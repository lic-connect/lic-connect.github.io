<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIC Plan 745 - Jeevan Umang Calculator</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --lic-pink: #ff2d78;
            --lic-pink-dark: #c2185b;
            --black: #121212;
            --white: #ffffff;
            --grey-bg: #fdf2f8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background: radial-gradient(circle at center, #4a0e2e, #000);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px 20px;
            perspective: 1500px;
        }

        /* 3D Box & Mirror Effect */
        .calculator-3d-box {
            position: relative;
            width: 100%;
            max-width: 950px;
            background: var(--white);
            border-radius: 30px;
            transform-style: preserve-3d;
            transform: rotateX(6deg);
            box-shadow: 0 40px 100px rgba(0,0,0,0.8);
            padding: 45px;
            border: 1px solid rgba(255,255,255,0.2);
            /* Fantastic Mirror Reflection Effect */
            -webkit-box-reflect: below 2px linear-gradient(transparent, transparent, rgba(255,255,255,0.15));
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 5px solid var(--lic-pink);
            padding-bottom: 15px;
        }

        .header h1 { color: var(--black); font-size: 26px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        .header p { color: var(--lic-pink); font-weight: 700; font-size: 14px; }

        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .input-group { position: relative; display: flex; flex-direction: column; }
        .input-group label { font-size: 11px; font-weight: 800; color: var(--black); margin-bottom: 6px; text-transform: uppercase; }
        .input-group i { position: absolute; right: 15px; top: 38px; color: var(--lic-pink); font-size: 18px; }

        input, select {
            padding: 14px 18px;
            border: 2px solid #edeff2;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            outline: none;
            transition: all 0.3s ease;
            background: var(--grey-bg);
        }

        input:focus, select:focus { border-color: var(--lic-pink); background: #fff; box-shadow: 0 0 15px rgba(255, 45, 120, 0.2); }

        /* Benefit Toggle Switch */
        .toggle-wrapper {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            margin: 20px 0;
            background: #fff0f5;
            padding: 12px;
            border-radius: 50px;
        }

        .toggle-case {
            display: flex;
            width: 420px;
            height: 50px;
            background: var(--black);
            border-radius: 25px;
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }

        .toggle-opt {
            flex: 1;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: var(--lic-pink);
            transition: 0.3s;
            font-size: 13px;
        }

        .toggle-opt.active { color: #fff; }
        .slider {
            position: absolute;
            left: 0;
            width: 50%;
            height: 100%;
            background: var(--lic-pink);
            border-radius: 25px;
            transition: 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1;
        }

        .calc-btn {
            grid-column: 1 / -1;
            background: var(--black);
            color: var(--lic-pink);
            border: 2px solid var(--lic-pink);
            padding: 20px;
            border-radius: 15px;
            font-size: 20px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.4s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .calc-btn:hover { background: var(--lic-pink); color: #000; transform: translateY(-5px); box-shadow: 0 10px 20px rgba(255, 45, 120, 0.3); }

        /* Results Panel */
        #results {
            margin-top: 40px;
            display: none;
            background: #fffbfd;
            padding: 35px;
            border-radius: 20px;
            border: 3px solid var(--lic-pink);
            animation: slideUp 0.6s ease;
        }

        .res-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px dashed #ccc; }
        .res-row:last-of-type { border: none; background: var(--black); color: var(--lic-pink); padding: 22px; border-radius: 15px; margin-top: 15px; }
        .res-label { font-weight: 600; font-size: 15px; }
        .res-val { font-weight: 800; font-size: 20px; }

        .formula-box {
            font-size: 11px;
            color: #777;
            text-align: center;
            margin-top: 20px;
            font-style: italic;
            background: #eee;
            padding: 10px;
            border-radius: 8px;
        }

        .footer-btns { display: flex; gap: 20px; margin-top: 30px; }
        .f-btn { flex: 1; padding: 15px; border-radius: 12px; border: 2px solid var(--black); background: transparent; color: var(--black); font-weight: 800; cursor: pointer; transition: 0.3s; }
        .f-btn:hover { background: var(--black); color: var(--lic-pink); }

        @keyframes slideUp { from { opacity: 0; transform: translateY(50px); } to { opacity: 1; transform: translateY(0); } }
        .err-hint { color: #d32f2f; font-size: 11px; font-weight: 700; margin-top: 4px; display: none; }
    </style>
</head>
<body>

<div class="calculator-3d-box">
    <div class="header">
        <h1>LIC-PLAN NO 745-JEEVAN UMANG</h1>
        <p>WHOLE LIFE SURVIVAL & MATURITY CALCULATOR</p>
    </div>

    <div class="input-grid">
        <div class="input-group">
            <label>Policy Holder Name</label>
            <input type="text" id="p_name" placeholder="Name">
            <i class="fas fa-user-circle"></i>
        </div>

        <div class="input-group">
            <label>Age at Entry (0-55 Yrs)</label>
            <input type="number" id="p_age" value="30" onchange="autoUpdateTerm()">
            <i class="fas fa-id-card"></i>
            <span id="age-err" class="err-hint">Invalid Entry Age for selected PPT</span>
        </div>

        <div class="input-group">
            <label>Sum Assured (Min 2,00,000)</label>
            <input type="number" id="p_sa" value="200000" step="25000">
            <i class="fas fa-coins"></i>
            <span id="sa-err" class="err-hint">Minimum Sum Assured ₹2,00,000</span>
        </div>

        <div class="input-group">
            <label>Premium Paying Term (PPT)</label>
            <select id="p_ppt" onchange="autoUpdateTerm()">
                <option value="15">15 Years</option>
                <option value="20">20 Years</option>
                <option value="25">25 Years</option>
                <option value="30">30 Years</option>
            </select>
            <i class="fas fa-hourglass-start"></i>
        </div>

        <div class="input-group">
            <label>Policy Term (Whole Life)</label>
            <input type="text" id="p_term" disabled>
            <i class="fas fa-calendar-alt"></i>
        </div>

        <div class="input-group">
            <label>Premium Mode</label>
            <select id="p_mode">
                <option value="yly">Yearly</option>
                <option value="hly">Half-Yearly</option>
                <option value="qly">Quarterly</option>
                <option value="mly">Monthly (NACH)</option>
            </select>
            <i class="fas fa-wallet"></i>
        </div>

        <div class="input-group">
            <label>Entered Annual Premium</label>
            <input type="number" id="p_prem" value="15000">
            <i class="fas fa-indian-rupee-sign"></i>
        </div>

        <div class="input-group">
            <label>Bonus Rate (Default 42)</label>
            <input type="number" id="p_bonus" value="42">
            <i class="fas fa-chart-line"></i>
        </div>

        <div class="input-group">
            <label>FAB Rate (Default 20)</label>
            <input type="number" id="p_fab" value="20">
            <i class="fas fa-star"></i>
        </div>

        <div class="toggle-wrapper">
            <div class="toggle-case" onclick="toggleBenefit()">
                <div class="slider" id="slider"></div>
                <div class="toggle-opt active" id="opt_m">SURVIVAL (MATURITY @100)</div>
                <div class="toggle-opt" id="opt_d">DEATH BENEFIT</div>
            </div>
        </div>

        <div class="input-group" id="death_ui" style="display:none; grid-column: 1 / -1;">
            <label>Policy Year of Death</label>
            <input type="number" id="death_yr" value="10">
            <i class="fas fa-skull-crossbones"></i>
        </div>

        <button class="calc-btn" onclick="performCalculation()">
            <i class="fas fa-calculator"></i> Calculate Wow Factor
        </button>
    </div>

    <div id="results">
        <div id="res_body"></div>
        <div class="footer-btns">
            <button class="f-btn" onclick="window.print()"><i class="fas fa-print"></i> Print PDF</button>
            <button class="f-btn" onclick="alert('PDF Generated for Sharing!')"><i class="fas fa-share-alt"></i> Share PDF</button>
        </div>
    </div>
</div>

<script>
    function autoUpdateTerm() {
        const age = parseInt(document.getElementById('p_age').value);
        const ppt = parseInt(document.getElementById('p_ppt').value);
        
        // Validation check for Age vs PPT
        const limits = { 15: 55, 20: 50, 25: 45, 30: 40 };
        if(age > limits[ppt]) {
            document.getElementById('age-err').style.display = 'block';
            document.getElementById('age-err').innerText = `Max Age for PPT ${ppt} is ${limits[ppt]}`;
        } else {
            document.getElementById('age-err').style.display = 'none';
        }

        if(!isNaN(age)) {
            document.getElementById('p_term').value = (100 - age) + " Years";
        }
    }
    autoUpdateTerm();

    let isDeathMode = false;
    function toggleBenefit() {
        isDeathMode = !isDeathMode;
        const slider = document.getElementById('slider');
        const dUI = document.getElementById('death_ui');
        if(isDeathMode) {
            slider.style.left = '50%';
            dUI.style.display = 'block';
            document.getElementById('opt_d').classList.add('active');
            document.getElementById('opt_m').classList.remove('active');
        } else {
            slider.style.left = '0';
            dUI.style.display = 'none';
            document.getElementById('opt_m').classList.add('active');
            document.getElementById('opt_d').classList.remove('active');
        }
    }

    function performCalculation() {
        const name = document.getElementById('p_name').value || "Valued Client";
        const age = parseInt(document.getElementById('p_age').value);
        const sa = parseFloat(document.getElementById('p_sa').value);
        const ppt = parseInt(document.getElementById('p_ppt').value);
        const prem = parseFloat(document.getElementById('p_prem').value);
        const bonusR = parseFloat(document.getElementById('p_bonus').value);
        const fabR = parseFloat(document.getElementById('p_fab').value);
        const dYear = parseInt(document.getElementById('death_yr').value);
        const term = 100 - age;

        // Validations
        let hasErr = false;
        if(sa < 200000) { document.getElementById('sa-err').style.display='block'; hasErr=true; }
        else document.getElementById('sa-err').style.display='none';
        if(hasErr) return;

        // Accrued Bonuses logic for Lakshya (Bonuses accrue only during PPT)
        const totalBonus = (sa/1000) * bonusR * ppt; 
        const fab = (sa >= 200000) ? (sa/1000) * fabR : 0;
        
        let html = `<h3>Report for ${name}</h3><br>`;

        if(!isDeathMode) {
            const finalMaturity = sa + totalBonus + fab;
            const totalPaid = prem * ppt;
            html += `
                <div class="res-row"><span class="res-label">Basic Sum Assured:</span><span class="res-val">₹ ${sa.toLocaleString()}</span></div>
                <div class="res-row"><span class="res-label">Accrued Vested Bonus (for ${ppt} yrs):</span><span class="res-val">₹ ${totalBonus.toLocaleString()}</span></div>
                <div class="res-row"><span class="res-label">Final Additional Bonus (FAB):</span><span class="res-val">₹ ${fab.toLocaleString()}</span></div>
                <div class="res-row"><span class="res-label">Total Premiums Paid:</span><span class="res-val">₹ ${totalPaid.toLocaleString()}</span></div>
                <div class="res-row"><span class="res-label">FINAL MATURITY (AGE 100):</span><span class="res-val">₹ ${finalMaturity.toLocaleString()}</span></div>
                <div style="background:#fce7f3; padding:10px; margin-top:10px; border-radius:8px; font-size:11px; color:#c2185b; font-weight:700;">
                    ⭐ SPECIAL UMANG BENEFIT: You receive ₹ ${(sa * 0.08).toLocaleString()} every year after PPT till age 99!
                </div>
                <div class="formula-box">Formula: [Basic Sum Assured] + [Vested Bonuses] + [FAB]</div>
            `;
        } else {
            // Death Commencement Logic
            const riskCommenced = (age >= 8) || (dYear >= 2);
            const totalPaidTillDeath = prem * Math.min(dYear, ppt);

            if(!riskCommenced) {
                html += `
                    <div class="res-row" style="background:#ff7675; color:white;"><span class="res-label">Status:</span><span class="res-val">Death Before Risk Commencement</span></div>
                    <div class="res-line"><span class="res-label">Refund of Premiums Paid:</span><span class="res-val">₹ ${totalPaidTillDeath.toLocaleString()}</span></div>
                    <div class="res-row"><span class="res-label">FINAL DEATH BENEFIT:</span><span class="res-val">₹ ${totalPaidTillDeath.toLocaleString()}</span></div>
                    <div class="formula-box">Note: Risk had not commenced. Returning premiums paid excluding taxes.</div>
                `;
            } else {
                // Sum Assured on Death: Max(Basic SA, 7x Annualized Premium)
                const saOnDeath = Math.max(sa, 7 * prem);
                const bonusAtDeath = (sa/1000) * bonusR * Math.min(dYear, ppt);
                const finalDeath = saOnDeath + bonusAtDeath + fab;

                html += `
                    <div class="res-row" style="background:var(--lic-pink); color:white;"><span class="res-label">Status:</span><span class="res-val">After Risk Commencement</span></div>
                    <div class="res-row"><span class="res-label">Sum Assured on Death:</span><span class="res-val">₹ ${saOnDeath.toLocaleString()}</span></div>
                    <div class="res-row"><span class="res-label">Bonus Accrued till Year ${dYear}:</span><span class="res-val">₹ ${bonusAtDeath.toLocaleString()}</span></div>
                    <div class="res-row"><span class="res-label">Final Additional Bonus:</span><span class="res-val">₹ ${fab.toLocaleString()}</span></div>
                    <div class="res-row"><span class="res-label">Total Premiums Paid till Death:</span><span class="res-val">₹ ${totalPaidTillDeath.toLocaleString()}</span></div>
                    <div class="res-row"><span class="res-label">FINAL DEATH CLAIM:</span><span class="res-val">₹ ${finalDeath.toLocaleString()}</span></div>
                    <div class="formula-box">Formula: [Higher of Basic SA or 7x Premium] + [Vested Bonus] + [FAB]</div>
                `;
            }
        }

        document.getElementById('res_body').innerHTML = html;
        document.getElementById('results').style.display = 'block';
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }
</script>

</body>
</html>
