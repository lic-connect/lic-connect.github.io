<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surrender Value Pro | LIC Plan 880</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00f2ff;
            --neon-purple: #bc13fe;
            --neon-pink: #ff0055;
            --glass: rgba(255, 255, 255, 0.1);
            --bg-dark: #080a0f;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 242, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(188, 19, 254, 0.15) 0%, transparent 40%);
            color: white;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            width: 95%;
            max-width: 900px;
            padding: 40px 20px;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, var(--neon-cyan), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(0, 242, 255, 0.5));
        }

        .subtitle {
            text-align: center;
            font-size: 0.9rem;
            letter-spacing: 2px;
            color: var(--neon-cyan);
            margin-bottom: 40px;
            text-transform: uppercase;
        }

        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #aaa;
            margin-left: 5px;
        }

        input, select {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 15px;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            transition: 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.3);
        }

        .calc-btn {
            width: 100%;
            margin-top: 30px;
            padding: 15px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(45deg, var(--neon-cyan), var(--neon-purple));
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.4s;
            text-transform: uppercase;
        }

        .calc-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 25px rgba(188, 19, 254, 0.6);
        }

        .results-area {
            margin-top: 40px;
            display: none;
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .res-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .res-box {
            background: rgba(0, 0, 0, 0.4);
            padding: 20px;
            border-radius: 15px;
            border-left: 4px solid var(--neon-cyan);
        }

        .res-box.alt { border-left-color: var(--neon-purple); }

        .res-label { font-size: 0.8rem; color: #888; margin-bottom: 5px; }
        .res-value { font-size: 1.4rem; font-weight: 700; font-family: 'Orbitron', sans-serif; }

        .final-box {
            background: linear-gradient(135deg, rgba(0, 242, 255, 0.1), rgba(188, 19, 254, 0.1));
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid var(--neon-cyan);
        }

        .final-label { color: var(--neon-cyan); font-weight: bold; margin-bottom: 10px; }
        .final-amt { font-size: 3rem; color: white; font-weight: 800; font-family: 'Orbitron', sans-serif; text-shadow: 0 0 20px var(--neon-cyan); }

        @media (max-width: 600px) {
            .res-grid { grid-template-columns: 1fr; }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>

function updateAutoFields() {
    // 1. Term and PPT Extraction
    // Extract number even if value is "T20" or "20"
    const termInput = document.getElementById('policyTerm').value;
    const term = parseInt(termInput.replace('T', '')); 
    const ppt = term - 5;
    
    // Update PPT field
    document.getElementById('ppt').value = ppt;

    // 2. Bonus - Always Zero for Plan 880
    document.getElementById('bonus').value = 0;

    // 3. Guaranteed Addition (GA) Calculation
    const bsa = parseFloat(document.getElementById('bsa').value) || 0;
    const ap = parseFloat(document.getElementById('ap').value) || 0;
    const yearsPaid = parseInt(document.getElementById('yearsPaid').value) || 0;
    const isOnline = document.getElementById('isOnline').checked;
    const isHighSA = document.getElementById('isHighSA').checked;

    // GA Formula logic
    let gaPercentage = 0.04; // Base 4%
    if (isOnline) gaPercentage += 0.01; // Online Purchase +1%
    
    // High SA condition: Only if BSA is exactly 2,00,00,000 (2 Lacs)
    if (isHighSA && bsa === 200000) {
        gaPercentage += 0.0025; // High SA +0.25%
    }

    // GA is only accrued for years premiums were paid, capped by PPT
    const gaYears = Math.min(yearsPaid, ppt);
    const totalGA = ap * gaPercentage * gaYears;

    // Update GA field in UI
    document.getElementById('ga').value = Math.round(totalGA);
}
// Run once on page load to initialize fields
window.onload = updateAutoFields;


     function calculateSurrender() {
    // 1. Environment Setup
    const termInput = document.getElementById('policyTerm').value;
    const term = parseInt(termInput.replace('T', ''));
    const termKey = "T" + term; // Ensures key is strictly "T12", "T20", etc.

    const bsa = parseFloat(document.getElementById('bsa').value);
    const ap = parseFloat(document.getElementById('ap').value);
    const ppt = parseInt(document.getElementById('ppt').value);
    const yearsPaid = parseInt(document.getElementById('yearsPaid').value);
    const totalGA = parseFloat(document.getElementById('ga').value) || 0;
    const bonus = parseFloat(document.getElementById('bonus').value) || 0;

    // 2. Eligibility Check
    if (yearsPaid < 2) {
        alert("Surrender value is only payable after 2 full years' premiums are paid.");
        return;
    }

    // 3. GSV Calculation
    // Find factors from JSON data based on yearsPaid
    const rowB = dataB.find(r => r.Term === yearsPaid);
    const rowP = dataP.find(r => r.Term === yearsPaid);

    const factorB = rowB ? (rowB[termKey] || 0) : 0;
    const factorP = rowP ? (rowP[termKey] || 0) : 0;

    const totalPremPaid = ap * yearsPaid;
    
    // GSV = (FactorB * Premiums) + (FactorP * Accrued GA)
    const gsv = (factorB * totalPremPaid) + (factorP * totalGA);

    // 4. SSV Calculation
    // Paid up SA = (BSA * Years Paid) / PPT
    const paidUpSA = (bsa * yearsPaid) / ppt;

    // Find SSV factors from F1, F2, F3 JSON tables
    const rowF1 = dataF1.find(r => r.Term === yearsPaid);
    const rowF2 = dataF2.find(r => r.Term === yearsPaid);
    const rowF3 = dataF3.find(r => r.Term === yearsPaid);

    const f1 = rowF1 ? (rowF1[termKey] || 0) : 0;
    const f2 = rowF2 ? (rowF2[termKey] || 0) : 0;
    const f3 = rowF3 ? (rowF3[termKey] || 0) : 0;

    // SSV = (Paid-up SA * F1) + (Bonus * F2) + (GA * F3)
    const ssv1 = paidUpSA * f1;
    const ssv2 = bonus * f2; // Note: bonus is 0 here
    const ssv3 = totalGA * f3;

    const ssv = ssv1 + ssv2 + ssv3;

    // 5. Final Result Determination
    const finalSV = Math.max(gsv, ssv);

    // 6. UI Update
    document.getElementById('results').style.display = 'block';
    document.getElementById('gsvVal').innerText = "₹ " + Math.round(gsv).toLocaleString('en-IN');
    document.getElementById('ssvVal').innerText = "₹ " + Math.round(ssv).toLocaleString('en-IN');
    document.getElementById('finalAmt').innerText = "₹ " + Math.round(finalSV).toLocaleString('en-IN');
}
