        acc[age] = {};
        for (const key in item) {

                acc[age][term] = item[key];

        }

    // --- HELPER & STANDALONE FUNCTIONS ---
    function clearAllResults() {
        document.getElementById("error-message").textContent = "";
        document.getElementById("results").classList.add("d-none");
        document.getElementById("standalone-rider-result").innerHTML = "";
    }

    function showStandaloneResult(message, isError = false) {
        clearAllResults();
        const resultDiv = document.getElementById("standalone-rider-result");
        const alertClass = isError ? 'alert-danger' : 'alert-success';
        resultDiv.innerHTML = `<div class="alert ${alertClass} text-center p-2">${message}</div>`;
    }

    function getAnnualTabularPremium(age, sa, term) {
        const tabularRate = baseRates[age]?.[term];
        if (!tabularRate) {
            throw new Error(`Premium rate for Age ${age} and Term ${term} not found.`);
        }
        return (tabularRate * sa) / 1000;
    }

    function getPwbRate(proposerAge, ppt, rateArray) {
        let ageBandCol;
        if (proposerAge >= 18 && proposerAge <= 25) ageBandCol = 'A';
        else if (proposerAge >= 26 && proposerAge <= 30) ageBandCol = 'B';
        else if (proposerAge >= 31 && proposerAge <= 35) ageBandCol = 'C';
        else if (proposerAge >= 36 && proposerAge <= 40) ageBandCol = 'D';
        else if (proposerAge >= 41 && proposerAge <= 45) ageBandCol = 'E';
        else if (proposerAge >= 46 && proposerAge <= 50) ageBandCol = 'F';
        else if (proposerAge >= 51 && proposerAge <= 55) ageBandCol = 'G';
        else return null;

        const row = rateArray.find(item => item.Term === ppt);
        if (!row) return null;
        
        const rate = row[ageBandCol];
        return (rate !== null && rate > 0) ? rate : null;
    }

    function calculateStandalonePwb() {
        try {
            const age = parseInt(document.getElementById("age").value);
            const sumAssured = parseFloat(document.getElementById("sum-assured").value);
            const term = parseInt(document.getElementById("term").value);
            const proposerAge = parseInt(document.getElementById("proposer-age").value);
            const ppt = term - 8;

            if (isNaN(proposerAge)) throw new Error("Please enter the Proposer's Age to calculate PWB premium.");
            if (proposerAge < 18 || proposerAge > 55) throw new Error("Proposer's Age must be between 18 and 55.");
            if (proposerAge <= age) throw new Error("Proposer's Age must be greater than the Insured's Age.");

            const annualTabularPremium = getAnnualTabularPremium(age, sumAssured, term);
            const pwbRate = getPwbRate(proposerAge, ppt, pwbRiderRates);
            if (!pwbRate) throw new Error(`PWB rate for Proposer Age ${proposerAge} and PPT ${ppt} not found.`);
            
            //const pwbAnnualPremium = (pwbRate / 1000) * annualTabularPremium;
            const pwbAnnualPremium = ((annualTabularPremium * pwbRate) / 100) * 1.1;
            
            const formatInr = (num) => num.toLocaleString('en-IN', {minimumFractionDigits: 0, maximumFractionDigits: 0});

            showStandaloneResult(`Standalone Annual PWB Rider Premium (Excl. GST): <strong class="fs-5">₹${formatInr(pwbAnnualPremium)}</strong>`);

        } catch (e) {
            showStandaloneResult(e.message, true);
        }
    }


    // --- MAIN CALCULATION ---
  function calculatePremium() {
        clearAllResults();
        const errorDiv = document.getElementById("error-message");

        const age = parseInt(document.getElementById("age").value);
        const sumAssured = parseFloat(document.getElementById("sum-assured").value);
        const term = parseInt(document.getElementById("term").value);
        const sa = parseFloat(document.getElementById("sum-assured").value);
        const addbSelected = document.getElementById("addb-rider").checked;
        const pwbSelected = document.getElementById("pwb-rider").checked;
        const proposerAge = parseInt(document.getElementById("proposer-age").value);
        
        // --- VALIDATION ---
        const maxEntryAge = 50; 
        if (isNaN(age) || isNaN(sumAssured) || isNaN(term)) { errorDiv.textContent = `Please fill all the required fields.`; return; }
        if (age > maxEntryAge) { errorDiv.textContent = `Max entry age is 50.`; return; }
        if (sumAssured < 200000 || sumAssured > 500000) { errorDiv.textContent = `Sum Assured must be between ₹2,00,000 and ₹5,00,000.`; return; }

        if (pwbSelected) {
            if (isNaN(proposerAge)) { errorDiv.textContent = `PWB Rider is selected. Please enter the Proposer's Age.`; return; }
            if (proposerAge < 18 || proposerAge > 55) { errorDiv.textContent = `Proposer's Age must be between 18 and 55.`; return; }
            if (proposerAge <= age) { errorDiv.textContent = `Proposer's Age must be greater than the Insured's Age.`; return; }
        }

        const tabularRate = baseRates[age]?.[term];
        if (!tabularRate) {
            errorDiv.textContent = `Premium rate for Age ${age} and Term ${term} not found.`;
            return;
        }

        const ppt = term - 8;
        
        // B: Base Premium
        const annualTabularPremium = (tabularRate * sumAssured) / 1000;

        // S: Sum Assured Rebate
        let saRebateRate = 0; 
        if (addbSelected) {
            if (age >= 1 && age <= 17) {
                if (sa === 500000) saRebateRate = 2.00; else if (sa >= 400000) saRebateRate = 1.50; else if (sa >= 300000) saRebateRate = 0.50; 
            } else if (age >= 18 && age <= 50) {
                if (term === 15) { if (sa === 500000) saRebateRate = 1.40; else if (sa >= 400000) saRebateRate = 1.00; else if (sa >= 300000) saRebateRate = 0.20; }
                else if (term === 16) { if (sa === 500000) saRebateRate = 1.55; else if (sa >= 400000) saRebateRate = 1.15; else if (sa >= 300000) saRebateRate = 0.35; else if (sa >=200000) saRebateRate = 0.15; }
                else if (term === 17) { if (sa === 500000) saRebateRate = 1.60; else if (sa >= 400000) saRebateRate = 1.20; else if (sa >= 300000) saRebateRate = 0.40; else if (sa >= 200000) saRebateRate = 0.20; }
                else if (term === 18) { if (sa === 500000) saRebateRate = 1.70; else if (sa >= 400000) saRebateRate = 1.30; else if (sa >= 300000) saRebateRate = 0.50; else if (sa >= 200000) saRebateRate = 0.30; }
                else if (term === 19) { if (sa === 500000) saRebateRate = 1.75; else if (sa >= 400000) saRebateRate = 1.35; else if (sa >= 300000) saRebateRate = 0.60; else if (sa >= 200000) saRebateRate = 0.35; }
                else if (term === 20) { if (sa === 500000) saRebateRate = 1.80; else if (sa >= 400000) saRebateRate = 1.40; else if (sa >= 300000) saRebateRate = 0.60; else if (sa >= 200000) saRebateRate = 0.40; }
            }
        } else {
            // --- Rebate Rates when ADDB is NOT selected ---
            if (age >= 1 && age <= 17) {
                if (sa === 500000) saRebateRate = 2.50; else if (sa >= 400000) saRebateRate = 2.00; else if (sa >= 300000) saRebateRate = 1.00;
            } else if (age >= 18 && age <= 50) {
                if (term === 15) { if (sa === 500000) saRebateRate = 2.00; else if (sa >= 400000) saRebateRate = 1.50; else if (sa >= 300000) saRebateRate = 0.50; }
                else if (term === 16) { if (sa === 500000) saRebateRate = 2.00; else if (sa >= 400000) saRebateRate = 1.50; else if (sa >= 300000) saRebateRate = 0.50; }
                else if (term === 17) { if (sa === 500000) saRebateRate = 2.00; else if (sa >= 400000) saRebateRate = 1.50; else if (sa >= 300000) saRebateRate = 0.50; }
                else if (term === 18) { if (sa === 500000) saRebateRate = 2.00; else if (sa >= 400000) saRebateRate = 1.49; else if (sa >= 300000) saRebateRate = 0.50; }
                else if (term === 19) { if (sa === 500000) saRebateRate = 2.00; else if (sa >= 400000) saRebateRate = 1.50; else if (sa >= 300000) saRebateRate = 0.50; }
                else if (term === 20) { if (sa === 500000) saRebateRate = 2.00; else if (sa >= 400000) saRebateRate = 1.50; else if (sa >= 300000) saRebateRate = 0.50; }
            }
        }
        const annualSaRebateAmount = (saRebateRate * sumAssured) / 1000;
        
        // D: ADDB Rider Premium
        let dabRatePer1000 = 1.0;
        if (sumAssured === 500000) dabRatePer1000 = 1.20; else if (sumAssured >= 400000) dabRatePer1000 = 1.30; else if (sumAssured >= 300000) dabRatePer1000 = 1.50; else if (sumAssured>=200000) dabRatePer1000 = 1.80;
        let annualAddbPremium = 0;
        if (age >= 18 && addbSelected) { annualAddbPremium = (dabRatePer1000 * sumAssured) / 1000; }

        // PWB RIDER PREMIUM CALCULATION
        let annualPwbPremium = 0;
        if (pwbSelected) {
            const pwbRate = getPwbRate(proposerAge, ppt, pwbRiderRates);
            if (!pwbRate) {
                errorDiv.textContent = `PWB rate for Proposer Age ${proposerAge} and PPT ${ppt} not found.`;
                return;
            }
            annualPwbPremium = ((annualTabularPremium * pwbRate) / 100) * 1.1;
        }

        // M: Mode Rebate
        const modes = {
            yearly: { name: "Yearly", factor: 1.0, modeRebatePercent: 0.02 },
            "half-yearly": { name: "Half-Yearly", factor: 0.5000, modeRebatePercent: 0.01 },
            quarterly: { name: "Quarterly", factor: 0.2500, modeRebatePercent: 0 },
            monthly: { name: "Monthly", factor: 0.0833, modeRebatePercent: 0 }
        };

        let ridersIndicator = addbSelected ? " | ADDB Rider" : "";
        ridersIndicator += pwbSelected ? " | PWB Rider" : "";
        
        const formatInr = (num) => num.toLocaleString('en-IN', {minimumFractionDigits: 0, maximumFractionDigits: 0});

        // Start Table Generation
        let outputHTML = `
            <p class="plan-details text-center"><b>Policy Term:</b> ${term} Years | <b>Premium Paying Term:</b> ${ppt} Years${ridersIndicator}</p>
            <h4 class="text-center mt-3">Premium Summary</h4>
            <table class="table table-bordered table-striped mt-2">
                <thead class="table-light">
                    <tr>
                        <th>Mode</th>
                        <th>Premium (Excl. GST)</th>
                    </tr>
                </thead>
                <tbody>
        `;

        for (const modeKey in modes) {
            const mode = modes[modeKey];
            
            let annualBaseAfterRebates = annualTabularPremium - annualSaRebateAmount;

            // Apply Mode Rebate to Base Premium
            if (mode.modeRebatePercent > 0) {
                annualBaseAfterRebates -= (annualTabularPremium * mode.modeRebatePercent);
            }

            // Total Annual Premium (Excluding GST)
            const annualPayablePremium = annualBaseAfterRebates + annualAddbPremium + annualPwbPremium;
            
            // Calculate Modal Premium (Excluding GST)
            const modalPremium = annualPayablePremium * mode.factor;
            
            outputHTML += `
                <tr>
                    <td>${mode.name}</td>
                    <td>₹ ${formatInr(modalPremium)}</td>
                </tr>
            `;
        }

        outputHTML += `</tbody></table>`;
        document.getElementById("premium-results").innerHTML = outputHTML;
        document.getElementById("results").classList.remove("d-none");
    }

function shareOnWhatsApp() {
    // 1. Get Plan Name (Looks for H1 or H3)
    const titleElem = document.querySelector('h1') || document.querySelector('h3');
    const planName = titleElem ? titleElem.innerText : "LIC Plan";

    // 2. Get Input Values (Handles both 'sumAssured' and 'sum-assured')
    const age = document.getElementById("age").value;
    const term = (document.getElementById("term") || document.getElementById("policy-term")).value;
    const saInput = document.getElementById("sumAssured") || document.getElementById("sum-assured");
    const sumAssured = saInput ? saInput.value : "0";
    
    // 3. Check if calculation results are visible
    const resultsDiv = document.getElementById("results");
    // Check if results are hidden (Bootstrap d-none or Style display none)
    if (!resultsDiv || resultsDiv.classList.contains('d-none') || window.getComputedStyle(resultsDiv).display === 'none') {
        alert("Please calculate the premium first!");
        return;
    }

    // 4. Format numbers
    const formattedSA = Number(sumAssured).toLocaleString('en-IN');

    // 5. Gather Premium Results
    let premiumDetails = "";
    
    // Logic for Table-based results (Plan 714, 764, etc.)
    const rows = resultsDiv.querySelectorAll('table tr');
    if (rows.length > 0) {
        rows.forEach(row => {
            const cols = row.querySelectorAll('td, th');
            if (cols.length === 2) {
                premiumDetails += `*${cols[0].innerText.trim().replace(':','')}:* ${cols[1].innerText.trim()}\n`;
            }
        });
    } 
    
    // Logic for Div-based results (Plan 751, 760, etc.)
    if (premiumDetails === "") {
        const resultBoxes = resultsDiv.querySelectorAll('.result-box');
        resultBoxes.forEach(box => {
            const mode = box.querySelector('strong') || box.querySelector('.result-title');
            const price = box.querySelector('span');
            if (mode && price) {
                premiumDetails += `*${mode.innerText.trim()}:* ${price.innerText.trim()}\n`;
            }
        });
    }

    // 6. Construct the Message
    let message = `*📊 ${planName} Premium Quote*\n\n`;
    message += `*--- Policy Details ---*\n`;
    message += `*Age:* ${age} Years\n`;
    message += `*Policy Term:* ${term} Years\n`;
    message += `*Sum Assured:* ₹${formattedSA}\n\n`;
    message += `*--- Premium Summary ---*\n`;
    message += premiumDetails;
    message += `\n_Calculated via LIC Premium Calculator_`;

    // 7. Open WhatsApp
    const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(message)}`;
    window.open(whatsappUrl, '_blank');
}
</script>
