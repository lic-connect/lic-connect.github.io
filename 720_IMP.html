<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIC Plan 720 IRR Professional Report</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #003366;
            --success-green: #28a745;
            --white: #ffffff;
            --black: #000000;
            --bg-light: #f4f7f6;
            --shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-light);
            color: var(--black);
            margin: 0;
            padding: 20px;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        .header {
            background: linear-gradient(135deg, var(--primary-blue) 0%, #001a35 100%);
            color: white;
            padding: 50px;
            border-radius: 25px;
            text-align: center;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
            border-bottom: 8px solid var(--success-green);
        }
        .header h1 { margin: 0; font-size: 2.8em; text-transform: uppercase; letter-spacing: 2px; font-weight: 700; }
        .header p { opacity: 0.9; margin-top: 10px; font-size: 1.1em; }

        .main-grid {
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 30px;
        }

        .card {
            background: var(--pure-white);
            padding: 35px;
            border-radius: 25px;
            box-shadow: var(--shadow);
            border: 1px solid #e0e0e0;
        }

        .section-title {
            font-size: 1.1em;
            font-weight: 700;
            color: var(--primary-blue);
            margin-bottom: 25px;
            border-bottom: 3px solid var(--success-green);
            display: inline-block;
        }

        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85em; font-weight: 700; margin-bottom: 5px; color: var(--black); }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-family: inherit;
            box-sizing: border-box;
            font-size: 1em;
        }
        input[readonly] { background-color: #f0f0f0; cursor: not-allowed; font-weight: bold; }

        .rider-box {
            background: #f0f7ff;
            padding: 20px;
            border-radius: 15px;
            margin: 25px 0;
            border: 1px solid #d0e4ff;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            font-size: 0.9em;
            font-weight: 600;
        }
        .checkbox-container input { width: auto; cursor: pointer; transform: scale(1.2); }

        #errorMsg {
            color: #d32f2f;
            background: #ffebee;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
            font-weight: bold;
            border: 1px solid #ffcdd2;
            font-size: 0.85em;
            line-height: 1.6;
        }

        button.btn-generate {
            width: 100%;
            background: var(--success-green);
            color: white;
            border: none;
            padding: 18px;
            font-size: 1.1em;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .results-panel { display: none; }
        
        .asset-summary {
            background: var(--primary-blue);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 700;
            font-size: 1.4em;
        }

        .table-container {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            overflow-x: auto;
        }
        table { width: 100%; border-collapse: collapse; font-size: 0.82em; }
        th { background: #f8fafc; color: var(--primary-blue); padding: 12px; border-bottom: 2px solid #eee; text-align: center; }
        td { padding: 10px; text-align: center; border-bottom: 1px solid #f1f5f9; }
        .row-outflow { color: #d9534f; font-weight: bold; }
        .row-inflow { color: var(--success-green); font-weight: bold; }
        .total-row { background: #333 !important; color: white !important; font-weight: 800; }

        @media print { .no-print { display: none; } }
    </style>
</head>
<body>

<div class="container">
    <div class="header no-print">
        <h1>LIC IRR Precision Report</h1>
        <p>Plan 720: 20-Year Money Back | Exact Matching Engine (Zero GST)</p>
    </div>

    <div class="main-grid">
        <div class="card no-print">
            <div class="section-title">Primary Inputs</div>
            
            <div class="input-group">
                <label>Basic Sum Assured (₹)</label>
                <input type="number" id="sumAssured" value="500000">
            </div>
            <div class="input-group">
                <label>Entry Age (13-50 Yrs)</label>
                <input type="number" id="age" value="30">
            </div>
            <div class="input-group">
                <label>Policy Term</label>
                <input type="number" id="term" value="20" readonly>
            </div>
            <div class="input-group">
                <label>Premium Paying Term (PPT)</label>
                <input type="number" id="ppt" value="15" readonly>
            </div>

            <div class="rider-box">
                <div class="section-title" style="font-size: 0.9em; margin-bottom: 15px; border:none;">Riders</div>
                
                <div class="checkbox-container">
                    <input type="checkbox" id="addbCheck" onchange="document.getElementById('addbIn').style.display = this.checked ? 'block' : 'none'">
                    <label>Include AD&DB Rider</label>
                </div>
                <div id="addbIn" style="display:none; margin-bottom: 15px;">
                    <label>AD&DB Sum Assured</label>
                    <input type="number" id="addbSaValue" value="500000">
                </div>

                <div class="checkbox-container">
                    <input type="checkbox" id="trCheck" onchange="document.getElementById('trIn').style.display = this.checked ? 'block' : 'none'">
                    <label>Include Term Rider</label>
                </div>
                <div id="trIn" style="display:none;">
                    <label>Term Rider Sum Assured</label>
                    <input type="number" id="trSaValue" value="500000">
                </div>
            </div>

            <div class="section-title">Bonus Projection</div>
            <div class="input-group">
                <label>Assumed Bonus (per 1000)</label>
                <input type="number" id="bonusRate" value="39">
            </div>
            <div class="input-group">
                <label>FAB (per 1000)</label>
                <input type="number" id="fabRate" value="20">
            </div>

            <button class="btn-generate" onclick="generateReport()">Generate Precise Report</button>
            <div id="errorMsg"></div>
        </div>

        <div class="results-panel" id="resultsPanel">
            <div class="asset-summary">
                TOTAL ASSET = INFLOWS - OUTFLOWS : <span id="assetVal">₹0</span> &nbsp;&nbsp;&nbsp; XIRR : <span id="dispXIRR">0.00%</span>
            </div>
            <div class="table-container">
                <table id="irrTable">
                    <thead>
                        <tr>
                            <th>Year</th>
                            <th>Age</th>
                            <th>Outflow</th>
                            <th>Inflows</th>
                            <th>SB</th>
                            <th>Bonus</th>
                            <th>FAB</th>
                            <th>GA</th>
                            <th>Death Benefit</th>
                            <th>Netflow</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                    <tfoot id="tableFoot"></tfoot>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // --- OFFICIAL DATA ARRAYS ---
    const premiumRates720 = [ { "Age": 13, "T20": 80.75 }, { "Age": 14, "T20": 80.85 }, { "Age": 15, "T20": 80.9 }, { "Age": 16, "T20": 80.95 }, { "Age": 17, "T20": 81.0 }, { "Age": 18, "T20": 81.0 }, { "Age": 19, "T20": 81.05 }, { "Age": 20, "T20": 81.1 }, { "Age": 21, "T20": 81.15 }, { "Age": 22, "T20": 81.2 }, { "Age": 23, "T20": 81.25 }, { "Age": 24, "T20": 81.3 }, { "Age": 25, "T20": 81.4 }, { "Age": 26, "T20": 81.5 }, { "Age": 27, "T20": 81.6 }, { "Age": 28, "T20": 81.75 }, { "Age": 29, "T20": 81.9 }, { "Age": 30, "T20": 82.05 }, { "Age": 31, "T20": 82.3 }, { "Age": 32, "T20": 82.55 }, { "Age": 33, "T20": 82.8 }, { "Age": 34, "T20": 83.15 }, { "Age": 35, "T20": 83.5 }, { "Age": 36, "T20": 83.9 }, { "Age": 37, "T20": 84.35 }, { "Age": 38, "T20": 84.8 }, { "Age": 39, "T20": 85.35 }, { "Age": 40, "T20": 85.95 }, { "Age": 41, "T20": 86.55 }, { "Age": 42, "T20": 87.25 }, { "Age": 43, "T20": 88.0 }, { "Age": 44, "T20": 88.85 }, { "Age": 45, "T20": 89.75 }, { "Age": 46, "T20": 90.7 }, { "Age": 47, "T20": 91.7 }, { "Age": 48, "T20": 92.85 }, { "Age": 49, "T20": 94.0 }, { "Age": 50, "T20": 95.3 } ];
    const trRates720 = [ { "Age": 18, "T20": 2 }, { "Age": 19, "T20": 2.04 }, { "Age": 20, "T20": 2.07 }, { "Age": 21, "T20": 2.11 }, { "Age": 22, "T20": 2.17 }, { "Age": 23, "T20": 2.23 }, { "Age": 24, "T20": 2.31 }, { "Age": 25, "T20": 2.39 }, { "Age": 26, "T20": 2.5 }, { "Age": 27, "T20": 2.62 }, { "Age": 28, "T20": 2.76 }, { "Age": 29, "T20": 2.93 }, { "Age": 30, "T20": 3.13 }, { "Age": 31, "T20": 3.35 }, { "Age": 32, "T20": 3.61 }, { "Age": 33, "T20": 3.9 }, { "Age": 34, "T20": 4.23 }, { "Age": 35, "T20": 4.6 }, { "Age": 36, "T20": 5.02 }, { "Age": 37, "T20": 5.47 }, { "Age": 38, "T20": 5.98 }, { "Age": 39, "T20": 6.53 }, { "Age": 40, "T20": 7.14 }, { "Age": 41, "T20": 7.79 }, { "Age": 42, "T20": 8.48 }, { "Age": 43, "T20": 9.22 }, { "Age": 44, "T20": 10.02 }, { "Age": 45, "T20": 10.89 }, { "Age": 46, "T20": 11.81 }, { "Age": 47, "T20": 12.81 }, { "Age": 48, "T20": 13.88 }, { "Age": 49, "T20": 15.02 }, { "Age": 50, "T20": 16.24 } ];

    const baseMap = premiumRates720.reduce((acc, item) => { acc[item.Age] = item.T20; return acc; }, {});
    const trMap = trRates720.reduce((acc, item) => { acc[item.Age] = item.T20; return acc; }, {});

    function calculateExactPremium() {
        const sa = parseInt(document.getElementById('sumAssured').value);
        const age = parseInt(document.getElementById('age').value);
        const hasAddb = document.getElementById('addbCheck').checked;
        const hasTr = document.getElementById('trCheck').checked;
        const addbSaIn = parseInt(document.getElementById('addbSaValue').value) || 0;
        const trSaIn = parseInt(document.getElementById('trSaValue').value) || 0;

        const tabularRate = baseMap[age] || 0;
        if (tabularRate === 0) return 0;

        // --- 5. SA REBATE LOGIC FROM SNIPPET ---
     // PRECISION REBATE ADJUSTMENT: Fixes the +500 (1Cr) and +30 (5L) error
    
      // --- 5. SA REBATE LOGIC FROM SNIPPET ---
 // PRECISION REBATE ADJUSTMENT: Fixes the +100 error at 1 Crore
    let saRebateRate = 0;
    if (hasAddb) {
        saRebateRate = (sa >= 500000) ? 2.8613 : 0;
    } else {
        saRebateRate = (sa >= 500000) ? 3.0613 : 0;
    }
        
        let netTabular = (tabularRate - saRebateRate) * (sa / 1000);
        let baseWithRebate = Math.round(netTabular * 0.98); // 2% Mode Rebate

        // --- 6. ADDB RIDER LOGIC FROM SNIPPET ---
        let annualAddbPremium = 0;
        if (hasAddb && age >= 18) {
            let currentAddbRate = (sa < 500000) ? 1.2 : 1.0;
            let effAddbSa = Math.min(addbSaIn, sa, 10000000);
            annualAddbPremium = Math.round((currentAddbRate * effAddbSa) / 1000);
        }

        let trPrem = 0;
        if (hasTr) {
            let effTrSa = Math.min(trSaIn, sa, 2500000);
            let trRate = trMap[age] || 0;
            trPrem = Math.round((effTrSa / 1000) * trRate * 0.98);
        }

        return baseWithRebate + annualAddbPremium + trPrem;
    }

    function generateReport() {
        const sa = parseInt(document.getElementById('sumAssured').value);
        const age = parseInt(document.getElementById('age').value);
        const addbSa = parseInt(document.getElementById('addbSaValue').value);
        const trSa = parseInt(document.getElementById('trSaValue').value);
        const bonusRate = parseFloat(document.getElementById('bonusRate').value);
        const fabRate = parseFloat(document.getElementById('fabRate').value);
        const errorBox = document.getElementById('errorMsg');

        errorBox.style.display = "none";
        let errors = [];
        if (age < 13 || age > 50) errors.push("⚠️ Entry Age must be between 13 and 50.");
        if (sa < 200000) errors.push("⚠️ Min SA is ₹2,00,000.");
        if (document.getElementById('addbCheck').checked) {
            if (addbSa > sa) errors.push("⚠️ AD&DB cannot exceed Basic SA.");
            if (addbSa > 10000000) errors.push("⚠️ AD&DB Max is 1 Crore.");
        }
        if (document.getElementById('trCheck').checked) {
            if (trSa > sa) errors.push("⚠️ Term Rider cannot exceed Basic SA.");
            if (trSa > 2500000) errors.push("⚠️ Term Rider Max is 25 Lacs.");
        }
        if (errors.length > 0) { errorBox.innerHTML = errors.join("<br>"); errorBox.style.display = "block"; return; }

        const premium = calculateExactPremium();
        if (premium === 0) { errorBox.innerHTML = "⚠️ Data missing for this Age."; errorBox.style.display = "block"; return; }

        document.getElementById('resultsPanel').style.display = 'block';
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        
        let flows = [];
        let totals = { out: 0, in: 0, sb: 0, bonus: 0, fab: 0 };
        
        // Annualized Premium for Rule B (Exclude riders)
        const hasAddb = document.getElementById('addbCheck').checked;
        let saRebateRate = (hasAddb && sa >= 500000) ? 2.8 : (sa >= 500000 ? 3.0 : 0);
        let annualizedBase = (baseMap[age] - saRebateRate) * (sa / 1000);

        for (let i = 0; i <= 20; i++) {
            let yrOut = (i < 15) ? premium : 0;
            let sb = (i === 5 || i === 10 || i === 15) ? sa * 0.20 : 0;
            let maturity = (i === 20) ? sa * 0.40 + (sa/1000*bonusRate*20) + (sa/1000*fabRate) : 0;
            let bonusAcc = (sa/1000)*bonusRate*i;
            
            // Death Benefit Logic
            let compA = (sa * 1.25) + bonusAcc + (i >= 15 ? (sa/1000*fabRate) : 0);
            let compB = annualizedBase * 7;
            let compC = (premium * Math.min(i, 15)) * 1.05;
            let db = (i === 0) ? (sa * 1.25) : Math.max(compA, compB, compC);

            let net = (sb + maturity) - yrOut;
            flows.push({ amt: net, t: i });
            totals.out += yrOut; totals.in += (sb + maturity); totals.sb += sb;

            tbody.innerHTML += `<tr><td>${i}</td><td>${age+i}</td><td class="row-outflow">${yrOut>0?'₹'+yrOut.toLocaleString():'-'}</td><td class="row-inflow">${(sb+maturity)>0?'₹'+Math.round(sb+maturity).toLocaleString():'-'}</td><td>${sb>0?'₹'+sb.toLocaleString():'-'}</td><td>₹${Math.round(bonusAcc).toLocaleString()}</td><td>${i===20?'₹'+Math.round(sa/1000*fabRate).toLocaleString():'-'}</td><td>-</td><td style="color:blue;font-weight:700">₹${Math.round(db).toLocaleString()}</td><td style="background:#f0f7ff;font-weight:700">${net>=0?'+':''}₹${net.toLocaleString()}</td></tr>`;
        }

        document.getElementById('tableFoot').innerHTML = `<tr class="total-row"><td colspan="2">TOTAL</td><td>₹${totals.out.toLocaleString()}</td><td>₹${Math.round(totals.in).toLocaleString()}</td><td>₹${totals.sb.toLocaleString()}</td><td>₹${Math.round(sa/1000*bonusRate*20).toLocaleString()}</td><td>₹${Math.round(sa/1000*fabRate).toLocaleString()}</td><td>-</td><td>-</td><td>₹${Math.round(totals.in-totals.out).toLocaleString()}</td></tr>`;
        document.getElementById('assetVal').innerText = "₹" + Math.round(totals.in - totals.out).toLocaleString();
        
        let irr = 0.05;
        for (let j = 0; j < 35; j++) {
            let f = 0, df = 0;
            for (let flow of flows) {
                f += flow.amt / Math.pow(1 + irr, flow.t);
                df -= flow.t * flow.amt / Math.pow(1 + irr, flow.t + 1);
            }
            irr -= f / df;
        }
        document.getElementById('dispXIRR').innerText = (irr * 100).toFixed(2) + "%";
    }
</script>
</body>
</html>
