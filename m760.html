<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIC Bima Jyoti 760 Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4a148c; /* Deep Purple */
            --accent: #9c27b0;
            --black: #121212;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, 0.95);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background: radial-gradient(circle at center, #2e004d 0%, #121212 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            perspective: 2000px;
        }

        /* 3D Box & Mirror Effect */
        .calculator-3d-box {
            position: relative;
            width: 100%;
            max-width: 950px;
            background: var(--glass);
            border-radius: 40px;
            transform-style: preserve-3d;
            transform: rotateX(10deg);
            box-shadow: 0 50px 100px rgba(0,0,0,0.8), 
                        inset 0 0 20px rgba(74, 20, 140, 0.2);
            padding: 50px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            -webkit-box-reflect: below 5px linear-gradient(transparent, transparent, rgba(255,255,255,0.1));
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 6px solid var(--primary);
            padding-bottom: 20px;
        }

        .header h1 { 
            color: var(--primary); 
            font-family: 'Orbitron', sans-serif;
            font-size: 30px; 
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        .header p { color: var(--black); font-weight: 700; font-size: 16px; opacity: 0.7; }

        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .input-group { position: relative; display: flex; flex-direction: column; }
        .input-group label { font-size: 11px; font-weight: 800; color: var(--primary); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;}
        .input-group i { position: absolute; right: 20px; top: 42px; color: var(--accent); font-size: 1.2rem; }

        input, select {
            padding: 15px 20px;
            border: 2px solid #e1bee7;
            border-radius: 15px;
            font-size: 15px;
            font-weight: 600;
            outline: none;
            transition: 0.4s;
            background: #fff;
            color: var(--black);
        }

        input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(74, 20, 140, 0.3); transform: translateY(-2px); }

        /* Fabulous Toggle */
        .benefit-section {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            margin: 30px 0;
        }

        .toggle-container {
            width: 360px;
            height: 60px;
            background: var(--black);
            border-radius: 30px;
            display: flex;
            position: relative;
            cursor: pointer;
            padding: 5px;
            border: 2px solid var(--primary);
        }

        .toggle-btn {
            flex: 1;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 800;
            font-size: 12px;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .toggle-btn.active { color: var(--black); }

        .slider {
            position: absolute;
            left: 5px;
            width: 175px;
            height: 46px;
            background: var(--white);
            border-radius: 25px;
            transition: 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            z-index: 1;
        }

        .calc-btn {
            grid-column: 1 / -1;
            background: linear-gradient(45deg, var(--black), var(--primary));
            color: white;
            border: none;
            padding: 22px;
            border-radius: 15px;
            font-size: 20px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.4s;
            text-transform: uppercase;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            margin-top: 15px;
        }

        .calc-btn:hover { transform: scale(1.02) translateY(-5px); background: var(--primary); box-shadow: 0 20px 40px rgba(74, 20, 140, 0.4); }

        /* Error Styles */
        .error-msg { 
            color: #d32f2f; 
            font-size: 11px; 
            font-weight: 700; 
            margin-top: 6px; 
            padding-left: 5px;
            display: none;
            animation: shake 0.3s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* Results Display */
        #results {
            margin-top: 40px;
            display: none;
            padding: 40px;
            background: var(--white);
            border-radius: 30px;
            border: 2px solid var(--primary);
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
        }

        .res-row { display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #f0f0f0; }
        .res-row.grand-total { background: var(--primary); color: white; padding: 25px; border-radius: 15px; margin-top: 20px; }
        .res-val { font-weight: 800; font-size: 18px; color: var(--primary); }
        .grand-total .res-val { color: var(--white); font-size: 26px; }

        .formula { font-size: 11px; color: #777; text-align: center; margin-top: 20px; font-style: italic; background: #f9f9f9; padding: 10px; border-radius: 10px;}

        .footer-btns { display: flex; gap: 20px; margin-top: 30px; grid-column: 1 / -1; }
        .btn-f { flex: 1; padding: 15px; border-radius: 12px; border: 2px solid var(--primary); background: transparent; color: var(--primary); font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; }
        .btn-f:hover { background: var(--primary); color: white; }

    </style>
</head>
<body>

<div class="calculator-3d-box">
    <div class="header">
        <h1>LIC-PLAN NO 760-BIMA JYOTI</h1>
        <p>PREMIUM & MATURITY CALCULATOR</p>
    </div>

    <div class="input-grid">
        <div class="input-group">
            <label>Policy Holder Name</label>
            <input type="text" id="name" placeholder="Name of the Insured">
            <i class="fas fa-user-circle"></i>
        </div>

        <div class="input-group">
            <label>Age at Entry (Years)</label>
            <input type="number" id="age" value="25">
            <i class="fas fa-calendar-day"></i>
            <span id="age-err" class="error-msg">Age is outside the allowed range for this term.</span>
        </div>

        <div class="input-group">
            <label>Sum Assured (Min: 1,00,000)</label>
            <input type="number" id="sa" value="200000" step="25000">
            <i class="fas fa-shield-alt"></i>
            <span id="sa-err" class="error-msg">Min Sum Assured is ₹1,00,000.</span>
        </div>

        <div class="input-group">
            <label>Policy Term</label>
            <select id="term" onchange="syncPPT()">
                <option value="15">15 Years</option>
                <option value="16">16 Years</option>
                <option value="17">17 Years</option>
                <option value="18">18 Years</option>
                <option value="19">19 Years</option>
                <option value="20">20 Years</option>
            </select>
            <i class="fas fa-clock"></i>
        </div>

        <div class="input-group">
            <label>Premium Paying Term (PPT)</label>
            <input type="number" id="ppt" readonly style="background: #f3e5f5;">
            <i class="fas fa-hourglass-start"></i>
        </div>

        <div class="input-group">
            <label>Premium Mode</label>
            <select id="mode">
                <option value="1">Yearly</option>
                <option value="0.51">Half-Yearly</option>
                <option value="0.26">Quarterly</option>
                <option value="0.089">Monthly (NACH)</option>
            </select>
            <i class="fas fa-wallet"></i>
        </div>

        <div class="input-group">
            <label>Estimated Annual Premium</label>
            <input type="number" id="premium" value="160000">
            <i class="fas fa-indian-rupee-sign"></i>
        </div>

        <div class="input-group">
            <label>GA Rate (Fixed at 50)</label>
            <input type="number" id="ga_rate" value="50">
            <i class="fas fa-gift"></i>
        </div>

        <div class="benefit-section">
            <div class="toggle-container" onclick="toggleBenefit()">
                <div id="slider" class="slider"></div>
                <div id="btn-survival" class="toggle-btn active">SURVIVAL BENEFIT</div>
                <div id="btn-death" class="toggle-btn">DEATH BENEFIT</div>
            </div>
        </div>

        <div class="input-group" id="death_ui" style="display:none; grid-column: 1 / -1;">
            <label>Estimated Year of Death</label>
            <input type="number" id="death_yr" value="10">
            <i class="fas fa-skull-crossbones"></i>
        </div>

        <button class="calc-btn" onclick="calculate()">
            <i class="fas fa-magic"></i> Calculate Now
        </button>
    </div>

    <div id="results">
        <div id="res-content"></div>
        <div class="footer-btns">
            <button class="btn-f" onclick="window.print()"><i class="fas fa-file-pdf"></i> Print PDF</button>
            <button class="btn-f" onclick="alert('Ready to share!')"><i class="fas fa-share-nodes"></i> Share Report</button>
        </div>
    </div>
</div>

<script>
    // Exact Logic Matrix based on your requirements
    const ageMatrix = {
        15: { min: 3, max: 60 },
        16: { min: 2, max: 59 },
        17: { min: 1, max: 58 },
        18: { min: 0, max: 57 },
        19: { min: 0, max: 56 },
        20: { min: 0, max: 55 }
    };

    function syncPPT() {
        const term = parseInt(document.getElementById('term').value);
        // PPT = Term - 5
        document.getElementById('ppt').value = term - 5;
    }

    let isDeath = false;
    function toggleBenefit() {
        isDeath = !isDeath;
        const slider = document.getElementById('slider');
        const deathUI = document.getElementById('death_ui');
        const bSurv = document.getElementById('btn-survival');
        const bDeath = document.getElementById('btn-death');

        if(isDeath) {
            slider.style.left = '180px';
            deathUI.style.display = 'block';
            bDeath.classList.add('active');
            bSurv.classList.remove('active');
        } else {
            slider.style.left = '5px';
            deathUI.style.display = 'none';
            bSurv.classList.add('active');
            bDeath.classList.remove('active');
        }
    }

    function calculate() {
        const name = document.getElementById('name').value || "Valued Customer";
        const age = parseInt(document.getElementById('age').value);
        const sa = parseFloat(document.getElementById('sa').value);
        const term = parseInt(document.getElementById('term').value);
        const ppt = term - 5;
        const premium = parseFloat(document.getElementById('premium').value);
        const gaRate = parseFloat(document.getElementById('ga_rate').value);
        const deathYr = parseInt(document.getElementById('death_yr').value);

        // Validations
        let valid = true;
        const limits = ageMatrix[term];

        document.getElementById('age-err').style.display = 'none';
        document.getElementById('sa-err').style.display = 'none';

        if (age < limits.min || age > limits.max) {
            const err = document.getElementById('age-err');
            err.innerText = `For Term ${term}: Min Age is ${limits.min} and Max Age is ${limits.max}.`;
            err.style.display = 'block';
            valid = false;
        }

        if (sa < 100000) {
            document.getElementById('sa-err').style.display = 'block';
            valid = false;
        }

        if (!valid) return;

        let resHTML = `<h2 style="color:var(--primary); text-align:center; margin-bottom:20px;">Policy Illustration for ${name}</h2>`;

        if (!isDeath) {
            const totalGA = (sa / 1000) * gaRate * term;
            const finalPayable = sa + totalGA;
            const totalInvested = premium * ppt;

            resHTML += `
                <div class="res-row"><span>Basic Sum Assured:</span><span class="res-val">₹ ${sa.toLocaleString()}</span></div>
                <div class="res-row"><span>Accrued Guaranteed Additions (GA):</span><span class="res-val">₹ ${totalGA.toLocaleString()}</span></div>
                <div class="res-row"><span>Total Premium Paid:</span><span class="res-val">₹ ${totalInvested.toLocaleString()}</span></div>
                <div class="res-row grand-total"><span>FINAL MATURITY BENEFIT:</span><span class="res-val">₹ ${finalPayable.toLocaleString()}</span></div>
                <div class="formula">Formula: Sum Assured on Maturity (Basic SA) + Accrued Guaranteed Additions (GA Rate × SA/1000 × Term)</div>
            `;
        } else {
            const accruedGATillDeath = (sa / 1000) * gaRate * deathYr;
            const saOnDeath = Math.max(sa * 1.25, premium * 7);
            const totalPaidTillDeath = premium * Math.min(deathYr, ppt);
            const finalDeathBenefit = saOnDeath + accruedGATillDeath;

            resHTML += `
                <div class="res-row"><span>Basic Sum Assured:</span><span class="res-val">₹ ${sa.toLocaleString()}</span></div>
                <div class="res-row"><span>Sum Assured on Death (125% SA / 7x Prem):</span><span class="res-val">₹ ${saOnDeath.toLocaleString()}</span></div>
                <div class="res-row"><span>Accrued GA till death (Year ${deathYr}):</span><span class="res-val">₹ ${accruedGATillDeath.toLocaleString()}</span></div>
                <div class="res-row"><span>Total Premiums Paid till death:</span><span class="res-val">₹ ${totalPaidTillDeath.toLocaleString()}</span></div>
                <div class="res-row grand-total"><span>FINAL DEATH CLAIM:</span><span class="res-val">₹ ${finalDeathBenefit.toLocaleString()}</span></div>
                <div class="formula">Formula: Sum Assured on Death [Max(125% of BSA or 7 × Annualized Premium)] + Accrued Guaranteed Additions till year of death</div>
            `;
        }

        document.getElementById('res-content').innerHTML = resHTML;
        document.getElementById('results').style.display = 'block';
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    // Initialize
    syncPPT();
</script>

</body>
</html>
