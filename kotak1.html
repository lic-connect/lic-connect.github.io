<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kotak Life - The Royal Collection</title>
    <!-- Fonts & Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --kotak-red: #ED1B24;
            --kotak-blue: #003366;
            --bg-deep: #1a0b2e;
            --bg-grad: linear-gradient(135deg, #4b0000 0%, #1c0030 50%, #001f3f 100%);
            --card-front-grad: linear-gradient(145deg, rgba(237, 27, 36, 0.8), rgba(0, 51, 102, 0.9));
            --card-back-grad: linear-gradient(145deg, #2e001f, #0d002e); /* Deep Plum/Indigo - NO BLACK */
            --gold: #FFD700;
            --neon-blue: #00ffff;
            --glass-border: 1px solid rgba(255, 255, 255, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--bg-grad);
            background-size: 400% 400%;
            animation: royalFlow 20s ease infinite;
            min-height: 100vh;
            color: #fff;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        @keyframes royalFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Moving Particles Background */
        .particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(var(--gold) 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.3;
            animation: twinkle 5s infinite;
            z-index: 0;
            pointer-events: none;
        }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.05); }
        }

        header {
            text-align: center;
            margin-bottom: 60px;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 4rem;
            text-transform: uppercase;
            background: linear-gradient(to right, #fff, var(--kotak-red), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(237, 27, 36, 0.6);
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.2rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 8px 30px;
            border-radius: 50px;
            display: inline-block;
            backdrop-filter: blur(5px);
        }

        /* GRID */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 50px;
            max-width: 1900px;
            margin: 0 auto;
            perspective: 2000px;
            z-index: 2;
            position: relative;
        }

        /* CARD */
        .card {
            height: 750px;
            position: relative;
            cursor: pointer;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(100, 0, 50, 0.5);
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        /* FACES */
        .front, .back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 25px;
            overflow: hidden;
            border: var(--glass-border);
            display: flex;
            flex-direction: column;
        }

        /* FRONT DESIGN */
        .front {
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            z-index: 2;
            transform: rotateY(0deg);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
        }

        /* Gradient Borders for Front */
        .front::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 25px;
            padding: 2px;
            background: linear-gradient(45deg, var(--kotak-red), var(--gold), var(--kotak-blue));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
        }

        .icon-box {
            font-size: 3.5rem;
            margin-bottom: 25px;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            box-shadow: 0 0 30px rgba(237, 27, 36, 0.4);
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float { 0%,100% {transform: translateY(0);} 50% {transform: translateY(-10px);} }

        .plan-name {
            font-family: 'Cinzel', serif;
            font-size: 1.6rem;
            margin-bottom: 10px;
            line-height: 1.3;
            color: #fff;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .cat-badge {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 5px 15px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.5);
            margin-bottom: 30px;
            background: rgba(0,0,0,0.2);
        }

        .flip-btn {
            padding: 12px 35px;
            background: linear-gradient(45deg, var(--kotak-red), #d63031);
            color: #fff;
            border: none;
            border-radius: 30px;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.9rem;
            box-shadow: 0 0 20px rgba(237, 27, 36, 0.6);
            transition: 0.3s;
            cursor: pointer;
        }
        .card:hover .flip-btn { transform: scale(1.1); box-shadow: 0 0 30px rgba(237, 27, 36, 0.9); }

        /* BACK DESIGN */
        .back {
            transform: rotateY(180deg);
            background: var(--card-back-grad);
            padding: 20px;
        }

        .back-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .back-title { color: var(--gold); font-family: 'Cinzel', serif; font-size: 1.1rem; }

        .data-list {
            flex-grow: 1;
            overflow-y: auto;
            text-align: left;
            padding-right: 8px;
        }

        /* Custom Scrollbar */
        .data-list::-webkit-scrollbar { width: 6px; }
        .data-list::-webkit-scrollbar-thumb { background: var(--kotak-red); border-radius: 10px; }
        .data-list::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }

        .data-row {
            margin-bottom: 10px;
            border-bottom: 1px dashed rgba(255,255,255,0.1);
            padding-bottom: 5px;
        }

        .label {
            display: block;
            font-size: 0.7rem;
            color: #ff9999;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 3px;
        }

        .value {
            font-size: 0.9rem;
            color: #fff;
            font-weight: 500;
            line-height: 1.4;
        }

        .usp-box {
            background: rgba(255, 215, 0, 0.05);
            border-left: 3px solid var(--gold);
            padding: 12px;
            margin-top: 15px;
            border-radius: 0 10px 10px 0;
        }

        .usp-label {
            display: block;
            color: var(--gold);
            font-weight: bold;
            margin-bottom: 5px;
            font-family: 'Cinzel', serif;
        }

        .usp-text {
            font-size: 0.85rem;
            line-height: 1.6;
            color: #e0e0e0;
            text-align: justify;
        }

        /* Category Glows */
        .cat-term .icon-box { box-shadow: 0 0 30px #00ffff; color: #00ffff; }
        .cat-save .icon-box { box-shadow: 0 0 30px #ff00ff; color: #ff00ff; }
        .cat-ulip .icon-box { box-shadow: 0 0 30px #ffff00; color: #ffff00; }
        .cat-pen .icon-box { box-shadow: 0 0 30px #00ff00; color: #00ff00; }

        /* Responsive */
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .grid-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
