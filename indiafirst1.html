<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Fonts & Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Palette - NO BLACK */
            --bg-deep: #0f0524;
            --bg-grad: linear-gradient(135deg, #1a0b2e 0%, #002c4e 50%, #2b0f25 100%);
            --card-grad-1: linear-gradient(160deg, #ff0055, #7700ff);
            --card-grad-2: linear-gradient(160deg, #00d2ff, #3a7bd5);
            --card-grad-3: linear-gradient(160deg, #f9d423, #ff4e50);
            --text-gold: #ffd700;
            --glass-bg: rgba(255, 255, 255, 0.07);
            --glass-border: 1px solid rgba(255, 255, 255, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Quicksand', sans-serif;
            background: var(--bg-grad);
            background-size: 400% 400%;
            animation: nebulaFlow 20s ease infinite;
            min-height: 100vh;
            color: #fff;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        @keyframes nebulaFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Moving Stars Background */
        .stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 3px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 2px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 3px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
            animation: starMove 100s linear infinite;
            z-index: -1;
            opacity: 0.6;
        }
        
        @keyframes starMove { to { transform: translateY(-2000px); } }

        header {
            text-align: center;
            margin-bottom: 70px;
            position: relative;
            z-index: 2;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            color: var(--text-gold);
            text-transform: uppercase;
            text-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
            margin-bottom: 15px;
        }

        .subtitle {
            font-size: 1.2rem;
            letter-spacing: 3px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            padding: 10px;
            display: inline-block;
            border-top: 1px solid rgba(255,255,255,0.3);
            border-bottom: 1px solid rgba(255,255,255,0.3);
        }

        /* GRID */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 50px;
            max-width: 1900px;
            margin: 0 auto;
            perspective: 2000px;
            z-index: 2;
        }

        /* CARD */
        .card {
            height: 750px;
            position: relative;
            cursor: pointer;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(50, 0, 100, 0.5);
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        /* FRONT & BACK */
        .front, .back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 25px;
            overflow: hidden;
            border: var(--glass-border);
            display: flex;
            flex-direction: column;
        }

        /* FRONT DESIGN */
        .front {
            align-items: center;
            justify-content: center;
            text-align: center;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            padding: 30px;
            z-index: 2;
            transform: rotateY(0deg);
        }

        /* Gradient Borders for Front */
        .front::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 25px;
            padding: 2px;
            background: linear-gradient(45deg, #ff00cc, #3333ff, #00ffcc);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
        }

        .icon-circle {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            color: #fff;
            margin-bottom: 30px;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255,255,255,0.2);
            animation: pulse 3s infinite;
        }

        @keyframes pulse { 0%,100%{transform: scale(1);} 50%{transform: scale(1.05);} }

        .plan-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            margin-bottom: 10px;
            line-height: 1.2;
            background: linear-gradient(to right, #fff, var(--text-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .plan-tag {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ccc;
            margin-bottom: 40px;
        }

        .reveal-btn {
            padding: 12px 35px;
            border: 1px solid #fff;
            color: #fff;
            border-radius: 30px;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.9rem;
            transition: 0.3s;
            background: transparent;
            cursor: pointer;
        }
        .card:hover .reveal-btn { background: #fff; color: #1a0b2e; box-shadow: 0 0 20px #fff; }

        /* BACK DESIGN */
        .back {
            transform: rotateY(180deg);
            background: #190033; /* Deep Violet - No Black */
            padding: 20px;
        }

        .back-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .back-title { color: var(--text-gold); font-family: 'Playfair Display', serif; font-size: 1.1rem; }

        .data-container {
            flex-grow: 1;
            overflow-y: auto;
            text-align: left;
            padding-right: 10px;
        }

        /* Gold Scrollbar */
        .data-container::-webkit-scrollbar { width: 5px; }
        .data-container::-webkit-scrollbar-thumb { background: var(--text-gold); border-radius: 10px; }
        .data-container::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }

        .data-row {
            margin-bottom: 8px;
            border-bottom: 1px dashed rgba(255,255,255,0.1);
            padding-bottom: 4px;
        }

        .label {
            display: block;
            font-size: 0.75rem;
            color: #00d2ff;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .value {
            font-size: 0.95rem;
            color: #fff;
            font-weight: 500;
        }

        .usp-section {
            margin-top: 15px;
            background: rgba(255, 215, 0, 0.05);
            padding: 15px;
            border-left: 4px solid var(--text-gold);
            border-radius: 0 10px 10px 0;
        }

        .usp-header {
            color: var(--text-gold);
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            font-family: 'Playfair Display', serif;
        }

        .usp-text {
            font-size: 0.85rem;
            line-height: 1.6;
            color: #e0e0e0;
            text-align: justify;
        }

        /* Category Specific Glows */
        .cat-term .icon-circle { box-shadow: 0 0 30px #00d2ff; color: #00d2ff; border-color: #00d2ff; }
        .cat-save .icon-circle { box-shadow: 0 0 30px #ff0055; color: #ff0055; border-color: #ff0055; }
        .cat-ulip .icon-circle { box-shadow: 0 0 30px #00ff00; color: #00ff00; border-color: #00ff00; }

        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .grid-container { grid-template-columns: 1fr; }
        }
    </style>
</head>

                age: "18 to 55 Years.",
                option: "Standard.",
                maturity: "SA + Loyalty Additions.",
                sb: "Nil.",
                death: "Sum Assured.",
                riders: "N/A.",
                surrender: "Allowed.",
                revival: "5 Years.",
                usp: "**Micro Bachat Plan** is a champion of affordable savings. **Who should buy it?** It is tailored for low-income households who want to save but cannot commit large amounts. With very low premium requirements, it allows daily wage earners or small business owners to secure their family's future. Despite being a micro-product, it offers 'Loyalty Additions,' incentivizing the policyholder to continue the policy till maturity. It ensures that insurance is not just a privilege of the rich but a right for everyone, protecting the most vulnerable sections of society against the loss of a breadwinner."
            },
            {
                name: "Saral Bachat Bima",
                cat: "cat-save",
                tag: "Simple Savings",
                icon: "fa-seedling",
                type: "Non-Linked Savings.",
                sa: "Based on Premium.",
                term: "10 to 15 Years.",
                ppt: "5 or 7 Years.",
                age: "0 to 60 Years.",
                option: "Standard.",
                maturity: "SA + Accrued Additions.",
                sb: "Nil.",
                death: "SA on Death.",
                riders: "Available.",
                surrender: "Allowed.",
                revival: "5 Years.",
                usp: "**Saral Bachat Bima** is a straightforward, easy-to-understand savings plan that does exactly what it says: Simple Savings with Insurance. **The USP:** It offers a short premium payment commitment (5 or 7 years) for a longer life cover and savings horizon. It creates a guaranteed corpus through additions declared by the company. This plan is ideal for conservative investors who do not want to track markets or understand complex bonus structures. It offers the peace of mind that comes with knowing your money is safe and growing, while your family is protected. A perfect starter plan for building a disciplined savings habit."
            }
        ];

        const grid = document.getElementById('cardGrid');

        plans.forEach((plan, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.setAttribute('onclick', 'this.classList.toggle("flipped")');

            // Assign gradients based on category
            let frontGrad = "";
            if (plan.cat === 'cat-term') frontGrad = "var(--card-grad-2)"; // Blue for Term
            else if (plan.cat === 'cat-ulip') frontGrad = "var(--card-grad-1)"; // Pink/Purple for ULIP
            else frontGrad = "var(--card-grad-3)"; // Gold/Red for Savings

            card.innerHTML = `
                <div class="card-inner">
                    <div class="front" style="background: ${frontGrad}">
                        <div class="icon-circle">
                            <i class="fas ${plan.icon}"></i>
                        </div>
                        <div class="plan-title">${plan.name}</div>
                        <div class="plan-tag">${plan.tag}</div>
                        <button class="reveal-btn">Click to Reveal</button>
                    </div>
                    <div class="back">
                        <div class="back-header">
                            <span class="back-title">${plan.name}</span>
                            <i class="fas fa-undo" style="color:var(--text-gold)"></i>
                        </div>
                        <div class="data-container">
                            <div class="data-row"><span class="label">1. Plan Type</span><span class="value">${plan.type}</span></div>
                            <div class="data-row"><span class="label">2. Sum Assured</span><span class="value">${plan.sa}</span></div>
                            <div class="data-row"><span class="label">3. Policy Term</span><span class="value">${plan.term}</span></div>
                            <div class="data-row"><span class="label">4. PPT</span><span class="value">${plan.ppt}</span></div>
                            <div class="data-row"><span class="label">5. Entry Age</span><span class="value">${plan.age}</span></div>
                            <div class="data-row"><span class="label">6. Option</span><span class="value">${plan.option}</span></div>
                            <div class="data-row"><span class="label">7. Maturity</span><span class="value">${plan.maturity}</span></div>
                            <div class="data-row"><span class="label">8. Survival Benefit</span><span class="value">${plan.sb}</span></div>
                            <div class="data-row"><span class="label">9. Death Benefit</span><span class="value">${plan.death}</span></div>
                            <div class="data-row"><span class="label">10. Riders</span><span class="value">${plan.riders}</span></div>
                            <div class="data-row"><span class="label">11. Surrender</span><span class="value">${plan.surrender}</span></div>
                            <div class="data-row"><span class="label">12. Revival</span><span class="value">${plan.revival}</span></div>
                            
                            <div class="usp-section">
                                <span class="usp-header">Salient Features (USP)</span>
                                <div class="usp-text">${plan.usp}</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    </script>
</body>
</html>
