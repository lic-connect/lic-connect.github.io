<head>

    <style>
        :root {
            --lic-blue: #00529b;
            --lic-yellow: #ffec00;
            --accent-pink: #d81b60;
            --bg-color: #fce4ec;
        }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: var(--bg-color); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .calc-container { background: white; width: 100%; max-width: 500px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.15); overflow: hidden; border-top: 8px solid var(--accent-pink); }
        .header { background: var(--lic-blue); color: white; padding: 25px; text-align: center; }
        .header h1 { margin: 0; font-size: 22px; letter-spacing: 1px; }
        .header p { margin: 5px 0 0; color: var(--lic-yellow); font-weight: bold; font-size: 14px; }
        .form-body { padding: 25px; }
        .badge { background: #f8bbd0; color: #880e4f; padding: 5px 12px; border-radius: 50px; font-size: 11px; font-weight: 800; display: inline-block; margin-bottom: 20px; }
        .input-box { margin-bottom: 18px; }
        label { display: block; margin-bottom: 7px; font-weight: 600; font-size: 14px; color: #444; }
        input, select { width: 100%; padding: 12px; border: 1.5px solid #eee; border-radius: 10px; font-size: 16px; box-sizing: border-box; transition: 0.3s; }
        input:focus { border-color: var(--accent-pink); outline: none; background: #fffcfd; }
        .checkbox-row { display: flex; align-items: center; gap: 12px; background: #fef7f9; padding: 15px; border-radius: 10px; margin-bottom: 12px; cursor: pointer; border: 1px solid #fce4ec; }
        .checkbox-row input { width: 20px; height: 20px; cursor: pointer; }
        button { width: 100%; background: var(--lic-blue); color: white; border: none; padding: 18px; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        button:hover { background: #003d74; transform: translateY(-1px); }
        
        #outputArea { margin-top: 25px; display: none; background: #fffde7; border: 1px solid #fbc02d; padding: 20px; border-radius: 12px; animation: fadeIn 0.5s; }
        .line { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f1f1f1; font-size: 15px; }
        .savings { color: #2e7d32; font-weight: 600; }
        .final-box { margin-top: 15px; padding-top: 15px; border-top: 2px dashed #fbc02d; text-align: center; }
        .amt { font-size: 28px; font-weight: 900; color: var(--lic-blue); display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="calc-container">
    <div class="header">
        <h1>BIMA KAVACH (887)</h1>
        <p>PPT: 15 YEARS | LIMITED PAY</p>
    </div>
    <div class="form-body">
        <div class="badge">FEMALE | NON-SMOKER | INCREASING SA</div>

        <div class="input-box">
            <label>Age (18 - 65)</label>
            <input type="number" id="age" value="18" min="18" max="65">
        </div>

        <div class="input-box">
            <label>Policy Term (20 - 82)</label>
            <input type="number" id="term" value="20" min="20" max="82">
        </div>

        <div class="input-box">
            <label>Sum Assured (Min: 2,00,00,000)</label>
            <input type="number" id="sa" value="20000000">
        </div>

        <div class="input-box">
            <label>Premium Mode</label>
            <select id="mode">
                <option value="1">Yearly</option>
                <option value="0.51">Half-Yearly</option>
                <option value="0.26">Quarterly</option>
                <option value="0.0861">Monthly (NACH)</option>
            </select>
        </div>

        <div class="checkbox-row" onclick="document.getElementById('isOnline').click()">
            <input type="checkbox" id="isOnline" checked onclick="event.stopPropagation()">
            <label style="margin:0;cursor:pointer">Online Purchase (10% Rebate)</label>
        </div>

        <div class="checkbox-row" onclick="document.getElementById('isAB').click()">
            <input type="checkbox" id="isAB" onclick="event.stopPropagation()">
            <label style="margin:0;cursor:pointer">Accident Benefit Rider</label>
        </div>

        <button onclick="calculatePremium()">Calculate Premium</button>

        <div id="outputArea">

        </div>
    </div>
</div>

    function calculatePremium() {
        const age = parseInt(document.getElementById('age').value);
        const term = parseInt(document.getElementById('term').value);
        const sa = parseFloat(document.getElementById('sa').value);
        const modeFactor = parseFloat(document.getElementById('mode').value);
        const isOnline = document.getElementById('isOnline').checked;
        const isAB = document.getElementById('isAB').checked;

        if (sa < 20000000) { alert("Min Sum Assured is 2,00,00,000"); return; }

        const ageData = tabularRates.find(r => r.Age === age);
        if (!ageData || !ageData[`T${term}`]) {
            alert("No data available for this Age/Term combination.");
            return;
        }

        const rate = ageData[`T${term}`];
        const tabularAnnual = (sa / 1000) * rate;

        // High Sum Assured Rebate Logic (Increasing SA - Option II)
        let hsaRate = 0;
        const saCr = sa / 10000000;
        if (saCr >= 3 && saCr < 5) hsaRate = (age <= 35) ? 2.00 : (age <= 55 ? 1.50 : 1.00);
        else if (saCr >= 5 && saCr < 10) hsaRate = (age <= 35) ? 3.00 : (age <= 55 ? 2.00 : 1.50);
        else if (saCr >= 10) hsaRate = (age <= 35) ? 3.50 : (age <= 55 ? 2.50 : 2.00);
        
        const hsaRebate = (tabularAnnual * hsaRate) / 100;

        // Online Rebate (10% for LP-15)
        const onlineRebate = isOnline ? (tabularAnnual * 0.10) : 0;

        // Accident Benefit (₹1 per 1000 SA, capped at 1 Crore)
        let abPremium = 0;
        if (isAB) {
            const abSA = Math.min(sa, 10000000);
            abPremium = (abSA / 1000) * 0.50 * modeFactor;
        }

        const netAnnualBase = tabularAnnual - hsaRebate - onlineRebate;
        const finalPremium = (netAnnualBase * modeFactor) + abPremium;

        // UI Updates
        document.getElementById('outputArea').style.display = 'block';
        document.getElementById('outTab').innerText = "₹ " + Math.round(tabularAnnual).toLocaleString('en-IN');
        document.getElementById('outHSA').innerText = "- ₹ " + Math.round(hsaRebate).toLocaleString('en-IN');
        document.getElementById('outOnline').innerText = "- ₹ " + Math.round(onlineRebate).toLocaleString('en-IN');
        document.getElementById('outAB').innerText = "₹ " + Math.round(abPremium).toLocaleString('en-IN');
        
        const modeTxt = {"1": "Yearly", "0.51": "Half-Yearly", "0.26": "Quarterly", "0.0861": "Monthly"};
        document.getElementById('modeLbl').innerText = modeTxt[modeFactor] + " Premium";
        document.getElementById('outTotal').innerText = "₹ " + Math.round(finalPremium).toLocaleString('en-IN');
    }
