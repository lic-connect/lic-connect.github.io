<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIC Nav Jeevan Shree (912) IRR Report</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #dc3545; --accent: #ff6b6b; --bg: #fff5f5; --text: #333; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg); margin: 0; padding: 20px; color: var(--text); }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { background: linear-gradient(135deg, #dc3545, #a71d2a); color: white; padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(220, 53, 69, 0.3); }
        .grid-layout { display: grid; grid-template-columns: 320px 1fr; gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-top: 4px solid var(--primary); }
        
        label { display: block; font-size: 0.85em; font-weight: 600; margin-bottom: 5px; color: #a71d2a; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ffcdd2; border-radius: 6px; font-size: 0.9em; margin-bottom: 15px; }
        input:focus, select:focus { outline: none; border-color: var(--primary); }

        .rider-section { background: #fff0f1; padding: 10px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #ffcdd2; }
        .checkbox-wrapper { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; font-weight: 500; font-size: 0.9em; }
        
        button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        button:hover { background: #a71d2a; transform: translateY(-2px); }
        
        #errorMsg { color: #d32f2f; background: #ffebee; padding: 10px; border-radius: 5px; font-size: 0.85em; margin-top: 10px; display: none; border: 1px solid #ef9a9a; }
        
        .results-panel { display: none; }
        .summary-box { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .kpi-card { background: #a71d2a; color: white; padding: 15px; border-radius: 8px; text-align: center; }
        .kpi-card h3 { margin: 0; font-size: 0.8em; opacity: 0.9; }
        .kpi-card span { font-size: 1.5em; font-weight: 700; }

        .table-wrap { overflow-x: auto; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; font-size: 0.85em; background: white; min-width: 900px; }
        th { background: var(--primary); color: white; padding: 10px; text-align: center; }
        td { padding: 8px; border: 1px solid #ffebee; text-align: center; }
        .total-row { background: #ffcdd2; font-weight: bold; color: #a71d2a; }
        
        @media(max-width: 768px) { .grid-layout { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>LIC Nav Jeevan Shree (912)</h1>
        <p style="margin:0; font-size:0.9em; opacity:0.9;">Limited Pay | High GA Incentives</p>
    </div>

    <div class="grid-layout">
        <div class="card">
            <h3>Plan Inputs</h3>
            
            <label>Death Benefit Option</label>
            <select id="option" onchange="updateDesc()">
                <option value="1">Option I (7x Annual Premium)</option>
                <option value="2">Option II (10x Annual Premium)</option>
            </select>
            <div id="optDesc" style="font-size:0.75em; color:#666; margin-top:-10px; margin-bottom:15px;">Sum Assured on Death: Higher of 7x Premium or Basic SA</div>

            <label>Life Assured Age (0-60)</label>
            <input type="number" id="age" value="35" min="0" max="60">

            <label>Premium Paying Term (PPT)</label>
            <select id="ppt" onchange="updateTerms()">
                <option value="6">6 Years</option>
                <option value="8">8 Years</option>
                <option value="10">10 Years</option>
                <option value="12">12 Years</option>
            </select>

            <label>Policy Term</label>
            <select id="term">
                <!-- Populated by JS -->
            </select>

            <label>Basic Sum Assured (Min 5L)</label>
            <input type="number" id="sumAssured" value="1000000" step="10000" min="500000">

            <div class="rider-section">
                <div class="checkbox-wrapper">
                    <input type="checkbox" id="pwbCheck" onchange="toggleInp('pwbInp', this)"> 
                    <label for="pwbCheck">PWB Rider (On Proposer)</label>
                </div>
                <div id="pwbInp" style="display:none;">
                    <label style="margin-bottom:2px; font-size:0.8em;">Proposer Age (18-55)</label>
                    <input type="number" id="propAge" value="30">
                </div>
            </div>

            <button onclick="generateReport()">Generate IRR Table</button>
            <div id="errorMsg"></div>
        </div>

        <div class="results-panel" id="resultsPanel">
            <div class="summary-box">
                <div class="kpi-card">
                    <h3>Net Benefit</h3>
                    <span id="netProfit">₹0</span>
                </div>
                <div class="kpi-card" style="background:#00897b;">
                    <h3>XIRR (Yield)</h3>
                    <span id="xirrVal">0.00%</span>
                </div>
            </div>

            <div class="card" style="padding:0; overflow:hidden;">
                <div class="table-wrap">
                    <table id="flowTable">
                        <thead>
                            <tr>
                                <th>Year</th>
                                <th>Age</th>
                                <th>Premium<br><small>(Outflow)</small></th>
                                <th>Maturity<br><small>(SA+GA)</small></th>
                                <th>Accrued GA</th>
                                <th>Death Benefit<br><small>(Cover)</small></th>
                                <th>Net Cashflow</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                        <tfoot id="tableFoot"></tfoot>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

    function updateTerms() {
        const ppt = document.getElementById('ppt').value;
        const termSel = document.getElementById('term');
        termSel.innerHTML = '';
        
        let minT = 0, maxT = 20;
        if(ppt === '6') minT = 10;
        else if(ppt === '8' || ppt === '10') minT = 15;
        else if(ppt === '12') minT = 16;
        
        for(let t=minT; t<=maxT; t++) {
            const opt = document.createElement('option');
            opt.value = t;
            opt.textContent = `${t} Years`;
            termSel.appendChild(opt);
        }
    }
    
    // Init terms on load
    document.addEventListener('DOMContentLoaded', updateTerms);

    function toggleInp(id, cb) { document.getElementById(id).style.display = cb.checked ? 'block' : 'none'; }

    function xirr(values) {
        let x = 0.1;
        for (let i = 0; i < 100; i++) {
            let f = 0, df = 0;
            for (let j = 0; j < values.length; j++) {
                let p = Math.pow(1 + x, j);
                f += values[j] / p;
                df -= j * values[j] / (p * (1 + x));
            }
            if (Math.abs(df) < 1e-12) break;
            x = x - f / df;
        }
        return x;
    }

    function generateReport() {
        const age = parseInt(document.getElementById('age').value);
        const ppt = parseInt(document.getElementById('ppt').value);
        const term = parseInt(document.getElementById('term').value);
        const sa = parseInt(document.getElementById('sumAssured').value);
        const opt = parseInt(document.getElementById('option').value);
        const err = document.getElementById('errorMsg');
        err.style.display = 'none';

        // --- VALIDATIONS ---
        if(age < 0) { showError("Age must be 0+"); return; }
        // Max Age logic from text:
        // PPT 6, 8, 10: Max 60 (Opt 1) / 59 ?? Text says "60 yrs nbd for PPT 6, 8 and 10 yrs" (Option 1?). 
        // Let's stick to standard logic: 
        if(ppt === 12 && age > 55) { showError("Max Age for PPT 12 is 55"); return; } 
        if(age > 60) { showError("Max Entry Age is 60"); return; }

        if(sa < 500000) { showError("Min Sum Assured is 5L"); return; }
        
        // PWB
        const hasPwb = document.getElementById('pwbCheck').checked;
        const propAge = parseInt(document.getElementById('propAge').value);
        if(hasPwb) {
            if(age > 17) { showError("PWB allowed only if Life Assured Age <= 17"); return; }
            if(isNaN(propAge) || propAge < 18 || propAge > 55) { showError("Proposer Age for PWB must be 18-55"); return; }
        }

        // --- PREMIUM CALCULATION ---
        const data = (opt === 1) ? option1Data : option2Data;
        const ageRow = data.find(r => r.Age === age);
        if(!ageRow) { showError("Rate not found"); return; }
        
       // Key format: "T{Term}_{PPT}" e.g., "T10_6"
        let key = `T${term}_${ppt}`;
        if(term===18 && ppt===6 && ageRow["T18 _6"]) key = "T18 _6"; // Handle specific typo if present in JSON

        const rate = ageRow[key];
        if(!rate || rate === 0) { showError("Invalid Age/Term/PPT Combination"); return; }

        // Premium Calculation (No Mode Rebate for 912 usually, or Rate is Tabular)
        // Check: 10L SA / 1000 * Rate 202.7 (implied from your correct premium) = 202,700
        // Your target is 202,700. If rate is ~202.7, then formula is simply:
        let basePrem = (sa/1000) * rate;

        // Plan 912 usually does NOT have a mode rebate on the tabular premium itself for Yearly.
        // It uses Modal Factors for non-yearly.
        // So, Annual Premium Paid = Base Premium.
     

        // Mode Rebate for Yearly: 2%
        // "Tabular Annual Premium" usually means rate * SA. 
        // Actual premium paid = Tabular * (1 - Mode Rebate).
        // For 912, Yearly mode rebate is 2%.
     let annualPremPaid = basePrem; // No 2% rebate for Yearly in Plan 912
        // PWB
        let pwbPrem = 0;
        if(hasPwb) {
            let band = propAge<=25?'T1': propAge<=30?'T2': propAge<=35?'T3': propAge<=40?'T4': propAge<=45?'T5': propAge<=50?'T6':'T7';
            const pRow = pwbRates.find(r => r.Term === ppt);
            if(pRow) {
                const pRate = pRow[band];
                // PWB Base = Tabular Annual Premium (before rebate) OR Paid? Usually Tabular.
                // Formula from BSMDT: (Tabular * Rate) / 100
                pwbPrem = (basePrem * pRate) / 100; 
            }
        }

        const finalAnnualPrem = Math.round(annualPremPaid + pwbPrem);

        // --- GA CALCULATION ---
        // Incentive for High SA (Added to GA Rate):
        // 7L-9.99L: varies by PPT
        // ... Logic from BSMDT `getIncentiveRate`
        let incentive = 0;
        if (sa >= 700000 && sa < 1000000) {
            if(ppt===6) incentive=0.07; else if(ppt===8) incentive=0.08; else if(ppt===10) incentive=0.10; else if(ppt===12) incentive=0.12;
        } else if (sa >= 1000000 && sa < 1500000) {
            if(ppt===6) incentive=0.10; else if(ppt===8) incentive=0.12; else if(ppt===10) incentive=0.20; else if(ppt===12) incentive=0.25;
        } else if (sa >= 1500000 && sa <= 2000000) {
            if(ppt===6) incentive=0.12; else if(ppt===8) incentive=0.15; else if(ppt===10) incentive=0.25; else if(ppt===12) incentive=0.30;
        } else if (sa > 2000000) {
            if(ppt===6) incentive=0.15; else if(ppt===8) incentive=0.20; else if(ppt===10) incentive=0.30; else if(ppt===12) incentive=0.35;
        }

        // Base GA Rate
        let baseGaRate = 0;
        if(term >= 10 && term <= 13) baseGaRate = 8.50; // Per 1000 SA? NO. "As percentage of Total Tabular Annual Premium"
        else if(term >= 14 && term <= 17) baseGaRate = 9.00;
        else if(term >= 18 && term <= 20) baseGaRate = 9.50;

        const totalGaPercent = baseGaRate + incentive;
        // GA Amount = (Total Tabular Premium Paid TO DATE? No, usually accrued per year based on annual premium)
        // Text: "Guaranteed Additions... As a percentage of Total Tabular Annual Premium Paid"
        // This usually means: GA accruing = % of (Tabular Premium). Accrues every year during PPT? 
        // Actually, Plan 912 GA accrues at end of *each policy year* for the *entire policy term*? Or just PPT?
        // Brochure: "Guaranteed Additions... accrued at the end of each policy year... throughout the policy term."? 
        // Wait, text in BSMDT says "As a percentage of Total Tabular Annual Premium Paid". This phrasing is tricky.
        // Standard LIC 912 logic: GA accrues *during PPT*.
        // Let's check standard Nav Jeevan Shree. It's a Limited Pay. GA usually accrues during PPT.
        // Correction: GA amount is calculated as % of "Total Tabular Annual Premium". 
        // Wait, is it % of *Annual* premium or *Total* premium paid so far?
        // Usually: GA = Rate * Annualized Premium.
        // Let's assume GA accrues every year during PPT.
        
        // Re-reading logic from similar plans: GA rate is applied to the *Annual* premium. 
        // e.g. 8.5% of Annual Premium is added as GA every year.
        const gaAmount = Math.round((basePrem * totalGaPercent) / 100); 

        // --- TABLE GENERATION ---
        document.getElementById('resultsPanel').style.display = 'block';
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        
        let cflows = [], totalOut = 0, totalIn = 0;
        let accruedGA = 0;

        for(let yr = 0; yr <= term; yr++) {
            let curAge = age + yr;
            
            // Outflow
            let out = 0;
            if (yr < ppt) out = finalAnnualPrem;

            // GA Accrual Fix: Plan 912 GA accrues at the end of EACH policy year throughout the POLICY TERM (provided premiums are paid).
            // For a fully paid policy, it continues to accrue after PPT.
            if(yr <= term) {
                // Ensure we don't add GA at year 0
                if(yr > 0) accruedGA += gaAmount;
            }

            // Maturity
            let matVal = 0;
            if (yr === term) matVal = sa + accruedGA;

            // Death Benefit
            let db = 0;
            if (yr < term) {
                let totalPremiumsPaid = finalAnnualPrem * (yr + 1);
                if (yr >= ppt) totalPremiumsPaid = finalAnnualPrem * ppt;

                let saOnDeath = 0;
                if(opt === 1) saOnDeath = Math.max(7 * basePrem, sa);
                else saOnDeath = Math.max(10 * basePrem, sa);
                
                let dbVal = saOnDeath + accruedGA;
                db = Math.max(dbVal, 1.05 * totalPremiumsPaid);
            }

            let net = matVal - out;
            cflows.push(net);
            totalOut += out;
            totalIn += matVal;

            tbody.innerHTML += `
                <tr>
                    <td>${yr}</td>
                    <td>${curAge}</td>
                    <td class="outflow">${out > 0 ? '₹'+out.toLocaleString() : '-'}</td>
                    <td>${matVal > 0 ? '₹'+matVal.toLocaleString() : '-'}</td>
                    <td>₹${accruedGA.toLocaleString()}</td>
                    <td style="color:blue">${db > 0 ? '₹'+Math.round(db).toLocaleString() : '-'}</td>
                    <td style="font-weight:bold">${net !== 0 ? (net > 0 ? '+' : '') + '₹'+Math.round(net).toLocaleString() : '-'}</td>
                </tr>
            `;
        }

        document.getElementById('netProfit').innerText = "₹" + (totalIn - totalOut).toLocaleString();
        document.getElementById('xirrVal').innerText = (xirr(cflows)*100).toFixed(2) + "%";
        document.getElementById('tableFoot').innerHTML = `
            <tr class="total-row">
                <td colspan="2">TOTAL</td>
                <td>₹${totalOut.toLocaleString()}</td>
                <td>₹${totalIn.toLocaleString()}</td>
                <td>-</td>
                <td>-</td>
                <td>₹${(totalIn-totalOut).toLocaleString()}</td>
            </tr>
        `;
    }

    function showError(msg) {
        const e = document.getElementById('errorMsg');
        e.innerText = "⚠️ " + msg;
        e.style.display = 'block';
    }
