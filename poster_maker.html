            font-family: 'Poppins', sans-serif;

            margin: 0; 
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container { 
            max-width: 500px; 
            width: 100%;
            background: white; 
            padding: 20px; 
            border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
            text-align: center;

        .subtitle { color: #666; font-size: 0.85rem; margin-bottom: 20px; }

        /* Controls Section */
        .selector-box {
            background: #f8fafc;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid #e2e8f0;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #ddd;
            font-family: 'Poppins';
            font-size: 0.9rem;
            margin-bottom: 10px;
            outline: none;
        }

        .nav-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-btn {
            background: var(--lic-blue);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .nav-btn:hover { background: #003d7a; }
        #themeCounter { font-weight: 600; color: var(--lic-accent); font-size: 0.9rem; }

        /* Canvas Style */
        #posterCanvas {
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            background: #eee;
            margin-bottom: 20px;
        }

        .action-btns {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .btn {
            padding: 14px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-download { background: #27ae60; color: white; font-size: 1rem; }
        .btn-download:hover { background: #219150; }
        .btn-back { background: #eee; color: #333; }

        /* Loading Spinner Overlay */
        #loadingOverlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            color: var(--lic-blue);
        }
    </style>
</head>

        <a href="main.html" class="btn btn-back">Return to Dashboard</a>

let currentImgIdx = 1; // Designs 1 to 10

    // --- MAIN DRAWING FUNCTION ---
function drawPoster() {
    const canvas = document.getElementById('posterCanvas');
    const ctx = canvas.getContext('2d');
    const loading = document.getElementById('loadingOverlay');
    const cat = document.getElementById('categorySelect').value;
    
    // Get info from our hard-coded database
    const theme = posterDatabase[cat];
    const imageUrl = theme.images[currentImgIdx - 1]; // -1 because arrays start at 0

    loading.style.display = "block";
    document.getElementById('themeCounter').innerText = `Design ${currentImgIdx} of 10`;

    const bgImg = new Image();
    bgImg.crossOrigin = "anonymous"; 
    
    // Use the hard-coded URL
    bgImg.src = imageUrl;

    bgImg.onload = function() {
        ctx.drawImage(bgImg, 0, 0, 1080, 1080);

        // --- THE OVERLAYS (Slogan, Blue Bar, Photo) ---
        // Slogan Box
        ctx.fillStyle = "rgba(0,0,0,0.6)";
        ctx.fillRect(0, 0, 1080, 180);
        ctx.fillStyle = "white";
        ctx.textAlign = "center";
        ctx.font = "bold 55px Poppins";
        ctx.fillText(theme.slogan, 540, 110);

        // Blue Branding Bar
        ctx.fillStyle = "rgba(0, 85, 164, 0.95)"; 
        ctx.fillRect(0, 880, 1080, 200);

        // Agent Name & Phone
        const agent = JSON.parse(localStorage.getItem('agentData')) || { name: "LIC ADVISOR", phone: "Contact Me" };
        ctx.textAlign = "left";
        ctx.fillStyle = "white";
        ctx.font = "bold 50px Poppins";
        ctx.fillText(agent.name.toUpperCase(), 320, 955);
        ctx.font = "42px Poppins";
        ctx.fillText("📞 " + agent.phone, 320, 1030);

        // Profile Photo Logic
        const savedPhoto = localStorage.getItem('agentPhoto');
        if (savedPhoto) {
            const pfp = new Image();
            pfp.onload = function() {
                ctx.save();
                ctx.beginPath();
                ctx.arc(160, 980, 115, 0, Math.PI * 2);
                ctx.clip();
                ctx.drawImage(pfp, 45, 865, 230, 230);
                ctx.restore();
                ctx.strokeStyle = "white"; ctx.lineWidth = 10; ctx.stroke();
                loading.style.display = "none";
            };
            pfp.src = savedPhoto;
        } else {
            loading.style.display = "none";
        }
    };

    bgImg.onerror = function() {
        loading.style.display = "none";
        alert("Image URL is empty or broken for this design. Please add a valid image link.");
    };
}
    // --- NAVIGATION LOGIC ---
function changeImage(dir) {
    currentImgIdx += dir;
    if (currentImgIdx > 10) currentImgIdx = 1;
    if (currentImgIdx < 1) currentImgIdx = 10;
    
    // Calling the function to redraw everything
    drawPoster();
}

    function resetAndDraw() {
        currentImgIdx = 1;
        drawPoster();
    }

    function downloadPoster() {
        const cat = document.getElementById('categorySelect').value;
        const link = document.createElement('a');
        link.download = `LIC_Poster_${cat}_${currentImgIdx}.png`;
        try {
            link.href = canvas.toDataURL('image/png');
            link.click();
        } catch(e) {
            alert("Security error: Could not download. Try long-pressing the image to save.");
        }
    }

    window.onload = drawPoster;
</script>
