<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instalment Cum Revival Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --lic-grey: #444444;
            --light-grey: #f4f4f4;
            --border-grey: #cccccc;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background: #e9e9e9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .calculator-card {
            width: 100%;
            max-width: 900px;
            background: var(--white);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 35px;
            border-top: 10px solid var(--lic-grey);
        }

        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { color: var(--lic-grey); font-size: 24px; text-transform: uppercase; }

        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .input-group { display: flex; flex-direction: column; }
        .input-group label { font-size: 11px; font-weight: 700; color: #555; margin-bottom: 5px; text-transform: uppercase; }

        input, select {
            padding: 10px;
            border: 1px solid var(--border-grey);
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
        }

        .premium-row {
            display: grid;
            grid-template-columns: 1fr 1fr 40px;
            gap: 10px;
            margin-bottom: 10px;
        }

        .btn-add { background: var(--lic-grey); color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600; }
        .btn-remove { background: #666; color: white; border: none; border-radius: 4px; cursor: pointer; }

        .calc-btn {
            width: 100%;
            padding: 16px;
            background: var(--lic-grey);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
        }

        #results { margin-top: 30px; display: none; }
        .summary-box {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
            padding: 15px;
            background: #fdfdfd;
            border: 1px solid #eee;
            border-radius: 8px;
        }
        .summary-item span { display: block; font-weight: 700; color: var(--lic-grey); font-size: 16px; }

        .table-container { overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: var(--lic-grey); color: white; padding: 10px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #eee; font-weight: 600; }
    </style>
</head>
<body>

<div class="calculator-card">
    <div class="header">
        <h1>Instalment Cum Revival</h1>
    </div>

    <div class="input-grid">
        <div class="input-group">
            <label>Plan Name</label>
            <select id="planName" onchange="document.getElementById('planNumber').value = this.value">
                <option value="714">714-New Endowment</option>
                <option value="715">715-Jeevan Anand</option>
                <option value="720">720-Money Back 20 Yrs</option>
                <option value="721">721-Money Back 25 Yrs</option>
                <option value="732">732-Child Money Back</option>
                <option value="733">733-Jeevan Lakshya</option>
                <option value="734">734-Jeevan Tarun</option>
                <option value="736">736-Jeevan Labh</option>
                <option value="745">745-Jeevan Umang</option>
                <option value="748">748-Bima Shree</option>
                <option value="751">751-Micro Bachat</option>
                <option value="764">764-Bima Ratna</option>
                <option value="768">768-Jeevan Azad</option>
                <option value="771">771-Jeevan Utsav</option>
                <option value="774">774-Amrit Baal</option>
                <option value="881">881-Bima Lakshmi</option>
                <option value="912">912-Nav Jeevan Shree</option>
            </select>
        </div>
        <div class="input-group">
            <label>Plan No.</label>
            <input type="text" id="planNumber" value="714" readonly>
        </div>
        <div class="input-group">
            <label>Revival/Approval Date</label>
            <input type="date" id="revivalDate">
        </div>
        <div class="input-group">
            <label>Interest Rate (%)</label>
            <input type="number" id="intRate" value="9.50" step="0.01">
        </div>
    </div>

    <div class="input-grid">
        <div class="input-group" style="max-width: 250px;">
            <label>Number of Instalments</label>
            <input type="number" id="numInstalments" value="6" min="2">
        </div>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <span style="font-size:12px; font-weight:700; color:#555;">UNPAID PREMIUMS</span>
        <button class="btn-add" onclick="addRow()">+ Add Installment</button>
    </div>

    <div id="premium-container"></div>

    <button class="calc-btn" onclick="calculateInstalmentRevival()">Calculate Instalment Plan</button>

    <div id="results">
        <div class="summary-box">
            <div class="summary-item">Initial Dues (Total):<span id="outInitialDues">₹ 0.00</span></div>
            <div class="summary-item">Instalment Principal:<span id="outInstPrincipal">₹ 0.00</span></div>
            <div class="summary-item">Total Interest (All Instalments):<span id="outTotalInt">₹ 0.00</span></div>
        </div>

        <h3>Instalment Schedule</h3>
        <div class="table-container">
            <table id="scheduleTable">
                <thead>
                    <tr>
                        <th>No.</th>
                        <th>Principal (₹)</th>
                        <th>Interest (₹)</th>
                        <th>Total (₹)</th>
                        <th>Balance (₹)</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    document.getElementById('revivalDate').valueAsDate = new Date();
    addRow();

    function addRow() {
        const div = document.createElement('div');
        div.className = 'premium-row';
        div.innerHTML = `
            <input type="number" class="p-amt" placeholder="Amount">
            <input type="date" class="p-due">
            <button class="btn-remove" onclick="this.parentElement.remove()">X</button>
        `;
        document.getElementById('premium-container').appendChild(div);
    }

    function calculateInstalmentRevival() {
        const planNum = document.getElementById('planNumber').value;
        const eligiblePlans = ['714', '715', '720', '721', '732', '733', '734', '736', '745', '748', '751', '764', '768', '771', '774', '881', '912'];
        
        if (!eligiblePlans.includes(planNum)) {
            alert("NOT ELIGIBLE FOR INSTALLMENT CUM REVIVAL.");
            return;
        }

        const revivalDate = new Date(document.getElementById('revivalDate').value);
        const rate = parseFloat(document.getElementById('intRate').value) / 100;
        const n = parseInt(document.getElementById('numInstalments').value);

        const amts = document.querySelectorAll('.p-amt');
        const dues = document.querySelectorAll('.p-due');

        let sumUnpaid = 0;
        let initialInterest = 0;
        let count = 0;

        amts.forEach((input, i) => {
            const amt = parseFloat(input.value);
            const dueStr = dues[i].value;

            if (isNaN(amt) || amt <= 0 || !dueStr) return; 

            const dueDate = new Date(dueStr);
            if (dueDate < revivalDate) {
                const days = Math.ceil(Math.abs(revivalDate - dueDate) / (1000 * 60 * 60 * 24));
                initialInterest += (amt * rate * days) / 365;
                sumUnpaid += amt;
                count++;
            }
        });

        if (count === 0) { alert("Enter valid premium details."); return; }

        const initialDues = sumUnpaid + initialInterest;
        const instPrincipal = initialDues / n;

        const tbody = document.querySelector('#scheduleTable tbody');
        tbody.innerHTML = '';
        
        let balance = initialDues;
        let totalInterestAccrued = 0;
        let currentDate = new Date(revivalDate);

        for(let i=1; i<=n; i++) {
            let nextDate = new Date(currentDate);
            nextDate.setMonth(nextDate.getMonth() + 1); 
            
            const exactDays = Math.ceil(Math.abs(nextDate - currentDate) / (1000 * 60 * 60 * 24));
            const ongoingInterest = (balance * rate * exactDays) / 365;
            const totalInstalment = instPrincipal + ongoingInterest;
            
            const row = `<tr>
                <td>${i}</td>
                <td>${instPrincipal.toFixed(2)}</td>
                <td>${ongoingInterest.toFixed(2)}</td>
                <td>${totalInstalment.toFixed(2)}</td>
                <td>${Math.max(0, balance - instPrincipal).toFixed(2)}</td>
            </tr>`;
            tbody.innerHTML += row;
            
            totalInterestAccrued += ongoingInterest;
            balance -= instPrincipal;
            currentDate = nextDate; 
        }

        document.getElementById('results').style.display = 'block';
        document.getElementById('outInitialDues').innerText = "₹ " + initialDues.toLocaleString('en-IN', {minimumFractionDigits:2});
        document.getElementById('outInstPrincipal').innerText = "₹ " + instPrincipal.toLocaleString('en-IN', {minimumFractionDigits:2});
        document.getElementById('outTotalInt').innerText = "₹ " + totalInterestAccrued.toLocaleString('en-IN', {minimumFractionDigits:2});

        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }
</script>

</body>
</html>
