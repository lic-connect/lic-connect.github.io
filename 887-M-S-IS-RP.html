        .form-body { padding: 30px; }
        .tag { background: #fff5f5; color: #c53030; padding: 5px 12px; border-radius: 4px; font-size: 10px; font-weight: 800; display: inline-block; margin-bottom: 20px; text-transform: uppercase; border: 1px solid #feb2b2; }
        .input-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: 700; font-size: 13px; color: #4a5568; }

        .checkbox-row { display: flex; align-items: center; gap: 10px; background: #f7fafc; padding: 12px; border-radius: 8px; margin-bottom: 15px; cursor: pointer; border: 1px solid #edf2f7; }
        button { width: 100%; background: var(--lic-blue); color: white; border: none; padding: 18px; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
        #results { margin-top: 25px; display: none; background: #fffdf0; border: 1px solid #fefcbf; padding: 20px; border-radius: 10px; }
        .res-line { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f7fafc; font-size: 15px; }
        .rebate { color: var(--success-green); font-weight: bold; }
        .total-container { text-align: center; margin-top: 20px; padding-top: 20px; border-top: 2px dashed #cbd5e0; }

    function calculate() {
        const age = parseInt(document.getElementById('age').value);
        const term = parseInt(document.getElementById('term').value);
        const sa = parseFloat(document.getElementById('sa').value);
        const abSa = parseFloat(document.getElementById('abSa').value) || 0;
        const mode = document.getElementById('mode').value;
        const online = document.getElementById('isOnline').checked;
        const errBox = document.getElementById('errorBox');
        
        errBox.style.display = 'none';

        // 1. Validations
        if (sa < 20000000) { showErr("Minimum Sum Assured is ₹ 2,00,00,000"); return; }
        if (abSa > 10000000) { showErr("Maximum AB Sum Assured is ₹ 1,00,00,000 (100 Lakhs)"); return; }
        if (abSa > sa) { showErr("AB Sum Assured cannot exceed Basic Sum Assured"); return; }
        if (age < 18 || age > 65) { showErr("Age must be between 18 and 65"); return; }

        const row = tabularRates.find(r => r.Age === age);
        if (!row || !row[`T${term}`]) { showErr("Rates not found for this Age/Term in provided sample."); return; }

        // 2. Yearly Tabular
        const yearlyTabular = (sa / 1000) * row[`T${term}`];

        // 3. High Sum Assured Rebate (Page 11b - Option II: Increasing SA)
        let hsaPerc = 0;
        const saCr = sa / 10000000;
        if (saCr >= 3) {
            if (age <= 35) hsaPerc = saCr < 5 ? 2.00 : (saCr < 10 ? 3.00 : 3.50);
            else if (age <= 55) hsaPerc = saCr < 5 ? 1.50 : (saCr < 10 ? 2.00 : 2.50);
            else hsaPerc = saCr < 5 ? 1.00 : (saCr < 10 ? 1.50 : 2.00);
        }
        const hsaAmount = yearlyTabular * (hsaPerc / 100);

        // 4. Online Sale Rebate (7.5% for Limited PPT)
        const onlineRebate = online ? (yearlyTabular * 0.075) : 0;

        // 5. Modal Calculation
        const factors = { "yly": 1, "hly": 0.51, "qly": 0.26, "mly": 0.0861 };
        const labels = { "yly": "Yearly", "hly": "Half-Yearly", "qly": "Quarterly", "mly": "Monthly" };
        
        const netYearly = yearlyTabular - hsaAmount - onlineRebate;
        const modalBase = netYearly * factors[mode];

        // 6. AB Rider (Provisional rate for 15yr PPT ~ 0.90 per 1000 SA yearly)
        const yearlyAB = (abSa / 1000) * 0.50; 
        const modalAB = yearlyAB * factors[mode];

        const totalInstallment = modalBase + modalAB;

        // Display
        document.getElementById('results').style.display = 'block';
        document.getElementById('outTab').innerText = Math.round(yearlyTabular).toLocaleString('en-IN');
        document.getElementById('outHSA').innerText = "- " + Math.round(hsaAmount).toLocaleString('en-IN') + " (" + hsaPerc + "%)";
        document.getElementById('outOnline').innerText = "- " + Math.round(onlineRebate).toLocaleString('en-IN');
        document.getElementById('outAB').innerText = "+ " + Math.round(modalAB).toLocaleString('en-IN');
        document.getElementById('modeLbl').innerText = labels[mode] + " Premium";
        document.getElementById('outTotal').innerText = "₹ " + Math.round(totalInstallment).toLocaleString('en-IN');
    }

    function showErr(msg) {
        const errBox = document.getElementById('errorBox');
        errBox.innerText = "⚠️ " + msg;
        errBox.style.display = 'block';
        document.getElementById('results').style.display = 'none';
    }
</script>
