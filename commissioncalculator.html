<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dynamic LIC Commission Calculator</title>
<!-- PWA: Link to the Manifest File -->
<link rel="manifest" href="manifest.json">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@400;600&display=swap');

        :root {
            --primary-bg: #008080; /* Teal */
            --secondary-bg: #004d4d; /* Darker Teal */
            --accent-color: #00ffff; /* Cyan/Aqua for glow */
            --highlight-color: #ff00ff; /* Flamboyant Magenta */
            --text-color: #000000;
            --card-bg: rgba(255, 255, 255, 0.1);
            --border-color: rgba(0, 255, 255, 0.5);
        }

        body {
            background: linear-gradient(135deg, var(--primary-bg), var(--secondary-bg));
            color: var(--text-color);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 25px var(--accent-color);
            border: 2px solid var(--border-color);
            animation: pulse-glow 5s infinite alternate;
        }

        @keyframes pulse-glow {
            from { box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 25px var(--accent-color); }
            to { box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 40px var(--highlight-color); }
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 10px;
            color: #FFFFFF;
        }

        #share-btn {
            background: none;
            border: 2px solid var(--accent-color);
            color: var(--accent-color);
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        #share-btn:hover {
            background-color: var(--accent-color);
            color: var(--secondary-bg);
            box-shadow: 0 0 15px var(--accent-color);
        }

        #current-date {
            font-weight: 600;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }

        header { text-align: center; margin-bottom: 30px; color: #FFFFFF; }
        header h1 { font-family: 'Orbitron', sans-serif; font-size: 2.5em; text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 15px var(--accent-color), 0 0 20px var(--accent-color); margin: 0; }
        header p { font-size: 1.1em; color: #f0f0f0; }

        .input-panel { background: var(--card-bg); padding: 25px; border-radius: 15px; margin-bottom: 25px; border: 1px solid var(--border-color); }
        h2 { color: #FFFFFF; text-align: center; margin-top: 0; margin-bottom: 20px; font-weight: 600; border-bottom: 2px solid var(--accent-color); padding-bottom: 10px; text-shadow: 0 0 5px var(--accent-color); }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; color: #DDDDDD; }
        .form-group input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background-color: rgba(0,0,0,0.4); color: #FFFFFF; font-size: 1em; box-sizing: border-box; transition: all 0.3s ease; }
        .form-group input:focus { outline: none; border-color: var(--highlight-color); box-shadow: 0 0 15px var(--highlight-color); }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        .tab-nav { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid var(--border-color); }
        .tab-button { padding: 12px 25px; cursor: pointer; border: none; background: none; color: #ccc; font-size: 1.1em; font-weight: 600; border-radius: 10px 10px 0 0; transition: all 0.3s ease; position: relative; bottom: -2px; }
        .tab-button:hover { color: #fff; background-color: rgba(0, 255, 255, 0.1); }
        .tab-button.active { color: #fff; border: 2px solid var(--border-color); border-bottom: 2px solid var(--highlight-color); text-shadow: 0 0 10px var(--highlight-color); }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: contentFadeIn 0.5s ease; }
        @keyframes contentFadeIn { from { opacity: 0; } to { opacity: 1; } }

        .plan-checklist { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; padding: 15px; background: var(--card-bg); border-radius: 10px; max-height: 250px; overflow-y: auto; }
        .combo-item { display: flex; align-items: center; gap: 8px; padding: 5px; border-radius: 5px; transition: background-color 0.2s; }
        .combo-item:hover { background-color: rgba(0, 255, 255, 0.1); }
        .combo-item label { color: #ddd; cursor: pointer; flex-grow: 1; }
        .combo-item input[type="checkbox"] { accent-color: var(--highlight-color); transform: scale(1.2); cursor: pointer; flex-shrink: 0; }
        .combo-item .commission-input { width: 60px; padding: 5px; text-align: center; flex-shrink: 0; }
        .combo-item .commission-input:disabled { background-color: rgba(0,0,0,0.2); cursor: not-allowed; opacity: 0.5; }

        .results-panel { background: var(--card-bg); padding: 25px; border-radius: 15px; margin-top: 25px; border: 1px solid var(--border-color); }
        .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .result-card { background: linear-gradient(145deg, #009688, #004d40); color: var(--text-color); padding: 20px; border-radius: 10px; border: 1px solid var(--accent-color); box-shadow: 5px 5px 15px rgba(0,0,0,0.3); text-align: center; opacity: 0; transform: translateY(20px); animation: fadeIn 0.5s forwards; display: flex; flex-direction: column; justify-content: space-between; }
        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
        .result-card h3 { margin-top: 0; font-size: 1.3em; color: #FFFFFF; text-shadow: 1px 1px 2px #000; }
        .result-card p { margin: 8px 0; font-size: 1em; background-color: rgba(255, 255, 255, 0.85); padding: 8px; border-radius: 5px; flex-grow: 1; }
        .result-card .premium { font-size: 1.5em; font-weight: bold; color: #000000; }
        .result-card .prompt { color: var(--highlight-color); font-weight: bold; }

        .summary-card {
            grid-column: 1 / -1;
            background: linear-gradient(145deg, var(--highlight-color), #8a008a);
            color: #fff;
            border: 2px solid var(--accent-color);
            text-align: center;
        }
        .summary-card h3 { font-size: 1.5em; margin-bottom: 15px; }
        .summary-card p { background-color: transparent !important; font-size: 1.2em !important; }

        .placeholder, .error-message { grid-column: 1 / -1; text-align: center; padding: 20px; color: #FFFFFF; font-style: italic; background: var(--card-bg); border-radius: 10px; }
        .error-message { color: #ffdddd; background: #8b0000; font-weight: bold; font-style: normal; display: none; margin-bottom: 20px; padding: 15px; border: 1px solid #ff4d4d; }

    .home-button-container {
      position: fixed; /* This makes it float on top of other content */
      top: 20px;       /* Position 20px from the top edge */
      right: 25px;     /* Position 25px from the right edge */
      z-index: 1000;   /* Ensures it's above other elements */
    }

    .home-button-container a img {
      width: 50px; /* Adjust size as needed */
      height: 50px;

      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      transition: transform 0.2s;
    }

    .home-button-container a:hover img {
      transform: scale(1.1); /* Slightly enlarge on hover */
    }


@media (max-width: 768px) {
    /* 1. Reset Body: Allow vertical flow only */
    body {
        padding: 10px !important;
        overflow-x: hidden !important;
        width: 100vw !important;
    }

    /* 2. Fix Containers: Remove fixed widths (like 400px or 1200px) */
    .container, .portal-container, .calc-wrapper, .input-panel, .panel, .container-gatekeeper {
        width: 100% !important;
        max-width: 100% !important;
        margin: 0 auto !important;
        padding: 15px !important;
        box-sizing: border-box !important;
        border-radius: 10px !important;
    }

    /* 3. Scale Headers: Make titles fit on one line */
    h1 {
        font-size: 1.8rem !important;
        line-height: 1.2 !important;
        margin-bottom: 15px !important;
    }
    
    .header p {
        font-size: 11px !important;
    }

    /* 4. Force Single Column: Fix grids for mobile */
    .plan-grid, .form-grid, .results-grid, .calc-wrapper, .split-screen, .form-grid-887 {
        display: flex !important;
        flex-direction: column !important;
        grid-template-columns: 1fr !important;
        gap: 15px !important;
    }

    /* 5. Android Input Fix: Big enough to tap, no auto-zoom */
    input, select, textarea, button {
        font-size: 16px !important; /* CRITICAL FOR ANDROID */
        width: 100% !important;
        height: auto !important;
        padding: 12px !important;
        box-sizing: border-box !important;
    }

    /* 6. Fix Card Images: Don't let images crush the layout */
    .card-image {
        height: 120px !important;
    }
    
    .card-icon {
        top: 80px !important;
        width: 60px !important;
        height: 60px !important;
    }

    /* 7. Results Section: Make tables and flexboxes stack */
    .res-line, .result-item {
        flex-direction: row !important;
        justify-content: space-between !important;
        font-size: 14px !important;
    }
    
    .total-val, .total-amt {
        font-size: 24px !important;
    }

    /* 8. Home/Back Button: Move it to stay reachable but not in the way */
    .home-button-container {
        top: 10px !important;
        right: 10px !important;
    }
    
    .home-button-container img {
        width: 35px !important;
        height: 35px !important;
    }
}

/* Smooth Tap Feedback for Touchscreens */
button:active, .plan-card:active {
    transform: scale(0.98);
    filter: brightness(0.9);
}

    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <button id="share-btn">🔗 Share</button>
            <span id="current-date"></span>
        </div>
        <header>
            <h1>LIC Commission Calculator</h1>
            <p>Find the premium needed for your target commission</p>
        </header>
        <main>
            <div class="input-panel">
                <h2>Enter Your Parameters</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="targetCommission">Total Target Commission (₹)</label>
                        <input type="number" id="targetCommission" placeholder="e.g., 3000">
                    </div>
                    <div class="form-group"><label for="policyTerm">Policy Term (Years)</label><input type="number" id="policyTerm" placeholder="e.g., 20"></div>
                    <div class="form-group"><label for="ppt">PPT (Years)</label><input type="number" id="ppt" placeholder="e.g., 20"></div>
                </div>
            </div>
            
            <div id="error-message" class="error-message"></div>

            <div class="tab-nav">
                <div class="tab-button active" data-tab="single">Single Plan Finder</div>
                <div class="tab-button" data-tab="combo">Combination Builder</div>
            </div>

            <div id="comboPlanTab" class="tab-content">
                <div id="plan-checklist-container" class="plan-checklist"></div>
            </div>
             <div id="singlePlanTab" class="tab-content active"></div>

            <div class="results-panel">
                <h2 id="results-title">Eligible Plans & Estimated Premium</h2>
                <div id="results-container" class="results-grid"></div>
            </div>
        </main>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    
    // --- Setup for Date and Share Button ---
    const currentDateEl = document.getElementById('current-date');
    const shareBtn = document.getElementById('share-btn');
    const options = { year: 'numeric', month: 'long', day: 'numeric' };
    currentDateEl.textContent = new Date().toLocaleDateString(undefined, options);

    shareBtn.addEventListener('click', async () => {
        const shareData = { title: 'LIC Commission Calculator', url: window.location.href };
        if (navigator.share) { try { await navigator.share(shareData); } catch (err) {} } 
        else if (navigator.clipboard) { await navigator.clipboard.writeText(window.location.href); shareBtn.textContent = '✅ Copied!'; setTimeout(() => { shareBtn.textContent = '🔗 Share'; }, 2000); }
    });
    
    // --- 31 PLANS DATA ---
    const allPlans = [
        { id: 714, name: 'New Endowment' }, { id: 715, name: 'Jeevan Anand' },
        { id: 717, name: 'Single Premium Endowment' }, { id: 720, name: '20 yr Money Back' },
        { id: 721, name: '25 yr Money Back' }, { id: 732, name: 'Children Money Back' },
        { id: 733, name: 'Jeevan Lakshya' }, { id: 734, name: 'Jeevan Tarun' },
        { id: 736, name: 'Jeevan Labh' }, { id: 745, name: 'Jeevan Umang' },
        { id: 748, name: 'Bima Shree' }, { id: 751, name: 'Micro Bachat' },
        { id: 758, name: 'New Jeevan Shanti' }, { id: 760, name: 'Bima Jyoti' },
        { id: 764, name: 'Bima Ratna' }, { id: 768, name: 'Jeevan Azad' },
        { id: 771, name: 'Jeevan Utsav' }, { id: 774, name: 'Amritbaal' },
        { id: 857, name: 'Jeevan Akshay' }, { id: 859, name: 'Saral Jeevan Bima' },
        { id: 862, name: 'Saral Pension' }, { id: 875, name: 'Yuva Term' },
        { id: 876, name: 'Digi Term' }, { id: 877, name: 'Yuva Credit Life' },
        { id: 879, name: 'Smart Pension' }, { id: 880, name: 'Jan Suraksha' },
        { id: 881, name: 'Bima Lakshmi' }, { id: 887, name: 'Bima Kavach' },
        { id: 911, name: 'Nav Jeevan Shree (Single)' }, { id: 912, name: 'Nav Jeevan Shree (Reg)' },
        { id: 955, name: 'Jeevan Amar' }
    ].sort((a,b) => a.id - b.id);

    // --- COMMISSION RULES (Nov 2024 Circular) ---
    const commissionRules = {
        'std': (p) => p.ppt === 1 ? 2 : (p.term >= 15 ? 20 : (p.term >= 10 ? 15 : (p.term >= 8 ? 8 : null))),
        714: 'std', 715: 'std', 733: 'std', 734: 'std', 736: 'std', 745: 'std',
        717: () => 2, 720: (p) => p.term >= 15 ? 15 : null, 721: (p) => p.term >= 20 ? 20 : null,
        732: (p) => p.term >= 15 ? 25 : 20,
        748: (p) => [16, 20, 24].includes(p.term) ? 20 : ([10, 12, 14].includes(p.term) ? 15 : null),
        751: (p) => (p.term >= 10 && p.term <= 15) ? 10 : null,
        758: () => 2, 857: () => 2, 862: () => 2, 911: () => 2, 887: () => 2,
        760: (p) => p.ppt === 1 ? 2 : (p.term >= 15 ? 25 : (p.term >= 10 ? 20 : null)),
        764: (p) => p.term >= 15 ? 15 : null, 768: (p) => p.ppt >= 15 ? 15 : 10,
        771: (p) => p.ppt === 1 ? 2 : (p.term >= 15 ? 25 : (p.term >= 10 ? 20 : 10)),
        774: (p) => p.ppt === 1 ? 2 : 10,
        859: () => 7.5, 875: (p) => p.ppt === 1 ? 3 : (p.term >= 15 ? 20 : 15),
        876: (p) => p.ppt === 1 ? 3 : 28, // Plan 876 specifically as requested
        877: (p) => p.ppt === 1 ? 3 : (p.term >= 15 ? 20 : (p.term >= 10 ? 15 : 10)),
        879: (p) => p.ppt === 1 ? 2 : 7.5, 880: () => 15, 881: () => 15,
        912: (p) => p.term >= 15 ? 25 : 20,
        955: (p) => p.ppt === 1 ? 4 : (p.term >= 15 ? 28.5 : (p.term >= 10 ? 23 : 15))
    };

    function getRate(id, params) {
        let rule = commissionRules[id];
        if (typeof rule === 'string') rule = commissionRules[rule];
        return rule ? rule(params) : null;
    }

    const inputs = {
        targetCommission: document.getElementById('targetCommission'),
        policyTerm: document.getElementById('policyTerm'),
        ppt: document.getElementById('ppt')
    };
    const errorMessageDiv = document.getElementById('error-message');
    const resultsContainer = document.getElementById('results-container');
    const resultsTitle = document.getElementById('results-title');
    const checklistContainer = document.getElementById('plan-checklist-container');
    let currentMode = 'single';

    function populateCombinationChecklist() {
        checklistContainer.innerHTML = '';
        allPlans.forEach(plan => {
            const item = document.createElement('div');
            item.className = 'combo-item';
            item.innerHTML = `
                <input type="checkbox" id="p-${plan.id}" data-plan-id="${plan.id}">
                <label for="p-${plan.id}">${plan.id} - ${plan.name}</label>
                <input type="number" class="commission-input" id="alloc-${plan.id}" placeholder="%" disabled>
            `;
            checklistContainer.appendChild(item);
        });
    }

    function getAndValidateInputs() {
        const valTC = parseFloat(inputs.targetCommission.value);
        const valTerm = parseInt(inputs.policyTerm.value, 10);
        const valPPT = parseInt(inputs.ppt.value, 10);
        
        errorMessageDiv.style.display = 'none';
        let errors = [];

        if (!inputs.targetCommission.value || valTC <= 0) errors.push("Enter a valid Target Commission.");
        if (!inputs.policyTerm.value || valTerm < 1) errors.push("Enter a valid Policy Term.");
        if (!inputs.ppt.value || valPPT < 1) errors.push("Enter a valid PPT.");
        if (valPPT > valTerm) errors.push("PPT cannot be greater than Policy Term.");

        if (errors.length > 0) {
            errorMessageDiv.innerHTML = errors.join('<br>');
            errorMessageDiv.style.display = 'block';
            resultsContainer.innerHTML = '';
            return null;
        }
        return { tc: valTC, term: valTerm, ppt: valPPT };
    }

    function updateDisplay() {
        const params = getAndValidateInputs();
        if (!params) return;

        if (currentMode === 'single') {
            resultsTitle.textContent = "Eligible Plans & Estimated Premium";
            renderSingleModeResults(params);
        } else {
            resultsTitle.textContent = "Combination Builder";
            renderComboModeResults(params);
        }
    }

    function renderSingleModeResults(p) {
        resultsContainer.innerHTML = '';
        let found = 0;
        allPlans.forEach(plan => {
            const rate = getRate(plan.id, { term: p.term, ppt: p.ppt });
            if (rate) {
                found++;
                const prem = (p.tc * 100) / rate;
                const card = document.createElement('div');
                card.className = 'result-card';
                card.innerHTML = `<h3>${plan.id} - ${plan.name}</h3><p>Rate: <b>${rate}%</b></p><p>Est. Premium: <span class="premium">₹${Math.round(prem).toLocaleString('en-IN')}</span></p>`;
                resultsContainer.appendChild(card);
            }
        });
        if (found === 0) resultsContainer.innerHTML = '<p class="placeholder">No plans eligible for this Term/PPT.</p>';
    }

    function renderComboModeResults(p) {
        resultsContainer.innerHTML = '';
        const selected = Array.from(checklistContainer.querySelectorAll('input[type="checkbox"]:checked'));
        if (selected.length === 0) {
            resultsContainer.innerHTML = '<p class="placeholder">Check plans and assign % allocation.</p>';
            return;
        }

        let totalPerc = 0;
        selected.forEach(cb => totalPerc += (parseFloat(document.getElementById(`alloc-${cb.dataset.planId}`).value) || 0));

        if (Math.abs(totalPerc - 100) > 0.01) {
            errorMessageDiv.innerHTML = `Allocation Error: Total must be exactly 100%. (Current: ${totalPerc}%)`;
            errorMessageDiv.style.display = 'block';
            return;
        }

        let totalPrem = 0;
        let cardsHtml = '';
        selected.forEach(cb => {
            const id = cb.dataset.planId;
            const plan = allPlans.find(pl => pl.id == id);
            const perc = parseFloat(document.getElementById(`alloc-${id}`).value) || 0;
            const rate = getRate(id, { term: p.term, ppt: p.ppt });
            if (rate) {
                const prem = ((p.tc * (perc / 100)) * 100) / rate;
                totalPrem += prem;
                cardsHtml += `<div class="result-card"><h3>${id} - ${plan.name} (${perc}%)</h3><p>Prem: ₹${Math.round(prem).toLocaleString('en-IN')}</p></div>`;
            } else {
                cardsHtml += `<div class="result-card"><h3>${id}</h3><p class="prompt">Invalid for Term/PPT</p></div>`;
            }
        });

        resultsContainer.innerHTML = `<div class="result-card summary-card"><h3>Total Premium: ₹${Math.round(totalPrem).toLocaleString('en-IN')}</h3><p>Commission Goal: ₹${p.tc.toLocaleString('en-IN')}</p></div>` + cardsHtml;
    }

    // --- Listeners ---
    populateCombinationChecklist();
    Object.values(inputs).forEach(input => input.addEventListener('input', updateDisplay));
    
    document.querySelector('.tab-nav').addEventListener('click', (e) => {
        if (e.target.classList.contains('tab-button')) {
            currentMode = e.target.dataset.tab;
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            e.target.classList.add('active');
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById(`${currentMode}PlanTab`).classList.add('active');
            updateDisplay();
        }
    });

    checklistContainer.addEventListener('input', (e) => {
        if (e.target.type === 'checkbox') {
            const allocInput = document.getElementById(`alloc-${e.target.dataset.planId}`);
            allocInput.disabled = !e.target.checked;
            if (!e.target.checked) allocInput.value = '';
        }
        updateDisplay();
    });

    updateDisplay();
});
    </script>
<div class="home-button-container">
  <a href="/main.html" title="Go to Home">
    <img src="images/home-icon.png" alt="Home">
  </a>
</div>
<!-- PWA: Register the Workbox Service Worker -->
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw-workbox.js')
                .then(registration => {
                    console.log('Workbox service worker registered successfully:', registration);
                })
                .catch(error => {
                    console.error('Workbox service worker registration FAILED:', error);
                });
        });
    }
</script>  
</body>
</html>
