<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>LIC Nav Jeevan Shree (911) IRR Report</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #004b8d; --accent: #ffd700; --bg: #f0f8ff; --text: #333; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg); margin: 0; padding: 20px; color: var(--text); }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { background: linear-gradient(135deg, #004b8d, #002a5c); color: white; padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0, 75, 141, 0.3); }
        .grid-layout { display: grid; grid-template-columns: 320px 1fr; gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-top: 4px solid var(--primary); }
        
        label { display: block; font-size: 0.85em; font-weight: 600; margin-bottom: 5px; color: #004b8d; }
        input, select { width: 100%; padding: 10px; border: 1px solid #b3d7ff; border-radius: 6px; font-size: 0.9em; margin-bottom: 15px; }
        input:focus, select:focus { outline: none; border-color: var(--primary); }

        .rider-section { background: #e6f7ff; padding: 10px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #b3d7ff; }
        .checkbox-wrapper { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; font-weight: 500; font-size: 0.9em; }
        
        button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        button:hover { background: #003366; transform: translateY(-2px); }
        
        #errorMsg { color: #d32f2f; background: #ffebee; padding: 10px; border-radius: 5px; font-size: 0.85em; margin-top: 10px; display: none; border: 1px solid #ef9a9a; }
        
        .results-panel { display: none; }
        .summary-box { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .kpi-card { background: #004b8d; color: white; padding: 15px; border-radius: 8px; text-align: center; }
        .kpi-card h3 { margin: 0; font-size: 0.8em; opacity: 0.9; }
        .kpi-card span { font-size: 1.5em; font-weight: 700; }

        .table-wrap { overflow-x: auto; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; font-size: 0.85em; background: white; min-width: 900px; }
        th { background: var(--primary); color: white; padding: 10px; text-align: center; }
        td { padding: 8px; border: 1px solid #e6f7ff; text-align: center; }
        .total-row { background: #cceeff; font-weight: bold; color: #004b8d; }
        
        @media(max-width: 768px) { .grid-layout { grid-template-columns: 1fr; } }
    </style>
</head>

<div class="container">
    <div class="header">
        <h1>LIC Nav Jeevan Shree (911)</h1>

    </div>

    <div class="grid-layout">
        <div class="card">
            <h3>Plan Inputs</h3>
            
            <label>Benefit Option</label>
            <select id="option" onchange="updateDesc()">

            <input type="number" id="age" value="35" min="0" max="60">

            <label>Policy Term (5-20)</label>
            <input type="number" id="term" value="20" min="5" max="20">

            <label>Basic Sum Assured (Min 1L)</label>
            <input type="number" id="sumAssured" value="1000000" step="10000" min="100000">

        <div class="results-panel" id="resultsPanel">
            <div class="summary-box">
                <div class="kpi-card">

                </div>
                <div class="kpi-card" style="background:#2e7d32;">

                </div>
            </div>

            <div class="card" style="padding:0; overflow:hidden;">
                <div class="table-wrap">
                    <table id="flowTable">
                        <thead>
                            <tr>
                                <th>Year</th>
                                <th>Age</th>

                                <th>Death Benefit<br><small>(Cover)</small></th>
                                <th>Net Cashflow</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                        <tfoot id="tableFoot"></tfoot>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

    function updateDesc() {
        const opt = document.getElementById("option").value;
        const desc = document.getElementById("optDesc");
        if(opt === "1") desc.innerText = "Death Benefit: Higher of 1.25x Single Premium or Basic SA + Accrued GA";
        else desc.innerText = "Death Benefit: 10x Single Premium + Accrued GA";
    }

    function xirr(values) {
        let x = 0.1;
        for (let i = 0; i < 100; i++) {
            let f = 0, df = 0;
            for (let j = 0; j < values.length; j++) {
                let p = Math.pow(1 + x, j);
                f += values[j] / p;
                df -= j * values[j] / (p * (1 + x));
            }
            if (Math.abs(df) < 1e-12) break;
            x = x - f / df;
        }
        return x;
    }

    function generateReport() {
        const age = parseInt(document.getElementById('age').value);
        const term = parseInt(document.getElementById('term').value);
        const sa = parseInt(document.getElementById('sumAssured').value);
        const opt = parseInt(document.getElementById('option').value);
        const err = document.getElementById('errorMsg');
        err.style.display = 'none';

        // --- VALIDATIONS ---
        if(age < 0 || age > 60) { showError("Age must be 0-60"); return; }
        if(opt === 2 && age > 40) { showError("Max Age for Option 2 is 40"); return; }
        if(term < 5 || term > 20) { showError("Term must be 5-20 years"); return; }
        if(sa < 100000) { showError("Min Sum Assured is 1L"); return; }

        // --- PREMIUM CALCULATION ---
        const data = (opt === 1) ? option1Data : option2Data;
        const ageRow = data.find(r => r.Age === age);
        if(!ageRow) { showError("Rate not found"); return; }
        const rate = ageRow[`T${term}`];
        if(!rate) { showError("Rate not found for this Term"); return; }

        // Rebate Logic (From BSMDT)
        let rebateRate = 0;
        if (opt === 1) { // Option 1 Rebates
            if (sa >= 200000 && sa < 500000) {
                if (term <= 9) rebateRate = 28; else if (term <= 14) rebateRate = 35; else if (term <= 19) rebateRate = 39; else rebateRate = 43;
            } else if (sa >= 500000 && sa < 1000000) {
                if (term <= 9) rebateRate = 49; else if (term <= 14) rebateRate = 60; else if (term <= 19) rebateRate = 68; else rebateRate = 75;
            } else if (sa >= 1000000 && sa < 1500000) {
                if (term <= 9) rebateRate = 56; else if (term <= 14) rebateRate = 69; else if (term <= 19) rebateRate = 78; else rebateRate = 85;
            } else if (sa >= 1500000) {
                if (term <= 9) rebateRate = 58; else if (term <= 14) rebateRate = 72; else if (term <= 19) rebateRate = 81; else rebateRate = 89;
            }
        } else { // Option 2 Rebates
            if (sa >= 200000 && sa < 500000) {
                if (term <= 9) rebateRate = 25; else if (term <= 14) rebateRate = 32; else if (term <= 19) rebateRate = 36; else rebateRate = 40;
            } else if (sa >= 500000 && sa < 1000000) {
                if (term <= 9) rebateRate = 44; else if (term <= 14) rebateRate = 55; else if (term <= 19) rebateRate = 64; else rebateRate = 69;
            } else if (sa >= 1000000 && sa < 1500000) {
                if (term <= 9) rebateRate = 50; else if (term <= 14) rebateRate = 63; else if (term <= 19) rebateRate = 73; else rebateRate = 79;
            } else if (sa >= 1500000) {
                if (term <= 9) rebateRate = 52; else if (term <= 14) rebateRate = 65; else if (term <= 19) rebateRate = 76; else rebateRate = 83;
            }
        }

        const tabularPrem = (sa / 1000) * rate;
        const rebateAmt = (sa / 1000) * rebateRate;
        const finalSinglePrem = Math.round(tabularPrem - rebateAmt);

        // --- TABLE GENERATION ---
        document.getElementById('resultsPanel').style.display = 'block';
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        
        let cflows = [], totalOut = 0, totalIn = 0;
        let accruedGA = 0;
        const gaRate = 85; // Rs 85 per 1000 SA per year (Fixed)

        // Year 0 (Outflow)
        cflows.push(-finalSinglePrem);
        totalOut = finalSinglePrem;

        // Loop for Policy Term
        for(let yr = 1; yr <= term; yr++) {
            let curAge = age + yr;
            
            // GA Accrual
            accruedGA += (sa / 1000) * gaRate;

            // Maturity Benefit (At end of Term)
            let matVal = 0;
            if (yr === term) matVal = sa + accruedGA;

            // Death Benefit Logic (Cover)
            let db = 0;
            if (yr <= term) { // Valid during term
                let saOnDeath = 0;
                if(opt === 1) {
                    saOnDeath = Math.max(1.25 * finalSinglePrem, sa);
                } else {
                    saOnDeath = 10 * finalSinglePrem;
                }
                db = saOnDeath + accruedGA;
            }

            let net = matVal; // No outflow after Year 0
            cflows.push(net);
            totalIn += matVal;

            tbody.innerHTML += `
                <tr>
                    <td>${yr}</td>
                    <td>${curAge}</td>
                    <td class="outflow">${yr === 1 ? '₹'+finalSinglePrem.toLocaleString() : '-'}</td>
                    <td class="inflow">${matVal > 0 ? '₹'+matVal.toLocaleString() : '-'}</td>
                    <td>₹${Math.round(accruedGA).toLocaleString()}</td>
                    <td style="color:blue">${db > 0 ? '₹'+Math.round(db).toLocaleString() : '-'}</td>
                    <td style="font-weight:bold">${net > 0 ? '+' : ''}₹${Math.round(net).toLocaleString()}</td>
                </tr>
            `;
        }
        
        // Correcting display logic for Table: Year 1 shows inflow/outflow? 
        // Standard IRR format: Year 0 is -Premium. Year 1..N are inflows.
        // The table loop builds Year 1 to Term.
        // Adjust outflow column visual: Year 0 isn't in loop. 
        // Let's prepend Year 0 row manually.
        
        const row0 = `
            <tr style="background:#fffbe6">
                <td>0</td>
                <td>${age}</td>
                <td class="outflow">₹${finalSinglePrem.toLocaleString()}</td>
                <td>-</td>
                <td>-</td>
                <td>-</td>
                <td class="outflow">-₹${finalSinglePrem.toLocaleString()}</td>
            </tr>
        `;
        // Re-render table properly
        tbody.innerHTML = row0 + tbody.innerHTML;
        // Fix loop display: Year 1 shouldn't show premium again.
        // (Logic inside loop: yr===1 check was just placeholder, removed in final render logic)
        // Actually, let's fix the loop HTML generation to NOT show premium in Year 1 column if we show Year 0 row.
        // Update: The loop HTML sets 'outflow' column. 
        // Correct: Outflow is 0 for yrs 1..Term.
        
        // Refinding rows to fix visually
        const rows = tbody.querySelectorAll('tr');
        for(let i=1; i<rows.length; i++) {
            rows[i].cells[2].innerText = '-'; // Clear premium column for years > 0
        }

        document.getElementById('netProfit').innerText = "₹" + (totalIn - totalOut).toLocaleString();
        document.getElementById('xirrVal').innerText = (xirr(cflows)*100).toFixed(2) + "%";
        document.getElementById('tableFoot').innerHTML = `
            <tr class="total-row">
                <td colspan="2">TOTAL</td>
                <td>₹${totalOut.toLocaleString()}</td>
                <td>₹${totalIn.toLocaleString()}</td>
                <td>-</td>
                <td>-</td>
                <td>₹${(totalIn-totalOut).toLocaleString()}</td>
            </tr>
        `;
    }

    function showError(msg) {
        const e = document.getElementById('errorMsg');
        e.innerText = "⚠️ " + msg;
        e.style.display = 'block';
    }
</script>
