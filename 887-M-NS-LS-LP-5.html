        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f0f4f8; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .calc-container { background: white; width: 100%; max-width: 500px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; border-top: 8px solid var(--lic-blue); }
        .header { background: var(--lic-blue); color: white; padding: 20px; text-align: center; }
        .header h1 { margin: 0; font-size: 20px; letter-spacing: 0.5px; }
        .header p { margin: 5px 0 0; color: var(--lic-yellow); font-size: 13px; font-weight: bold; }
        .form-content { padding: 25px; }
        .tag { background: #e3f2fd; color: #0d47a1; padding: 4px 10px; border-radius: 4px; font-size: 10px; font-weight: 700; margin-bottom: 15px; display: inline-block; text-transform: uppercase; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 13px; color: #555; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; box-sizing: border-box; outline-color: var(--lic-blue); }
        .err-msg { background: #fff5f5; border: 1px solid #feb2b2; color: var(--error); padding: 12px; border-radius: 8px; margin-bottom: 15px; display: none; font-size: 13px; font-weight: 600; }
        .checkbox-card { display: flex; align-items: center; gap: 10px; background: #f8f9fa; padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #eee; cursor: pointer; }
        button { width: 100%; background: var(--lic-blue); color: white; border: none; padding: 16px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #003d74; }
        #results { margin-top: 20px; display: none; background: #fffdf0; border: 1px solid #ffe58f; padding: 20px; border-radius: 8px; }
        .res-line { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 14px; }
        .total-box { margin-top: 15px; padding-top: 15px; border-top: 2px dashed #ccc; text-align: center; }
        .total-val { font-size: 32px; font-weight: 800; color: var(--lic-blue); display: block; }
        .total-lbl { font-size: 12px; font-weight: 700; color: #777; text-transform: uppercase; }
    </style>
</head>

        </div>

        </div>
    </div>
</div>

    function calculate() {
        const age = parseInt(document.getElementById('age').value);
        const term = parseInt(document.getElementById('term').value);
        const sa = parseFloat(document.getElementById('sa').value);
        const abSa = parseFloat(document.getElementById('abSa').value) || 0;
        const mode = document.getElementById('mode').value;
        const isOnline = document.getElementById('isOnline').checked;
        const errBox = document.getElementById('errBox');

        errBox.style.display = 'none';

        // Validations
        if (sa < 20000000) { showErr("Minimum Sum Assured is ₹ 2,00,00,000"); return; }
        if (abSa > 10000000) { showErr("Max Accident Benefit Sum Assured is ₹ 1,00,00,000"); return; }
        if (abSa > sa) { showErr("AB Sum Assured cannot exceed Basic Sum Assured"); return; }
        
        const data = tabularRates.find(r => r.Age === age);
        if (!data || !data[`T${term}`]) { showErr("Rates not found for this Age/Term combination."); return; }
        
        // 1. Base Yearly
        const yearlyTabular = (sa / 1000) * data[`T${term}`];

        // 2. High Sum Assured Rebate (Option I - Level SA Page 11a)
        let hsaPerc = 0;
        const saCr = sa / 10000000;
        if (saCr >= 3) {
            if (age <= 35) hsaPerc = saCr < 5 ? 2.25 : (saCr < 10 ? 3.50 : 4.00);
            else if (age <= 55) hsaPerc = saCr < 5 ? 1.75 : (saCr < 10 ? 2.50 : 3.25);
            else hsaPerc = saCr < 5 ? 1.25 : (saCr < 10 ? 2.00 : 2.50);
        }
        const hsaAmount = yearlyTabular * (hsaPerc / 100);

        // 3. Online Sale Rebate (7.5%)
        const onlineRebate = isOnline ? (yearlyTabular * 0.075) : 0;

        // 4. Modal Factors
        const factors = { "yly": 1, "hly": 0.51, "qly": 0.26, "mly": 0.0861 };
        const labels = { "yly": "Yearly", "hly": "Half-Yearly", "qly": "Quarterly", "mly": "Monthly" };
        
        const netYearly = yearlyTabular - hsaAmount - onlineRebate;
        const modalBase = netYearly * factors[mode];

        // 5. AB Rider (Provisional yearly rate for 5yr PPT ~ 0.50 per 1000)
        const yearlyAB = (abSa / 1000) * 0.50; 
        const modalAB = yearlyAB * factors[mode];

        const total = modalBase + modalAB;

        // Display
        document.getElementById('results').style.display = 'block';
        document.getElementById('outTab').innerText = Math.round(yearlyTabular).toLocaleString('en-IN');
        document.getElementById('outHSA').innerText = "- " + Math.round(hsaAmount).toLocaleString('en-IN') + " (" + hsaPerc + "%)";
        document.getElementById('outOnline').innerText = "- " + Math.round(onlineRebate).toLocaleString('en-IN');
        document.getElementById('outAB').innerText = "+ " + Math.round(modalAB).toLocaleString('en-IN');
        document.getElementById('modeLbl').innerText = labels[mode] + " Premium";
        document.getElementById('outTotal').innerText = "₹ " + Math.round(total).toLocaleString('en-IN');
    }

    function showErr(msg) {
        const errBox = document.getElementById('errBox');
        errBox.innerText = "⚠️ " + msg;
        errBox.style.display = 'block';
        document.getElementById('results').style.display = 'none';
    }
