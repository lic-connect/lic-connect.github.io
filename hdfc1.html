<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HDFC Life - The Grand Collection</title>
    <!-- Fonts & Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Nunito:wght@300;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --hdfc-red: #ed1c24;
            --hdfc-blue: #004c8f;
            --bg-deep: #0f0c29;
            --bg-grad: linear-gradient(135deg, #302b63, #0f0c29, #24243e);
            --card-front-grad: linear-gradient(135deg, rgba(237, 28, 36, 0.8), rgba(0, 76, 143, 0.9));
            --card-back-grad: linear-gradient(135deg, #1a0b2e, #2c003e); /* Deep Purple/Indigo - NO BLACK */
            --gold: #FFD700;
            --cyan: #00f2fe;
            --glass: rgba(255, 255, 255, 0.1);
            --border: rgba(255, 255, 255, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--bg-grad);
            background-size: 400% 400%;
            animation: galaxyFlow 20s ease infinite;
            min-height: 100vh;
            color: #fff;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        @keyframes galaxyFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* HEADER */
        header {
            text-align: center;
            margin-bottom: 60px;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 4rem;
            text-transform: uppercase;
            background: linear-gradient(to right, var(--hdfc-red), #fff, var(--hdfc-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(0, 76, 143, 0.8);
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.2rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--cyan);
            border: 1px solid var(--cyan);
            display: inline-block;
            padding: 8px 30px;
            border-radius: 50px;
            box-shadow: 0 0 15px var(--cyan);
        }

        /* GRID */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 50px;
            max-width: 1800px;
            margin: 0 auto;
            perspective: 2000px;
        }

        /* CARD */
        .card {
            height: 750px;
            position: relative;
            cursor: pointer;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 76, 143, 0.5);
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        /* FACES */
        .front, .back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        /* FRONT DESIGN */
        .front {
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            z-index: 2;
            transform: rotateY(0deg);
            background: var(--glass);
            backdrop-filter: blur(15px);
        }

        /* Dynamic Gradients for Front based on JS injection later, defaults here */
        .front::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(160deg, rgba(237,28,36,0.2), rgba(0,76,143,0.4));
            z-index: -1;
        }

        .icon-box {
            font-size: 4rem;
            margin-bottom: 25px;
            color: #fff;
            filter: drop-shadow(0 0 10px var(--cyan));
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float { 0%,100% {transform: translateY(0);} 50% {transform: translateY(-15px);} }

        .plan-name {
            font-family: 'Cinzel', serif;
            font-size: 1.6rem;
            margin-bottom: 10px;
            line-height: 1.3;
            color: #fff;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .cat-badge {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: rgba(255,255,255,0.1);
            padding: 5px 15px;
            border-radius: 20px;
            margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.5);
        }

        .click-hint {
            padding: 10px 30px;
            border: 2px solid var(--cyan);
            color: var(--cyan);
            border-radius: 30px;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.8rem;
            transition: 0.3s;
            background: rgba(0,0,0,0.2);
        }
        .card:hover .click-hint { background: var(--cyan); color: #004c8f; box-shadow: 0 0 20px var(--cyan); }

        /* BACK DESIGN */
        .back {
            transform: rotateY(180deg);
            background: var(--card-back-grad);
            padding: 20px;
        }

        .back-header {
            border-bottom: 1px solid rgba(255,255,255,0.3);
            padding-bottom: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-title { color: var(--gold); font-family: 'Cinzel', serif; font-size: 1.1rem; }

        .data-list {
            flex-grow: 1;
            overflow-y: auto;
            text-align: left;
            padding-right: 8px;
        }

        /* Custom Scrollbar */
        .data-list::-webkit-scrollbar { width: 6px; }
        .data-list::-webkit-scrollbar-thumb { background: linear-gradient(to bottom, var(--hdfc-red), var(--hdfc-blue)); border-radius: 10px; }
        .data-list::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }

        .data-row {
            margin-bottom: 10px;
            border-bottom: 1px dashed rgba(255,255,255,0.1);
            padding-bottom: 5px;
        }

        .label {
            display: block;
            font-size: 0.7rem;
            color: var(--cyan);
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 3px;
        }

        .value {
            font-size: 0.9rem;
            color: #fff;
            font-weight: 500;
            line-height: 1.4;
        }

        .usp-box {
            background: rgba(255, 255, 255, 0.05);
            border-left: 3px solid var(--gold);
            padding: 10px;
            margin-top: 15px;
            border-radius: 0 10px 10px 0;
        }

        .usp-text {
            font-size: 0.85rem;
            line-height: 1.6;
            color: #e0e0e0;
            text-align: justify;
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .grid-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
