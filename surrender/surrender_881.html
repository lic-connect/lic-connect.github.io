<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bima Lakshmi | Pro Surrender Calc</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --aurora-purple: #6a3093;
            --aurora-blue: #23a6d5;
            --neon-green: #00ff88;
            --neon-gold: #ffcc00;
            --glass: rgba(255, 255, 255, 0.1);
            --bg-dark: #080a0f;
        }

        body {
            background: var(--bg-dark);
            background-image: radial-gradient(circle at 10% 20%, rgba(106, 48, 147, 0.3) 0%, transparent 50%), radial-gradient(circle at 90% 80%, rgba(35, 166, 213, 0.3) 0%, transparent 50%);
            color: white; font-family: 'Poppins', sans-serif; margin: 0; display: flex; justify-content: center; min-height: 100vh; overflow-x: hidden;
        }

        .container { width: 100%; max-width: 900px; padding: 20px; box-sizing: border-box; }
        header { text-align: center; padding: 30px 0; }
        h1 { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 2.5rem; margin: 0; background: linear-gradient(to right, var(--neon-green), var(--aurora-blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 10px rgba(0, 255, 136, 0.4)); }
        .tagline { font-size: 0.9rem; letter-spacing: 4px; color: var(--neon-gold); text-transform: uppercase; }

        .glass-panel { background: var(--glass); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 24px; padding: 30px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5); }
        .input-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 0.75rem; font-weight: 600; color: var(--aurora-blue); text-transform: uppercase; margin-left: 5px; }
        
        input, select { background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.1); padding: 12px 15px; border-radius: 12px; color: white; font-size: 1rem; transition: 0.3s; }
        input[readonly] { background: rgba(255, 255, 255, 0.05); color: var(--neon-green); cursor: not-allowed; border-style: dashed; }
        input:focus { border-color: var(--neon-green); box-shadow: 0 0 15px rgba(0, 255, 136, 0.2); outline: none; }

        .option-toggle { grid-column: 1 / -1; display: flex; justify-content: center; gap: 10px; margin: 10px 0; flex-wrap: wrap; }
        .option-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); padding: 10px 20px; border-radius: 50px; color: white; cursor: pointer; font-family: 'Orbitron', sans-serif; font-size: 0.8rem; transition: 0.3s; }
        .option-btn.active { background: var(--neon-green); color: #000; border-color: var(--neon-green); font-weight: bold; box-shadow: 0 0 15px var(--neon-green); }

        .calc-btn { width: 100%; padding: 18px; border: none; border-radius: 15px; background: linear-gradient(45deg, var(--aurora-purple), var(--aurora-blue)); color: white; font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 1.2rem; cursor: pointer; transition: 0.4s; text-transform: uppercase; letter-spacing: 2px; }
        .calc-btn:hover { transform: scale(1.01); box-shadow: 0 0 30px rgba(35, 166, 213, 0.5); }

        .results { display: none; margin-top: 40px; animation: slideUp 0.6s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .res-split { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        .res-card { background: rgba(0,0,0,0.3); padding: 20px; border-radius: 15px; border-top: 3px solid var(--aurora-blue); }
        .res-card.ssv { border-top-color: var(--aurora-purple); }
        .res-label { font-size: 0.7rem; color: #888; text-transform: uppercase; margin-bottom: 5px; }
        .res-val { font-size: 1.2rem; font-family: 'Orbitron', sans-serif; font-weight: 700; }
        .final-hero { background: linear-gradient(145deg, rgba(0, 255, 136, 0.1), rgba(35, 166, 213, 0.1)); border: 2px solid var(--neon-green); border-radius: 20px; padding: 30px; text-align: center; }
        .final-amt { font-size: 3.5rem; font-family: 'Orbitron', sans-serif; font-weight: 900; margin: 10px 0; text-shadow: 0 0 20px var(--neon-green); }

        @media (max-width: 768px) {
            h1 { font-size: 1.8rem; }
            .input-grid { grid-template-columns: 1fr; }
            .res-split { grid-template-columns: 1fr; }
            input, select { font-size: 16px !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>BIMA LAKSHMI (881)</h1>
        <div class="tagline">Smart Surrender Calculator</div>
    </header>

    <div class="glass-panel">
      <div class="input-grid">
    <div class="input-group">
        <label>Sum Assured (Min 2,00,00,000)</label>
        <input type="number" id="sa" value="200000" oninput="updateFields()">
    </div>
    <div class="input-group">
        <label>Annual Premium (AP)</label>
        <input type="number" id="ap" value="15000" oninput="updateFields()">
    </div>
    <div class="input-group">
        <label>PPT (7 to 15 Years)</label>
        <input type="number" id="ppt" value="10" min="7" max="15" oninput="updateFields()">
    </div>
    <div class="input-group">
        <label>Years Premium Paid</label>
        <input type="number" id="yearsPaid" value="5" min="2" oninput="updateFields()">
    </div>
    <div class="input-group">
        <label>Policy Term (PT)</label>
        <input type="text" id="pt" readonly>
    </div>
    <div class="input-group">
        <label>Total Accrued GA</label>
        <input type="text" id="ga" readonly>
    </div>
    <div class="input-group">
        <label>Accrued Bonus</label>
        <input type="number" id="bonus" value="0" readonly>
    </div>
    <!-- High SA Info Box (Replaces FAB) -->
    <div class="input-group" style="justify-content: center; background: rgba(0,255,136,0.1); border-radius: 12px; border: 1px solid var(--neon-green); padding: 5px;">
        <div id="hsaStatus" style="font-size: 0.7rem; text-align: center; color: var(--neon-green); font-weight: bold;">
            HIGH SA REBATE: APPLICABLE (+0.25%)
        </div>
    </div>

    <div class="input-group" style="grid-column: 1 / -1; flex-direction: row; align-items: center; gap: 10px; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px;">
        <input type="checkbox" id="isOnline" checked onchange="updateFields()" style="width: 20px; height: 20px;">
        <label for="isOnline" style="margin: 0; color: white;">Purchased Online (Additional +1% GA)</label>
    </div>

    <div class="option-toggle">
        <button class="option-btn active" id="btnA" onclick="setOption('A')">Option A (PPT+6)</button>
        <button class="option-btn" id="btnB" onclick="setOption('B')">Option B (PPT+8)</button>
        <button class="option-btn" id="btnC" onclick="setOption('C')">Option C (PPT+10)</button>
    </div>
</div>
        <button class="calc-btn" onclick="runCalculation()">Calculate Value</button>

        <div id="resultsArea" class="results">
            <div class="res-split">
                <div class="res-card">
                    <div class="res-label">Guaranteed (GSV)</div>
                    <div class="res-val" id="gsvDisplay">₹ 0.00</div>
                </div>
                <div class="res-card ssv">
                    <div class="res-label">Special (SSV)</div>
                    <div class="res-val" id="ssvDisplay">₹ 0.00</div>
                </div>
            </div>
            <div class="final-hero">
                <div class="res-label" style="color: var(--neon-green);">Higher of GSV/SSV Payable</div>
                <div class="final-amt" id="finalDisplay">₹ 0.00</div>
            </div>
        </div>
    </div>
</div>

<script>
    let selectedOption = 'A';

    // JSON Data Arrays
    const dataB = [{"T25": 0.0,"Term": 1},{"T25": 0.0,"Term": 2},{"T25": 0.1528,"Term": 3},{"T25": 0.1542,"Term": 4},{"T25": 0.1555,"Term": 5},{"T25": 0.1572,"Term": 6},{"T25": 0.1593,"Term": 7},{"T25": 0.1622,"Term": 8},{"T25": 0.1658,"Term": 9},{"T25": 0.1703,"Term": 10},{"T25": 0.1758,"Term": 11},{"T25": 0.1758,"Term": 12},{"T25": 0.1766,"Term": 13},{"T25": 0.1785,"Term": 14},{"T25": 0.1816,"Term": 15},{"T25": 0.186,"Term": 16},{"T25": 0.1918,"Term": 17},{"T25": 0.1993,"Term": 18},{"T25": 0.2085,"Term": 19},{"T25": 0.2199,"Term": 20},{"T25": 0.2338,"Term": 21},{"T25": 0.2505,"Term": 22},{"T25": 0.2706,"Term": 23},{"T25": 0.3,"Term": 24},{"T25": 0.35,"Term": 25}];
    const dataP = [{"T25": 0.0,"Term": 1},{"T25": 0.3,"Term": 2},{"T25": 0.35,"Term": 3},{"T25": 0.5,"Term": 4},{"T25": 0.5,"Term": 5},{"T25": 0.5,"Term": 6},{"T25": 0.5,"Term": 7},{"T25": 0.516,"Term": 8},{"T25": 0.5301,"Term": 9},{"T25": 0.5452,"Term": 10},{"T25": 0.5602,"Term": 11},{"T25": 0.5754,"Term": 12},{"T25": 0.5904,"Term": 13},{"T25": 0.6056,"Term": 14},{"T25": 0.6206,"Term": 15},{"T25": 0.6356,"Term": 16},{"T25": 0.6508,"Term": 17},{"T25": 0.6658,"Term": 18},{"T25": 0.6809,"Term": 19},{"T25": 0.6959,"Term": 20},{"T25": 0.7111,"Term": 21},{"T25": 0.7262,"Term": 22},{"T25": 0.7412,"Term": 23},{"T25": 0.9,"Term": 24},{"T25": 0.9,"Term": 25}];
    const dataF1 = [{"T25": 0.0377,"Term": 1},{"T25": 0.0391,"Term": 2},{"T25": 0.0405,"Term": 3},{"T25": 0.0419,"Term": 4},{"T25": 0.0433,"Term": 5},{"T25": 0.0447,"Term": 6},{"T25": 0.046,"Term": 7},{"T25": 0.0473,"Term": 8},{"T25": 0.0484,"Term": 9},{"T25": 0.0495,"Term": 10},{"T25": 0.0504,"Term": 11},{"T25": 0.051,"Term": 12},{"T25": 0.0514,"Term": 13},{"T25": 0.0514,"Term": 14},{"T25": 0.051,"Term": 15},{"T25": 0.0501,"Term": 16},{"T25": 0.0485,"Term": 17},{"T25": 0.0462,"Term": 18},{"T25": 0.043,"Term": 19},{"T25": 0.0389,"Term": 20},{"T25": 0.0337,"Term": 21},{"T25": 0.0274,"Term": 22},{"T25": 0.0197,"Term": 23},{"T25": 0.0107,"Term": 24}];
    const dataF2 = [{"T25": 0.1669,"Term": 1},{"T25": 0.1792,"Term": 2},{"T25": 0.1924,"Term": 3},{"T25": 0.2067,"Term": 4},{"T25": 0.222,"Term": 5},{"T25": 0.2385,"Term": 6},{"T25": 0.2562,"Term": 7},{"T25": 0.2754,"Term": 8},{"T25": 0.296,"Term": 9},{"T25": 0.3182,"Term": 10},{"T25": 0.3422,"Term": 11},{"T25": 0.3681,"Term": 12},{"T25": 0.3961,"Term": 13},{"T25": 0.4264,"Term": 14},{"T25": 0.4592,"Term": 15},{"T25": 0.4948,"Term": 16},{"T25": 0.5335,"Term": 17},{"T25": 0.5756,"Term": 18},{"T25": 0.6214,"Term": 19},{"T25": 0.6714,"Term": 20},{"T25": 0.7259,"Term": 21},{"T25": 0.7855,"Term": 22},{"T25": 0.8506,"Term": 23},{"T25": 0.9219,"Term": 24}];
    const dataF3A = [{"Term": 1,"T15": 0.3634},{"Term": 2,"T15": 0.3902},{"Term": 3,"T15": 0.4191},{"Term": 4,"T15": 0.4501},{"Term": 5,"T15": 0.4835},{"Term": 6,"T15": 0.5194},{"Term": 7,"T15": 0.5581},{"Term": 8,"T15": 0.5997},{"Term": 9,"T15": 0.6446},{"Term": 10,"T15": 0.693},{"Term": 11,"T15": 0.7452},{"Term": 12,"T15": 0.8016},{"Term": 13,"T15": 0.8625},{"Term": 14,"T15": 0.9285},{"Term": 15,"T15": 1.0}];
    const dataF3B = [{"T25": 5.6828,"Term": 1},{"T25": 6.1021,"Term": 2},{"T25": 5.4793,"Term": 3},{"T25": 5.8848,"Term": 4},{"T25": 5.2472,"Term": 5},{"T25": 5.6369,"Term": 6},{"T25": 4.9821,"Term": 7},{"T25": 5.3539,"Term": 8},{"T25": 4.6796,"Term": 9},{"T25": 5.0309,"Term": 10},{"T25": 4.3349,"Term": 11},{"T25": 4.6627,"Term": 12},{"T25": 3.9412,"Term": 13},{"T25": 4.2428,"Term": 14},{"T25": 3.4924,"Term": 15},{"T25": 3.7633,"Term": 16},{"T25": 2.9794,"Term": 17},{"T25": 3.2143,"Term": 18},{"T25": 2.3907,"Term": 19},{"T25": 2.5829,"Term": 20},{"T25": 1.7116,"Term": 21},{"T25": 1.852,"Term": 22},{"T25": 0.9227,"Term": 23},{"T25": 1.0,"Term": 24}];
    const dataF3C = [{"T25": 2.6337,"Term": 1},{"T25": 2.828,"Term": 2},{"T25": 3.0369,"Term": 3},{"T25": 3.2617,"Term": 4},{"T25": 2.4296,"Term": 5},{"T25": 2.61,"Term": 6},{"T25": 2.8044,"Term": 7},{"T25": 3.0136,"Term": 8},{"T25": 2.1642,"Term": 9},{"T25": 2.3267,"Term": 10},{"T25": 2.5022,"Term": 11},{"T25": 2.6913,"Term": 12},{"T25": 1.82,"Term": 13},{"T25": 1.9592,"Term": 14},{"T25": 2.11,"Term": 15},{"T25": 2.2737,"Term": 16},{"T25": 1.3733,"Term": 17},{"T25": 1.4816,"Term": 18},{"T25": 1.5996,"Term": 19},{"T25": 1.7282,"Term": 20},{"T25": 0.7874,"Term": 21},{"T25": 0.852,"Term": 22},{"T25": 0.9227,"Term": 23},{"T25": 1.0,"Term": 24}];
    const dataF4 = [{"T25": 0.5128,"Term": 1},{"T25": 0.5102,"Term": 2},{"T25": 0.5059,"Term": 3},{"T25": 0.4998,"Term": 4},{"T25": 0.4918,"Term": 5},{"T25": 0.4818,"Term": 6},{"T25": 0.4697,"Term": 7},{"T25": 0.4553,"Term": 8},{"T25": 0.4386,"Term": 9},{"T25": 0.4195,"Term": 10},{"T25": 0.3979,"Term": 11},{"T25": 0.3739,"Term": 12},{"T25": 0.3474,"Term": 13},{"T25": 0.3186,"Term": 14},{"T25": 0.2878,"Term": 15},{"T25": 0.2551,"Term": 16},{"T25": 0.2211,"Term": 17},{"T25": 0.1862,"Term": 18},{"T25": 0.1512,"Term": 19},{"T25": 0.1168,"Term": 20},{"T25": 0.0843,"Term": 21},{"T25": 0.0547,"Term": 22},{"T25": 0.0296,"Term": 23},{"T25": 0.0107,"Term": 24}];

    function setOption(opt) {
        selectedOption = opt;
        document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn' + opt).classList.add('active');
        updateFields();
    }

  function updateFields() {
    const ppt = parseInt(document.getElementById('ppt').value) || 0;
    const sa = parseFloat(document.getElementById('sa').value) || 0;
    const ap = parseFloat(document.getElementById('ap').value) || 0;
    const yPaid = parseInt(document.getElementById('yearsPaid').value) || 0;
    const isOnline = document.getElementById('isOnline').checked;

    // 1. PT Calculation based on Option
    let pt = 0;
    if (selectedOption === 'A') pt = ppt + 6;
    else if (selectedOption === 'B') pt = ppt + 8;
    else if (selectedOption === 'C') pt = ppt + 10;
    document.getElementById('pt').value = pt + " Years";

    // 2. GA Calculation Logic
    let gaRate = 0.07; // Base 7%
    if (isOnline) gaRate += 0.01; // Online +1%
    
    if (sa >= 200000) {
        gaRate += 0.0025; // High SA +0.25%
        document.getElementById('hsaStatus').innerText = "HIGH SA REBATE: APPLICABLE (+0.25%)";
        document.getElementById('hsaStatus').style.color = "var(--neon-green)";
    } else {
        document.getElementById('hsaStatus').innerText = "HIGH SA REBATE: NOT APPLICABLE";
        document.getElementById('hsaStatus').style.color = "#888";
    }
    
    // Total GA = AP * rate * years premiums were paid
    // Note: GA accrues at the end of each year for which premium is paid
    const totalGA = ap * gaRate * yPaid;
    document.getElementById('ga').value = Math.round(totalGA);
}

function runCalculation() {
    const sa = parseFloat(document.getElementById('sa').value);
    const ap = parseFloat(document.getElementById('ap').value);
    const yPaid = parseInt(document.getElementById('yearsPaid').value);
    const ppt = parseInt(document.getElementById('ppt').value);
    const totalGA = parseFloat(document.getElementById('ga').value);

    // 1. PPT Range Validation (7 to 15)
    if (ppt < 7 || ppt > 15) {
        alert("CRITICAL ERROR: Premium Paying Term (PPT) must be between 7 and 15 years for Plan 881.");
        return;
    }

    if (yPaid < 2) {
        alert("Policy not eligible for surrender. Minimum 2 years' premiums must be paid.");
        return;
    }

    const findFactor = (arr, term, key) => {
        const row = arr.find(r => r.Term === term);
        return row ? (row[key] || 0) : 0;
    };

    // 2. GSV Calculation
    const totalPremiumPaid = ap * yPaid;
    const factorB = findFactor(dataB, yPaid, "T25");
    const factorP = findFactor(dataP, yPaid, "T25");
    const gsv = (totalPremiumPaid * factorB) + (totalGA * factorP);

    // 3. SSV Calculation (Bonus is 0, FAB is removed)
    const paidUpSA = (sa * yPaid) / ppt;
    const f1 = findFactor(dataF1, yPaid, "T25");
    
    let f3 = 0;
    if (selectedOption === 'A') f3 = findFactor(dataF3A, yPaid, "T15");
    else if (selectedOption === 'B') f3 = findFactor(dataF3B, yPaid, "T25");
    else if (selectedOption === 'C') f3 = findFactor(dataF3C, yPaid, "T25");

    // SSV = (Paid-up SA * F1) + (GA * F3)
    const ssv = (paidUpSA * f1) + (totalGA * f3);

    // 4. Determine Final Payable Amount
    const finalSV = Math.max(gsv, ssv);
    
    document.getElementById('resultsArea').style.display = 'block';
    document.getElementById('gsvDisplay').innerText = "₹ " + Math.round(gsv).toLocaleString('en-IN');
    document.getElementById('ssvDisplay').innerText = "₹ " + Math.round(ssv).toLocaleString('en-IN');
    document.getElementById('finalDisplay').innerText = "₹ " + Math.round(finalSV).toLocaleString('en-IN');
    
    document.getElementById('resultsArea').scrollIntoView({ behavior: 'smooth' });
}
    // Initialize fields on load
    window.onload = updateFields;
</script>

</body>
</html>
