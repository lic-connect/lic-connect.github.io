    function calculateSV() {
        const term = parseInt(document.getElementById('policyTerm').value);
        const year = parseInt(document.getElementById('policyYear').value);
        const premium = parseFloat(document.getElementById('annualPremium').value);
        const bonus = parseFloat(document.getElementById('totalBonus').value) || 0;
        const resDiv = document.getElementById('result');

        if (!premiumFactorData[term]) {
            resDiv.innerHTML = "Error: Data for Term " + term + " not found.";
            resDiv.style.display = "block";
            return;
        }

        // Logic: Access Array using Term, then index Year - 1
        const pFactor = premiumFactorData[term][year - 1];
        const bFactor = bonusFactorData[term][year - 1];

        const totalPremiums = premium * year;
        const gsvOnPremium = (totalPremiums * pFactor) / 100;
        const gsvOnBonus = bonus * bFactor;
        const totalCashValue = gsvOnPremium + gsvOnBonus;

        resDiv.style.display = "block";
        resDiv.innerHTML = `
            <div>Total Premiums Paid: <span class="val">₹${totalPremiums.toLocaleString()}</span></div>
            <div>GSV Factor (Premium): <span class="val">${pFactor}%</span></div>
            <div><strong>GSV on Premium:</strong> <span class="val">₹${Math.round(gsvOnPremium).toLocaleString()}</span></div>
            <hr>
            <div>Accrued Bonus: <span class="val">₹${bonus.toLocaleString()}</span></div>
            <div>GSV Factor (Bonus): <span class="val">${bFactor}</span></div>
            <div><strong>GSV on Bonus:</strong> <span class="val">₹${Math.round(gsvOnBonus).toLocaleString()}</span></div>
            <hr>
            <div style="font-size:1.2em"><strong>Total Cash Value: <span class="val">₹${Math.round(totalCashValue).toLocaleString()}</span></strong></div>
        `;
