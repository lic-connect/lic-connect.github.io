<html lang="en">
<head>
    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --pram-blue: #0056b3;
            --neon-blue: #00f2ff;
            --neon-pink: #ff00ff;
            --neon-gold: #ffd700;
            --deep-space: #050a30;
            --bg-grad: linear-gradient(125deg, #1a0b2e, #003366, #004d40, #240b36);
            --card-front: rgba(255, 255, 255, 0.1);
            --card-back: linear-gradient(135deg, #0f2027, #203a43, #2c5364); /* Deep Teal - NO BLACK */
            --glass-border: 1px solid rgba(255, 255, 255, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Quicksand', sans-serif;
            background: var(--bg-grad);
            background-size: 400% 400%;
            animation: aurora 15s ease infinite;
            min-height: 100vh;
            color: #fff;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        @keyframes aurora {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating Stars */
        .stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(white 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.2;
            z-index: 0;
            pointer-events: none;
            animation: twinkle 5s infinite;
        }

        @keyframes twinkle { 0%,100%{opacity:0.2;} 50%{opacity:0.5;} }

        header {
            text-align: center;
            margin-bottom: 60px;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 4rem;
            text-transform: uppercase;
            background: linear-gradient(to right, #fff, var(--neon-blue), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 242, 255, 0.6);
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.2rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--neon-gold);
            border: 1px solid var(--neon-gold);
            display: inline-block;
            padding: 8px 30px;
            border-radius: 50px;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }

        /* GRID */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 50px;
            max-width: 1900px;
            margin: 0 auto;
            perspective: 2000px;
            z-index: 2;
            position: relative;
        }

        /* CARD */
        .card {
            height: 750px;
            position: relative;
            cursor: pointer;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0, 50, 100, 0.6);
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        /* FACES */
        .front, .back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 25px;
            overflow: hidden;
            border: var(--glass-border);
            display: flex;
            flex-direction: column;
        }

        /* FRONT DESIGN */
        .front {
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            z-index: 2;
            transform: rotateY(0deg);
            background: var(--card-front);
            backdrop-filter: blur(15px);
        }

        .front::before {
            content: '';
            position: absolute;
            inset: 0;
            padding: 2px;
            border-radius: 25px;
            background: linear-gradient(45deg, var(--neon-blue), transparent, var(--neon-pink));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
        }

        .icon-box {
            font-size: 3.5rem;
            margin-bottom: 25px;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px var(--neon-blue);
            color: #fff;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float { 0%,100% {transform: translateY(0);} 50% {transform: translateY(-10px);} }

        .plan-name {
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            margin-bottom: 10px;
            line-height: 1.3;
            color: #fff;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .cat-badge {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 5px 15px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.5);
            margin-bottom: 30px;
            font-weight: bold;
            background: rgba(255,255,255,0.1);
        }

        .flip-btn {
            padding: 12px 35px;
            background: linear-gradient(45deg, var(--neon-blue), #007bff);
            color: #fff;
            border: none;
            border-radius: 30px;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.9rem;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.4);
            transition: 0.3s;
            cursor: pointer;
        }
        .card:hover .flip-btn { transform: scale(1.1); box-shadow: 0 0 30px rgba(0, 242, 255, 0.8); }

        /* BACK DESIGN */
        .back {
            transform: rotateY(180deg);
            background: var(--card-back);
            padding: 20px;
        }

        .back-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .back-title { color: var(--neon-gold); font-family: 'Cinzel', serif; font-size: 1rem; }

        .data-list {
            flex-grow: 1;
            overflow-y: auto;
            text-align: left;
            padding-right: 8px;
        }

        /* Custom Scrollbar */
        .data-list::-webkit-scrollbar { width: 5px; }
        .data-list::-webkit-scrollbar-thumb { background: var(--neon-pink); border-radius: 10px; }
        .data-list::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }

        .data-row {
            margin-bottom: 10px;
            border-bottom: 1px dashed rgba(255,255,255,0.1);
            padding-bottom: 5px;
        }

        .label {
            display: block;
            font-size: 0.7rem;
            color: var(--neon-blue);
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 3px;
        }

        .value {
            font-size: 0.9rem;
            color: #fff;
            font-weight: 500;
            line-height: 1.4;
        }

        .usp-box {
            background: rgba(255, 255, 255, 0.05);
            border-left: 3px solid var(--neon-gold);
            padding: 12px;
            margin-top: 15px;
            border-radius: 0 10px 10px 0;
        }

        .usp-label {
            display: block;
            color: var(--neon-gold);
            font-weight: bold;
            margin-bottom: 5px;
            font-family: 'Cinzel', serif;
        }

        .usp-text {
            font-size: 0.85rem;
            line-height: 1.6;
            color: #e0e0e0;
            text-align: justify;
        }

        /* Category Specific Colors */
        .cat-term .icon-box { box-shadow: 0 0 30px var(--neon-blue); color: var(--neon-blue); }
        .cat-save .icon-box { box-shadow: 0 0 30px var(--neon-pink); color: var(--neon-pink); }
        .cat-ulip .icon-box { box-shadow: 0 0 30px var(--neon-gold); color: var(--neon-gold); }
        .cat-pen .icon-box { box-shadow: 0 0 30px #00ff00; color: #00ff00; }

        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .grid-container { grid-template-columns: 1fr; }
        }
    </style>
</head>

                name: "NextGen Pension Plan",
                cat: "Pension",
                style: "cat-pen",
                icon: "fa-hourglass-start",
                details: {
                    type: "Deferred Pension.",
                    sa: "Vesting Corpus.",
                    term: "10 to 30 Years.",
                    ppt: "Limited / Regular.",
                    age: "25 to 65 Years.",
                    option: "Accumulation.",
                    maturity: "Buy Annuity.",
                    sb: "Nil.",
                    death: "105% Premiums.",
                    riders: "N/A.",
                    surrender: "Paid-up.",
                    revival: "5 Years.",
                    usp: "**NextGen Pension Plan** is for the forward-thinking individual planning for retirement early. **The USP:** It helps you build a substantial retirement corpus during your earning years. At vesting age (retirement), you use the accumulated corpus to purchase an annuity. It bridges the gap between your working life and retired life. By starting early, you benefit from the power of compounding. It ensures that when you hang up your boots, you don't have to compromise on your lifestyle."
                }
            }
        ];

        const grid = document.getElementById('cardGrid');

        plans.forEach((plan, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = function() { this.classList.toggle('flipped'); };

            // Dynamic Styling
            let accentColor = "";
            if(plan.style === 'cat-term') accentColor = "var(--neon-blue)";
            else if(plan.style === 'cat-save') accentColor = "var(--neon-pink)";
            else if(plan.style === 'cat-ulip') accentColor = "var(--neon-gold)";
            else accentColor = "#00ff7f"; // Green for Pension

            card.innerHTML = `
                <div class="card-inner">
                    <div class="front" style="border-top: 3px solid ${accentColor}">
                        <div class="icon-box" style="box-shadow: 0 0 20px ${accentColor}; color: ${accentColor}">
                            <i class="fas ${plan.icon}"></i>
                        </div>
                        <div class="plan-name">${plan.name}</div>
                        <div class="cat-badge" style="color:${accentColor}; border-color:${accentColor}">${plan.cat}</div>
                        <button class="flip-btn" style="background: linear-gradient(45deg, ${accentColor}, #000); color:white; border:1px solid ${accentColor}">Reveal Details</button>
                    </div>
                    <div class="back">
                        <div class="back-header">
                            <span class="back-title" style="color:${accentColor}">${plan.name}</span>
                            <i class="fas fa-undo" style="color:#fff"></i>
                        </div>
                        <div class="data-list">
                            <div class="data-row"><span class="label" style="color:${accentColor}">1. Plan Type</span><span class="value">${plan.details.type}</span></div>
                            <div class="data-row"><span class="label" style="color:${accentColor}">2. Sum Assured</span><span class="value">${plan.details.sa}</span></div>
                            <div class="data-row"><span class="label" style="color:${accentColor}">3. Policy Term</span><span class="value">${plan.details.term}</span></div>
                            <div class="data-row"><span class="label" style="color:${accentColor}">4. PPT</span><span class="value">${plan.details.ppt}</span></div>
                            <div class="data-row"><span class="label" style="color:${accentColor}">5. Entry Age</span><span class="value">${plan.details.age}</span></div>
                            <div class="data-row"><span class="label" style="color:${accentColor}">6. Option</span><span class="value">${plan.details.option}</span></div>
                            <div class="data-row"><span class="label" style="color:${accentColor}">7. Maturity</span><span class="value">${plan.details.maturity}</span></div>
                            <div class="data-row"><span class="label" style="color:${accentColor}">8. SB</span><span class="value">${plan.details.sb}</span></div>
                            <div class="data-row"><span class="label" style="color:${accentColor}">9. Death Benefit</span><span class="value">${plan.details.death}</span></div>
                            <div class="data-row"><span class="label" style="color:${accentColor}">10. Riders</span><span class="value">${plan.details.riders}</span></div>
                            <div class="data-row"><span class="label" style="color:${accentColor}">11. Surrender</span><span class="value">${plan.details.surrender}</span></div>
                            <div class="data-row"><span class="label" style="color:${accentColor}">12. Revival</span><span class="value">${plan.details.revival}</span></div>
                            
                            <div class="usp-box" style="border-left-color:${accentColor}">
                                <span class="usp-label" style="color:${accentColor}">Salient Features (USP):</span>
                                <div class="usp-text">${plan.details.usp}</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    </script>
</body>
</html>
