<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIC Jeevan Utsav 771 Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #7FFFD4; /* Aquamarine */
            --bg: #1a1a1a;
            --card-bg: #ffffff;
            --black: #1a1a1a;
            --grey: #7f8c8d;
            --light-grey: #f5f6fa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background-color: var(--bg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            perspective: 1500px;
        }

        /* 3D Box Container */
        .calculator-3d-box {
            position: relative;
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border-radius: 20px;
            transform-style: preserve-3d;
            transform: rotateX(5deg);
            box-shadow: 0 20px 60px rgba(127, 255, 212, 0.3);
            padding: 40px;
            border: 1px solid rgba(0,0,0,0.05);
            /* Mirror Reflection Effect */
            -webkit-box-reflect: below 2px linear-gradient(transparent, transparent, rgba(255,255,255,0.2));
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 3px solid var(--primary);
            padding-bottom: 10px;
        }

        .header h1 { color: var(--black); font-size: 24px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }

        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .input-group { position: relative; display: flex; flex-direction: column; }
        .input-group label { font-size: 11px; font-weight: 700; color: var(--black); margin-bottom: 5px; text-transform: uppercase; }
        .input-group i { position: absolute; right: 15px; top: 35px; color: var(--grey); }

        input, select {
            padding: 12px 15px;
            border: 2px solid #edeff2;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            transition: 0.3s;
            background: var(--light-grey);
        }

        input:focus, select:focus { border-color: var(--primary); background: white; }

        /* Benefit Toggle Switch */
        .toggle-section {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            margin: 20px 0;
            background: #f0f0f0;
            padding: 10px;
            border-radius: 50px;
        }

        .toggle-container {
            display: flex;
            width: 350px;
            height: 45px;
            background: var(--black);
            border-radius: 25px;
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }

        .toggle-btn {
            flex: 1;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #fff;
            transition: 0.3s;
            font-size: 12px;
        }

        .toggle-btn.active { color: var(--black); }

        .slider {
            position: absolute;
            left: 0;
            width: 50%;
            height: 100%;
            background: var(--primary);
            border-radius: 25px;
            transition: 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1;
        }

        .calc-btn {
            grid-column: 1 / -1;
            background: var(--black);
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 18px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .calc-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(127, 255, 212, 0.3); background: var(--primary); color: var(--black); }

        /* Results Area */
        #results {
            margin-top: 30px;
            display: none;
            padding: 25px;
            background: var(--light-grey);
            border-radius: 15px;
            border-left: 5px solid var(--primary);
            animation: slideIn 0.5s ease;
        }

        .res-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #ddd; }
        .res-row:last-of-type { border: none; background: var(--black); color: var(--primary); padding: 15px; border-radius: 8px; margin-top: 10px; }
        .res-val { font-weight: 700; }

        .formula { font-size: 10px; color: #777; text-align: center; margin-top: 15px; font-style: italic; }

        .error-msg { color: #e74c3c; font-size: 11px; font-weight: 700; margin-top: 5px; display: none; }

        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .btn-s { flex: 1; padding: 10px; border-radius: 5px; border: 1px solid var(--black); background: transparent; cursor: pointer; font-weight: 700; }
        .btn-s:hover { background: var(--black); color: var(--primary); }

        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="calculator-3d-box">
    <div class="header">
        <h1>LIC PLAN NO 771 - JEEVAN UTSAV</h1>
        <p>Whole Life Income & Maturity Calculator</p>
    </div>

    <div class="input-grid">
        <div class="input-group">
            <label>Name of Policy Holder</label>
            <input type="text" id="name" placeholder="Enter Name">
            <i class="fas fa-user"></i>
        </div>

        <div class="input-group">
            <label>Age at Entry (0-65 Yrs)</label>
            <input type="number" id="age" value="30">
            <i class="fas fa-birthday-cake"></i>
            <span id="age-err" class="error-msg">Check age limits for chosen PPT</span>
        </div>

        <div class="input-group">
            <label>Sum Assured (Min 5,00,000)</label>
            <input type="number" id="sa" value="500000" step="25000">
            <i class="fas fa-shield-alt"></i>
            <span id="sa-err" class="error-msg">Min Sum Assured is 5 Lacs</span>
        </div>

        <div class="input-group">
            <label>Policy Term</label>
            <select id="term" onchange="syncPPT()">
                <option value="100">Whole Life (Age 100)</option>
            </select>
            <i class="fas fa-clock"></i>
        </div>

     <div class="input-group">
    <label>Premium Paying Term (PPT)</label>
    <select id="ppt">
        <option value="5">5 Years</option>
        <option value="6">6 Years</option>
        <option value="7">7 Years</option>
        <option value="8">8 Years</option>
        <option value="9">9 Years</option>
        <option value="10" selected>10 Years</option>
        <option value="11">11 Years</option>
        <option value="12">12 Years</option>
        <option value="13">13 Years</option>
        <option value="14">14 Years</option>
        <option value="15">15 Years</option>
        <option value="16">16 Years</option>
    </select>
    <i class="fas fa-hourglass-half"></i>
</div>

        <div class="input-group">
            <label>Premium Mode</label>
            <select id="mode">
                <option value="1">Yearly</option>
                <option value="0.51">Half-Yearly</option>
                <option value="0.26">Quarterly</option>
                <option value="0.089">Monthly</option>
            </select>
            <i class="fas fa-wallet"></i>
        </div>

        <div class="input-group">
            <label>Annual Premium (Entered)</label>
            <input type="number" id="premium" value="72600">
            <i class="fas fa-indian-rupee-sign"></i>
        </div>

        <div class="input-group">
            <label>GA Rate (Default 40)</label>
            <input type="number" id="ga_rate" value="40" placeholder="Per 1000 SA">
            <i class="fas fa-chart-line"></i>
        </div>

        <div class="toggle-section">
            <div class="toggle-container" onclick="handleToggle()">
                <div id="slider" class="slider"></div>
                <div id="btn-mat" class="toggle-btn active">SURVIVAL (MATURITY)</div>
                <div id="btn-death" class="toggle-btn">DEATH BENEFIT</div>
            </div>
        </div>

        <div class="input-group" id="death_ui" style="display:none; grid-column: 1 / -1;">
            <label>Policy Year of Death</label>
            <input type="number" id="death_yr" value="15">
            <i class="fas fa-calendar-times"></i>
        </div>

        <button class="calc-btn" onclick="calculate()">
            <i class="fas fa-calculator"></i> Calculate Final Benefit
        </button>
    </div>

    <div id="results">
        <div id="res-content"></div>
        <div class="btn-group">
            <button class="btn-s" onclick="window.print()">Print PDF</button>
            <button class="btn-s" onclick="alert('Shared successfully')">Share PDF</button>
        </div>
    </div>
</div>

<script>
    function syncPPT() {
        // PPT logic for Plan 771 is flexible between 5-16 years
        // Structure maintained as per request.
    }

    let isDeath = false;
    function handleToggle() {
        isDeath = !isDeath;
        const slider = document.getElementById('slider');
        const deathUI = document.getElementById('death_ui');
        const bMat = document.getElementById('btn-mat');
        const bDeath = document.getElementById('btn-death');

        if(isDeath) {
            slider.style.left = '50%';
            deathUI.style.display = 'block';
            bDeath.classList.add('active');
            bMat.classList.remove('active');
        } else {
            slider.style.left = '0';
            deathUI.style.display = 'none';
            bMat.classList.add('active');
            bDeath.classList.remove('active');
        }
    }

    function calculate() {
        const name = document.getElementById('name').value || "Valued Client";
        const age = parseInt(document.getElementById('age').value);
        const sa = parseFloat(document.getElementById('sa').value);
        const ppt = parseInt(document.getElementById('ppt').value);
        const premium = parseFloat(document.getElementById('premium').value);
        const gaRate = parseFloat(document.getElementById('ga_rate').value);
        const deathYr = parseInt(document.getElementById('death_yr').value);

        // Technical Validations
        document.getElementById('age-err').style.display = 'none';
        document.getElementById('sa-err').style.display = 'none';

     
        
        // Age limits based on PPT (Page 3 of PDF)
       // Technical Age Limits Matrix from PDF Page 3
const ageLimits = {
    5: { min: 8, max: 65 },
    6: { min: 8, max: 65 },
    7: { min: 8, max: 65 },
    8: { min: 8, max: 65 },
    9: { min: 7, max: 65 },
    10: { min: 6, max: 65 },
    11: { min: 5, max: 64 },
    12: { min: 4, max: 63 },
    13: { min: 3, max: 62 },
    14: { min: 2, max: 61 },
    15: { min: 1, max: 60 },
    16: { min: 0, max: 59 }
};

const limits = ageLimits[ppt];

// 1. Entry Age Validation
if (age < limits.min || age > limits.max) {
    const errMsg = age < limits.min ? `Min Age for PPT ${ppt} is ${limits.min}` : `Max Age for PPT ${ppt} is ${limits.max}`;
    document.getElementById('age-err').innerText = errMsg;
    document.getElementById('age-err').style.display = 'block';
    return;
}

// 2. Max Premium Ceasing Age Validation (Must not exceed 75)
if ((age + ppt) > 75) {
    document.getElementById('age-err').innerText = `Max Premium Ceasing Age is 75 (Current: ${age + ppt})`;
    document.getElementById('age-err').style.display = 'block';
    return;
}

// 3. Sum Assured Validation
if (sa < 500000) {
    document.getElementById('sa-err').style.display = 'block';
    return;
}

        // GA Calculation: Rs 40 per 1000 SA during PPT
        const accruedGA = (sa / 1000) * gaRate * ppt;
        const totalPaid = premium * ppt;

        let html = `<h3>Plan 771 Report: ${name}</h3><br>`;

        if(!isDeath) {
            const finalBenefit = sa + accruedGA;
            html += `
                <div class="res-row"><span>Basic Sum Assured:</span><span class="res-val">₹ ${sa.toLocaleString()}</span></div>
                <div class="res-row"><span>Accrued Guaranteed Additions (GA):</span><span class="res-val">₹ ${accruedGA.toLocaleString()}</span></div>
                <div class="res-row"><span>Total Premium Paid (during PPT):</span><span class="res-val">₹ ${totalPaid.toLocaleString()}</span></div>
                <div class="res-row"><span>Lifetime Income (10% of SA):</span><span class="res-val">₹ ${(sa * 0.1).toLocaleString()} / Year</span></div>
                <div class="res-row"><span>FINAL BENEFIT PAYABLE (At Age 100):</span><span class="res-val">₹ ${finalBenefit.toLocaleString()}</span></div>
                <div class="formula">Formula: Basic Sum Assured + Total Accrued GA</div>
            `;
        } else {
            // Death Benefit Logic (Page 4)
            const gaTillDeath = (deathYr <= ppt) ? ((sa / 1000) * gaRate * deathYr) : accruedGA;
            const saOnDeath = Math.max(sa, 7 * premium);
            const totalPaidTillDeath = premium * Math.min(deathYr, ppt);
            const baseDeathClaim = Math.max(saOnDeath, 1.05 * totalPaidTillDeath);
            const finalDeathPayable = baseDeathClaim + gaTillDeath;

            html += `
                <div class="res-row"><span>Basic Sum Assured:</span><span class="res-val">₹ ${sa.toLocaleString()}</span></div>
                <div class="res-row"><span>Accrued GA till Year ${deathYr}:</span><span class="res-val">₹ ${gaTillDeath.toLocaleString()}</span></div>
                <div class="res-row"><span>Total Premium Paid till Death:</span><span class="res-val">₹ ${totalPaidTillDeath.toLocaleString()}</span></div>
                <div class="res-row"><span>FINAL DEATH BENEFIT:</span><span class="res-val">₹ ${finalDeathPayable.toLocaleString()}</span></div>
                <div class="formula">Formula: Max(BSA, 7x Prem, 105% Paid) + Accrued GA</div>
            `;
        }

        document.getElementById('res-content').innerHTML = html;
        document.getElementById('results').style.display = 'block';
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }
</script>

</body>
</html>
