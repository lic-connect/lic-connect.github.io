<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Digital Card</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root {
            --lic-blue: #0055a4;
            --lic-accent: #f97316;
            --whatsapp-green: #25D366;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .card-container {
            background: white;
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            overflow: hidden;
            text-align: center;
            position: relative;
        }

        .card-header {
            background: var(--lic-blue);
            height: 120px;
            position: relative;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 5px solid white;
            background: #eee;
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            object-fit: cover;
        }

      .card-body { padding: 130px 20px 30px; }

        .agent-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: #333;
            margin: 0;
        }

        .agent-title {
            color: var(--lic-blue);
            font-weight: 500;
            margin-bottom: 20px;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .contact-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #555;
            transition: transform 0.2s;
        }

        .contact-item:active { transform: scale(0.9); }

        .icon-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: white;
            margin-bottom: 5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .bg-call { background: #3498db; }
        .bg-whatsapp { background: var(--whatsapp-green); }
        .bg-mail { background: #e74c3c; }
        .bg-web { background: var(--lic-accent); }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 1rem;
            transition: 0.3s;
        }

        .btn-save {
            background: var(--lic-blue);
            color: white;
        }

        .btn-share {
            background: #eee;
            color: #333;
        }

        #qrcode {
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }

        .back-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            z-index: 10;
        }

/* Container for the image and the upload button */
.profile-img-container {
    position: absolute;
    bottom: -60px;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 120px;
}

.profile-img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 5px solid white;
    background: #eee;
    object-fit: cover;
}

/* The small camera button */
.camera-icon {
    position: absolute;
    bottom: 5px;
    right: 5px;
    background: var(--lic-accent);
    color: white;
    width: 35px;
    height: 35px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: 3px solid white;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    transition: 0.3s;
}

.camera-icon:hover {
    transform: scale(1.1);
    background: var(--lic-blue);
}


/* Edit Button in top right */
.edit-profile-btn {
    position: absolute;
    top: 15px;
    right: 15px;
    background: rgba(255,255,255,0.2);
    border: none;
    color: white;
    width: 35px;
    height: 35px;
    border-radius: 50%;
    cursor: pointer;
    z-index: 10;
    transition: 0.3s;
}
.edit-profile-btn:hover { background: rgba(255,255,255,0.4); }

/* Modal Overlay */
.modal-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.7);
    display: none; /* Hidden by default */
    align-items: center;
    justify-content: center;
    z-index: 1000;
}

/* Modal Box */
.modal-content {
    background: white;
    padding: 25px;
    border-radius: 15px;
    width: 90%;
    max-width: 350px;
    text-align: left;
}

.modal-content h3 { margin-top: 0; color: var(--lic-blue); }

.modal-content input {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-family: 'Poppins', sans-serif;
}
    </style>

</head>
<body>

 <div class="card-container">
    <!-- Navigation & Edit -->
    <a href="main.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
    <button class="edit-profile-btn" onclick="toggleModal(true)"><i class="fas fa-cog"></i></button>
    
    <div class="card-header">
        <div class="profile-img-container">
            <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Agent" class="profile-img" id="displayPic">
            <label for="imageUpload" class="camera-icon">
                <i class="fas fa-camera"></i>
            </label>
            <input type="file" id="imageUpload" accept="image/*" style="display:none;">
        </div>
    </div>

    <div class="card-body">
        <h1 class="agent-name" id="agentNameDisplay">LIC Agent Name</h1>
        <p class="agent-title" id="agentTitleDisplay">Certified Insurance Advisor</p>

        <div class="contact-grid">
            <a href="tel:+919876543210" class="contact-item" id="phoneLink">
                <div class="icon-circle bg-call"><i class="fas fa-phone"></i></div>
                <span style="font-size: 0.7rem;">Call</span>
            </a>
            <a href="https://wa.me/919876543210" class="contact-item" id="whatsappLink">
                <div class="icon-circle bg-whatsapp"><i class="fab fa-whatsapp"></i></div>
                <span style="font-size: 0.7rem;">WhatsApp</span>
            </a>
            <a href="mailto:agent@example.com" class="contact-item" id="emailLink">
                <div class="icon-circle bg-mail"><i class="fas fa-envelope"></i></div>
                <span style="font-size: 0.7rem;">Email</span>
            </a>
            <a href="https://www.licindia.in" class="contact-item" id="websiteLink" target="_blank">
                <div class="icon-circle bg-web"><i class="fas fa-globe"></i></div>
                <span style="font-size: 0.7rem;">Website</span>
            </a>
        </div>

        <div class="action-buttons">
            <button class="btn btn-save" onclick="downloadVCard()">
                <i class="fas fa-user-plus"></i> Save to Contacts
            </button>
            <button class="btn btn-share" onclick="shareCard()">
                <i class="fas fa-share-alt"></i> Share Card
            </button>
        </div>

        <div id="qrcode"></div>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="editModal" class="modal-overlay">
        <div class="modal-content">
            <h3>Edit Profile Details</h3>
            <input type="text" id="nameInput" placeholder="Full Name">
            <input type="text" id="titleInput" placeholder="Designation (e.g. MDRT Advisor)">
            <input type="text" id="phoneInput" placeholder="Phone Number (with +91)">
            <input type="email" id="emailInput" placeholder="Email Address">
            <input type="text" id="websiteInput" placeholder="Website URL">
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button class="btn btn-save" style="flex: 1;" onclick="saveProfileData()">Save Details</button>
                <button class="btn btn-share" style="flex: 1;" onclick="toggleModal(false)">Cancel</button>
            </div>
        </div>
    </div>
</div>

<script>
    // --- INITIAL DATA & ELEMENTS ---
const elements = {
    nameDisp: document.getElementById('agentNameDisplay'),
    titleDisp: document.getElementById('agentTitleDisplay'),
    phoneLnk: document.getElementById('phoneLink'),
    waLnk: document.getElementById('whatsappLink'),
    mailLnk: document.getElementById('emailLink'),
    webLnk: document.getElementById('websiteLink'),
    modal: document.getElementById('editModal')
};

const inputs = {
    name: document.getElementById('nameInput'),
    title: document.getElementById('titleInput'),
    phone: document.getElementById('phoneInput'),
    email: document.getElementById('emailInput'),
    web: document.getElementById('websiteInput')
};

// --- LOAD DATA ON START ---
window.addEventListener('load', () => {
    // 1. Load Photo
    const savedPhoto = localStorage.getItem('agentPhoto');
    if (savedPhoto) document.getElementById('displayPic').src = savedPhoto;

    // 2. Load Text Data
    const savedData = JSON.parse(localStorage.getItem('agentData'));
    if (savedData) {
        updateUI(savedData);
    }
    
    // 3. Initialize QR Code (based on current URL)
    new QRCode(document.getElementById("qrcode"), {
        text: window.location.href,
        width: 128, height: 128
    });
});

// --- TOGGLE MODAL ---
function toggleModal(show) {
    elements.modal.style.display = show ? 'flex' : 'none';
    if (show) {
        // Pre-fill inputs with current data
        inputs.name.value = elements.nameDisp.innerText;
        inputs.title.value = elements.titleDisp.innerText;
        inputs.phone.value = elements.phoneLnk.getAttribute('href').replace('tel:', '');
        inputs.email.value = elements.mailLnk.getAttribute('href').replace('mailto:', '');
        inputs.web.value = elements.webLnk.getAttribute('href');
    }
}

// --- SAVE DATA ---
function saveProfileData() {
    const data = {
        name: inputs.name.value,
        title: inputs.title.value,
        phone: inputs.phone.value,
        email: inputs.email.value,
        web: inputs.web.value
    };

    localStorage.setItem('agentData', JSON.stringify(data));
    updateUI(data);
    toggleModal(false);
}

// --- UPDATE UI ELEMENTS ---
function updateUI(data) {
    elements.nameDisp.innerText = data.name || "LIC Agent Name";
    elements.titleDisp.innerText = data.title || "Insurance Advisor";
    elements.phoneLnk.href = `tel:${data.phone}`;
    elements.waLnk.href = `https://wa.me/${data.phone.replace('+', '')}`;
    elements.mailLnk.href = `mailto:${data.email}`;
    elements.webLnk.href = data.web;
}

// --- PHOTO UPLOAD ---
document.getElementById('imageUpload').addEventListener('change', function() {
    const file = this.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
            document.getElementById('displayPic').src = e.target.result;
            localStorage.setItem('agentPhoto', e.target.result);
        };
        reader.readAsDataURL(file);
    }
});

// --- VCARD DOWNLOAD ---
function downloadVCard() {
    const name = elements.nameDisp.innerText;
    const phone = elements.phoneLnk.href.replace('tel:', '');
    const email = elements.mailLnk.href.replace('mailto:', '');

    const vcard = `BEGIN:VCARD\nVERSION:3.0\nFN:${name}\nTEL;TYPE=CELL:${phone}\nEMAIL:${email}\nORG:LIC India\nEND:VCARD`;
    const blob = new Blob([vcard], { type: "text/vcard" });
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${name}.vcf`;
    a.click();
}

// --- NATIVE SHARE ---
async function shareCard() {
    if (navigator.share) {
        await navigator.share({ title: 'My Digital Card', url: window.location.href });
    } else {
        alert("Copy this URL to share: " + window.location.href);
    }
}
</script>
</body>
</html>
