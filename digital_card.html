<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Digital Card</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root {
            --lic-blue: #0055a4;
            --lic-accent: #f97316;
            --whatsapp-green: #25D366;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .card-container {
            background: white;
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            overflow: hidden;
            text-align: center;
            position: relative;
        }

        .card-header {
            background: var(--lic-blue);
            height: 120px;
            position: relative;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 5px solid white;
            background: #eee;
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            object-fit: cover;
        }

        .card-body {
            padding: 70px 20px 30px;
        }

        .agent-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: #333;
            margin: 0;
        }

        .agent-title {
            color: var(--lic-blue);
            font-weight: 500;
            margin-bottom: 20px;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .contact-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #555;
            transition: transform 0.2s;
        }

        .contact-item:active { transform: scale(0.9); }

        .icon-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: white;
            margin-bottom: 5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .bg-call { background: #3498db; }
        .bg-whatsapp { background: var(--whatsapp-green); }
        .bg-mail { background: #e74c3c; }
        .bg-web { background: var(--lic-accent); }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 1rem;
            transition: 0.3s;
        }

        .btn-save {
            background: var(--lic-blue);
            color: white;
        }

        .btn-share {
            background: #eee;
            color: #333;
        }

        #qrcode {
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }

        .back-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <a href="main.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        
        <div class="card-header">
            <!-- You can replace this with an actual image link -->
            <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Agent" class="profile-img" id="displayPic">
        </div>

        <div class="card-body">
            <h1 class="agent-name" id="agentName">LIC Agent Name</h1>
            <p class="agent-title">Certified Insurance Advisor</p>

            <div class="contact-grid">
                <a href="tel:+919876543210" class="contact-item">
                    <div class="icon-circle bg-call"><i class="fas fa-phone"></i></div>
                    <span style="font-size: 0.7rem;">Call</span>
                </a>
                <a href="https://wa.me/919876543210" class="contact-item">
                    <div class="icon-circle bg-whatsapp"><i class="fab fa-whatsapp"></i></div>
                    <span style="font-size: 0.7rem;">WhatsApp</span>
                </a>
                <a href="mailto:agent@example.com" class="contact-item">
                    <div class="icon-circle bg-mail"><i class="fas fa-envelope"></i></div>
                    <span style="font-size: 0.7rem;">Email</span>
                </a>
                <a href="https://www.licindia.in" class="contact-item">
                    <div class="icon-circle bg-web"><i class="fas fa-globe"></i></div>
                    <span style="font-size: 0.7rem;">Website</span>
                </a>
            </div>

            <div class="action-buttons">
                <button class="btn btn-save" onclick="downloadVCard()">
                    <i class="fas fa-user-plus"></i> Save to Contacts
                </button>
                <button class="btn btn-share" onclick="shareCard()">
                    <i class="fas fa-share-alt"></i> Share Card
                </button>
            </div>

            <div id="qrcode"></div>
            <p style="font-size: 0.8rem; color: #777; margin-top: 10px;">Scan to open Digital Card</p>
        </div>
    </div>

    <script>
        // 1. Initialize QR Code
        const qrDiv = document.getElementById("qrcode");
        new QRCode(qrDiv, {
            text: window.location.href,
            width: 128,
            height: 128
        });

        // 2. Download vCard Function
        function downloadVCard() {
            const name = document.getElementById("agentName").innerText;
            const phone = "+919876543210";
            const email = "agent@example.com";

            const vcard = `BEGIN:VCARD
VERSION:3.0
FN:${name}
TEL;TYPE=CELL:${phone}
EMAIL:${email}
ORG:LIC India
TITLE:Insurance Advisor
END:VCARD`;

            const blob = new Blob([vcard], { type: "text/vcard" });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `${name}.vcf`;
            a.click();
        }

        // 3. Share Function
        async function shareCard() {
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'My Digital Business Card',
                        text: 'Connect with me for LIC Insurance solutions.',
                        url: window.location.href,
                    });
                } catch (err) {
                    console.log("Error sharing:", err);
                }
            } else {
                alert("Share not supported on this browser. Copy the URL instead.");
            }
        }
    </script>
</body>
</html>
