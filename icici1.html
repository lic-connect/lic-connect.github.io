<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --icici-orange: #F37021;
            --icici-maroon: #8B0E04;
            --deep-space: #1a0b2e;
            --bg-grad: linear-gradient(135deg, #2b0a3d, #510a0a, #1f1c2c);
            --card-front-grad: linear-gradient(160deg, rgba(139, 14, 4, 0.85), rgba(243, 112, 33, 0.85));
            --card-back-grad: linear-gradient(160deg, #190033, #330019); /* Deep Purple/Red - NO BLACK */
            --gold: #FFD700;
            --glass: rgba(255, 255, 255, 0.1);
            --border: rgba(255, 255, 255, 0.3);
            --text-glow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Lato', sans-serif;
            background: var(--bg-grad);
            background-size: 400% 400%;
            animation: cosmicShift 20s ease infinite;
            min-height: 100vh;
            color: #fff;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        @keyframes cosmicShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* HEADER */
        header {
            text-align: center;
            margin-bottom: 70px;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 4rem;
            text-transform: uppercase;
            background: linear-gradient(to right, #fff, var(--gold), var(--icici-orange));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(243, 112, 33, 0.8);
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.2rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--gold);
            border: 1px solid var(--gold);
            display: inline-block;
            padding: 10px 30px;
            border-radius: 50px;
            box-shadow: 0 0 20px var(--icici-orange);
            backdrop-filter: blur(5px);
        }

        /* GRID */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 50px;
            max-width: 1900px;
            margin: 0 auto;
            perspective: 2000px;
        }

        /* CARD */
        .card {
            height: 750px;
            position: relative;
            cursor: pointer;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(81, 10, 10, 0.6);
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        /* FACES */
        .front, .back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        /* FRONT DESIGN */
        .front {
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            z-index: 2;
            transform: rotateY(0deg);
            background: var(--glass);
            backdrop-filter: blur(15px);
        }

        /* Dynamic Gradients for Front injected via JS */
        
        .icon-box {
            font-size: 4rem;
            margin-bottom: 25px;
            color: #fff;
            filter: drop-shadow(0 0 15px var(--gold));
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float { 0%,100% {transform: translateY(0);} 50% {transform: translateY(-15px);} }

        .plan-name {
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            margin-bottom: 10px;
            line-height: 1.3;
            color: #fff;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
            border-bottom: 2px solid var(--gold);
            padding-bottom: 10px;
            width: 80%;
        }

        .cat-badge {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: rgba(255,255,255,0.1);
            padding: 5px 15px;
            border-radius: 20px;
            margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.5);
            color: var(--gold);
            font-weight: bold;
        }

        .click-hint {
            padding: 12px 35px;
            background: linear-gradient(45deg, var(--icici-orange), #d35400);
            color: #fff;
            border-radius: 30px;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.8rem;
            transition: 0.3s;
            box-shadow: 0 0 15px var(--icici-orange);
            margin-top: auto;
        }
        .card:hover .click-hint { transform: scale(1.05); }

        /* BACK DESIGN */
        .back {
            transform: rotateY(180deg);
            background: var(--card-back-grad);
            padding: 20px;
        }

        .back-header {
            border-bottom: 1px solid rgba(255,255,255,0.3);
            padding-bottom: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-title { color: var(--gold); font-family: 'Cinzel', serif; font-size: 1.1rem; }

        .data-list {
            flex-grow: 1;
            overflow-y: auto;
            text-align: left;
            padding-right: 8px;
        }

        /* Custom Scrollbar */
        .data-list::-webkit-scrollbar { width: 6px; }
        .data-list::-webkit-scrollbar-thumb { background: linear-gradient(to bottom, var(--icici-maroon), var(--icici-orange)); border-radius: 10px; }
        .data-list::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }

        .data-row {
            margin-bottom: 10px;
            border-bottom: 1px dashed rgba(255,255,255,0.1);
            padding-bottom: 5px;
        }

        .label {
            display: block;
            font-size: 0.7rem;
            color: var(--icici-orange);
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 3px;
        }

        .value {
            font-size: 0.9rem;
            color: #fff;
            font-weight: 500;
            line-height: 1.4;
        }

        .usp-box {
            background: rgba(255, 255, 255, 0.05);
            border-left: 3px solid var(--gold);
            padding: 15px;
            margin-top: 20px;
            border-radius: 0 10px 10px 0;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
        }

        .usp-text {
            font-size: 0.85rem;
            line-height: 1.7;
            color: #f0f0f0;
            text-align: justify;
        }
        
        .usp-label {
            display: block;
            color: var(--gold);
            font-family: 'Cinzel', serif;
            margin-bottom: 8px;
            font-size: 1rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .grid-container { grid-template-columns: 1fr; }
        }
    </style>
</head>

                    usp: "Future Perfect lives up to its name by blending guarantees with performance. <b>USP:</b> It offers 'Guaranteed Additions' for the first few years, followed by 'Reversionary Bonuses' and 'Terminal Bonuses'. This structure ensures that your base is secure, while your final payout benefits from the insurer's profits. It is a long-term wealth builder suitable for creating a legacy or funding major life goals with tax-free returns."
                }
            },
            {
                name: "ICICI Pru Life Time Classic",
                cat: "Classic ULIP",
                icon: "fa-landmark",
                details: {
                    type: "Unit Linked Plan.",
                    sa: "10x Premium.",
                    term: "10 to 25 Years.",
                    ppt: "Regular Pay.",
                    age: "0 to 65.",
                    option: "Wealth.",
                    maturity: "Fund Value.",
                    sb: "Withdrawals.",
                    death: "Higher of SA or Fund.",
                    riders: "Available.",
                    surrender: "5 Years.",
                    revival: "3 Years.",
                    usp: "A flexible ULIP that allows you to change your portfolio strategy as your risk appetite changes. <b>USP:</b> It offers 4 distinct portfolio strategies (Lifecycle based, Target Asset Allocation, etc.). It rewards long-term customers with Loyalty Additions. With the ability to switch between equity and debt funds unlimited times for free, it puts the power of wealth creation in your hands. Ideal for active investors seeking insurance plus investment."
                }
            }
        ];

        const grid = document.getElementById('cardGrid');

        plans.forEach((plan, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.setAttribute('onclick', 'this.classList.toggle("flipped")');

            // Category color logic
            let catColor = "";
            if(plan.cat.includes("Term")) catColor = "#F37021"; // Orange
            else if(plan.cat.includes("ULIP")) catColor = "#00d2ff"; // Blue
            else if(plan.cat.includes("Savings") || plan.cat.includes("Endowment")) catColor = "#FF007F"; // Pink/Red
            else catColor = "#FFD700"; // Gold

            card.innerHTML = `
                <div class="card-inner">
                    <div class="front" style="background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.1)); border-top: 3px solid ${catColor}">
                        <div class="icon-box"><i class="fas ${plan.icon}" style="color:${catColor}"></i></div>
                        <div class="plan-name">${plan.name}</div>
                        <div class="cat-badge" style="color:${catColor}; border-color:${catColor}">${plan.cat}</div>
                        <div class="click-hint">Click to Flip</div>
                    </div>
                    <div class="back">
                        <div class="back-header">
                            <span class="back-title" style="color:${catColor}">${plan.name}</span>
                            <i class="fas fa-undo" style="color:#fff"></i>
                        </div>
                        <div class="data-list">
                            <div class="data-row"><span class="label" style="color:${catColor}">1. Plan Type</span><span class="value">${plan.details.type}</span></div>
                            <div class="data-row"><span class="label" style="color:${catColor}">2. Sum Assured</span><span class="value">${plan.details.sa}</span></div>
                            <div class="data-row"><span class="label" style="color:${catColor}">3. Policy Term</span><span class="value">${plan.details.term}</span></div>
                            <div class="data-row"><span class="label" style="color:${catColor}">4. PPT</span><span class="value">${plan.details.ppt}</span></div>
                            <div class="data-row"><span class="label" style="color:${catColor}">5. Entry Age</span><span class="value">${plan.details.age}</span></div>
                            <div class="data-row"><span class="label" style="color:${catColor}">6. Option</span><span class="value">${plan.details.option}</span></div>
                            <div class="data-row"><span class="label" style="color:${catColor}">7. Maturity</span><span class="value">${plan.details.maturity}</span></div>
                            <div class="data-row"><span class="label" style="color:${catColor}">8. SB</span><span class="value">${plan.details.sb}</span></div>
                            <div class="data-row"><span class="label" style="color:${catColor}">9. Death Benefit</span><span class="value">${plan.details.death}</span></div>
                            <div class="data-row"><span class="label" style="color:${catColor}">10. Riders</span><span class="value">${plan.details.riders}</span></div>
                            <div class="data-row"><span class="label" style="color:${catColor}">11. Surrender</span><span class="value">${plan.details.surrender}</span></div>
                            <div class="data-row"><span class="label" style="color:${catColor}">12. Revival</span><span class="value">${plan.details.revival}</span></div>
                            <div class="usp-box" style="border-left-color:${catColor}">
                                <span class="usp-label" style="color:${catColor}">Salient Features (USP):</span>
                                <div class="usp-text">${plan.details.usp}</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    </script>
</body>
</html>
