    <style>
        :root {
            --cosmic-blue: #1a1a40;
            --nebula-purple: #4b0082;
            --starlight-gold: #ffd700;
            --danger-red: #ff3333;
            --pure-white: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --card-front-grad: linear-gradient(135deg, #240b36 0%, #c31432 100%);
            --card-back-grad: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
        }

        body {
            background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%); 
            /* Deep midnight blue, not black */
            font-family: 'Rajdhani', sans-serif;
            color: var(--pure-white);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Twinkling Stars Background */
        .stars, .twinkling {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100%; height: 100%;
            display: block;
        }
        .stars {
            background: #000 url('http://www.script-tutorials.com/demos/360/images/stars.png') repeat top center;
            z-index: -2;
            opacity: 0.6; /* mitigating pure black via opacity */
        }
        .twinkling{
            background: transparent url('http://www.script-tutorials.com/demos/360/images/twinkling.png') repeat top center;
            z-index: -1;
            animation: move-twink-back 200s linear infinite;
        }
        @keyframes move-twink-back {
            from {background-position:0 0;}
            to {background-position:-10000px 5000px;}
        }

        /* 3D Title */
        header {
            text-align: center;
            padding: 40px 20px;
            perspective: 500px;
        }

        h1.galaxy-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 4rem;
            text-transform: uppercase;
            color: var(--pure-white);
            text-shadow: 
                0 1px 0 #ccc,
                0 2px 0 #c9c9c9,
                0 3px 0 #bbb,
                0 4px 0 #b9b9b9,
                0 5px 0 #aaa,
                0 6px 1px rgba(0,0,0,.1),
                0 0 5px rgba(0,0,0,.1),
                0 1px 3px rgba(0,0,0,.3),
                0 3px 5px rgba(0,0,0,.2),
                0 5px 10px rgba(0,0,0,.25),
                0 10px 10px rgba(0,0,0,.2),
                0 20px 20px rgba(0,0,0,.15),
                0 0 20px var(--danger-red),
                0 0 40px var(--danger-red);
            transform: rotateX(10deg);
            letter-spacing: 5px;
            margin: 0;
        }
        
        .sub-title {
            font-family: 'Cinzel', serif;
            color: var(--starlight-gold);
            font-size: 1.5rem;
            margin-top: 10px;
            text-shadow: 0 0 10px var(--starlight-gold);
        }

        /* Comparison Section */
        .comparison-container {
            background: rgba(48, 11, 74, 0.7);
            border: 2px solid var(--starlight-gold);
            border-radius: 20px;
            margin: 20px auto;
            width: 90%;
            max-width: 1200px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        .comparison-controls {
            text-align: center;
            margin-bottom: 20px;
        }

        select {
            padding: 10px 20px;
            font-size: 1.2rem;
            border-radius: 30px;
            border: 2px solid var(--starlight-gold);
            background: #2e0944;
            color: white;
            font-family: 'Orbitron', sans-serif;
            outline: none;
            cursor: pointer;
            transition: 0.3s;
        }
        select:hover {
            box-shadow: 0 0 15px var(--starlight-gold);
        }

        .comp-table {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .comp-card {
            background: linear-gradient(to bottom, #141e30, #243b55);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .comp-card.lic-card {
            border: 2px solid var(--danger-red);
            box-shadow: 0 0 20px rgba(255, 51, 51, 0.4);
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 8px 0;
        }
        .stat-label { color: #aaa; font-size: 0.9rem; }
        .stat-val { color: var(--starlight-gold); font-weight: bold; font-size: 1.1rem; text-align: right; }

        /* The Grid */
        .galaxy-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            padding: 40px;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* FLIP CARD STYLES */
        .flip-card {
            background-color: transparent;
            width: 100%;
            height: 450px;
            perspective: 1000px; /* Remove this if you don't want the 3D effect */
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.8s;
            transform-style: preserve-3d;
            box-shadow: 0 4px 8px 0 rgba(255,255,255,0.2);
            border-radius: 15px;
        }

        .flip-card:hover .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 15px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
            box-sizing: border-box;
        }

        .flip-card-front {
            background: var(--card-front-grad);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .flip-card-back {
            background: var(--card-back-grad);
            color: white;
            transform: rotateY(180deg);
            border: 2px solid var(--starlight-gold);
            justify-content: flex-start;
            padding-top: 20px;
            overflow-y: auto; /* Scroll if content is too long */
        }

        /* Scrollbar for back of card */
        .flip-card-back::-webkit-scrollbar {
            width: 5px;
        }
        .flip-card-back::-webkit-scrollbar-thumb {
            background: var(--starlight-gold);
            border-radius: 10px;
        }

        /* Typography & Data Styling */
        .company-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
            background: -webkit-linear-gradient(#fff, #ccc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .big-stat {
            margin: 10px 0;
        }
        .big-stat .val {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--starlight-gold);
            line-height: 1;
            display: block;
            text-shadow: 2px 2px 4px #5e0e0e;
        }
        .big-stat .lbl {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ddd;
        }

        .detail-grid {
            width: 100%;
            padding: 0 15px;
            text-align: left;
        }
        .detail-item {
            margin-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 4px;
        }
        .detail-item span.lbl {
            color: #aaa;
            font-size: 0.8rem;
            display: block;
        }
        .detail-item span.val {
            color: #fff;
            font-size: 1rem;
            font-weight: bold;
        }
        .important-note {
            background: rgba(255, 51, 51, 0.2);
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            font-size: 0.8rem;
            color: #ffcccc;
            border-left: 3px solid var(--danger-red);
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1.galaxy-title { font-size: 2.5rem; }
            .comp-table { grid-template-columns: 1fr; }
        }
    </style>
</head>

            note: "High claim performance."
        }
    ];

    const gridContainer = document.getElementById('gridContainer');
    const compareSelect = document.getElementById('compareSelect');

    // Initialize Page
    function init() {
        insuranceData.forEach((co, index) => {
            // 1. Populate Comparison Dropdown (Skip LIC as it's the benchmark)
            if (co.name !== "LIC") {
                const opt = document.createElement('option');
                opt.value = index;
                opt.innerText = co.name;
                compareSelect.appendChild(opt);
            }

            // 2. Create Flip Cards
            const card = document.createElement('div');
            card.className = 'flip-card';
            card.innerHTML = `
                <div class="flip-card-inner">
                    <div class="flip-card-front">
                        <div class="company-name">${co.name}</div>
                        <div class="big-stat">
                            <span class="val">${co.share}</span>
                            <span class="lbl">Market Share</span>
                        </div>
                        <div class="big-stat">
                            <span class="val">${co.csr}</span>
                            <span class="lbl">Claim Ratio</span>
                        </div>
                        <div class="big-stat">
                            <span class="val" style="font-size:1.8rem">${co.est}</span>
                            <span class="lbl">Established</span>
                        </div>
                        <div style="margin-top:20px; font-size:0.8rem; color:#ffd700">HOVER FOR DETAILS</div>
                    </div>
                    <div class="flip-card-back">
                        <div class="company-name" style="font-size:1.4rem; border-bottom:1px solid gold; width:90%; margin:0 auto 10px auto;">${co.name}</div>
                        <div class="detail-grid">
                            ${createDetailRow('Policy Holders', co.holders)}
                            ${createDetailRow('Agents', co.agents)}
                            ${createDetailRow('Branches', co.branches)}
                            ${createDetailRow('Claims Settled (Yr)', co.settled)}
                            ${createDetailRow('Rejected (Yr)', co.rejected)}
                            ${createDetailRow('Chairman/MD', co.chair)}
                            ${createDetailRow('Total Plans', co.plans)}
                            ${createDetailRow('Share Price', co.price)}
                            ${createDetailRow('Market Cap', co.mcap)}
                            <div class="detail-item">
                                <span class="lbl">Head Office</span>
                                <span class="val" style="font-size:0.9rem">${co.hq}</span>
                            </div>
                            <div class="important-note">NOTE: ${co.note}</div>
                        </div>
                    </div>
                </div>
            `;
            gridContainer.appendChild(card);
        });

        // Initialize Comparison with first option
        updateComparison();
        renderStats(insuranceData[0], 'lic-stats');
    }

    function createDetailRow(label, value) {
        return `
            <div class="detail-item">
                <span class="lbl">${label}</span>
                <span class="val">${value}</span>
            </div>
        `;
    }

    // Render Stats for Comparison Table
    function renderStats(co, containerId) {
        const container = document.getElementById(containerId);
        container.innerHTML = `
            <div class="stat-row"><span class="stat-label">Market Share</span><span class="stat-val">${co.share}</span></div>
            <div class="stat-row"><span class="stat-label">Claim Ratio</span><span class="stat-val">${co.csr}</span></div>
            <div class="stat-row"><span class="stat-label">Policy Holders</span><span class="stat-val">${co.holders}</span></div>
            <div class="stat-row"><span class="stat-label">Agents</span><span class="stat-val">${co.agents}</span></div>
            <div class="stat-row"><span class="stat-label">Branches</span><span class="stat-val">${co.branches}</span></div>
            <div class="stat-row"><span class="stat-label">Est. Date</span><span class="stat-val">${co.est}</span></div>
            <div class="stat-row"><span class="stat-label">Share Price</span><span class="stat-val">${co.price}</span></div>
            <div class="stat-row"><span class="stat-label">Market Cap</span><span class="stat-val">${co.mcap}</span></div>
        `;
    }

    // Update Comparator
    window.updateComparison = function() {
        const index = compareSelect.value;
        const co = insuranceData[index];
        document.getElementById('chal-name').innerText = co.name;
        renderStats(co, 'chal-stats');
    }

    // Run
    init();

</script>

</body>
</html>
