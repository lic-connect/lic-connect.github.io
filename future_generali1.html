<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future Generali - The Grand Collection</title>
    <!-- Fonts & Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=Raleway:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #4a0000 0%, #8E0E00 50%, #1F1C18 100%); /* Deep Red/Gold/Dark Brown - No Black */
            --glass: rgba(255, 255, 255, 0.1);
            --border: rgba(255, 255, 255, 0.3);
            --text-light: #ffffff;
            --gold: #FFD700;
            --crimson: #DC143C;
            
            /* Category Colors */
            --term-grad: linear-gradient(135deg, #cb2d3e, #ef473a);
            --save-grad: linear-gradient(135deg, #DA22FF, #9733EE);
            --ulip-grad: linear-gradient(135deg, #FF512F, #F09819);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Raleway', sans-serif;
            background: var(--bg-gradient);
            background-size: 400% 400%;
            animation: royalFlow 15s ease infinite;
            min-height: 100vh;
            color: var(--text-light);
            padding: 40px 20px;
            overflow-x: hidden;
        }

        @keyframes royalFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Animated Background Particles */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(rgba(255, 215, 0, 0.2) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: sparkle 5s infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.7; }
        }

        header {
            text-align: center;
            margin-bottom: 60px;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            color: var(--gold);
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(220, 20, 60, 0.8);
            font-style: italic;
        }

        .subtitle {
            font-size: 1.2rem;
            letter-spacing: 3px;
            background: rgba(255,255,255,0.1);
            display: inline-block;
            padding: 8px 30px;
            border-radius: 50px;
            border: 1px solid var(--gold);
        }

        /* GRID */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 40px;
            max-width: 1800px;
            margin: 0 auto;
            perspective: 2000px;
            z-index: 10;
            position: relative;
        }

        /* CARD */
        .card {
            height: 700px;
            position: relative;
            cursor: pointer;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(100, 0, 0, 0.4);
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        /* FACES */
        .front, .back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        /* FRONT */
        .front {
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            z-index: 2;
            transform: rotateY(0deg);
            backdrop-filter: blur(15px);
            background: var(--glass);
        }

        .icon-box {
            font-size: 4rem;
            margin-bottom: 20px;
            color: var(--gold);
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.5));
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float { 0%,100% {transform: translateY(0);} 50% {transform: translateY(-15px);} }

        .plan-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 15px;
            line-height: 1.2;
            color: #fff;
        }

        .cat-badge {
            font-size: 0.8rem;
            padding: 5px 20px;
            border-radius: 20px;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .click-hint {
            padding: 10px 25px;
            border: 1px solid var(--gold);
            color: var(--gold);
            border-radius: 30px;
            transition: 0.3s;
            text-transform: uppercase;
            font-size: 0.8rem;
        }
        .card:hover .click-hint { background: var(--gold); color: #4a0000; font-weight: bold; }

        /* BACK */
        .back {
            transform: rotateY(180deg);
            background: #2b0a1a; /* Deep purple/maroon mix - NO BLACK */
            padding: 15px;
        }

        .back-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--gold);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .back-title { font-weight: 700; font-size: 1rem; color: var(--gold); font-family: 'Playfair Display', serif;}

        .data-list {
            flex-grow: 1;
            overflow-y: auto;
            text-align: left;
            padding-right: 5px;
        }

        .data-list::-webkit-scrollbar { width: 5px; }
        .data-list::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }

        .data-row {
            margin-bottom: 8px;
            border-bottom: 1px dashed rgba(255,255,255,0.15);
            padding-bottom: 4px;
        }

        .label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 2px;
            color: #ff9999;
        }

        .value {
            font-size: 0.9rem;
            color: #fff;
            font-weight: 500;
        }

        .usp-box {
            background: rgba(255, 215, 0, 0.15);
            padding: 10px;
            border-radius: 8px;
            margin-top: 5px;
            font-size: 0.85rem;
            border-left: 3px solid var(--gold);
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .grid-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
