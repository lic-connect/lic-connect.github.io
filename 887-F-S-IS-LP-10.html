    function calculate() {
        const age = parseInt(document.getElementById('age').value);
        const term = document.getElementById('term').value;
        const sa = parseFloat(document.getElementById('sa').value);
        const modeFactor = parseFloat(document.getElementById('mode').value);
        const isOnline = document.getElementById('isOnline').checked;
        const isAB = document.getElementById('isAB').checked;

        if (sa < 20000000) { alert("Min Sum Assured is 2 Crore."); return; }

        const ageRow = tabularRates.find(r => r.Age === age);
        if (!ageRow || !ageRow[term] || ageRow[term] === 0) {
            alert("No data available for this Age/Term combination.");
            return;
        }

        const rate = ageRow[term];
        const tabularPremium = (sa / 1000) * rate;

        // High Sum Assured Rebate (Option II)
        let hsaRate = 0;
        const saCr = sa / 10000000;
        if (saCr >= 3 && saCr < 5) hsaRate = (age <= 35) ? 2.00 : (age <= 55 ? 1.50 : 1.00);
        else if (saCr >= 5 && saCr < 10) hsaRate = (age <= 35) ? 3.00 : (age <= 55 ? 2.00 : 1.50);
        else if (saCr >= 10) hsaRate = (age <= 35) ? 3.50 : (age <= 55 ? 2.50 : 2.00);
        const hsaRebate = (tabularPremium * hsaRate) / 100;

        // Online Rebate (10% for LP-10)
        const onlineRebate = isOnline ? (tabularPremium * 0.10) : 0;

        // AB Rider (₹1/1000, capped at 1Cr SA)
        let abPremium = 0;
        if (isAB) {
            const abSA = Math.min(sa, 10000000);
            abPremium = (abSA / 1000) * 0.50 * modeFactor;
        }

        const netAnnual = tabularPremium - hsaRebate - onlineRebate;
        const finalPremium = (netAnnual * modeFactor) + abPremium;

        document.getElementById('results').style.display = 'block';
        document.getElementById('resTab').innerText = "₹ " + Math.round(tabularPremium).toLocaleString('en-IN');
        document.getElementById('resHSA').innerText = "- ₹ " + Math.round(hsaRebate).toLocaleString('en-IN');
        document.getElementById('resOnline').innerText = "- ₹ " + Math.round(onlineRebate).toLocaleString('en-IN');
        document.getElementById('resAB').innerText = "₹ " + Math.round(abPremium).toLocaleString('en-IN');
        
        const modeLabels = {"1": "Yearly", "0.51": "Half-Yearly", "0.26": "Quarterly", "0.0861": "Monthly"};
        document.getElementById('resMode').innerText = modeLabels[modeFactor] + " Premium:";
        document.getElementById('resTotal').innerText = "₹ " + Math.round(finalPremium).toLocaleString('en-IN');
    }
