<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIC Plan 721 IRR Professional Report</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #003366;
            --success-green: #28a745;
            --white: #ffffff;
            --black: #000000;
            --bg-light: #f4f7f6;
            --shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-light);
            color: var(--black);
            margin: 0;
            padding: 20px;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        .header {
            background: linear-gradient(135deg, var(--primary-blue) 0%, #001a35 100%);
            color: white;
            padding: 50px;
            border-radius: 25px;
            text-align: center;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
            border-bottom: 8px solid var(--success-green);
        }
        .header h1 { margin: 0; font-size: 2.8em; text-transform: uppercase; letter-spacing: 2px; font-weight: 700; }
        .header p { opacity: 0.9; margin-top: 10px; font-size: 1.1em; }

        .main-grid {
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 30px;
        }

        .card {
            background: var(--white);
            padding: 35px;
            border-radius: 25px;
            box-shadow: var(--shadow);
            border: 1px solid #e0e0e0;
        }

        .section-title {
            font-size: 1.1em;
            font-weight: 700;
            color: var(--primary-blue);
            margin-bottom: 25px;
            border-bottom: 3px solid var(--success-green);
            display: inline-block;
        }

        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85em; font-weight: 700; margin-bottom: 5px; color: var(--black); }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-family: inherit;
            box-sizing: border-box;
            font-size: 1em;
        }
        input[readonly] { background-color: #f0f0f0; cursor: not-allowed; font-weight: bold; }

        .rider-box {
            background: #f0f7ff;
            padding: 20px;
            border-radius: 15px;
            margin: 25px 0;
            border: 1px solid #d0e4ff;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            font-size: 0.9em;
            font-weight: 600;
        }
        .checkbox-container input { width: auto; cursor: pointer; transform: scale(1.2); }

        #errorMsg {
            color: #d32f2f;
            background: #ffebee;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
            font-weight: bold;
            border: 1px solid #ffcdd2;
            font-size: 0.85em;
            line-height: 1.6;
        }

        button.btn-generate {
            width: 100%;
            background: var(--success-green);
            color: white;
            border: none;
            padding: 18px;
            font-size: 1.1em;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .results-panel { display: none; }
        
        .asset-summary {
            background: var(--primary-blue);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 700;
            font-size: 1.4em;
        }

        .table-container {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            overflow-x: auto;
        }
        table { width: 100%; border-collapse: collapse; font-size: 0.82em; }
        th { background: #f8fafc; color: var(--primary-blue); padding: 12px; border-bottom: 2px solid #eee; text-align: center; }
        td { padding: 10px; text-align: center; border-bottom: 1px solid #f1f5f9; }
        .row-outflow { color: #d9534f; font-weight: bold; }
        .row-inflow { color: var(--success-green); font-weight: bold; }
        .total-row { background: #333 !important; color: white !important; font-weight: 800; }

        @media print { .no-print { display: none; } }
    </style>
</head>
<body>

<div class="container">
    <div class="header no-print">
        <h1>LIC IRR Precision Report</h1>
        <p>Plan 721: 25-Year Money Back | BSMDT Rule Engine</p>
    </div>

    <div class="main-grid">
        <div class="card no-print">
            <div class="section-title">Primary Inputs</div>
            
            <div class="input-group">
                <label>Basic Sum Assured (₹)</label>
                <input type="number" id="sumAssured" value="20000000">
            </div>
            <div class="input-group">
                <label>Entry Age (13-45 Yrs)</label>
                <input type="number" id="age" value="30">
            </div>
            <div class="input-group">
                <label>Policy Term</label>
                <input type="number" id="term" value="25" readonly>
            </div>
            <div class="input-group">
                <label>Premium Paying Term (PPT)</label>
                <input type="number" id="ppt" value="20" readonly>
            </div>

            <div class="rider-box">
                <div class="section-title" style="font-size: 0.9em; margin-bottom: 15px; border:none;">Riders</div>
                
                <div class="checkbox-container">
                    <input type="checkbox" id="addbCheck" onchange="document.getElementById('addbIn').style.display = this.checked ? 'block' : 'none'">
                    <label>Include AD&DB Rider</label>
                </div>
                <div id="addbIn" style="display:none; margin-bottom: 15px;">
                    <label>AD&DB Sum Assured</label>
                    <input type="number" id="addbSaValue" value="10000000">
                </div>

                <div class="checkbox-container">
                    <input type="checkbox" id="trCheck" onchange="document.getElementById('trIn').style.display = this.checked ? 'block' : 'none'">
                    <label>Include Term Rider</label>
                </div>
                <div id="trIn" style="display:none;">
                    <label>Term Rider Sum Assured</label>
                    <input type="number" id="trSaValue" value="2500000">
                </div>
            </div>

            <div class="section-title">Bonus Projection</div>
            <div class="input-group">
                <label>Assumed Bonus (per 1000)</label>
                <input type="number" id="bonusRate" value="39">
            </div>
            <div class="input-group">
                <label>FAB (per 1000)</label>
                <input type="number" id="fabRate" value="20">
            </div>

            <button class="btn-generate" onclick="generateReport()">Generate Precise Report</button>
            <div id="errorMsg"></div>
        </div>

        <div class="results-panel" id="resultsPanel">
            <div class="asset-summary">
                TOTAL ASSET = INFLOWS - OUTFLOWS : <span id="assetVal">₹0</span> &nbsp;&nbsp;&nbsp; XIRR : <span id="dispXIRR">0.00%</span>
            </div>
            <div class="table-container">
                <table id="irrTable">
                    <thead>
                        <tr>
                            <th>Year</th>
                            <th>Age</th>
                            <th>Outflow</th>
                            <th>Inflows</th>
                            <th>SB</th>
                            <th>Bonus</th>
                            <th>FAB</th>
                            <th>GA</th>
                            <th>Death Benefit</th>
                            <th>Netflow</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                    <tfoot id="tableFoot"></tfoot>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const baseRates721 = { 13: 62.35, 14: 62.4, 15: 62.45, 16: 62.55, 17: 62.6, 18: 62.65, 19: 62.7, 20: 62.75, 21: 62.8, 22: 62.9, 23: 62.95, 24: 63.05, 25: 63.2, 26: 63.35, 27: 63.5, 28: 63.7, 29: 63.9, 30: 64.15, 31: 64.45, 32: 64.75, 33: 65.1, 34: 65.5, 35: 65.9, 36: 66.4, 37: 66.9, 38: 67.45, 39: 68.05, 40: 68.7, 41: 69.4, 42: 70.2, 43: 71.05, 44: 71.95, 45: 72.95 };
    const trRates721 = { 18: 1.98, 19: 2.04, 20: 2.09, 21: 2.16, 22: 2.24, 23: 2.33, 24: 2.43, 25: 2.56, 26: 2.7, 27: 2.87, 28: 3.06, 29: 3.28, 30: 3.53, 31: 3.81, 32: 4.12, 33: 4.46, 34: 4.84, 35: 5.25, 36: 5.7, 37: 6.19, 38: 6.72, 39: 7.29, 40: 7.91, 41: 8.59, 42: 9.3, 43: 10.07, 44: 10.91, 45: 11.81 };

    function calculateExactPremium() {
        const sa = parseInt(document.getElementById('sumAssured').value);
        const age = parseInt(document.getElementById('age').value);
        const hasAddb = document.getElementById('addbCheck').checked;
        const hasTr = document.getElementById('trCheck').checked;
        const addbSaIn = parseInt(document.getElementById('addbSaValue').value) || 0;
        const trSaIn = parseInt(document.getElementById('trSaValue').value) || 0;

        const tabular = baseRates721[age] || 0;
        const trTabular = trRates721[age] || 0;

        // BSMDT LOGIC
        let saRebate = (sa >= 500000) ? 3.0612 : 0;
        let basePrem = Math.round(Math.round((tabular - saRebate) * (sa / 1000)) * 0.98);

        let trPrem = 0;
        if (hasTr) {
            let trSaEffective = Math.min(trSaIn, sa, 2500000);
            trPrem = Math.round(Math.round((trTabular - 0.23) * (trSaEffective / 1000)) * 0.98);
        }

        let addbPrem = 0;
        if (hasAddb) {
            let addbSaEffective = Math.min(addbSaIn, sa, 10000000);
            addbPrem = Math.round(1.15 * (addbSaEffective / 1000));
        }

        return basePrem + trPrem + addbPrem;
    }

    function generateReport() {
        const sa = parseInt(document.getElementById('sumAssured').value);
        const age = parseInt(document.getElementById('age').value);
        const addbSa = parseInt(document.getElementById('addbSaValue').value) || 0;
        const trSa = parseInt(document.getElementById('trSaValue').value) || 0;
        const bonusRate = parseFloat(document.getElementById('bonusRate').value);
        const fabRate = parseFloat(document.getElementById('fabRate').value);
        const errorBox = document.getElementById('errorMsg');

        errorBox.style.display = "none";
        let errors = [];

        // VALIDATIONS
        if (isNaN(age) || age < 13 || age > 45) errors.push("⚠️ Entry Age must be 13 to 45 years.");
        if (isNaN(sa) || sa < 200000) errors.push("⚠️ Minimum Sum Assured is ₹2,00,000.");
        
        if (document.getElementById('addbCheck').checked) {
            if (addbSa > sa) errors.push("⚠️ AD&DB Sum Assured cannot exceed Basic Sum Assured.");
            if (addbSa > 10000000) errors.push("⚠️ AD&DB maximum limit is ₹1,00,00,000 (1 Crore).");
        }
        if (document.getElementById('trCheck').checked) {
            if (trSa > sa) errors.push("⚠️ Term Rider Sum Assured cannot exceed Basic Sum Assured.");
            if (trSa > 2500000) errors.push("⚠️ Term Rider maximum limit is ₹25,00,000.");
        }

        if (errors.length > 0) {
            errorBox.innerHTML = errors.join("<br>");
            errorBox.style.display = "block";
            return;
        }

        const premium = calculateExactPremium();
        document.getElementById('resultsPanel').style.display = 'block';
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        
        let flows = [];
        let totals = { out: 0, in: 0 };
        const annBase = Math.round((baseRates721[age] - 3.0612) * (sa / 1000));

        for (let i = 0; i <= 25; i++) {
            let yrOut = (i < 20) ? premium : 0;
            let sb = [5, 10, 15, 20].includes(i) ? sa * 0.15 : 0;
            let bonusAcc = (sa / 1000 * bonusRate * i);
            let fabAmt = (i === 25) ? (sa / 1000 * fabRate) : 0;
            let maturity = (i === 25) ? (sa * 0.40) + (sa / 1000 * bonusRate * 25) + fabAmt : 0;

            let dbA = (sa * 1.25) + bonusAcc + (i === 25 ? fabAmt : 0);
            let dbB = annBase * 7;
            let dbC = (premium * Math.min(i, 20)) * 1.05;
            let db = (i === 0) ? (sa * 1.25) : Math.max(dbA, dbB, dbC);

            let rowIn = sb + maturity;
            let net = rowIn - yrOut;
            flows.push({ amt: net, t: i });
            totals.out += yrOut; totals.in += rowIn;

            tbody.innerHTML += `<tr>
                <td>${i}</td>
                <td>${age + i}</td>
                <td class="row-outflow">${yrOut > 0 ? '₹' + yrOut.toLocaleString() : '-'}</td>
                <td class="row-inflow">${rowIn > 0 ? '₹' + Math.round(rowIn).toLocaleString() : '-'}</td>
                <td>${sb > 0 ? '₹' + sb.toLocaleString() : '-'}</td>
                <td>₹${Math.round(bonusAcc).toLocaleString()}</td>
                <td>${i === 25 ? '₹' + Math.round(fabAmt).toLocaleString() : '-'}</td>
                <td>-</td>
                <td style="color:blue;font-weight:700">₹${Math.round(db).toLocaleString()}</td>
                <td style="background:#f0f7ff;font-weight:700">${net >= 0 ? '+' : ''}₹${Math.round(net).toLocaleString()}</td>
            </tr>`;
        }

        document.getElementById('tableFoot').innerHTML = `<tr class="total-row">
            <td colspan="2">TOTAL</td>
            <td>₹${totals.out.toLocaleString()}</td>
            <td>₹${Math.round(totals.in).toLocaleString()}</td>
            <td colspan="5"></td>
            <td>₹${Math.round(totals.in - totals.out).toLocaleString()}</td>
        </tr>`;

        document.getElementById('assetVal').innerText = "₹" + Math.round(totals.in - totals.out).toLocaleString();
        
        let irr = 0.05;
        for (let j = 0; j < 60; j++) {
            let f = 0, df = 0;
            for (let flow of flows) {
                f += flow.amt / Math.pow(1 + irr, flow.t);
                df -= flow.t * flow.amt / Math.pow(1 + irr, flow.t + 1);
            }
            irr -= f / df;
        }
        document.getElementById('dispXIRR').innerText = (irr * 100).toFixed(2) + "%";
    }
</script>
</body>
</html>
