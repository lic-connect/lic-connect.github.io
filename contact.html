<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<!-- Add these inside your <head> tag -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <title>Contact Us</title>
  <style>
   /* === Root Variables for a Vibrant Green & Gold Theme === */
/* === Root Variables: Green & Gold Theme === */
:root {
    --primary-bg: #004d40;      /* Deep Forest Green */
    --accent-color: #ffd700;    /* Gold */
    --text-color: #ffffff;
    --input-bg: rgba(255, 255, 255, 0.1);
    --input-border: rgba(255, 215, 0, 0.4);
    --input-focus-border: var(--accent-color);
}

/* === General Body Styling === */
body {
    font-family: 'Poppins', sans-serif;
    background-color: var(--primary-bg);
    background-image: radial-gradient(circle at top right, #00695c, #002d26);
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow-x: hidden;
}

h1 {
    text-align: center;
    color: var(--accent-color);
    font-family: 'Poppins', sans-serif;
    font-size: 2.5rem;
    font-weight: 700;
    margin-bottom: 20px;
    text-transform: uppercase;
    letter-spacing: 2px;
    text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
}

/* === Main Form Container === */
form {
    width: 100%;
    max-width: 500px;
    background: linear-gradient(145deg, #005a4b, #003e2e);
    padding: 35px;
    border-radius: 20px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    border: 1px solid rgba(255, 215, 0, 0.2);
    box-sizing: border-box;
}

/* === ICON SYNC LOGIC (The Fix) === */
.input-wrapper {
    position: relative; /* This is the anchor for the icon */
    margin-bottom: 20px;
}

label {
    display: block;
    font-weight: 600;
    font-size: 0.9rem;
    color: var(--accent-color);
    margin-bottom: 8px;
    margin-left: 5px;
}

input, textarea {
    width: 100%;
    padding: 14px 14px 14px 45px !important; /* Extra left padding for the icon */
    border: 1px solid var(--input-border);
    border-radius: 10px;
    box-sizing: border-box;
    font-size: 1rem;
    background: var(--input-bg);
    color: var(--text-color);
    transition: all 0.3s ease;
    font-family: 'Poppins', sans-serif;
}

input:focus, textarea:focus {
    outline: none;
    border-color: var(--accent-color);
    background: rgba(255, 255, 255, 0.15);
    box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
}

/* Positioning the Icons */
.input-wrapper .icon {
    position: absolute;
    left: 15px;
    bottom: 14px; /* Perfectly aligned with the center of the input */
    color: var(--accent-color);
    font-size: 1.1rem;
    pointer-events: none; /* Makes sure you can click "through" the icon to type */
    transition: 0.3s;
}

/* Specific fix for Textarea Icon (move to top) */
.input-wrapper textarea ~ .icon {
    top: 50px; /* Aligns icon near the top for long messages */
    bottom: auto;
}

/* === Button Styling === */
button {
    margin-top: 10px;
    width: 100%;
    padding: 16px;
    font-size: 1.1rem;
    color: #004d40;
    background: var(--accent-color);
    border: none;
    border-radius: 10px;
    font-weight: 700;
    cursor: pointer;
    text-transform: uppercase;
    transition: 0.3s;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

button:hover {
    background: #fff;
    transform: translateY(-2px);
}

button:active {
    transform: scale(0.98);
}

/* ============================================================
   ANDROID & MOBILE REPAIRS
   ============================================================ */
@media (max-width: 768px) {
    body {
        padding: 15px !important;
    }

    form {
        padding: 25px 20px !important;
    }

    h1 {
        font-size: 1.8rem !important;
    }

    /* CRITICAL: Prevents Android auto-zoom and makes fields easy to tap */
    input, select, textarea, button {
        font-size: 16px !important;
        height: auto;
    }
}

/* === Form Footer Disclosure === */
.form-footer {
    margin-top: 25px;
    text-align: center;
    color: rgba(255, 255, 255, 0.7);
    font-size: 0.8rem;
    max-width: 500px;
    line-height: 1.5;
    padding: 0 10px;
}

.form-footer b {
    color: var(--accent-color);
    font-weight: 600;
}
  </style>
</head>
<body>
<h1>Contact PolicyAdvisor</h1>
  <form id="contactForm">

    <div class="input-wrapper">
      <label for="fullname">Full Name</label>
      <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required />
      <i class="icon fas fa-user"></i> <!-- Icon is now inside the wrapper -->
    </div>

    <div class="input-wrapper">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required />
      <i class="icon fas fa-envelope"></i>
    </div>

    <div class="input-wrapper">
      <label for="mobile">Mobile Number</label>
      <input type="tel" id="mobile" name="mobile" placeholder="10-digit number" required pattern="[0-9]{10}" />
      <i class="icon fas fa-phone"></i>
    </div>

    <div class="input-wrapper">
      <label for="message">Your Message</label>
      <textarea id="message" name="message" placeholder="How can we help?" required></textarea>
      <i class="icon fas fa-pen"></i>
    </div>

    <button type="submit">Send Message</button>
  </form>
<div class="form-footer">
    <p>
        <b>PolicyAdvisor</b> is an independent platform created by an authorized LIC Agent (Active since 2010). 
        This is not the official website of Life Insurance Corporation of India (LIC). 
        Your data is handled securely for insurance assistance purposes only.
    </p>
</div>
  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabaseUrl = 'https://efduqdondmlzmwhfgkfz.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVmZHVxZG9uZG1sem13aGZna2Z6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDg4MDcxNjUsImV4cCI6MjA2NDM4MzE2NX0.M-D0eUjlCxc-vZtT3LdbWJJgLDZ-ScHQkZH69kU6d44';
    const supabase = createClient(supabaseUrl, supabaseKey);

    const form = document.getElementById("contactForm");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const fullname = document.getElementById("fullname").value;
      const email = document.getElementById("email").value;
      const mobile = document.getElementById("mobile").value;
      const message = document.getElementById("message").value;

      const { data, error } = await supabase
        .from("contact")
        .insert([{ fullname, email, mobile, message }]);

      if (error) {
        alert("Error saving message: " + error.message);
      } else {
        alert("Message submitted successfully!");
        form.reset();
      }
    });
  </script>
</body>
</html>
