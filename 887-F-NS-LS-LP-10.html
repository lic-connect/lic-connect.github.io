        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #fce4ec; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .calc-card { background: white; width: 100%; max-width: 500px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; border-top: 6px solid var(--dark-pink); }
        .header { background: var(--lic-blue); color: white; padding: 20px; text-align: center; }
        .header h1 { margin: 0; font-size: 20px; letter-spacing: 1px; }
        .header p { margin: 5px 0 0; color: var(--lic-yellow); font-size: 13px; font-weight: bold; }
        .content { padding: 25px; }
        .badge-row { display: flex; gap: 5px; margin-bottom: 20px; flex-wrap: wrap; }
        .badge { background: #f8bbd0; color: #880e4f; padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; border: 1px solid #f48fb1; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; color: #333; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; outline: none; }
        input:focus { border-color: var(--lic-pink); }
        .check-card { display: flex; align-items: center; gap: 10px; background: #f9f9f9; padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #eee; cursor: pointer; }
        button { width: 100%; background: var(--lic-blue); color: white; border: none; padding: 16px; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #003d74; }
        #results { margin-top: 25px; display: none; background: #fffdf2; border: 1px solid #f0e68c; padding: 20px; border-radius: 10px; }
        .res-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f0f0f0; font-size: 15px; }
        .res-row.total { font-weight: 800; font-size: 22px; color: var(--lic-blue); border-bottom: none; margin-top: 10px; }
        .green { color: #27ae60; font-weight: bold; }
    </style>
</head>

    function calculate() {
        const age = parseInt(document.getElementById('age').value);
        const term = parseInt(document.getElementById('term').value);
        const sa = parseFloat(document.getElementById('sa').value);
        const modeFactor = parseFloat(document.getElementById('mode').value);
        const isOnline = document.getElementById('isOnline').checked;
        const isAB = document.getElementById('isAB').checked;

        if (sa < 20000000) { alert("Minimum Sum Assured is 2 Crore."); return; }

        const ageData = tabularRates.find(r => r.Age === age);
        if (!ageData || !ageData[`T${term}`]) {
            alert("No data found for this combination.");
            return;
        }

        const rate = ageData[`T${term}`];
        const tabAnnual = (sa / 1000) * rate;

        // High Sum Assured Rebate for Option I (Level Sum Assured)
        let hsaRate = 0;
        const saCr = sa / 10000000;
        if (saCr >= 5 && saCr < 10) hsaRate = 0.50;
        else if (saCr >= 10) hsaRate = 1.00;
        
        const hsaRebate = (tabAnnual * hsaRate) / 100;

        // Online Rebate (10% for LP-10)
        const onlineRebate = isOnline ? (tabAnnual * 0.10) : 0;

        // Accident Benefit (₹1 per 1000, capped at 1 Crore SA)
        let abPrem = 0;
        if (isAB) {
            const abSA = Math.min(sa, 10000000);
            abPrem = (abSA / 1000) * 0.50 * modeFactor;
        }

        const netAnnualBase = tabAnnual - hsaRebate - onlineRebate;
        const finalPremium = (netAnnualBase * modeFactor) + abPrem;

        // Update UI
        document.getElementById('results').style.display = 'block';
        document.getElementById('outTab').innerText = "₹ " + Math.round(tabAnnual).toLocaleString('en-IN');
        document.getElementById('outHSA').innerText = "- ₹ " + Math.round(hsaRebate).toLocaleString('en-IN');
        document.getElementById('outOnline').innerText = "- ₹ " + Math.round(onlineRebate).toLocaleString('en-IN');
        document.getElementById('outAB').innerText = "₹ " + Math.round(abPrem).toLocaleString('en-IN');
        
        const modeTexts = {"1": "Yearly", "0.51": "Half-Yearly", "0.26": "Quarterly", "0.0861": "Monthly"};
        document.getElementById('modeLbl').innerText = modeTexts[modeFactor] + " Premium:";
        document.getElementById('outTotal').innerText = "₹ " + Math.round(finalPremium).toLocaleString('en-IN');
    }
