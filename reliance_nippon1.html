<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Fonts & Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Raleway:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Palette - NO BLACK */
            --rnl-red: #E31837;
            --deep-wine: #2b0a1a;
            --night-blue: #0a0e29;
            --gold: #FFD700;
            --bg-grad: linear-gradient(135deg, #4a0000 0%, #1a0b2e 50%, #001f3f 100%);
            --card-glass: rgba(255, 255, 255, 0.1);
            --border-glow: 1px solid rgba(255, 255, 255, 0.3);
            
            /* Category Colors */
            --term-color: #ff3366;
            --save-color: #3366ff;
            --ulip-color: #00ffcc;
            --pen-color: #ffcc00;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Raleway', sans-serif;
            background: var(--bg-grad);
            background-size: 400% 400%;
            animation: royalFlow 20s ease infinite;
            min-height: 100vh;
            color: #fff;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        @keyframes royalFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating Particles */
        .particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(rgba(255,255,255,0.2) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: drift 60s linear infinite;
            z-index: 0;
            pointer-events: none;
        }
        @keyframes drift { from { transform: translateY(0); } to { transform: translateY(-1000px); } }

        header {
            text-align: center;
            margin-bottom: 60px;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 3.5rem;
            color: var(--gold);
            text-transform: uppercase;
            text-shadow: 0 0 25px rgba(227, 24, 55, 0.8);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 1.2rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: rgba(255,255,255,0.1);
            padding: 8px 30px;
            border-radius: 50px;
            border: 1px solid var(--gold);
            display: inline-block;
            backdrop-filter: blur(5px);
        }

        /* GRID */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 50px;
            max-width: 1900px;
            margin: 0 auto;
            perspective: 2000px;
            z-index: 2;
            position: relative;
        }

        /* CARD */
        .card {
            height: 780px;
            position: relative;
            cursor: pointer;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(60, 0, 20, 0.6);
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        /* FACES */
        .front, .back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 25px;
            overflow: hidden;
            border: var(--border-glow);
            display: flex;
            flex-direction: column;
        }

        /* FRONT DESIGN */
        .front {
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            z-index: 2;
            transform: rotateY(0deg);
            background: var(--card-glass);
            backdrop-filter: blur(15px);
        }

        /* Gradient Borders */
        .front::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 25px;
            padding: 2px;
            background: linear-gradient(45deg, var(--rnl-red), var(--gold));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
        }

        .icon-box {
            font-size: 4rem;
            margin-bottom: 25px;
            color: #fff;
            filter: drop-shadow(0 0 15px rgba(255,255,255,0.5));
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float { 0%,100% {transform: translateY(0);} 50% {transform: translateY(-15px);} }

        .plan-name {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 1.5rem;
            margin-bottom: 10px;
            line-height: 1.3;
            color: #fff;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
            border-bottom: 2px solid var(--gold);
            padding-bottom: 10px;
            width: 80%;
        }

        .cat-badge {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: rgba(255,255,255,0.1);
            padding: 5px 15px;
            border-radius: 20px;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .click-hint {
            padding: 12px 35px;
            background: linear-gradient(45deg, var(--rnl-red), #990000);
            color: #fff;
            border-radius: 30px;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.8rem;
            transition: 0.3s;
            box-shadow: 0 0 15px var(--rnl-red);
            border: 1px solid var(--gold);
        }
        .card:hover .click-hint { transform: scale(1.1); box-shadow: 0 0 25px var(--gold); }

        /* BACK DESIGN */
        .back {
            transform: rotateY(180deg);
            background: #1a0525; /* Deep Violet - No Black */
            padding: 20px;
        }

        .back-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .back-title { color: var(--gold); font-family: 'Cinzel Decorative', cursive; font-size: 1rem; }

        .data-list {
            flex-grow: 1;
            overflow-y: auto;
            text-align: left;
            padding-right: 8px;
        }

        /* Custom Scrollbar */
        .data-list::-webkit-scrollbar { width: 6px; }
        .data-list::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }
        .data-list::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }

        .data-row {
            margin-bottom: 10px;
            border-bottom: 1px dashed rgba(255,255,255,0.1);
            padding-bottom: 5px;
        }

        .label {
            display: block;
            font-size: 0.7rem;
            color: var(--rnl-red);
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 3px;
        }

        .value {
            font-size: 0.9rem;
            color: #fff;
            font-weight: 500;
            line-height: 1.4;
        }

        .usp-box {
            background: rgba(255, 255, 255, 0.05);
            border-left: 3px solid var(--gold);
            padding: 15px;
            margin-top: 20px;
            border-radius: 0 10px 10px 0;
        }

        .usp-text {
            font-size: 0.85rem;
            line-height: 1.7;
            color: #e0e0e0;
            text-align: justify;
        }
        
        .usp-label {
            display: block;
            color: var(--gold);
            font-family: 'Cinzel Decorative', cursive;
            margin-bottom: 8px;
            font-size: 1rem;
        }

        /* Category Specific Glows */
        .cat-Protect .icon-box { color: var(--term-color); filter: drop-shadow(0 0 10px var(--term-color)); }
        .cat-Savings .icon-box { color: var(--save-color); filter: drop-shadow(0 0 10px var(--save-color)); }
        .cat-ULIP .icon-box { color: var(--ulip-color); filter: drop-shadow(0 0 10px var(--ulip-color)); }
        .cat-Pension .icon-box { color: var(--pen-color); filter: drop-shadow(0 0 10px var(--pen-color)); }

        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .grid-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
