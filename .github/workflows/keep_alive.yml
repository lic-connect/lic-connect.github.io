name: Keep Supabase Awake
on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch: 

jobs:
  ping_supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Poke Supabase API
        run: |
          curl -X GET "https://efduqdondmlzmwhfgkfz.supabase.co/rest/v1/" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
