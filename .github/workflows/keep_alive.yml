name: Keep Supabase Awake
on:
  schedule:
    - cron: '0 */4 * * *' # Runs every 4 hours
  workflow_dispatch: 

jobs:
  ping_supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Poke Supabase API
        run: |
          # We add "/?select=*" to the end of the URL to ensure it queries the database
          curl -X GET "https://efduqdondmlzmwhfgkfz.supabase.co/rest/v1/?select=*" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
