<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LIC Agent Commission Master</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --primary-color: #004d40;
            --secondary-color: #00796b;
            --accent-color: #ffd700;
            --text-color: #ffffff;
            --card-bg: rgba(0, 0, 0, 0.25);
            --card-border: rgba(255, 255, 255, 0.3);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--primary-color);
            background-image: radial-gradient(circle at top right, var(--secondary-color), var(--primary-color));
            margin: 0; padding: 40px 20px; color: var(--text-color); min-height: 100vh;
        }

        .container { max-width: 1100px; margin: auto; }
        h1 { text-align: center; font-family: 'Montserrat', sans-serif; color: var(--accent-color); font-size: 2.8rem; margin-bottom: 40px; text-shadow: 0 4px 10px rgba(0,0,0,0.5); text-transform: uppercase; }

        .calculator-body { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 30px; }

        .panel {
            background: var(--card-bg); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            padding: 40px; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            border: 1px solid var(--card-border);
        }

        .panel h2 { font-family: 'Montserrat', sans-serif; margin-top: 0; color: #fff; border-bottom: 2px solid var(--accent-color); padding-bottom: 10px; margin-bottom: 30px; font-size: 1.6rem; }

        .form-group { margin-bottom: 22px; text-align: left; }
        label { font-weight: 600; color: rgba(255, 255, 255, 0.9); display: block; margin-bottom: 8px; font-size: 0.95rem; }
        
        input, select { 
            width: 100%; padding: 15px; border-radius: 12px; border: 1px solid var(--card-border); 
            background: rgba(0,0,0,0.3); color: #fff; font-size: 1rem; box-sizing: border-box; 
            transition: all 0.3s ease;
        }
        input:focus, select:focus { outline: none; border-color: var(--accent-color); box-shadow: 0 0 15px var(--accent-color); background: rgba(0,0,0,0.5); }
        input[readonly] { background: rgba(255, 255, 255, 0.1); color: #ccc; cursor: not-allowed; }

        .btn-container { display: flex; gap: 15px; margin-top: 30px; }
        .btn { flex: 1; padding: 18px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 1.1rem; text-transform: uppercase; }
        #calc-btn { background: var(--accent-color); color: #004d40; box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3); }
        #reset-btn { background: rgba(255, 255, 255, 0.2); color: #fff; }
        .btn:hover { transform: translateY(-3px); opacity: 0.95; box-shadow: 0 6px 20px rgba(0,0,0,0.4); }

        table { width: 100%; border-collapse: collapse; margin-top: 25px; }
        th, td { padding: 18px; text-align: center; border-bottom: 1px solid var(--card-border); }
        th { font-size: 0.85rem; color: rgba(255, 255, 255, 0.6); text-transform: uppercase; letter-spacing: 1.5px; }
        td { font-size: 1.8rem; font-weight: bold; color: var(--accent-color); text-shadow: 0 2px 4px rgba(0,0,0,0.3); }

        .error-msg { color: #ff8a80; background: rgba(211, 47, 47, 0.2); padding: 15px; border-radius: 10px; margin-top: 20px; display: none; text-align: center; font-weight: bold; border: 1px solid #ff8a80; }
        .hidden { display: none; }

        .home-button-container { position: fixed; top: 20px; right: 25px; z-index: 1000; }
        .home-button-container img { width: 55px; height: 55px; box-shadow: 0 5px 15px rgba(0,0,0,0.4); border-radius: 50%; transition: 0.3s; }
        .home-button-container img:hover { transform: scale(1.15); }


@media (max-width: 768px) {
    /* 1. Reset Body: Allow vertical flow only */
    body {
        padding: 10px !important;
        overflow-x: hidden !important;
        width: 100vw !important;
    }

    /* 2. Fix Containers: Remove fixed widths (like 400px or 1200px) */
    .container, .portal-container, .calc-wrapper, .input-panel, .panel, .container-gatekeeper {
        width: 100% !important;
        max-width: 100% !important;
        margin: 0 auto !important;
        padding: 15px !important;
        box-sizing: border-box !important;
        border-radius: 10px !important;
    }

    /* 3. Scale Headers: Make titles fit on one line */
    h1 {
        font-size: 1.8rem !important;
        line-height: 1.2 !important;
        margin-bottom: 15px !important;
    }
    
    .header p {
        font-size: 11px !important;
    }

    /* 4. Force Single Column: Fix grids for mobile */
    .plan-grid, .form-grid, .results-grid, .calc-wrapper, .split-screen, .form-grid-887 {
        display: flex !important;
        flex-direction: column !important;
        grid-template-columns: 1fr !important;
        gap: 15px !important;
    }

    /* 5. Android Input Fix: Big enough to tap, no auto-zoom */
    input, select, textarea, button {
        font-size: 16px !important; /* CRITICAL FOR ANDROID */
        width: 100% !important;
        height: auto !important;
        padding: 12px !important;
        box-sizing: border-box !important;
    }

    /* 6. Fix Card Images: Don't let images crush the layout */
    .card-image {
        height: 120px !important;
    }
    
    .card-icon {
        top: 80px !important;
        width: 60px !important;
        height: 60px !important;
    }

    /* 7. Results Section: Make tables and flexboxes stack */
    .res-line, .result-item {
        flex-direction: row !important;
        justify-content: space-between !important;
        font-size: 14px !important;
    }
    
    .total-val, .total-amt {
        font-size: 24px !important;
    }

    /* 8. Home/Back Button: Move it to stay reachable but not in the way */
    .home-button-container {
        top: 10px !important;
        right: 10px !important;
    }
    
    .home-button-container img {
        width: 35px !important;
        height: 35px !important;
    }
}

/* Smooth Tap Feedback for Touchscreens */
button:active, .plan-card:active {
    transform: scale(0.98);
    filter: brightness(0.9);
}



    </style>
</head>
<body>

<div class="home-button-container">
    <a href="/main.html"><img src="images/home-icon.png" alt="Home"></a>
</div>

<div class="container">
    <h1><i class="fas fa-hand-holding-usd"></i> LIC Commission Master</h1>
    <div class="calculator-body">
        
        <!-- PANEL: INPUTS -->
        <div class="panel">
            <h2><i class="fas fa-sliders-h"></i> Policy Details</h2>
            <div class="form-group">
                <label>Select Insurance Plan:</label>
                <select id="plan-select" onchange="setupPlanLogic()"><option value="">-- Select Plan --</option></select>
            </div>
            <div class="form-group">
                <label>Plan Number:</label>
                <input type="text" id="plan-no" readonly>
            </div>
            <div class="form-group" id="term-container">
                <label id="term-label">Policy Term (Years):</label>
                <input type="number" id="policy-term" placeholder="Enter Years" oninput="updatePPT()">
                <select id="term-dropdown" class="hidden" onchange="updatePPT()"></select>
            </div>
            <div class="form-group">
                <label>Premium Paying Term (PPT):</label>
                <input type="number" id="ppt" readonly>
            </div>
            <div class="form-group">
                <label>Premium (Excluding GST):</label>
                <input type="number" id="premium" placeholder="Enter amount paid">
            </div>
            <div class="form-group">
                <label>Payment Mode:</label>
                <select id="mode">
                    <option value="1">Yearly (YLY)</option>
                    <option value="2">Half-Yearly (HLY)</option>
                    <option value="4">Quarterly (QLY)</option>
                    <option value="12">Monthly (NACH/SSS)</option>
                </select>
            </div>
            <div class="btn-container">
                <button class="btn" id="calc-btn" onclick="runCalculation()">Calculate</button>
                <button class="btn" id="reset-btn" onclick="location.reload()">Clear</button>
            </div>
            <div id="error-box" class="error-msg"></div>
        </div>

        <!-- PANEL: OUTPUTS -->
        <div class="panel">
            <h2><i class="fas fa-coins"></i> Commission Result</h2>
            <table>
                <thead>
                    <tr><th>Year 1</th><th>Year 2</th><th>Year 3</th><th>Year 4+</th></tr>
                </thead>
                <tbody>
                    <tr><td id="y1">-</td><td id="y2">-</td><td id="y3">-</td><td id="y4">-</td></tr>
                </tbody>
            </table>
            <div style="margin-top: 30px; padding: 20px; background: rgba(255,255,255,0.05); border-radius: 15px;">
                <p style="font-size: 0.9rem; color: var(--accent-color); font-weight: 600; margin-bottom: 5px;"><i class="fas fa-info-circle"></i> Important Note:</p>
                <p style="font-size: 0.85rem; color: #ddd; line-height: 1.6;">Calculations shown are estimated basic commissions. Bonus commission (if applicable) and TDS deductions are not included here.</p>
            </div>
        </div>

    </div>
</div>

<script>
const db = {
    '714': { name: "New Endowment (714)", type: 'END', rule: 'T=P', min: 12, max: 35 },
    '715': { name: "New Jeevan Anand (715)", type: 'END', rule: 'T=P', min: 15, max: 35 },
    '717': { name: "Single Prem. Endowment (717)", type: 'SP', rule: 'SP', min: 10, max: 25 },
    '720': { name: "20 Year Money Back (720)", type: 'MB', rule: 'FIX', fT: 20, fP: 15 },
    '721': { name: "25 Year Money Back (721)", type: 'MB', rule: 'FIX', fT: 25, fP: 20 },
    '732': { name: "Children Money Back (732)", type: 'END', rule: 'T=P', min: 13, max: 25 },
    '733': { name: "Jeevan Lakshya (733)", type: 'END', rule: 'T-3', min: 13, max: 25 },
    '734': { name: "Jeevan Tarun (734)", type: 'END', rule: 'T=P', min: 13, max: 25 },
    '736': { name: "Jeevan Labh (736)", type: 'END', rule: 'MAP', map: {16:10, 21:15, 25:16} },
    '745': { name: "Jeevan Umang (745)", type: 'END', rule: 'T=P', min: 15, max: 30 },
    '748': { name: "Bima Shree (748)", type: 'MB', rule: 'MAP', map: {14:10, 16:12, 18:14, 20:16, 24:20, 28:24} },
    '751': { name: "Micro Bachat (751)", type: 'MICRO', rule: 'T=P', min: 10, max: 15 },
    '758': { name: "New Jeevan Shanti (758)", type: 'SP', rule: 'SP', min: 1, max: 12 },
    '760': { name: "Bima Jyoti (760)", type: 'END', rule: 'MAP', map: {15:10, 16:11, 17:12, 18:13, 19:14, 20:15} },
    '764': { name: "Bima Ratna (764)", type: 'END', rule: 'MAP', map: {15:11, 20:16, 25:21} },
    '768': { name: "Jeevan Azad (768)", type: 'END', rule: 'MAP', map: {15:7, 16:8, 17:9, 18:10, 19:11, 20:12} },
    '771': { name: "Jeevan Utsav (771)", type: 'END', rule: 'T=P', min: 5, max: 16 },
    '774': { name: "Amritbaal (774)", type: 'END', rule: 'T=P', min: 10, max: 25 },
    '857': { name: "Jeevan Akshay VII (857)", type: 'SP', rule: 'SP', min: 1, max: 1 },
    '859': { name: "Saral Jeevan Bima (859)", type: 'TERM', rule: 'T=P', min: 5, max: 40 },
    '862': { name: "Saral Pension (862)", type: 'SP', rule: 'SP', min: 1, max: 1 },
    '875': { name: "Yuva Term (875)", type: 'TERM', rule: 'T=P', min: 15, max: 40 },
    '877': { name: "Yuva Credit Life (877)", type: 'TERM', rule: 'T=P', min: 5, max: 30 },
    '879': { name: "Smart Pension (879)", type: 'SP', rule: 'SP', min: 1, max: 1 },
    '880': { name: "Jan Suraksha (880)", type: 'MICRO', rule: 'T-5', min: 12, max: 20 },
    '881': { name: "Bima Lakshmi (881)", type: 'LAKSHMI', rule: 'MANUAL', min: 25, max: 25 },
    '887': { name: "Bima Kavach (887)", type: 'TERM', rule: 'MANUAL', min: 10, max: 82 },
    '911': { name: "Nav Jeevan Shree Single (911)", type: 'SP', rule: 'SP', min: 5, max: 20 },
    '912': { name: "Nav Jeevan Shree Regular (912)", type: 'END', rule: 'MAP', map: {10:6, 12:8, 15:10, 20:12} },
    '955': { name: "New Jeevan Amar (955)", type: 'TERM', rule: 'T=P', min: 10, max: 40 }
};

const planSelect = document.getElementById('plan-select');
const termInp = document.getElementById('policy-term');
const termSel = document.getElementById('term-dropdown');
const pptInp = document.getElementById('ppt');
const modeSel = document.getElementById('mode');

// Sort and Populate Dropdown
Object.keys(db).sort().forEach(id => {
    let el = document.createElement('option');
    el.value = id; el.text = db[id].name;
    planSelect.add(el);
});

function setupPlanLogic() {
    const plan = db[planSelect.value];
    if(!plan) return;
    
    document.getElementById('plan-no').value = planSelect.value;
    modeSel.disabled = (plan.type === 'SP');
    if(plan.type === 'SP') modeSel.value = "1";

    termInp.classList.remove('hidden'); termSel.classList.add('hidden');
    termInp.readOnly = false; pptInp.readOnly = true;

    if(plan.rule === 'MAP') {
        termInp.classList.add('hidden'); termSel.classList.remove('hidden');
        termSel.innerHTML = '<option value="">-- Select --</option>';
        Object.keys(plan.map).forEach(t => {
            let o = document.createElement('option'); o.value = t; o.text = t; termSel.add(o);
        });
    } else if(plan.rule === 'FIX') {
        termInp.value = plan.fT; termInp.readOnly = true; pptInp.value = plan.fP;
    } else if(plan.rule === 'SP') {
        pptInp.value = 1;
    } else if(plan.rule === 'MANUAL') {
        termInp.value = plan.min; termInp.readOnly = true;
        pptInp.readOnly = false; pptInp.placeholder = "Enter 7-15"; pptInp.value = "";
    }
}

function updatePPT() {
    const plan = db[planSelect.value];
    if(!plan) return;
    const t = parseInt(plan.rule === 'MAP' ? termSel.value : termInp.value);
    if(!t) return;

    if(plan.rule === 'T=P') pptInp.value = t;
    if(plan.rule === 'T-3') pptInp.value = t - 3;
    if(plan.rule === 'T-5') pptInp.value = t - 5;
    if(plan.rule === 'MAP') pptInp.value = plan.map[t];
}

function runCalculation() {
    const id = planSelect.value;
    const premium = parseFloat(document.getElementById('premium').value);
    const mode = parseInt(modeSel.value);
    const ppt = parseInt(pptInp.value);
    const errorBox = document.getElementById('error-box');
    
    errorBox.style.display = 'none';
    if(!id || !premium || isNaN(ppt)) { alert("Error: Please fill all fields."); return; }

    const plan = db[id];
    const annualized = (plan.type === 'SP') ? premium : premium * mode;
    let rates = { y1: 25, y2: 7.5, y3: 7.5, y4: 5 };

    if (plan.type === 'SP') {
        rates = { y1: 2, y2: 0, y3: 0, y4: 0 };
 } else if (plan.type === 'TERM') {
        if (ppt === 1) { 
            rates = { y1: 2, y2: 0, y3: 0, y4: 0 }; // Single Premium rate
        } else {
            rates = { y1: 7.5, y2: 2, y3: 2, y4: 2 }; // Regular/Limited Pay rate
        }
    } else if (plan.type === 'MICRO') {
        rates = { y1: 10, y2: 5, y3: 5, y4: 5 };
    } else if (plan.type === 'MB') {
        rates = { y1: 15, y2: 10, y3: 10, y4: 6 };
    } else if (plan.type === 'LAKSHMI') {
        if (ppt >= 15) rates = { y1: 25, y2: 7.5, y3: 7.5, y4: 5 };
        else if (ppt >= 10) rates = { y1: 20, y2: 7.5, y3: 7.5, y4: 5 };
        else rates = { y1: 15, y2: 5, y3: 5, y4: 5 };
    } else {
        // Generic Endowment Logic based on PPT
        if (ppt < 10) rates = { y1: 10, y2: 5, y3: 5, y4: 5 };
        else if (ppt < 15) rates = { y1: 20, y2: 7.5, y3: 7.5, y4: 5 };
    }

    const format = (v) => "₹ " + Math.round(v).toLocaleString('en-IN');
    document.getElementById('y1').innerText = format(annualized * rates.y1 / 100);
    document.getElementById('y2').innerText = (ppt >= 2) ? format(annualized * rates.y2 / 100) : "₹ 0";
    document.getElementById('y3').innerText = (ppt >= 3) ? format(annualized * rates.y3 / 100) : "₹ 0";
    document.getElementById('y4').innerText = (ppt >= 4) ? format(annualized * rates.y4 / 100) : "₹ 0";
}
</script>
</body>

</html>
