<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIC Bima Ratna 864 Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --violet-primary: #6a1b9a;
            --violet-dark: #4a148c;
            --violet-light: #9c4dcc;
            --black: #121212;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background: radial-gradient(circle at center, #2e004d 0%, #000000 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
            perspective: 2000px;
            color: var(--white);
        }

        /* 3D Box Container */
        .calculator-3d-wrapper {
            position: relative;
            width: 100%;
            max-width: 950px;
            transform-style: preserve-3d;
            transform: rotateX(5deg);
            /* Mirror Reflection Effect */
            -webkit-box-reflect: below 5px linear-gradient(transparent, transparent, rgba(255,255,255,0.1));
        }

        .main-box {
            background: linear-gradient(145deg, #1f1f1f, #121212);
            border: 2px solid var(--violet-primary);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 0 50px rgba(106, 27, 154, 0.4);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 4px solid var(--violet-primary);
            padding-bottom: 15px;
        }

        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(to right, #fff, var(--violet-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .input-group {
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 11px;
            font-weight: 700;
            color: var(--violet-light);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-group i {
            position: absolute;
            right: 15px;
            top: 40px;
            color: var(--violet-primary);
        }

        input, select {
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(106, 27, 154, 0.3);
            border-radius: 12px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        input:focus, select:focus {
            border-color: var(--violet-light);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 15px rgba(156, 77, 204, 0.2);
        }

        /* Toggle Section */
        .benefit-toggle {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            margin: 30px 0;
            gap: 20px;
            align-items: center;
        }

        .switch-container {
            width: 380px;
            height: 50px;
            background: var(--black);
            border-radius: 25px;
            position: relative;
            cursor: pointer;
            border: 1px solid var(--violet-primary);
            display: flex;
        }

        .switch-btn {
            flex: 1;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 12px;
            color: #777;
            transition: 0.3s;
        }

        .switch-btn.active { color: white; }

        .slider {
            position: absolute;
            left: 5px;
            top: 5px;
            width: 180px;
            height: 40px;
            background: var(--violet-primary);
            border-radius: 20px;
            transition: 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1;
        }

        .calc-btn {
            grid-column: 1 / -1;
            background: linear-gradient(45deg, var(--violet-dark), var(--violet-primary));
            color: white;
            border: none;
            padding: 20px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.4s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            margin-top: 10px;
        }

        .calc-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(106, 27, 154, 0.5);
        }

        /* Result Area */
        #results {
            margin-top: 40px;
            display: none;
            padding: 30px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            border-left: 5px solid var(--violet-light);
            animation: slideUp 0.6s ease;
        }

        .res-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .res-row.total { background: var(--violet-dark); border-radius: 8px; padding: 15px; margin-top: 15px; font-weight: 800; color: #fff; }
        .res-val { color: var(--violet-light); font-weight: 700; }

        .formula {
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 8px;
            font-size: 11px;
            color: #aaa;
            margin-top: 20px;
            font-style: italic;
            text-align: center;
        }

        .error-msg {
            color: #ff5252;
            font-size: 11px;
            font-weight: 600;
            margin-top: 5px;
            display: none;
        }

        .btn-group { display: flex; gap: 15px; margin-top: 30px; }
        .btn-f { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--violet-primary); background: transparent; color: white; cursor: pointer; font-weight: 700; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-f:hover { background: var(--violet-primary); }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="calculator-3d-wrapper">
    <div class="main-box">
        <div class="header">
            <h1>LIC PLAN 864 - BIMA RATNA</h1>
            <p style="font-size: 12px; opacity: 0.6;">MATURITY & SURVIVAL CALCULATOR</p>
        </div>

        <div class="input-grid">
            <div class="input-group">
                <label>Policy Holder Name</label>
                <input type="text" id="name" placeholder="Enter Name">
                <i class="fas fa-user"></i>
            </div>

            <div class="input-group">
                <label>Age at Entry (Yrs)</label>
                <input type="number" id="age" value="30">
                <i class="fas fa-id-card"></i>
                <span id="age-err" class="error-msg"></span>
            </div>

            <div class="input-group">
                <label>Sum Assured (Min 5,00,000)</label>
                <input type="number" id="sa" value="500000" step="25000">
                <i class="fas fa-shield-alt"></i>
                <span id="sa-err" class="error-msg"></span>
            </div>

            <div class="input-group">
                <label>Policy Term</label>
                <select id="term" onchange="syncPPT()">
                    <option value="15">15 Years</option>
                    <option value="20">20 Years</option>
                    <option value="25">25 Years</option>
                </select>
                <i class="fas fa-clock"></i>
            </div>

            <div class="input-group">
                <label>Premium Paying Term (PPT)</label>
                <input type="number" id="ppt" readonly value="11">
                <i class="fas fa-hourglass-half"></i>
            </div>

            <div class="input-group">
                <label>Mode of Premium</label>
                <select id="mode">
                    <option value="1">Yearly</option>
                    <option value="0.51">Half-Yearly</option>
                    <option value="0.26">Quarterly</option>
                    <option value="0.089">Monthly</option>
                </select>
                <i class="fas fa-wallet"></i>
            </div>

            <div class="input-group">
                <label>Instalment Premium (Entered)</label>
                <input type="number" id="premium" value="50000">
                <i class="fas fa-money-bill-wave"></i>
            </div>

            <div class="input-group">
                <label>GA Rate (1st 5 Yrs)</label>
                <input type="number" id="ga_rate" value="50" step="1">
                <i class="fas fa-percentage"></i>
            </div>

            <div class="benefit-toggle">
                <div class="switch-container" onclick="handleToggle()">
                    <div id="slider" class="slider"></div>
                    <div id="btn-surv" class="switch-btn active">SURVIVAL BENEFIT</div>
                    <div id="btn-death" class="switch-btn">DEATH BENEFIT</div>
                </div>
            </div>

            <div class="input-group" id="death_ui" style="display:none; grid-column: 1 / -1;">
                <label>Policy Year of Death</label>
                <input type="number" id="death_yr" value="10">
                <i class="fas fa-calendar-times"></i>
            </div>

            <button class="calc-btn" onclick="calculate()">
                <i class="fas fa-calculator"></i> Calculate Benefits
            </button>
        </div>

        <div id="results">
            <div id="res-content"></div>
            <div class="btn-group">
                <button class="btn-f" onclick="window.print()"><i class="fas fa-print"></i> Print PDF</button>
                <button class="btn-f" onclick="alert('Ready to Share')"><i class="fas fa-share-alt"></i> Share PDF</button>
            </div>
        </div>
    </div>
</div>

<script>
    function syncPPT() {
        const term = parseInt(document.getElementById('term').value);
        const pptMap = { 15: 11, 20: 16, 25: 21 };
        document.getElementById('ppt').value = pptMap[term];
    }

    let isDeath = false;
    function handleToggle() {
        isDeath = !isDeath;
        const slider = document.getElementById('slider');
        const deathUI = document.getElementById('death_ui');
        const btnSurv = document.getElementById('btn-surv');
        const btnDeath = document.getElementById('btn-death');

        if(isDeath) {
            slider.style.left = '195px';
            deathUI.style.display = 'block';
            btnDeath.classList.add('active');
            btnSurv.classList.remove('active');
        } else {
            slider.style.left = '5px';
            deathUI.style.display = 'none';
            btnSurv.classList.add('active');
            btnDeath.classList.remove('active');
        }
    }

    function calculate() {
        const name = document.getElementById('name').value || "Valued Client";
        const age = parseInt(document.getElementById('age').value);
        const sa = parseFloat(document.getElementById('sa').value);
        const term = parseInt(document.getElementById('term').value);
        const ppt = parseInt(document.getElementById('ppt').value);
        const premium = parseFloat(document.getElementById('premium').value);
        const deathYr = parseInt(document.getElementById('death_yr').value);

        // Validations
        let valid = true;
        const saErr = document.getElementById('sa-err');
        const ageErr = document.getElementById('age-err');

        if(sa < 500000 || sa % 25000 !== 0) {
            saErr.innerText = "Min SA is 5,00,000 (Multiples of 25k)";
            saErr.style.display = "block";
            valid = false;
        } else saErr.style.display = "none";

        const maxAgeMap = { 15: 55, 20: 50, 25: 45 };
        if(age > maxAgeMap[term]) {
            ageErr.innerText = `Max age for ${term} yr term is ${maxAgeMap[term]}`;
            ageErr.style.display = "block";
            valid = false;
        } else ageErr.style.display = "none";

        if(age + term > 70) {
            alert("Max Maturity Age is 70 years");
            valid = false;
        }

        if(!valid) return;

        // Guaranteed Addition Calculation (Based on PDF Page 3)
        function calcGA(years) {
            let total = 0;
            for(let i = 1; i <= years; i++) {
                if(i <= 5) total += (sa/1000 * 50);
                else if(i <= 10) total += (sa/1000 * 55);
                else total += (sa/1000 * 60);
            }
            return total;
        }

        let html = `<h3>Plan 864 Report: ${name}</h3><br>`;

        if(!isDeath) {
            const survivalPayment = 0.25 * sa; // Money Back 25% SA twice
            const accruedGA = calcGA(term);
            const maturitySA = 0.50 * sa; // Maturity is 50% SA
            const finalPayable = maturitySA + accruedGA;

            html += `
                <div class="res-row"><span>Basic Sum Assured:</span><span class="res-val">₹ ${sa.toLocaleString()}</span></div>
                <div class="res-row"><span>Survival Benefits (Money Back):</span><span class="res-val">₹ ${(survivalPayment * 2).toLocaleString()}</span></div>
                <div class="res-row" style="font-size: 11px; opacity: 0.6;">(25% SA at End of Yrs: ${term==15?'13,14':term==20?'18,19':'23,24'})</div>
                <div class="res-row"><span>Sum Assured on Maturity (50%):</span><span class="res-val">₹ ${maturitySA.toLocaleString()}</span></div>
                <div class="res-row"><span>Total Accrued Guaranteed Additions:</span><span class="res-val">₹ ${accruedGA.toLocaleString()}</span></div>
                <div class="res-row"><span>Total Premium Paid (Approx):</span><span class="res-val">₹ ${(premium * ppt).toLocaleString()}</span></div>
                <div class="res-row total"><span>FINAL MATURITY BENEFIT:</span><span class="res-val">₹ ${finalPayable.toLocaleString()}</span></div>
                <div class="formula">Formula: (Sum Assured on Maturity [50% of SA]) + Accrued GA</div>
            `;
        } else {
            const deathGA = calcGA(deathYr);
            const saOnDeath = Math.max(1.25 * sa, 7 * premium);
            const totalPaid = premium * Math.min(deathYr, ppt);
            const minBenefit = 1.05 * totalPaid;
            const finalDeath = Math.max(saOnDeath, minBenefit) + deathGA;

            html += `
                <div class="res-row"><span>Basic Sum Assured:</span><span class="res-val">₹ ${sa.toLocaleString()}</span></div>
                <div class="res-row"><span>Sum Assured on Death (125% SA):</span><span class="res-val">₹ ${saOnDeath.toLocaleString()}</span></div>
                <div class="res-row"><span>Accrued GA till Year ${deathYr}:</span><span class="res-val">₹ ${deathGA.toLocaleString()}</span></div>
                <div class="res-row"><span>Total Premiums Paid till death:</span><span class="res-val">₹ ${totalPaid.toLocaleString()}</span></div>
                <div class="res-row total"><span>FINAL DEATH BENEFIT:</span><span class="res-val">₹ ${finalDeath.toLocaleString()}</span></div>
                <div class="formula">Formula: Higher of (125% SA or 7x Annual Premium or 105% Premiums Paid) + Accrued GA till death</div>
            `;
        }

        document.getElementById('res-content').innerHTML = html;
        document.getElementById('results').style.display = 'block';
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    // Initialize PPT sync on load
    syncPPT();
</script>

</body>
</html>
