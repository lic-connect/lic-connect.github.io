<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIC Bima Jyoti (760) IRR Precision Report</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-purple: #6f42c1;
            --primary-dark: #4b2c85;
            --success-green: #2e7d32;
            --white: #ffffff;
            --black: #000000;
            --bg-light: #f4f0fa;
            --shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-light);
            color: var(--black);
            margin: 0;
            padding: 20px;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        .header {
            background: linear-gradient(135deg, var(--primary-purple) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
        }
        .header h1 { margin: 0; font-size: 2.5em; text-transform: uppercase; letter-spacing: 2px; }

        .main-grid {
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 30px;
        }

        .card {
            background: var(--white);
            padding: 35px;
            border-radius: 25px;
            box-shadow: var(--shadow);
            border: 1px solid #e0e0e0;
        }

        .section-title {
            font-size: 1.1em;
            font-weight: 700;
            color: var(--primary-purple);
            margin-bottom: 20px;
            border-bottom: 3px solid var(--primary-purple);
            display: inline-block;
        }

        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85em; font-weight: 600; margin-bottom: 5px; }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-family: inherit;
            box-sizing: border-box;
            font-size: 1em;
        }
        input[readonly] { background-color: #f0f0f0; cursor: not-allowed; font-weight: bold; }

        .rider-box {
            background: #f8f4ff;
            padding: 20px;
            border-radius: 15px;
            margin: 25px 0;
            border: 1px solid #e1d5f5;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 0.9em;
            font-weight: 600;
        }

        #errorMsg {
            color: #d32f2f;
            background: #ffebee;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
            font-weight: bold;
            border: 1px solid #ffcdd2;
            font-size: 0.85em;
        }

        button.btn-generate {
            width: 100%;
            background: var(--primary-purple);
            color: white;
            border: none;
            padding: 18px;
            font-size: 1.1em;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .results-panel { display: none; }
        
        .summary-dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .summary-card {
            background: #333;
            color: white;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            box-shadow: var(--shadow);
        }

        .summary-card.irr-box {
            background: linear-gradient(135deg, #fbc02d 0%, #f57f17 100%);
            color: #000;
        }

        .summary-card h3 { margin: 0; font-size: 0.8em; text-transform: uppercase; opacity: 0.8; }
        .summary-card p { margin: 10px 0 0; font-size: 1.8em; font-weight: 800; }

        .table-container {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            overflow-x: auto;
        }
        table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
        th { background: #f3e5f5; color: var(--primary-purple); padding: 12px; border-bottom: 2px solid #e1bee7; text-align: center; }
        td { padding: 10px; text-align: center; border-bottom: 1px solid #f1f5f9; }
        .row-outflow { color: #d9534f; font-weight: bold; }
        .row-inflow { color: var(--success-green); font-weight: bold; }
        .total-row { background: #333 !important; color: white !important; font-weight: 800; }
    </style>
</head>

            <div class="input-group">

            <div class="rider-box">

                <div class="checkbox-container">
                    <input type="checkbox" id="addbCheck" onchange="toggleInput('addbSaValueDiv', this)">
                    <label>Include AD&DB Rider</label>
                </div>
                <div id="addbSaValueDiv" class="input-group" style="display:none;">
                    <label style="font-size: 0.7em;">AD&DB Sum Assured (Max 1 Cr)</label>

                <div class="checkbox-container">

                </div>
                <div id="pwbAgeDiv" class="input-group" style="display:none;">
                    <label style="font-size: 0.7em;">Proposer's Age (18-55)</label>
                    <input type="number" id="pwbAge" placeholder="Proposer Age">
                </div>
            </div>

            <button class="btn-generate" onclick="generateReport()">Generate Precise Report</button>
            <div id="errorMsg"></div>
        </div>

        <div class="results-panel" id="resultsPanel">
            <div class="summary-dashboard">
                <div class="summary-card">
                    <h3>Total Net Profit</h3>
                    <p id="assetVal">₹0</p>
                </div>
                <div class="summary-card irr-box">
                    <h3>Internal Rate of Return (XIRR)</h3>
                    <p id="xirrResult">0.00%</p>
                </div>
            </div>

            <div class="table-container">
                <table id="irrTable">
                    <thead>
                        <tr>
                            <th>Year</th>
                            <th>Age</th>
                            <th>Premium (Out)</th>
                            <th>GA (Accrued)</th>
                            <th>Maturity (In)</th>
                            <th>Death Benefit</th>
                            <th>Net Cashflow</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                    <tfoot id="tableFoot"></tfoot>
                </table>
            </div>
        </div>
    </div>
</div>

    };

    const pwbRates = {
        10: {T1: 2.2, T2: 2.25, T3: 2.55, T4: 3.1, T5: 4.05, T6: 5.75, T7: 8.15},
        11: {T1: 2.25, T2: 2.4, T3: 2.65, T4: 3.3, T5: 4.4, T6: 6.35, T7: 9.0},
        12: {T1: 2.3, T2: 2.45, T3: 2.8, T4: 3.5, T5: 4.8, T6: 6.9, T7: 9.85},
        13: {T1: 2.45, T2: 2.55, T3: 2.95, T4: 3.75, T5: 5.15, T6: 7.5, T7: 10.7},
        14: {T1: 2.5, T2: 2.7, T3: 3.1, T4: 4.0, T5: 5.55, T6: 8.15, T7: 11.6},
        15: {T1: 2.6, T2: 2.8, T3: 3.3, T4: 4.35, T5: 6.1, T6: 8.9, T7: 12.75}
    };

    function updatePPT() {
        const term = parseInt(document.getElementById("term").value);
        document.getElementById("ppt").value = term - 5;
    }

    function toggleInput(id, cb) {
        document.getElementById(id).style.display = cb.checked ? 'block' : 'none';
    }

    function irr(values) {
        let x = 0.1;
        for (let i = 0; i < 20; i++) {
            let f = 0, df = 0;
            for (let j = 0; j < values.length; j++) {
                let powVal = Math.pow(1 + x, j);
                f += values[j] / powVal;
                df -= (j * values[j]) / (powVal * (1 + x));
            }
            if (Math.abs(df) < 1e-12) break;
            let xNew = x - f / df;
            if (Math.abs(xNew - x) < 1e-12) return xNew;
            x = xNew;
        }
        return x;
    }

    function generateReport() {
        const age = parseInt(document.getElementById("age").value);
        const sa = parseInt(document.getElementById("sumAssured").value);
        const term = parseInt(document.getElementById("term").value);
        const ppt = term - 5;
        const errorBox = document.getElementById('errorMsg');
        errorBox.style.display = "none";

        // Rider Values
        const hasAddb = document.getElementById('addbCheck').checked;
        const addbSa = parseInt(document.getElementById('addbSaValue').value) || 0;
        const hasTr = document.getElementById('trCheck').checked;
        const trSa = parseInt(document.getElementById('trSaValue').value) || 0;
        const hasPwb = document.getElementById('pwbCheck').checked;
        const pAge = parseInt(document.getElementById('pwbAge').value) || 0;

        // Validations
        const maxAgeMap = { 15: 60, 16: 59, 17: 58, 18: 57, 19: 56, 20: 55 };
        const minAgeMap = { 15: 3, 16: 2, 17: 1, 18: 0, 19: 0, 20: 0 };

        if (age < minAgeMap[term] || age > maxAgeMap[term]) {
            errorBox.innerHTML = `⚠️ Entry Age for Term ${term} is ${minAgeMap[term]} to ${maxAgeMap[term]}.`;
            errorBox.style.display = "block"; return;
        }
        if (sa < 125000) { errorBox.innerHTML = "⚠️ Min SA ₹1,25,000."; errorBox.style.display = "block"; return; }
        if (hasAddb && (addbSa > sa || addbSa > 10000000)) { errorBox.innerHTML = "⚠️ AD&DB Capped at SA or 1 Cr."; errorBox.style.display = "block"; return; }
        if (hasTr && (trSa > sa || trSa > 2500000)) { errorBox.innerHTML = "⚠️ Term Rider Capped at SA or 25 Lacs."; errorBox.style.display = "block"; return; }
        if (hasPwb && (pAge < 18 || pAge > 55)) { errorBox.innerHTML = "⚠️ Proposer Age must be 18-55."; errorBox.style.display = "block"; return; }
if (hasPwb && age > 17) { errorBox.innerHTML = "⚠️ PWB Rider is only available for Life Assured age 17 or less."; errorBox.style.display = "block"; return; }

        const tabularRate = tabularRates[age] ? tabularRates[age][term] : 0;
        let saRebate =  (sa >= 10000000) ? 6.100 : (sa >= 2500000) ? 6.122 :(sa >= 1000000) ? 6.100 : (sa >= 500000 ? 5.100 : (sa >= 300000 ? 4.10 : 0));
        
        // Base Annual (98% for Yearly)
        const baseAnnual = ((tabularRate - saRebate) * (sa / 1000)) * 0.98;
        
        const addbPrem = hasAddb ? (addbSa / 1000) * addbRateTable[term] : 0;
        
        // --- CORRECTED RIDER CALCULATIONS ---
        
        // 1. Find Term Rider Rate & Calculate Premium (with 0.98 Mode and 0.94 Correction)
        let trRateLookup = 0;
        const riderAges = Object.keys(termRiderRates).sort((a,b) => a-b);
        for(let a of riderAges) {
            if(age <= a) { 
                trRateLookup = termRiderRates[a][term]; 
                break; 
            }
        }
        const trPrem = hasTr ? Math.round((trSa / 1000) * trRateLookup * 0.98 * 1.00) : 0;
        
        // 2. PWB Calculation (with 0.96 Adjustment Factor)
        let pwbTier = "";
        if(pAge <= 25) pwbTier="T1"; 
        else if(pAge <= 30) pwbTier="T2"; 
        else if(pAge <= 35) pwbTier="T3"; 
        else if(pAge <= 40) pwbTier="T4"; 
        else if(pAge <= 45) pwbTier="T5"; 
        else if(pAge <= 50) pwbTier="T6"; 
        else pwbTier="T7";
        
        const pwbFactor = hasPwb ? pwbRates[ppt][pwbTier] : 0;
        const pwbPrem = hasPwb ? Math.round(((baseAnnual * pwbFactor) / 100) * 0.98) : 0;

        // 3. Final Premium Summation
        const finalAnnualPremium = Math.round(baseAnnual + addbPrem + trPrem + pwbPrem);
        document.getElementById('resultsPanel').style.display = 'block';
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        
        let cashflows = [];
        let accruedGA = 0, totalOut = 0, totalIn = 0;

        for (let yr = 1; yr <= term; yr++) {
            let outflow = (yr <= ppt) ? finalAnnualPremium : 0;
            let yrGA = (sa / 1000) * 50;
            accruedGA += yrGA;

            let maturityVal = (yr === term) ? (sa + accruedGA) : 0;
            
            // Risk logic
            let riskAge = age < 8 ? Math.max(8, age + 2) : age;
            let db = (age < 8 && (age + yr < riskAge)) ? (outflow * yr) : Math.max(1.25 * sa, 7 * baseAnnual) + accruedGA;

            cashflows.push(maturityVal - outflow);
            totalOut += outflow; totalIn += maturityVal;

            tbody.innerHTML += `
                <tr>
                    <td>${yr}</td><td>${age+yr}</td>
                    <td class="row-outflow">${outflow > 0 ? '₹' + outflow.toLocaleString() : '-'}</td>
                    <td>₹${yrGA.toLocaleString()}</td>
                    <td>₹${accruedGA.toLocaleString()}</td>
                    <td class="row-inflow">${maturityVal > 0 ? '₹' + maturityVal.toLocaleString() : '-'}</td>
                    <td style="color:blue;font-weight:700">₹${Math.round(db).toLocaleString()}</td>
                    <td style="background:#f4f0fa;font-weight:700">${(maturityVal-outflow) >= 0 ? '+' : ''}₹${Math.round(maturityVal-outflow).toLocaleString()}</td>
                </tr>`;
        }

        document.getElementById('xirrResult').innerText = (irr(cashflows) * 100).toFixed(2) + "%";
        document.getElementById('assetVal').innerText = "₹" + Math.round(totalIn - totalOut).toLocaleString();
        document.getElementById('tableFoot').innerHTML = `<tr class="total-row"><td colspan="2">TOTAL</td><td>₹${totalOut.toLocaleString()}</td><td>-</td><td>₹${accruedGA.toLocaleString()}</td><td>₹${totalIn.toLocaleString()}</td><td>-</td><td>₹${Math.round(totalIn-totalOut).toLocaleString()}</td></tr>`;
    }
</script>
</body>
</html>
