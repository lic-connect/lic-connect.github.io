<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bima Lakshmi | Pro Surrender Calc</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
 <style>
        :root {
            --lic-grey: #444444;
            --light-grey: #f4f4f4;
            --border-grey: #cccccc;
            --white: #ffffff;
            --accent: #ffd700;
            --error-red: #d32f2f;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background: #e9e9e9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container { width: 100%; max-width: 800px; }

        .glass-panel {
            background: var(--white);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 35px;
            border-top: 10px solid var(--lic-grey);
        }

        header { text-align: center; margin-bottom: 25px; }
        h1 { color: var(--lic-grey); font-size: 22px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
        .tagline { font-size: 12px; color: #777; font-weight: 600; margin-top: 5px; text-transform: uppercase; }

        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .input-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 11px; font-weight: 700; color: #555; text-transform: uppercase; }
        
        input, select {
            padding: 12px;
            border: 1px solid var(--border-grey);
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            outline: none;
            transition: border 0.3s;
        }
        
        input:focus { border-color: var(--lic-grey); }
        input[readonly] { background: var(--light-grey); color: #666; border-style: dashed; }

        /* Option Toggles Styling */
        .option-toggle { 
            grid-column: 1 / -1; 
            display: flex; 
            justify-content: center; 
            gap: 10px; 
            margin: 10px 0; 
            flex-wrap: wrap; 
        }

        .option-btn { 
            background: white; 
            border: 1px solid var(--border-grey); 
            padding: 10px 20px; 
            border-radius: 5px; 
            color: var(--lic-grey); 
            cursor: pointer; 
            font-size: 11px; 
            font-weight: 700;
            text-transform: uppercase;
            transition: 0.3s; 
        }

        .option-btn.active { 
            background: var(--lic-grey); 
            color: white; 
            border-color: var(--lic-grey);
        }

        /* Checkbox Row Styling */
        .input-group[style*="flex-direction: row"] {
            border: 1px solid #eee;
            background: #fafafa;
            padding: 15px !important;
            border-radius: 8px;
        }

        .calc-btn { 
            width: 100%; 
            padding: 16px; 
            border: none; 
            border-radius: 8px; 
            background: var(--lic-grey); 
            color: white; 
            font-weight: 700; 
            font-size: 16px; 
            cursor: pointer; 
            transition: background 0.3s; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
        }

        .calc-btn:hover { background: #222; }

        /* Results Area Styling */
        .results { margin-top: 30px; display: none; animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .res-split { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 15px; 
            margin-bottom: 20px; 
        }

        .res-card { 
            background: #fdfdfd; 
            padding: 20px; 
            border-radius: 8px; 
            border-left: 5px solid var(--lic-grey);
            border: 1px solid #eee;
            border-left: 5px solid var(--lic-grey);
        }

        .res-label { font-size: 11px; color: #888; text-transform: uppercase; font-weight: 700; margin-bottom: 5px; }
        .res-val { font-size: 18px; font-weight: 700; color: var(--lic-grey); }

        .final-hero { 
            background: #f9f9f9; 
            border: 1px solid #eee;
            border-radius: 12px; 
            padding: 25px; 
            text-align: center; 
        }

        .final-amt { 
            font-size: 32px; 
            font-weight: 800; 
            margin: 5px 0; 
            color: #2e7d32;
        }

        /* Error Box Styling */
        #errorBox { 
            background: #ffebee; 
            color: var(--error-red); 
            padding: 15px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            border: 1px solid #ffcdd2; 
            font-size: 13px; 
            font-weight: 600;
        }

        .footer-note { font-size: 11px; color: #888; margin-top: 15px; text-align: center; font-style: italic; }

        @media (max-width: 600px) {
            .res-split { grid-template-columns: 1fr; }
            h1 { font-size: 18px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>BIMA LAKSHMI (881)</h1>
        <div class="tagline">Exclusive Surrender Engine</div>
    </header>

<!-- ADD THIS: Error Container -->
<div id="errorBox" style="display:none; background:rgba(255,0,0,0.2); color:#ff4d4d; padding:15px; border-radius:12px; margin-bottom:20px; border:1px solid #ff4d4d; font-size:13px; grid-column: 1/-1;">
    <strong style="font-family: 'Orbitron';">System Warning:</strong>
    <div id="errorList" style="margin-top:5px;"></div>
</div>

    <div class="glass-panel">
        <div class="input-grid">
<!-- ADD THIS: Age Input -->
<div class="input-group">
    <label>Entry Age (18-50 Yrs)</label>
    <input type="number" id="age" value="30" oninput="updateFields()">
</div>
            <div class="input-group">
                <label>Sum Assured (Min 2L)</label>
                <input type="number" id="sa" value="200000" oninput="updateFields()">
            </div>
            <div class="input-group">
                <label>Annual Premium (AP)</label>
                <input type="number" id="ap" value="15000" oninput="updateFields()">
            </div>
            <div class="input-group">
                <label>PPT (7 to 15 Years)</label>
                <input type="number" id="ppt" value="10" min="7" max="15" oninput="updateFields()">
            </div>
            <div class="input-group">
                <label>Years Premium Paid</label>
                <input type="number" id="yearsPaid" value="5" min="2" oninput="updateFields()">
            </div>
            <div class="input-group">
                <label>Policy Term (PT)</label>
                <input type="text" id="pt" readonly>
            </div>
            <div class="input-group">
                <label>Total Accrued GA</label>
                <input type="text" id="ga" readonly>
            </div>
            
            <div class="input-group" style="grid-column: 1 / -1; flex-direction: row; align-items: center; gap: 10px; background: rgba(0,255,136,0.05); padding: 12px; border-radius: 12px; border: 1px solid rgba(0,255,136,0.2);">
                <input type="checkbox" id="isOnline" checked onchange="updateFields()" style="width: 20px; height: 20px;">
                <label for="isOnline" style="margin: 0; color: white;">Direct/Online Purchase (+1% GA)</label>
                <div id="hsaStatus" style="margin-left: auto; font-size: 0.7rem; color: var(--neon-green); font-weight: bold;">
                    SA REBATE: APPLICABLE (+0.25%)
                </div>
            </div>

            <div class="option-toggle">
                <button class="option-btn active" id="btnA" onclick="setOption('A')">Option A (PPT+6)</button>
                <button class="option-btn" id="btnB" onclick="setOption('B')">Option B (PPT+8)</button>
                <button class="option-btn" id="btnC" onclick="setOption('C')">Option C (PPT+10)</button>
            </div>
        </div>

        <button class="calc-btn" onclick="runCalculation()">Generate Value</button>

        <div id="resultsArea" class="results">
            <div class="res-split">
                <div class="res-card">
                    <div class="res-label">Guaranteed (GSV)</div>
                    <div class="res-val" id="gsvDisplay">₹ 0.00</div>
                </div>
                <div class="res-card ssv">
                    <div class="res-label">Special (SSV)</div>
                    <div class="res-val" id="ssvDisplay">₹ 0.00</div>
                </div>
            </div>
            <div class="final-hero">
                <div class="res-label" style="color: var(--neon-green);">Estimated Surrender Value</div>
                <div class="final-amt" id="finalDisplay">₹ 0.00</div>
            </div>
            <p class="footer-note">* Calculations are indicative. Exact values depend on last premium date and LIC's latest circulars.</p>
        </div>
    </div>
</div>

<script>
    let selectedOption = 'A';

    // JSON Data provided in attachment
    const dataB = [{"T25": 0.0,"Term": 1},{"T25": 0.0,"Term": 2},{"T25": 0.1528,"Term": 3},{"T25": 0.1542,"Term": 4},{"T25": 0.1555,"Term": 5},{"T25": 0.1572,"Term": 6},{"T25": 0.1593,"Term": 7},{"T25": 0.1622,"Term": 8},{"T25": 0.1658,"Term": 9},{"T25": 0.1703,"Term": 10},{"T25": 0.1758,"Term": 11},{"T25": 0.1758,"Term": 12},{"T25": 0.1766,"Term": 13},{"T25": 0.1785,"Term": 14},{"T25": 0.1816,"Term": 15},{"T25": 0.186,"Term": 16},{"T25": 0.1918,"Term": 17},{"T25": 0.1993,"Term": 18},{"T25": 0.2085,"Term": 19},{"T25": 0.2199,"Term": 20},{"T25": 0.2338,"Term": 21},{"T25": 0.2505,"Term": 22},{"T25": 0.2706,"Term": 23},{"T25": 0.3,"Term": 24},{"T25": 0.35,"Term": 25}];
    const dataP = [{"T25": 0.0,"Term": 1},{"T25": 0.3,"Term": 2},{"T25": 0.35,"Term": 3},{"T25": 0.5,"Term": 4},{"T25": 0.5,"Term": 5},{"T25": 0.5,"Term": 6},{"T25": 0.5,"Term": 7},{"T25": 0.516,"Term": 8},{"T25": 0.5301,"Term": 9},{"T25": 0.5452,"Term": 10},{"T25": 0.5602,"Term": 11},{"T25": 0.5754,"Term": 12},{"T25": 0.5904,"Term": 13},{"T25": 0.6056,"Term": 14},{"T25": 0.6206,"Term": 15},{"T25": 0.6356,"Term": 16},{"T25": 0.6508,"Term": 17},{"T25": 0.6658,"Term": 18},{"T25": 0.6809,"Term": 19},{"T25": 0.6959,"Term": 20},{"T25": 0.7111,"Term": 21},{"T25": 0.7262,"Term": 22},{"T25": 0.7412,"Term": 23},{"T25": 0.9,"Term": 24},{"T25": 0.9,"Term": 25}];
    const dataF1 = [{"T25": 0.0377,"Term": 1},{"T25": 0.0391,"Term": 2},{"T25": 0.0405,"Term": 3},{"T25": 0.0419,"Term": 4},{"T25": 0.0433,"Term": 5},{"T25": 0.0447,"Term": 6},{"T25": 0.046,"Term": 7},{"T25": 0.0473,"Term": 8},{"T25": 0.0484,"Term": 9},{"T25": 0.0495,"Term": 10},{"T25": 0.0504,"Term": 11},{"T25": 0.051,"Term": 12},{"T25": 0.0514,"Term": 13},{"T25": 0.0514,"Term": 14},{"T25": 0.051,"Term": 15},{"T25": 0.0501,"Term": 16},{"T25": 0.0485,"Term": 17},{"T25": 0.0462,"Term": 18},{"T25": 0.043,"Term": 19},{"T25": 0.0389,"Term": 20},{"T25": 0.0337,"Term": 21},{"T25": 0.0274,"Term": 22},{"T25": 0.0197,"Term": 23},{"T25": 0.0107,"Term": 24}];
    const dataF3A = [{"Term": 1,"T15": 0.3634},{"Term": 2,"T15": 0.3902},{"Term": 3,"T15": 0.4191},{"Term": 4,"T15": 0.4501},{"Term": 5,"T15": 0.4835},{"Term": 6,"T15": 0.5194},{"Term": 7,"T15": 0.5581},{"Term": 8,"T15": 0.5997},{"Term": 9,"T15": 0.6446},{"Term": 10,"T15": 0.693},{"Term": 11,"T15": 0.7452},{"Term": 12,"T15": 0.8016},{"Term": 13,"T15": 0.8625},{"Term": 14,"T15": 0.9285},{"Term": 15,"T15": 1.0}];
    const dataF3B = [{"T25": 5.6828,"Term": 1},{"T25": 6.1021,"Term": 2},{"T25": 5.4793,"Term": 3},{"T25": 5.8848,"Term": 4},{"T25": 5.2472,"Term": 5},{"T25": 5.6369,"Term": 6},{"T25": 4.9821,"Term": 7},{"T25": 5.3539,"Term": 8},{"T25": 4.6796,"Term": 9},{"T25": 5.0309,"Term": 10},{"T25": 4.3349,"Term": 11},{"T25": 4.6627,"Term": 12},{"T25": 3.9412,"Term": 13},{"T25": 4.2428,"Term": 14},{"T25": 3.4924,"Term": 15},{"T25": 3.7633,"Term": 16},{"T25": 2.9794,"Term": 17},{"T25": 3.2143,"Term": 18},{"T25": 2.3907,"Term": 19},{"T25": 2.5829,"Term": 20},{"T25": 1.7116,"Term": 21},{"T25": 1.852,"Term": 22},{"T25": 0.9227,"Term": 23},{"T25": 1.0,"Term": 24}];
    const dataF3C = [{"T25": 2.6337,"Term": 1},{"T25": 2.828,"Term": 2},{"T25": 3.0369,"Term": 3},{"T25": 3.2617,"Term": 4},{"T25": 2.4296,"Term": 5},{"T25": 2.61,"Term": 6},{"T25": 2.8044,"Term": 7},{"T25": 3.0136,"Term": 8},{"T25": 2.1642,"Term": 9},{"T25": 2.3267,"Term": 10},{"T25": 2.5022,"Term": 11},{"T25": 2.6913,"Term": 12},{"T25": 1.82,"Term": 13},{"T25": 1.9592,"Term": 14},{"T25": 2.11,"Term": 15},{"T25": 2.2737,"Term": 16},{"T25": 1.3733,"Term": 17},{"T25": 1.4816,"Term": 18},{"T25": 1.5996,"Term": 19},{"T25": 1.7282,"Term": 20},{"T25": 0.7874,"Term": 21},{"T25": 0.852,"Term": 22},{"T25": 0.9227,"Term": 23},{"T25": 1.0,"Term": 24}];

    function setOption(opt) {
        selectedOption = opt;
        document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn' + opt).classList.add('active');
        updateFields();
    }

    function updateFields() {
        const ppt = parseInt(document.getElementById('ppt').value) || 0;
        const sa = parseFloat(document.getElementById('sa').value) || 0;
        const ap = parseFloat(document.getElementById('ap').value) || 0;
        const yPaid = parseInt(document.getElementById('yearsPaid').value) || 0;
        const isOnline = document.getElementById('isOnline').checked;

        let pt = 0;
        if (selectedOption === 'A') pt = ppt + 6;
        else if (selectedOption === 'B') pt = ppt + 8;
        else if (selectedOption === 'C') pt = ppt + 10;
        document.getElementById('pt').value = pt + " Years";

        let gaRate = 0.07;
        if (isOnline) gaRate += 0.01;
        if (sa >= 200000) {
            gaRate += 0.0025;
            document.getElementById('hsaStatus').innerText = "SA REBATE: APPLICABLE (+0.25%)";
            document.getElementById('hsaStatus').style.color = "var(--neon-green)";
        } else {
            document.getElementById('hsaStatus').innerText = "SA REBATE: NOT APPLICABLE";
            document.getElementById('hsaStatus').style.color = "#888";
        }

        const totalGA = ap * gaRate * Math.min(yPaid, ppt);
        document.getElementById('ga').value = Math.round(totalGA);
    }

    function runCalculation() {

// --- ADD VALIDATION LOGIC START ---
    const ageVal = parseInt(document.getElementById('age').value);
    const saVal = parseFloat(document.getElementById('sa').value);
    const pptVal = parseInt(document.getElementById('ppt').value);
    const yPaidVal = parseInt(document.getElementById('yearsPaid').value);
    
    const errBox = document.getElementById('errorBox');
    const errList = document.getElementById('errorList');
    
    errBox.style.display = "none";
    errList.innerHTML = "";
    let errors = [];

    // 1. Entry Age Validation (Brochure Page 3: 18 to 50 years)
    if (isNaN(ageVal) || ageVal < 18 || ageVal > 50) {
        errors.push("• Entry Age must be between 18 and 50 years.");
    }

    // 2. PPT Validation (Brochure Page 3: 7 to 15 years)
    if (isNaN(pptVal) || pptVal < 7 || pptVal > 15) {
        errors.push("• Premium Paying Term (PPT) must be between 7 and 15 years.");
    }

    // 3. Sum Assured & Multiples Validation (Brochure Page 3: Min 2L & Multiples of 10k)
    if (isNaN(saVal) || saVal < 200000) {
        errors.push("• Minimum Sum Assured is ₹ 2,00,000.");
    } else if (saVal % 10000 !== 0) {
        errors.push("• Sum Assured must be in multiples of ₹ 10,000.");
    }

    // 4. Surrender Rule (Brochure Page 15: Min 2 full years paid)
    if (isNaN(yPaidVal) || yPaidVal < 2) {
        errors.push("• Surrender Value requires at least 2 full years of premium payment.");
    }

    if (errors.length > 0) {
        errList.innerHTML = errors.join("<br>");
        errBox.style.display = "block";
        document.getElementById('resultsArea').style.display = "none";
        window.scrollTo(0, 0); // Scroll to error box
        return; // Stops calculation
    }
    // --- ADD VALIDATION LOGIC END ---
        const sa = parseFloat(document.getElementById('sa').value);
        const ap = parseFloat(document.getElementById('ap').value);
        const yPaid = parseInt(document.getElementById('yearsPaid').value);
        const ppt = parseInt(document.getElementById('ppt').value);
        const totalGA = parseFloat(document.getElementById('ga').value);

        if (ppt < 7 || ppt > 15) return alert("PPT must be between 7 and 15 years.");
        if (yPaid < 2) return alert("Minimum 2 years' premiums must be paid.");

        const findFactor = (arr, term, key) => {
            const row = arr.find(r => r.Term === term);
            return row ? (row[key] || 0) : 0;
        };

        // GSV Logic
        const totalPremiumPaid = ap * yPaid;
        const factorPrem = findFactor(dataP, yPaid, "T25");
        const factorGA = findFactor(dataB, yPaid, "T25");
        const gsv = (totalPremiumPaid * factorPrem) + (totalGA * factorGA);

        // SSV Logic
        const paidUpSA = (sa * yPaid) / ppt;
        const f1 = findFactor(dataF1, yPaid, "T25");
        
        let f3 = 0;
        if (selectedOption === 'A') f3 = findFactor(dataF3A, yPaid, "T15");
        else if (selectedOption === 'B') f3 = findFactor(dataF3B, yPaid, "T25");
        else if (selectedOption === 'C') f3 = findFactor(dataF3C, yPaid, "T25");

        const ssv = (paidUpSA * f1) + (totalGA * f3);
        const finalSV = Math.max(gsv, ssv);
        
        document.getElementById('resultsArea').style.display = 'block';
        document.getElementById('gsvDisplay').innerText = "₹ " + Math.round(gsv).toLocaleString('en-IN');
        document.getElementById('ssvDisplay').innerText = "₹ " + Math.round(ssv).toLocaleString('en-IN');
        document.getElementById('finalDisplay').innerText = "₹ " + Math.round(finalSV).toLocaleString('en-IN');
        
        document.getElementById('resultsArea').scrollIntoView({ behavior: 'smooth' });
    }

    window.onload = updateFields;
</script>

</body>
</html>
