<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIC Plan 733 - Jeevan Lakshya Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --parrot-green: #44bd32;
            --parrot-dark: #2e8b22;
            --black: #121212;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, 0.95);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background: radial-gradient(circle at center, #2c3e50, #000);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            perspective: 1200px;
        }

        /* 3D Box & Mirror Effect */
        .calculator-card {
            position: relative;
            width: 100%;
            max-width: 950px;
            background: var(--white);
            border-radius: 25px;
            transform-style: preserve-3d;
            transform: rotateX(6deg);
            box-shadow: 0 40px 100px rgba(0,0,0,0.8);
            padding: 45px;
            border: 1px solid rgba(68, 189, 50, 0.3);
            /* Fantastic Mirror Reflection */
            -webkit-box-reflect: below 2px linear-gradient(transparent, transparent, rgba(255,255,255,0.15));
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
            border-bottom: 5px solid var(--parrot-green);
            padding-bottom: 15px;
        }

        .header h1 { color: var(--black); font-size: 26px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        .header p { color: var(--parrot-dark); font-weight: 700; font-size: 14px; }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .field-group { position: relative; display: flex; flex-direction: column; }
        .field-group label { font-size: 11px; font-weight: 800; color: var(--black); margin-bottom: 6px; text-transform: uppercase; }
        .field-group i { position: absolute; right: 15px; top: 38px; color: var(--parrot-green); font-size: 18px; }

        input, select {
            padding: 14px 18px;
            border: 2px solid #edeff2;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            outline: none;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        input:focus, select:focus { border-color: var(--parrot-green); background: #fff; box-shadow: 0 0 15px rgba(68, 189, 50, 0.2); }

        /* Benefit Toggle Switch */
        .toggle-area {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            margin: 20px 0;
            background: #f0fff0;
            padding: 12px;
            border-radius: 50px;
        }

        .toggle-box {
            display: flex;
            width: 380px;
            height: 50px;
            background: var(--black);
            border-radius: 25px;
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }

        .toggle-opt {
            flex: 1;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: var(--parrot-green);
            transition: 0.3s;
            font-size: 13px;
        }

        .toggle-opt.active { color: #000; }
        .slider {
            position: absolute;
            left: 0;
            width: 50%;
            height: 100%;
            background: var(--parrot-green);
            border-radius: 25px;
            transition: 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1;
        }

        .calc-btn {
            grid-column: 1 / -1;
            background: var(--black);
            color: var(--parrot-green);
            border: 3px solid var(--parrot-green);
            padding: 20px;
            border-radius: 15px;
            font-size: 20px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.4s;
            text-transform: uppercase;
        }

        .calc-btn:hover { background: var(--parrot-green); color: #000; transform: translateY(-5px); box-shadow: 0 10px 20px rgba(68, 189, 50, 0.3); }

        /* Results Panel */
        #results-box {
            margin-top: 40px;
            display: none;
            background: #fdfdfd;
            padding: 35px;
            border-radius: 20px;
            border: 3px solid var(--parrot-green);
            animation: slideUp 0.6s ease;
        }

        .res-item { display: flex; justify-content: space-between; padding: 14px 0; border-bottom: 1px dashed #ccc; }
        .res-item:last-of-type { border: none; background: var(--black); color: var(--parrot-green); padding: 22px; border-radius: 15px; margin-top: 15px; }
        .res-label { font-weight: 600; font-size: 15px; }
        .res-val { font-weight: 800; font-size: 20px; }

        .formula-card {
            font-size: 11px;
            color: #777;
            text-align: center;
            margin-top: 20px;
            font-style: italic;
            background: #eee;
            padding: 10px;
            border-radius: 8px;
        }

        .footer-btns { display: flex; gap: 20px; margin-top: 30px; }
        .f-btn { flex: 1; padding: 15px; border-radius: 12px; border: 2px solid var(--black); background: transparent; color: var(--black); font-weight: 800; cursor: pointer; transition: 0.3s; }
        .f-btn:hover { background: var(--black); color: var(--parrot-green); }

        @keyframes slideUp { from { opacity: 0; transform: translateY(50px); } to { opacity: 1; transform: translateY(0); } }
        .err-msg { color: #eb4d4b; font-size: 11px; font-weight: 700; margin-top: 4px; display: none; }
    </style>
</head>
<body>

<div class="calculator-card">
    <div class="header">
        <h1>LIC-PLAN NO 733-JEEVAN LAKSHYA</h1>
        <p>THE ONLY PLAN WHERE BENEFITS CONTINUE AFTER DEATH</p>
    </div>

    <div class="form-grid">
        <div class="field-group">
            <label>Policy Holder Name</label>
            <input type="text" id="name" placeholder="Name">
            <i class="fas fa-user-tie"></i>
        </div>

        <div class="field-group">
            <label>Entry Age (18-50 Yrs)</label>
            <input type="number" id="age" value="30">
            <i class="fas fa-birthday-cake"></i>
            <span id="age-err" class="err-msg">Age must be 18 to 50</span>
        </div>

        <div class="field-group">
            <label>Sum Assured (Min 2L)</label>
            <input type="number" id="sa" value="200000" step="10000">
            <i class="fas fa-shield-alt"></i>
            <span id="sa-err" class="err-msg">Minimum Sum Assured ₹2,00,000</span>
        </div>

        <div class="field-group">
            <label>Policy Term (13-25 Yrs)</label>
            <select id="term" onchange="syncPPT()">
                <!-- Populated by JS -->
            </select>
            <i class="fas fa-calendar-alt"></i>
        </div>

        <div class="field-group">
            <label>Premium Paying Term (PPT)</label>
            <input type="number" id="ppt" disabled>
            <i class="fas fa-hourglass-half"></i>
        </div>

        <div class="field-group">
            <label>Mode</label>
            <select id="mode">
                <option value="yly">Yearly</option>
                <option value="hly">Half-Yearly</option>
                <option value="qly">Quarterly</option>
                <option value="mly">Monthly</option>
            </select>
            <i class="fas fa-wallet"></i>
        </div>

        <div class="field-group">
            <label>Entered Annual Premium</label>
            <input type="number" id="prem" value="9535">
            <i class="fas fa-rupee-sign"></i>
        </div>

        <div class="field-group">
            <label>Bonus Rate (Default 46)</label>
            <input type="number" id="bonus_rate" value="46">
            <i class="fas fa-chart-line"></i>
        </div>

        <div class="field-group">
            <label>FAB Rate (Default 20)</label>
            <input type="number" id="fab_rate" value="20">
            <i class="fas fa-award"></i>
        </div>

        <div class="toggle-area">
            <div class="toggle-box" onclick="toggleView()">
                <div class="slider" id="slider"></div>
                <div class="toggle-opt active" id="opt_m">SURVIVAL (MATURITY)</div>
                <div class="toggle-opt" id="opt_d">DEATH BENEFIT</div>
            </div>
        </div>

        <div class="field-group" id="death_field" style="display:none; grid-column: 1 / -1;">
            <label>Policy Year of Death</label>
            <input type="number" id="death_yr" value="10">
            <i class="fas fa-skull-crossbones"></i>
        </div>

        <button class="calc-btn" onclick="calculateLakshya()">
            <i class="fas fa-calculator"></i> Calculate Wow Factor
        </button>
    </div>

    <div id="results-box">
        <div id="res_content"></div>
        <div class="footer-btns">
            <button class="f-btn" onclick="window.print()"><i class="fas fa-print"></i> Print PDF</button>
            <button class="f-btn" onclick="alert('Ready to Share Report!')"><i class="fas fa-share-alt"></i> Share PDF</button>
        </div>
    </div>
</div>

<script>
    // Initialize Term Dropdown
    const tSel = document.getElementById('term');
    for(let i=13; i<=25; i++) {
        let opt = document.createElement('option');
        opt.value = i; opt.innerHTML = i + " Years";
        tSel.appendChild(opt);
    }
    tSel.value = 25;

    function syncPPT() {
        document.getElementById('ppt').value = tSel.value - 3;
    }
    syncPPT();

    let isDeathMode = false;
    function toggleView() {
        isDeathMode = !isDeathMode;
        const slider = document.getElementById('slider');
        const dField = document.getElementById('death_field');
        if(isDeathMode) {
            slider.style.left = '50%';
            dField.style.display = 'block';
            document.getElementById('opt_d').classList.add('active');
            document.getElementById('opt_m').classList.remove('active');
        } else {
            slider.style.left = '0';
            dField.style.display = 'none';
            document.getElementById('opt_m').classList.add('active');
            document.getElementById('opt_d').classList.remove('active');
        }
    }

    function calculateLakshya() {
        const name = document.getElementById('name').value || "Customer";
        const age = parseInt(document.getElementById('age').value);
        const sa = parseFloat(document.getElementById('sa').value);
        const term = parseInt(document.getElementById('term').value);
        const ppt = term - 3;
        const prem = parseFloat(document.getElementById('prem').value);
        const bRate = parseFloat(document.getElementById('bonus_rate').value);
        const fRate = parseFloat(document.getElementById('fab_rate').value);
        const dYear = parseInt(document.getElementById('death_yr').value);

        // Validation
        let valid = true;
        if(age < 18 || age > 50) { document.getElementById('age-err').style.display='block'; valid=false; }
        else document.getElementById('age-err').style.display='none';
        if(sa < 200000) { document.getElementById('sa-err').style.display='block'; valid=false; }
        else document.getElementById('sa-err').style.display='none';
        if(!valid) return;

        // Jeevan Lakshya unique logic: Bonus is paid for the FULL TERM even after death
        const totalBonus = (sa/1000) * bRate * term; 
        const fab = (term >= 15 && sa >= 200000) ? (sa/1000) * fRate : 0;
        
        let html = `<h3>Plan 733 Report for ${name}</h3><br>`;

        if(!isDeathMode) {
            const finalMaturity = sa + totalBonus + fab;
            html += `
                <div class="res-item"><span class="res-label">Basic Sum Assured:</span><span class="res-val">₹ ${sa.toLocaleString()}</span></div>
                <div class="res-item"><span class="res-label">Total Accrued Bonus:</span><span class="res-val">₹ ${totalBonus.toLocaleString()}</span></div>
                <div class="res-item"><span class="res-label">Final Additional Bonus (FAB):</span><span class="res-val">₹ ${fab.toLocaleString()}</span></div>
                <div class="res-item"><span class="res-label">Total Premiums Paid:</span><span class="res-val">₹ ${(prem * ppt).toLocaleString()}</span></div>
                <div class="res-item"><span class="res-label">FINAL MATURITY PAYABLE:</span><span class="res-val">₹ ${finalMaturity.toLocaleString()}</span></div>
                <div class="formula-card">Formula: [Basic Sum Assured] + [Bonus for ${term} yrs] + [FAB]</div>
            `;
        } else {
            // DEATH BENEFIT (Plan 733 Logic per Page 3 of PDF)
            // Sum Assured on Death is higher of: 7x Premium OR 110% of Basic Sum Assured
            const saOnDeath = Math.max(1.1 * sa, 7 * prem);
            const totalDeathBenefit = saOnDeath + totalBonus + fab;
            const premiumsPaidTillDeath = prem * Math.min(dYear, ppt);

            html += `
                <div class="res-item" style="background:#e8f5e9; padding:10px; border-radius:8px; border:1px solid var(--parrot-green); margin-bottom:10px;">
                   <span class="res-label" style="color:var(--parrot-dark)">⭐ Special Income Benefit:</span>
                   <span class="res-val" style="color:var(--parrot-dark)">₹ ${(sa * 0.1).toLocaleString()} / Yr</span>
                   <p style="font-size:10px; width:100%; text-align:right;">(Paid every year from death until maturity)</p>
                </div>
                <div class="res-item"><span class="res-label">Sum Assured on Death (110% BSA):</span><span class="res-val">₹ ${saOnDeath.toLocaleString()}</span></div>
                <div class="res-item"><span class="res-label">Bonus till Maturity (Guaranteed):</span><span class="res-val">₹ ${totalBonus.toLocaleString()}</span></div>
                <div class="res-item"><span class="res-label">Final Additional Bonus:</span><span class="res-val">₹ ${fab.toLocaleString()}</span></div>
                <div class="res-item"><span class="res-label">Total Premiums Paid till Death:</span><span class="res-val">₹ ${premiumsPaidTillDeath.toLocaleString()}</span></div>
                <div class="res-item"><span class="res-label">FINAL LUMP SUM AT MATURITY:</span><span class="res-val">₹ ${totalDeathBenefit.toLocaleString()}</span></div>
                <div class="formula-card">Formula: [Higher of 110% BSA or 7x Premium] + [Bonus for Full Term] + [FAB]</div>
            `;
        }

        document.getElementById('res_content').innerHTML = html;
        document.getElementById('results-box').style.display = 'block';
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }
</script>

</body>
</html>
