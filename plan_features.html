<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Google Fonts for a modern, stylish look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --primary-color: #0d1b2a; /* Deep Space Blue */
            --secondary-color: #1b263b; /* Darker Blue */
            --accent-color: #00f5d4; /* Neon Teal */
            --glow-color: rgba(0, 245, 212, 0.6);
            --text-color: #e0e1dd;
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 40px 20px;
            background-color: var(--primary-color);
            /* This will use your image as a background layer */
            background-image: 
                linear-gradient(rgba(13, 27, 42, 0.85), rgba(13, 27, 42, 0.95)),
                url('happy-family.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            background-attachment: fixed;
            color: var(--text-color);
        }

        .portal-container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(27, 38, 59, 0.6);
            border: 1px solid rgba(0, 245, 212, 0.2);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 0 50px rgba(0,0,0,0.7);
            animation: fadeIn 1.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .portal-header .icon {
            font-size: 4rem;
            color: var(--accent-color);
            text-shadow: 0 0 20px var(--glow-color);
            margin-bottom: 15px;
        }

        .portal-header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 10px;
            color: #fff;
        }

        .portal-header p {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 50px;
        }

        .plan-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 20px;
        }

        .plan-card {
            background: linear-gradient(145deg, var(--secondary-color), var(--primary-color));
            color: white;
            border: 1px solid rgba(0, 245, 212, 0.3);
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: all 0.3s ease-out;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 120px;
        }

        .plan-card:hover {
            transform: translateY(-10px) scale(1.05);
            background: var(--accent-color);
            color: var(--primary-color);
            box-shadow: 0 0 30px var(--glow-color);
            border-color: var(--accent-color);
        }

        .plan-card .plan-number {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            font-weight: 800;
        }

        .plan-card .plan-name {
            font-size: 0.8rem;
            opacity: 0.7;
            margin-top: 5px;
        }

        /* The JS function remains the same, as it's perfect. */
    .home-button-container {
      position: fixed; /* This makes it float on top of other content */
      top: 20px;       /* Position 20px from the top edge */
      right: 25px;     /* Position 25px from the right edge */
      z-index: 1000;   /* Ensures it's above other elements */
    }

    .home-button-container a img {
      width: 50px; /* Adjust size as needed */
      height: 50px;

      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      transition: transform 0.2s;
    }

    .home-button-container a:hover img {
      transform: scale(1.1); /* Slightly enlarge on hover */
    }

@media (max-width: 768px) {
    /* 1. Reset Body: Allow vertical flow only */
    body {
        padding: 10px !important;
        overflow-x: hidden !important;
        width: 100vw !important;
    }

    /* 2. Fix Containers: Remove fixed widths (like 400px or 1200px) */
    .container, .portal-container, .calc-wrapper, .input-panel, .panel, .container-gatekeeper {
        width: 100% !important;
        max-width: 100% !important;
        margin: 0 auto !important;
        padding: 15px !important;
        box-sizing: border-box !important;
        border-radius: 10px !important;
    }

    /* 3. Scale Headers: Make titles fit on one line */
    h1 {
        font-size: 1.8rem !important;
        line-height: 1.2 !important;
        margin-bottom: 15px !important;
    }
    
    .header p {
        font-size: 11px !important;
    }

    /* 4. Force Single Column: Fix grids for mobile */
    .plan-grid, .form-grid, .results-grid, .calc-wrapper, .split-screen, .form-grid-887 {
        display: flex !important;
        flex-direction: column !important;
        grid-template-columns: 1fr !important;
        gap: 15px !important;
    }

    /* 5. Android Input Fix: Big enough to tap, no auto-zoom */
    input, select, textarea, button {
        font-size: 16px !important; /* CRITICAL FOR ANDROID */
        width: 100% !important;
        height: auto !important;
        padding: 12px !important;
        box-sizing: border-box !important;
    }

    /* 6. Fix Card Images: Don't let images crush the layout */
    .card-image {
        height: 120px !important;
    }
    
    .card-icon {
        top: 80px !important;
        width: 60px !important;
        height: 60px !important;
    }

    /* 7. Results Section: Make tables and flexboxes stack */
    .res-line, .result-item {
        flex-direction: row !important;
        justify-content: space-between !important;
        font-size: 14px !important;
    }
    
    .total-val, .total-amt {
        font-size: 24px !important;
    }

    /* 8. Home/Back Button: Move it to stay reachable but not in the way */
    .home-button-container {
        top: 10px !important;
        right: 10px !important;
    }
    
    .home-button-container img {
        width: 35px !important;
        height: 35px !important;
    }
}

/* Smooth Tap Feedback for Touchscreens */
button:active, .plan-card:active {
    transform: scale(0.98);
    filter: brightness(0.9);
}
