    <!-- Google Fonts for a modern, stylish look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root {
      --fb-blue: #1877F2;
      --aquamarine: #7FFFD4;
      --white: #FFFFFF;
      --black: #000000; /* Used for text only */
      --shadow: rgba(0, 0, 0, 0.15);
    }

    body {
      background-color: var(--white);
      font-family: 'Poppins', sans-serif;
      color: var(--black);
      margin: 0;
      padding: 40px 15px;
      background-image: radial-gradient(#e6e6e6 1px, transparent 1px);
      background-size: 20px 20px; /* Subtle dot pattern for texture */
    }

    .portal-container {
      max-width: 1100px;
      margin: 0 auto;
      text-align: center;
    }

    /* --- 3D Dashboard Title Box --- */
    .portal-header {
      display: inline-block;
      background: var(--white);
      padding: 25px 60px;
      border: 4px solid var(--fb-blue);
      margin-bottom: 60px;
      position: relative;
      /* The 3D Stack Effect */
      box-shadow: 
        1px 1px 0px var(--fb-blue),
        2px 2px 0px var(--fb-blue),
        3px 3px 0px var(--fb-blue),
        4px 4px 0px var(--fb-blue),
        5px 5px 0px var(--fb-blue),
        6px 6px 0px var(--fb-blue),
        7px 7px 0px var(--fb-blue),
        8px 8px 0px var(--fb-blue),
        15px 15px 20px rgba(24, 119, 242, 0.3);
      transform: perspective(500px) rotateX(5deg);
      transition: transform 0.3s;
    }

    .portal-header:hover {
      transform: perspective(500px) rotateX(0deg) scale(1.02);
    }

    /* Glossy Mirror Effect Overlay */
    .portal-header::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 50%);
      pointer-events: none;
    }

    .portal-header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 3rem;
      margin: 0;
      color: var(--fb-blue);
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 2px 2px 0px var(--aquamarine);
    }

    .portal-header p {
      margin: 10px 0 0;
      font-size: 1.1rem;
      color: var(--black);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .portal-header .icon {
      font-size: 2rem;
      color: var(--fb-blue);
      margin-bottom: 10px;
    }

    /* --- Grid Layout --- */
    .plan-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
      padding-bottom: 60px;
    }

   /* Layout Change: Vertical Stack & Centered */
.plan-card {
  background: var(--white);
  border: 3px solid var(--fb-blue);
  border-radius: 15px;
  padding: 20px;
  display: flex;
  flex-direction: column; /* Stacks items vertically */
  align-items: center;      /* Centers items horizontally */
  justify-content: center;  /* Centers items vertically */
  text-align: center;       /* Centers text */
  text-decoration: none;
  cursor: pointer;
  height: 180px;            /* Increased height to fit vertical stack */
  position: relative;
  overflow: hidden;
  transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  box-shadow: 8px 8px 0px var(--fb-blue);
}

    /* Hover State */
    .plan-card:hover {
      transform: translate(-4px, -4px);
      border-color: var(--fb-blue);
      box-shadow: 12px 12px 0px var(--aquamarine); /* Color shift on hover */
      background-color: #fbfbfb;
    }

    .plan-card:active {
      transform: translate(4px, 4px);
      box-shadow: 2px 2px 0px var(--fb-blue);
    }

/* Icon Adjustment: Margin bottom instead of right */
.plan-card::before {
  font-family: "Font Awesome 6 Free";
  font-weight: 900;
  font-size: 2.5rem;
  color: var(--fb-blue);
  margin-right: 0;          /* Remove side margin */
  margin-bottom: 15px;      /* Add bottom gap */
  width: auto;
  transition: color 0.2s;
}
    
    .plan-card:hover::before {
      color: var(--black); /* Icon turns black on hover */
    }

    /* Assigning specific icons based on button order */
    .plan-card:nth-child(1)::before { content: "\f0c0"; } /* 714 - Users */
    .plan-card:nth-child(2)::before { content: "\f004"; } /* 715 - Heart */
    .plan-card:nth-child(3)::before { content: "\f4c0"; } /* 717 - Coins */
    .plan-card:nth-child(4)::before { content: "\f53a"; } /* 720 - Money Bill */
    .plan-card:nth-child(5)::before { content: "\f53d"; } /* 721 - Hand Holding $ */

    .plan-card:nth-child(9)::before { content: "\f067"; } /* 735 - Plus */

    .plan-card:nth-child(11)::before { content: "\f581"; } /* 745 - Smile */
    .plan-card:nth-child(12)::before { content: "\f3a5"; } /* 748 - Diamond */
    .plan-card:nth-child(13)::before { content: "\f19c"; } /* 749 - Bank */
    .plan-card:nth-child(14)::before { content: "\f51e"; } /* 751 - Coins */
    .plan-card:nth-child(15)::before { content: "\f200"; } /* 752 - Pie Chart */
    .plan-card:nth-child(16)::before { content: "\f4b6"; } /* 758 - Handshake */
    .plan-card:nth-child(17)::before { content: "\f0eb"; } /* 760 - Lightbulb */
    .plan-card:nth-child(18)::before { content: "\f132"; } /* 768 - Shield */
    .plan-card:nth-child(19)::before { content: "\f79f"; } /* 771 - Party */
    .plan-card:nth-child(20)::before { content: "\f77c"; } /* 774 - Baby */
    .plan-card:nth-child(21)::before { content: "\f156"; } /* 857 - Rupee */
    .plan-card:nth-child(22)::before { content: "\f058"; } /* 859 - Check */
    .plan-card:nth-child(23)::before { content: "\f183"; } /* 862 - Elder */
    .plan-card:nth-child(24)::before { content: "\f0b1"; } /* 867 - Briefcase */
    .plan-card:nth-child(25)::before { content: "\f09d"; } /* 873 - Credit Card */
    .plan-card:nth-child(26)::before { content: "\f406"; } /* 875 - Youth */
    .plan-card:nth-child(27)::before { content: "\f3cd"; } /* 876 - Phone */
    .plan-card:nth-child(28)::before { content: "\f2c2"; } /* 877 - ID Card */
    .plan-card:nth-child(29)::before { content: "\f577"; } /* 878 - Lock */
    .plan-card:nth-child(30)::before { content: "\f085"; } /* 879 - Gear */
    .plan-card:nth-child(31)::before { content: "\f0c0"; } /* 880 - Group */
    .plan-card:nth-child(32)::before { content: "\f22d"; } /* 881 - Venus */
    .plan-card:nth-child(33)::before { content: "\f06b"; } /* 883 - Gift */

/* Number Adjustment: Black Color & Gap */
.plan-card .plan-number {

    /* --- Floating Home Button --- */
    .home-button-container {

      top: 30px;

    }

    .home-button-container img {

      padding: 10px;
      box-shadow: 4px 4px 0px var(--fb-blue);
      transition: 0.2s;
    }

    .home-button-container img:hover {
      transform: scale(1.1);
      box-shadow: 6px 6px 0px var(--aquamarine);
      border-color: var(--aquamarine);
    }

    /* --- Mobile Responsive --- */
    @media (max-width: 768px) {
      .plan-grid {
        grid-template-columns: 1fr; /* Single column on mobile */
        padding: 0 10px;
      }
      
      .portal-header {
        padding: 20px;
        width: 80%;
      }
      
      .portal-header h1 {
        font-size: 2rem;
      }
      
      .plan-card {
        height: auto;
        padding: 25px;
      }
    }
.plan-card:last-child { grid-column: 1 / -1; justify-self: center; width: 100%; max-width: 320px; }
</style>
