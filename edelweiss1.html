<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edelweiss Life - The Grand Collection</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Jost:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-deep: #1a0b2e;
            --grad-body: linear-gradient(125deg, #240b36, #102e4a, #004e92, #5a189a);
            --glass: rgba(255, 255, 255, 0.1);
            --border: rgba(255, 255, 255, 0.3);
            --text-glow: 0 0 10px rgba(255,255,255,0.8);
            
            /* Category Colors */
            --term-color: #00f260;
            --term-grad: linear-gradient(135deg, #0575E6, #021B79);
            
            --save-color: #ff00cc;
            --save-grad: linear-gradient(135deg, #b20a2c, #480048);
            
            --ulip-color: #00d2ff;
            --ulip-grad: linear-gradient(135deg, #134E5E, #71B280);
            
            --pen-color: #ffcc00;
            --pen-grad: linear-gradient(135deg, #F2994A, #F2C94C);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Jost', sans-serif;
            background: var(--grad-body);
            background-size: 400% 400%;
            animation: galaxyMove 15s ease infinite;
            min-height: 100vh;
            color: white;
            padding: 40px 20px;
        }

        @keyframes galaxyMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        header {
            text-align: center;
            margin-bottom: 60px;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 4rem;
            background: linear-gradient(to right, #fff, #00d2ff, #ff00cc, #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255,255,255,0.4);
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.2rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            border: 1px solid rgba(255,255,255,0.5);
            padding: 10px 30px;
            border-radius: 50px;
            display: inline-block;
            backdrop-filter: blur(5px);
        }

        /* GRID */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 40px;
            max-width: 1800px;
            margin: 0 auto;
            perspective: 2000px;
        }

        /* CARD */
        .card {
            height: 650px;
            position: relative;
            cursor: pointer;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        /* FACES */
        .front, .back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        /* FRONT */
        .front {
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            z-index: 2;
            transform: rotateY(0deg);
            backdrop-filter: blur(15px);
        }

        .icon-box {
            font-size: 3.5rem;
            margin-bottom: 20px;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.1);
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float { 0%,100% {transform: translateY(0);} 50% {transform: translateY(-10px);} }

        .plan-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            line-height: 1.2;
            text-transform: uppercase;
        }

        .cat-badge {
            font-size: 0.8rem;
            padding: 5px 15px;
            border-radius: 20px;
            border: 1px solid white;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .flip-hint {
            margin-top: auto;
            font-size: 0.8rem;
            opacity: 0.8;
            animation: pulse 2s infinite;
        }

        /* BACK */
        .back {
            transform: rotateY(180deg);
            background: #0f0518; /* Deep purple/black replacement */
            padding: 15px;
        }

        .back-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.3);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .back-title { font-weight: 700; font-size: 1rem; color: #fff; }

        .data-list {
            flex-grow: 1;
            overflow-y: auto;
            text-align: left;
            padding-right: 5px;
        }

        .data-list::-webkit-scrollbar { width: 5px; }
        .data-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.5); border-radius: 10px; }

        .data-row {
            margin-bottom: 8px;
            border-bottom: 1px dashed rgba(255,255,255,0.1);
            padding-bottom: 4px;
        }

        .label {
            display: block;
            font-size: 0.65rem;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .value {
            font-size: 0.85rem;
            color: #fff;
            font-weight: 500;
        }

        .usp-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 8px;
            border-radius: 8px;
            margin-top: 5px;
            font-size: 0.8rem;
        }

        @keyframes pulse { 0%,100% {opacity: 0.5;} 50% {opacity: 1;} }

    </style>
</head>
