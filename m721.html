<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIC Plan 721 - Money Back 25 Yrs Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --parrot-green: #44bd32;
            --parrot-light: #70e000;
            --black: #121212;
            --dark-grey: #2f3640;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, 0.95);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background: radial-gradient(circle at center, var(--dark-grey), #000);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            perspective: 1500px;
        }

        /* 3D Box & Mirror Effect */
        .calculator-3d-container {
            position: relative;
            width: 100%;
            max-width: 1000px;
            background: var(--white);
            border-radius: 30px;
            transform-style: preserve-3d;
            transform: rotateX(6deg);
            box-shadow: 0 50px 100px rgba(0,0,0,0.8);
            padding: 50px;
            border: 2px solid var(--parrot-green);
            /* Mirror Reflection Effect */
            -webkit-box-reflect: below 2px linear-gradient(transparent, transparent, rgba(255,255,255,0.1));
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 5px solid var(--parrot-green);
            padding-bottom: 15px;
        }

        .header h1 { color: var(--black); font-size: 28px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        .header p { color: var(--parrot-green); font-weight: 700; font-size: 15px; }

        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .input-box { position: relative; display: flex; flex-direction: column; }
        .input-box label { font-size: 12px; font-weight: 700; color: var(--black); margin-bottom: 8px; text-transform: uppercase; }
        .input-box i { position: absolute; right: 15px; top: 42px; color: var(--parrot-green); font-size: 20px; }

        input, select {
            padding: 15px 20px;
            border: 2px solid #edeff2;
            border-radius: 15px;
            font-size: 16px;
            font-weight: 600;
            outline: none;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        input:focus, select:focus { border-color: var(--parrot-green); background: #fff; box-shadow: 0 0 20px rgba(68, 189, 50, 0.2); }

        /* Benefit Type Toggle */
        .toggle-section {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            margin: 25px 0;
            background: #f0fff0;
            padding: 15px;
            border-radius: 60px;
        }

        .toggle-case {
            display: flex;
            width: 400px;
            height: 55px;
            background: var(--black);
            border-radius: 30px;
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }

        .toggle-opt {
            flex: 1;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: var(--parrot-green);
            transition: 0.3s;
            font-size: 14px;
        }

        .toggle-opt.active { color: #000; }
        .slider {
            position: absolute;
            left: 0;
            width: 50%;
            height: 100%;
            background: var(--parrot-green);
            border-radius: 30px;
            transition: 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1;
        }

        .calc-btn {
            grid-column: 1 / -1;
            background: var(--black);
            color: var(--parrot-green);
            border: 3px solid var(--parrot-green);
            padding: 22px;
            border-radius: 20px;
            font-size: 22px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.4s;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 20px;
        }

        .calc-btn:hover { background: var(--parrot-green); color: #000; transform: translateY(-5px); box-shadow: 0 15px 30px rgba(68, 189, 50, 0.4); }

        /* Results Display Section */
        #results {
            margin-top: 50px;
            display: none;
            background: #fdfdfd;
            padding: 40px;
            border-radius: 25px;
            border: 4px solid var(--parrot-green);
            animation: bounceIn 0.8s ease;
        }

        .res-item { display: flex; justify-content: space-between; padding: 16px 0; border-bottom: 2px dashed #eee; }
        .res-item:last-of-type { border: none; background: var(--black); color: var(--parrot-green); padding: 25px; border-radius: 20px; margin-top: 20px; }
        .res-label { font-weight: 600; font-size: 16px; }
        .res-val { font-weight: 700; font-size: 22px; }

        .formula-box {
            font-size: 12px;
            color: #777;
            text-align: center;
            margin-top: 25px;
            font-style: italic;
            background: #f1f2f6;
            padding: 15px;
            border-radius: 12px;
        }

        .action-row { display: flex; gap: 20px; margin-top: 40px; }
        .btn-foot { flex: 1; padding: 18px; border-radius: 15px; border: 2px solid var(--black); background: transparent; color: var(--black); font-weight: 800; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-foot:hover { background: var(--black); color: var(--parrot-green); }

        @keyframes bounceIn { from { opacity: 0; transform: translateY(100px); } to { opacity: 1; transform: translateY(0); } }
        
        .error-tag { color: #eb4d4b; font-size: 11px; font-weight: 700; margin-top: 6px; display: none; }
    </style>
</head>
<body>

<div class="calculator-3d-container">
    <div class="header">
        <h1>LIC-PLAN NO 721-MONEY BACK-25 YRS</h1>
        <p>PREMIUM & MATURITY CALCULATOR</p>
    </div>

    <div class="input-grid">
        <div class="input-box">
            <label>Policy Holder Name</label>
            <input type="text" id="name" placeholder="Full Name">
            <i class="fas fa-user-tie"></i>
        </div>

        <div class="input-box">
            <label>Age at Entry (13-45 Yrs)</label>
            <input type="number" id="age" value="30">
            <i class="fas fa-id-card"></i>
            <span id="age-err" class="error-tag">Entry Age must be between 13 and 45</span>
        </div>

        <div class="input-box">
            <label>Sum Assured (Min 2,00,000)</label>
            <input type="number" id="sa" value="200000" step="25000">
            <i class="fas fa-piggy-bank"></i>
            <span id="sa-err" class="error-tag">Min ₹2,00,000 in multiples of 25,000</span>
        </div>

        <div class="input-box">
            <label>Policy Term</label>
            <select id="term" onchange="autoPopulatePPT()">
                <option value="25">25 Years</option>
            </select>
            <i class="fas fa-clock"></i>
        </div>

        <div class="input-box">
            <label>Premium Paying Term (PPT)</label>
            <input type="number" id="ppt" value="20" disabled>
            <i class="fas fa-hourglass-end"></i>
        </div>

        <div class="input-box">
            <label>Premium Mode</label>
            <select id="mode">
                <option value="yly">Yearly</option>
                <option value="hly">Half-Yearly</option>
                <option value="qly">Quarterly</option>
                <option value="mly">Monthly (NACH)</option>
                <option value="single">Single Premium</option>
            </select>
            <i class="fas fa-wallet"></i>
        </div>

        <div class="input-box">
            <label>Premium Amount (Excl. Tax)</label>
            <input type="number" id="premium_val" value="12573">
            <i class="fas fa-coins"></i>
        </div>

        <div class="input-box">
            <label>Bonus Rate (Default 40)</label>
            <input type="number" id="bonus_rate" value="40">
            <i class="fas fa-chart-line"></i>
        </div>

        <div class="input-box">
            <label>FAB Rate (Default 25)</label>
            <input type="number" id="fab_rate" value="25">
            <i class="fas fa-award"></i>
        </div>

        <div class="toggle-section">
            <div class="toggle-case" onclick="handleBenefitToggle()">
                <div class="slider" id="slider"></div>
                <div class="toggle-opt active" id="opt_mat">SURVIVAL TILL MATURITY</div>
                <div class="toggle-opt" id="opt_death">DEATH BENEFIT</div>
            </div>
        </div>

        <div class="input-box" id="death_occurrence" style="display:none; grid-column: 1 / -1;">
            <label>Policy Year of Death</label>
            <input type="number" id="death_yr" value="10">
            <i class="fas fa-calendar-times"></i>
        </div>

        <button class="calc-btn" onclick="processCalculation()">
            <i class="fas fa-calculator"></i> Calculate Final Benefit
        </button>
    </div>

    <div id="results">
        <div id="res_inject"></div>
        <div class="action-row">
            <button class="btn-foot" onclick="window.print()"><i class="fas fa-print"></i> Print PDF</button>
            <button class="btn-foot" onclick="alert('PDF Generated for Sharing')"><i class="fas fa-share-alt"></i> Share Report</button>
        </div>
    </div>
</div>

<script>
    function autoPopulatePPT() {
        // Plan 721 always has PPT = 20 for Term = 25
        document.getElementById('ppt').value = 20;
    }

    let isDeathActive = false;
    function handleBenefitToggle() {
        isDeathActive = !isDeathActive;
        const slider = document.getElementById('slider');
        const dUI = document.getElementById('death_occurrence');
        if(isDeathActive) {
            slider.style.left = '50%';
            dUI.style.display = 'block';
            document.getElementById('opt_death').classList.add('active');
            document.getElementById('opt_mat').classList.remove('active');
        } else {
            slider.style.left = '0';
            dUI.style.display = 'none';
            document.getElementById('opt_mat').classList.add('active');
            document.getElementById('opt_death').classList.remove('active');
        }
    }

    function processCalculation() {
        const name = document.getElementById('name').value || "Valued Client";
        const age = parseInt(document.getElementById('age').value);
        const sa = parseFloat(document.getElementById('sa').value);
        const term = 25;
        const ppt = 20;
        const prem = parseFloat(document.getElementById('premium_val').value);
        const bRate = parseFloat(document.getElementById('bonus_rate').value);
        const fRate = parseFloat(document.getElementById('fab_rate').value);
        const dYear = parseInt(document.getElementById('death_yr').value);

        // Validation Logic
        let hasError = false;
        if(age < 13 || age > 45) { document.getElementById('age-err').style.display='block'; hasError=true; }
        else document.getElementById('age-err').style.display='none';
        
        if(sa < 200000 || sa % 25000 !== 0) { document.getElementById('sa-err').style.display='block'; hasError=true; }
        else document.getElementById('sa-err').style.display='none';

        if(hasError) return;

        const totalBonus = (sa/1000) * bRate * (isDeathActive ? dYear : term);
        const fab = (sa >= 200000) ? (sa/1000) * fRate : 0;
        
        let html = `<h3>Plan 721 Benefit Report: ${name}</h3><br>`;

        if(!isDeathActive) {
            // Maturity Payout for Plan 721 is 40% of BSA (since 60% was paid as Money Back installments)
            const maturitySA = sa * 0.40;
            const totalPaid = prem * ppt;
            const finalMaturity = maturitySA + totalBonus + fab;
            html += `
                <div class="res-item"><span class="res-label">Basic Sum Assured:</span><span class="res-val">₹ ${sa.toLocaleString()}</span></div>
                <div class="res-item"><span class="res-label">Maturity Sum Assured (40% of BSA):</span><span class="res-val">₹ ${maturitySA.toLocaleString()}</span></div>
                <div class="res-item"><span class="res-label">Total Accrued Bonus:</span><span class="res-val">₹ ${totalBonus.toLocaleString()}</span></div>
                <div class="res-item"><span class="res-label">Final Additional Bonus (FAB):</span><span class="res-val">₹ ${fab.toLocaleString()}</span></div>
                <div class="res-item"><span class="res-label">Total Premium Paid:</span><span class="res-val">₹ ${totalPaid.toLocaleString()}</span></div>
                <div class="res-item"><span class="res-label">FINAL MATURITY BENEFIT:</span><span class="res-val">₹ ${finalMaturity.toLocaleString()}</span></div>
                <div class="formula-box">Formula: [40% of Basic Sum Assured] + [Vested Bonuses] + [FAB]</div>
            `;
        } else {
            // Death Logic: Risk is immediate for Plan 721 as min age is 13.
            // Death Sum Assured = Higher of 125% BSA or 7x Annual Premium.
            const saOnDeath = Math.max(1.25 * sa, 7 * prem);
            const totalPaidTillDeath = prem * Math.min(dYear, ppt);
            const finalDeathBenefit = saOnDeath + totalBonus + fab;

            html += `
                <div class="res-item"><span class="res-label">Basic Sum Assured:</span><span class="res-val">₹ ${sa.toLocaleString()}</span></div>
                <div class="res-item"><span class="res-label">Sum Assured on Death (125% of BSA):</span><span class="res-val">₹ ${saOnDeath.toLocaleString()}</span></div>
                <div class="res-item"><span class="res-label">Accrued Bonus till Death:</span><span class="res-val">₹ ${totalBonus.toLocaleString()}</span></div>
                <div class="res-item"><span class="res-label">Final Additional Bonus:</span><span class="res-val">₹ ${fab.toLocaleString()}</span></div>
                <div class="res-item"><span class="res-label">Total Premium Paid till Death:</span><span class="res-val">₹ ${totalPaidTillDeath.toLocaleString()}</span></div>
                <div class="res-item"><span class="res-label">FINAL DEATH BENEFIT PAYABLE:</span><span class="res-val">₹ ${finalDeathBenefit.toLocaleString()}</span></div>
                <div class="formula-box">Formula: [Higher of 125% of BSA or 7x Premium] + [Accrued Bonus till Death] + [FAB]</div>
            `;
        }

        document.getElementById('res_inject').innerHTML = html;
        document.getElementById('results').style.display = 'block';
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }
</script>

</body>
</html>
