<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIC Plan 912 Nav-Jeevan Shree Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --black: #000000;
            --white: #ffffff;
            --grey: #f4f4f4;
            --accent: #333333;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background-color: #050505;
            background-image: radial-gradient(circle at center, #222 0%, #000 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
            perspective: 2000px;
        }

        /* 3D Box & Mirror Effect */
        .box-3d {
            position: relative;
            width: 100%;
            max-width: 950px;
            background: var(--white);
            border-radius: 20px;
            transform-style: preserve-3d;
            transform: rotateX(7deg);
            box-shadow: 0 50px 100px rgba(255, 255, 255, 0.1);
            padding: 45px;
            border: 1px solid var(--black);
            -webkit-box-reflect: below 2px linear-gradient(transparent, transparent, rgba(255, 255, 255, 0.1));
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 3px solid var(--black);
            padding-bottom: 10px;
        }

        .header h1 { 
            font-family: 'Orbitron', sans-serif;
            color: var(--black); 
            font-size: 24px; 
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .input-group { position: relative; display: flex; flex-direction: column; }
        .input-group label { font-size: 11px; font-weight: 800; color: var(--black); margin-bottom: 5px; text-transform: uppercase; }
        .input-group i { position: absolute; right: 15px; top: 38px; color: #555; }

        input, select {
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            transition: 0.3s;
            background: #fafafa;
        }

        input:focus, select:focus { border-color: var(--black); background: white; }

        /* Benefit Toggle */
        .toggle-section {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }

        .toggle-box {
            display: flex;
            width: 360px;
            height: 50px;
            background: var(--black);
            border-radius: 25px;
            position: relative;
            cursor: pointer;
            padding: 5px;
        }

        .toggle-label {
            flex: 1;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #fff;
            transition: 0.3s;
            font-size: 12px;
        }

        .toggle-label.active { color: var(--black); }

        .slider {
            position: absolute;
            left: 5px;
            width: 175px;
            height: 40px;
            background: var(--white);
            border-radius: 25px;
            transition: 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1;
        }

        .calc-btn {
            grid-column: 1 / -1;
            background: var(--black);
            color: white;
            border: none;
            padding: 20px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            margin-top: 10px;
        }

        .calc-btn:hover { background: #333; transform: translateY(-3px); }

        /* Results Display */
        #results {
            margin-top: 30px;
            display: none;
            padding: 30px;
            background: var(--grey);
            border-radius: 15px;
            border-left: 10px solid var(--black);
            animation: slideIn 0.5s ease;
        }

        .res-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #ddd; }
        .res-row.final { background: var(--black); color: white; padding: 15px; border-radius: 10px; margin-top: 10px; }
        .res-val { font-weight: 800; }
        .formula { font-size: 11px; color: #666; text-align: center; margin-top: 15px; font-style: italic; background: #ddd; padding: 10px; border-radius: 5px;}

        .error-msg { color: #e74c3c; font-size: 11px; font-weight: 700; margin-top: 5px; display: none; }

        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .btn-s { flex: 1; padding: 12px; border-radius: 8px; border: 2px solid var(--black); background: transparent; cursor: pointer; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
        .btn-s:hover { background: var(--black); color: white; }

        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="box-3d">
    <div class="header">
        <h1>LIC-PLAN NO 912 NAV-JEEVAN SHREE</h1>
        <p style="font-weight: 700; font-size: 12px; color: #666;">MATURITY & BENEFIT CALCULATOR</p>
    </div>

    <div class="input-grid">
        <div class="input-group">
            <label><i class="fas fa-user"></i> Policy Holder Name</label>
            <input type="text" id="name" placeholder="Enter Name">
        </div>

        <div class="input-group">
            <label><i class="fas fa-id-card"></i> Age at Entry (Max 60)</label>
            <input type="number" id="age" value="35">
            <span id="age-err" class="error-msg"></span>
        </div>

        <div class="input-group">
            <label><i class="fas fa-shield-alt"></i> Sum Assured (Min 5,00,000)</label>
            <input type="number" id="sa" value="500000" step="10000">
            <span id="sa-err" class="error-msg">Min Sum Assured is 5 Lakhs</span>
        </div>

        <div class="input-group">
            <label><i class="fas fa-calendar-alt"></i> Policy Term (10-20 Yrs)</label>
            <select id="term" onchange="syncPPT()">
                <option value="10">10 Years</option>
                <option value="11">11 Years</option>
                <option value="12">12 Years</option>
                <option value="13">13 Years</option>
                <option value="14">14 Years</option>
                <option value="15" selected>15 Years</option>
                <option value="16">16 Years</option>
                <option value="17">17 Years</option>
                <option value="18">18 Years</option>
                <option value="19">19 Years</option>
                <option value="20">20 Years</option>
            </select>
        </div>

        <div class="input-group">
            <label><i class="fas fa-hourglass-half"></i> PPT (Limited Premium)</label>
            <select id="ppt">
                <!-- Serialwise PPT populated by JS -->
            </select>
        </div>

        <div class="input-group">
            <label><i class="fas fa-wallet"></i> Mode of Premium</label>
            <select id="mode">
                <option value="1.0000">Yearly</option>
                <option value="1.0186">Half-Yearly</option>
                <option value="1.0280">Quarterly</option>
                <option value="1.0344">Monthly</option>
            </select>
        </div>

        <div class="input-group">
            <label><i class="fas fa-coins"></i> Tabular Annual Premium</label>
            <input type="number" id="premium" value="34480">
        </div>

        <div class="input-group">
            <label><i class="fas fa-percentage"></i> GA Rate (Enter %)</label>
            <input type="number" id="ga_rate_input" value="9.0" step="0.1">
        </div>

        <div class="input-group">
            <label><i class="fas fa-list-ul"></i> Survival Option</label>
            <select id="surv_opt">
                <option value="A">Option A (50% SA at end of PPT)</option>
                <option value="B">Option B (7.5% SA Every 2nd Year)</option>
                <option value="C">Option C (15% SA Every 4th Year)</option>
            </select>
        </div>

        <div class="input-group">
            <label><i class="fas fa-user-shield"></i> Death Benefit Option</label>
            <select id="death_opt">
                <option value="I">Option I (7x Prem or SA)</option>
                <option value="II">Option II (10x Prem or SA)</option>
            </select>
        </div>

        <div class="toggle-section">
            <div class="toggle-box" onclick="toggleBenefit()">
                <div id="slider" class="slider"></div>
                <div id="l-surv" class="toggle-label active">SURVIVAL (MATURITY)</div>
                <div id="l-death" class="toggle-label">DEATH BENEFIT</div>
            </div>
        </div>

        <div id="death_ui" class="input-group" style="display:none; grid-column: 1 / -1;">
            <label><i class="fas fa-calendar-times"></i> Estimated Year of Death</label>
            <input type="number" id="death_yr" value="10" min="1">
        </div>

        <button class="calc-btn" onclick="calculate()">
            <i class="fas fa-bolt"></i> Calculate Final Benefit
        </button>
    </div>

    <div id="results">
        <div id="res-data"></div>
        <div class="btn-group">
            <button class="btn-s" onclick="window.print()"><i class="fas fa-file-pdf"></i> Print PDF</button>
            <button class="btn-s" onclick="alert('Shared Successfully')"><i class="fas fa-share-alt"></i> Share PDF</button>
        </div>
    </div>
</div>

<script>
    // Logic Matrix from Page 3
    function syncPPT() {
        const term = parseInt(document.getElementById('term').value);
        const pptSelect = document.getElementById('ppt');
        pptSelect.innerHTML = "";
        
        const serialPPTs = [6, 8, 10, 12, 15];
        serialPPTs.forEach(p => {
            let possible = false;
            if(p == 6 && term >= 10) possible = true;
            if((p == 8 || p == 10) && term >= 15) possible = true;
            if(p == 12 && term >= 16) possible = true;
            if(p == 15 && term >= 18) possible = true;

            if(possible) {
                let opt = document.createElement("option");
                opt.value = p; opt.text = p + " Years";
                pptSelect.appendChild(opt);
            }
        });
    }

    let isDeath = false;
    function toggleBenefit() {
        isDeath = !isDeath;
        const slider = document.getElementById('slider');
        const deathUI = document.getElementById('death_ui');
        const lSurv = document.getElementById('l-surv');
        const lDeath = document.getElementById('l-death');

        if(isDeath) {
            slider.style.left = '180px';
            deathUI.style.display = 'block';
            lDeath.classList.add('active');
            lSurv.classList.remove('active');
        } else {
            slider.style.left = '5px';
            deathUI.style.display = 'none';
            lSurv.classList.add('active');
            lDeath.classList.remove('active');
        }
    }

    function calculate() {
        const name = document.getElementById('name').value || "Valued Client";
        const age = parseInt(document.getElementById('age').value);
        const sa = parseFloat(document.getElementById('sa').value);
        const term = parseInt(document.getElementById('term').value);
        const ppt = parseInt(document.getElementById('ppt').value);
        const premium = parseFloat(document.getElementById('premium').value);
        const gaRate = parseFloat(document.getElementById('ga_rate_input').value) / 100;
        const dOpt = document.getElementById('death_opt').value;
        const sOpt = document.getElementById('surv_opt').value;
        const deathYr = parseInt(document.getElementById('death_yr').value);

        // Validations
        document.querySelectorAll('.error-msg').forEach(e => e.style.display = 'none');
        let valid = true;

        if (sa < 500000) { document.getElementById('sa-err').style.display='block'; valid = false; }
        const ageLimits = { 6:60, 8:60, 10:60, 12:59, 15:57 };
        if (age > ageLimits[ppt]) { 
            const err = document.getElementById('age-err');
            err.innerText = `Max Entry Age for PPT ${ppt} is ${ageLimits[ppt]}`;
            err.style.display='block'; 
            valid = false; 
        }
        if (age + term > 75) { alert("Maturity age exceeds 75 years!"); valid = false; }

        if (!valid) return;

        // GA Logic: End of each year (Page 5)
        const totalGA = (premium * gaRate) * term;
        const totalPaid = premium * ppt * parseFloat(document.getElementById('mode').value);

        let html = `<h3 style="color:var(--black); text-align:center; margin-bottom:15px;">Report for ${name}</h3>`;

        if (!isDeath) {
            const finalMaturity = sa + totalGA;
            html += `
                <div class="res-row"><span>Basic Sum Assured:</span><span class="res-val">₹ ${sa.toLocaleString()}</span></div>
                <div class="res-row"><span>Survival Option:</span><span class="res-val">Option ${sOpt}</span></div>
                <div class="res-row"><span>Accrued Guaranteed Addition:</span><span class="res-val">₹ ${totalGA.toLocaleString()}</span></div>
                <div class="res-row"><span>Total Premium Paid:</span><span class="res-val">₹ ${totalPaid.toLocaleString()}</span></div>
                <div class="res-row final"><span>FINAL BENEFIT PAYABLE:</span><span class="res-val">₹ ${finalMaturity.toLocaleString()}</span></div>
                <div class="formula">Formula: Basic Sum Assured + Total Accrued Guaranteed Additions (at end of policy term)</div>
            `;
        } else {
            const gaTillDeath = (premium * gaRate) * Math.min(deathYr, term);
            const saOnDeath = (dOpt === "I") ? Math.max(sa, 7 * premium) : Math.max(sa, 10 * premium);
            const finalDeathBenefit = saOnDeath + gaTillDeath;

            html += `
                <div class="res-row"><span>Basic Sum Assured:</span><span class="res-val">₹ ${sa.toLocaleString()}</span></div>
                <div class="res-row"><span>Sum Assured on Death (Option ${dOpt}):</span><span class="res-val">₹ ${saOnDeath.toLocaleString()}</span></div>
                <div class="res-row"><span>Accrued GA till death:</span><span class="res-val">₹ ${gaTillDeath.toLocaleString()}</span></div>
                <div class="res-row final"><span>FINAL DEATH BENEFIT:</span><span class="res-val">₹ ${finalDeathBenefit.toLocaleString()}</span></div>
                <div class="formula">Formula: Higher of (BSA or ${dOpt === 'I' ? '7' : '10'}x Annual Premium) + Accrued GA till year of death</div>
            `;
        }

        document.getElementById('res-data').innerHTML = html;
        document.getElementById('results').style.display = 'block';
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    // Init
    syncPPT();
</script>

</body>
</html>
