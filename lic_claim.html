<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIC Claim Command Center</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --crimson: #990000;
            --crimson-dark: #660000;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #f5f5f5 0%, #e0e0e0 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* --- 3D MIRROR TITLE --- */
        .header-container {
            margin-bottom: 80px;
            perspective: 1000px;
            text-align: center;
        }

        .title-3d {
            font-family: 'Playfair Display', serif;
            font-size: 6rem;
            color: var(--crimson);
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: 10px;
            position: relative;
            display: inline-block;
            transform: rotateX(15deg);
            /* 3D Depth Effect */
            text-shadow: 
                0 1px 0 #ccc, 
                0 2px 0 #c9c9c9, 
                0 3px 0 #bbb, 
                0 4px 0 #b9b9b9, 
                0 5px 0 #aaa, 
                0 6px 1px rgba(0,0,0,.1), 
                0 0 5px rgba(0,0,0,.1), 
                0 1px 3px rgba(0,0,0,.3), 
                0 3px 5px rgba(0,0,0,.2), 
                0 5px 10px rgba(0,0,0,.25), 
                0 10px 10px rgba(0,0,0,.2), 
                0 20px 20px rgba(0,0,0,.15);
            /* Mirror Effect */
            -webkit-box-reflect: below -30px linear-gradient(transparent, rgba(0,0,0,0.1));
        }

        @media (max-width: 768px) {
            .title-3d { font-size: 3rem; letter-spacing: 5px; }
        }

        /* --- BUTTON CONTAINER --- */
        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 90%;
            max-width: 600px;
            z-index: 10;
        }

        /* --- STYLISH TABS --- */
        .claim-tab {
            text-decoration: none;
            display: flex;
            align-items: center;
            padding: 20px 30px;
            background: var(--white);
            border-left: 8px solid var(--crimson);
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .claim-tab i {
            font-size: 1.8rem;
            color: var(--crimson);
            margin-right: 25px;
            transition: all 0.4s;
        }

        .claim-tab span {
            font-size: 1.1rem;
            font-weight: 700;
            color: #333;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.4s;
        }

        /* --- HOVER EFFECTS --- */
        .claim-tab:hover {
            transform: scale(1.05) translateX(20px);
            background: var(--crimson);
            border-left-color: #ff4d4d;
        }

        .claim-tab:hover i {
            color: var(--white);
            transform: rotate(360deg);
        }

        .claim-tab:hover span {
            color: var(--white);
        }

        /* Shine animation */
        .claim-tab::after {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: 0.5s;
        }

        .claim-tab:hover::after {
            left: 100%;
        }

        /* --- BACKGROUND DECOR --- */
        .bg-crimson-circle {
            position: fixed;
            width: 500px;
            height: 500px;
            background: var(--crimson);
            opacity: 0.03;
            border-radius: 50%;
            z-index: -1;
        }

        .circle-1 { top: -100px; right: -100px; }
        .circle-2 { bottom: -100px; left: -100px; }

    </style>
</head>
<body>

    <div class="bg-crimson-circle circle-1"></div>
    <div class="bg-crimson-circle circle-2"></div>

    <div class="header-container">
        <h1 class="title-3d">Claim Process</h1>
    </div>

    <nav class="menu-container">
        
        <!-- Tab 1 -->
        <a href="death_claim.html" class="claim-tab">
            <i class="fa-solid fa-hand-holding-heart"></i>
            <span>1. Death Claim Process</span>
        </a>

        <!-- Tab 2 -->
        <a href="maturity_claim.html" class="claim-tab">
            <i class="fa-solid fa-calendar-check"></i>
            <span>2. Maturity Claim Process</span>
        </a>

        <!-- Tab 3 -->
        <a href="SB_claim.html" class="claim-tab">
            <i class="fa-solid fa-sack-dollar"></i>
            <span>3. Survival Benefit Process</span>
        </a>

        <!-- Tab 4 -->
        <a href="accident_rider_claim.html" class="claim-tab">
            <i class="fa-solid fa-ambulance"></i>
            <span>4. Accident & Rider Claim Process</span>
        </a>

        <!-- Tab 5 -->
        <a href="pension_claim.html" class="claim-tab">
            <i class="fa-solid fa-house-user"></i>
            <span>5. Pension Claim Process</span>
        </a>

    </nav>

    <p style="margin-top: 50px; color: #888; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 2px;">
        LIC of India • Secure Your Future
    </p>

</body>
</html>
