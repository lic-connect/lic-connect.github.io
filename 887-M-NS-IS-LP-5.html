    function calculatePremium() {
        const age = parseInt(document.getElementById('age').value);
        const term = parseInt(document.getElementById('term').value);
        const sa = parseFloat(document.getElementById('sa').value);
        const mode = document.getElementById('mode').value;
        const online = document.getElementById('isOnline').checked;
        const ab = document.getElementById('isAB').checked;

        // Validations
        if (sa < 20000000) { alert("Min Sum Assured is 2 Crore."); return; }
        const ageData = tabularRates.find(r => r.Age === age);
        if (!ageData || !ageData[`T${term}`]) {
            alert("Rate not found for this Age/Term in sample data.");
            return;
        }

        const rate = ageData[`T${term}`];
        
        // 1. Calculate Yearly Tabular Premium
        const yearlyTabular = (sa / 1000) * rate;

        // 2. High Sum Assured Rebate (Option II)
        let hsaPerc = 0;
        const saCr = sa / 10000000;
        if (saCr >= 3) {
            if (age <= 35) hsaPerc = saCr < 5 ? 2.00 : (saCr < 10 ? 3.00 : 3.50);
            else if (age <= 55) hsaPerc = saCr < 5 ? 1.50 : (saCr < 10 ? 2.00 : 2.50);
            else hsaPerc = saCr < 5 ? 1.00 : (saCr < 10 ? 1.50 : 2.00);
        }
        const hsaRebate = yearlyTabular * (hsaPerc / 100);

        // 3. Online Sale Rebate (7.5% for Limited Pay)
        const onlineRebate = online ? (yearlyTabular * 0.075) : 0;

        // 4. Mode Factors
        const modeFactors = { "yly": 1, "hly": 0.51, "qly": 0.26, "mly": 0.0861 };
        const modeLabels = { "yly": "Yearly", "hly": "Half-Yearly", "qly": "Quarterly", "mly": "Monthly" };
        
        const netYearly = yearlyTabular - hsaRebate - onlineRebate;
        const modalBasePremium = netYearly * modeFactors[mode];

        // 5. Accident Benefit Rider (Provisional Annual rate ~ 1.00 per 1000 SA)
        let modalAB = 0;
        if (ab) {
            const abSA = Math.min(sa, 10000000); // Capped at 1Cr
            const yearlyAB = (abSA / 1000) * 0.50; 
            modalAB = yearlyAB * modeFactors[mode];
        }

        const finalPremium = modalBasePremium + modalAB;

        // Display
        document.getElementById('results').style.display = 'block';
        document.getElementById('outTabular').innerText = Math.round(yearlyTabular).toLocaleString('en-IN');
        document.getElementById('outHSA').innerText = "- " + Math.round(hsaRebate).toLocaleString('en-IN');
        document.getElementById('outOnline').innerText = "- " + Math.round(onlineRebate).toLocaleString('en-IN');
        document.getElementById('outModalBase').innerText = Math.round(modalBasePremium).toLocaleString('en-IN');
        document.getElementById('outAB').innerText = Math.round(modalAB).toLocaleString('en-IN');
        document.getElementById('modeLabel').innerText = modeLabels[mode] + " Premium";
        document.getElementById('outTotal').innerText = "₹ " + Math.round(finalPremium).toLocaleString('en-IN');
    }
</script>
