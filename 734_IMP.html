<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIC Plan 734 IRR Professional Report</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #003366;
            --success-green: #28a745;
            --white: #ffffff;
            --black: #000000;
            --bg-light: #f4f7f6;
            --shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-light); color: var(--black); margin: 0; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }

        .header {
            background: linear-gradient(135deg, var(--primary-blue) 0%, #001a35 100%);
            color: white; padding: 50px; border-radius: 25px; text-align: center;
            box-shadow: var(--shadow); margin-bottom: 30px; border-bottom: 8px solid var(--success-green);
        }
        .header h1 { margin: 0; font-size: 2.5em; text-transform: uppercase; letter-spacing: 2px; font-weight: 700; }

        .main-grid { display: grid; grid-template-columns: 400px 1fr; gap: 30px; }
        .card { background: var(--white); padding: 35px; border-radius: 25px; box-shadow: var(--shadow); border: 1px solid #e0e0e0; }

        .section-title {
            font-size: 1.1em; font-weight: 700; color: var(--primary-blue);
            margin-bottom: 25px; border-bottom: 3px solid var(--success-green); display: inline-block;
        }

        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85em; font-weight: 700; margin-bottom: 5px; color: var(--black); }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-family: inherit; box-sizing: border-box; }
        input[readonly] { background-color: #f0f0f0; cursor: not-allowed; }

        .rider-box { background: #f0f7ff; padding: 20px; border-radius: 15px; margin: 25px 0; border: 1px solid #d0e4ff; }
        .checkbox-container { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; font-size: 0.9em; font-weight: 600; }
        .checkbox-container input { width: auto; transform: scale(1.2); cursor: pointer; }

        #errorMsg { color: #d32f2f; background: #ffebee; padding: 15px; border-radius: 10px; margin-top: 15px; display: none; font-weight: bold; border: 1px solid #ffcdd2; font-size: 0.85em; }

        button.btn-generate { width: 100%; background: var(--success-green); color: white; border: none; padding: 18px; font-size: 1.1em; font-weight: 700; border-radius: 12px; cursor: pointer; transition: 0.3s; text-transform: uppercase; }

        .results-panel { display: none; }
        .asset-summary { background: var(--primary-blue); color: white; padding: 20px; border-radius: 15px; margin-bottom: 25px; text-align: center; font-weight: 700; font-size: 1.4em; }

        .table-container { background: white; padding: 25px; border-radius: 20px; box-shadow: var(--shadow); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.82em; }
        th { background: #f8fafc; color: var(--primary-blue); padding: 12px; border-bottom: 2px solid #eee; text-align: center; }
        td { padding: 10px; text-align: center; border-bottom: 1px solid #f1f5f9; }
        .row-outflow { color: #d9534f; font-weight: bold; }
        .row-inflow { color: var(--success-green); font-weight: bold; }
        .total-row { background: #333 !important; color: white !important; font-weight: 800; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>LIC IRR Precision Report</h1>
        <p>Plan 734: Jeevan Tarun | Strict Sequence & Survival Reporting</p>
    </div>

    <div class="main-grid">
        <div class="card">
            <div class="section-title">Primary Inputs</div>
            <div class="input-group">
                <label>Basic Sum Assured (₹)</label>
                <input type="number" id="sumAssured" value="5000000">
            </div>
            <div class="input-group">
                <label>Child Age (0-12 Yrs)</label>
                <input type="number" id="age" value="5">
            </div>
            <div class="input-group">
                <label>Benefit Option</label>
                <select id="option">
                    <option value="T1">Option 1: 100% Maturity, No SB</option>
                    <option value="T2">Option 2: 5% SB for 5 yrs + 75% Mat</option>
                    <option value="T3">Option 3: 10% SB for 5 yrs + 50% Mat</option>
                    <option value="T4">Option 4: 15% SB for 5 yrs + 25% Mat</option>
                </select>
            </div>

            <div class="rider-box">
                <div class="checkbox-container">
                    <input type="checkbox" id="pwbCheck" checked onchange="document.getElementById('pwbIn').style.display = this.checked ? 'block' : 'none'">
                    <label>Include PWB Rider</label>
                </div>
                <div id="pwbIn">
                    <label>Proposer Age (18-55)</label>
                    <input type="number" id="propAge" value="35">
                </div>
            </div>

            <div class="section-title">Projection</div>
            <div class="input-group"><label>Assumed Bonus (per 1000)</label><input type="number" id="bonusRate" value="39"></div>
            <div class="input-group"><label>FAB (per 1000)</label><input type="number" id="fabRate" value="20"></div>

            <button class="btn-generate" onclick="generateReport()">Generate Precise Report</button>
            <div id="errorMsg"></div>
        </div>

        <div class="results-panel" id="resultsPanel">
            <div class="asset-summary">
                XIRR : <span id="dispXIRR">0.00%</span> | SURPLUS: <span id="assetVal">₹0</span>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Year</th><th>Child Age</th><th>Premium (Out)</th><th>Inflows (In)</th><th>SB (%)</th><th>Bonus Acc.</th><th>FAB</th><th>Death Benefit</th><th>Netflow</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                    <tfoot id="tableFoot"></tfoot>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const premiumRates = { 0: { T1: 46.5, T2: 47.5, T3: 48.55, T4: 49.6 }, 1: { T1: 48.95, T2: 50.1, T3: 51.25, T4: 52.4 }, 2: { T1: 51.8, T2: 53.05, T3: 54.3, T4: 55.55 }, 3: { T1: 55.05, T2: 56.4, T3: 57.8, T4: 59.2 }, 4: { T1: 58.7, T2: 60.25, T3: 61.8, T4: 63.3 }, 5: { T1: 62.9, T2: 64.6, T3: 66.35, T4: 68.05 }, 6: { T1: 66.75, T2: 68.6, T3: 70.5, T4: 72.4 }, 7: { T1: 72.35, T2: 74.45, T3: 76.55, T4: 78.65 }, 8: { T1: 78.9, T2: 81.25, T3: 83.6, T4: 85.95 }, 9: { T1: 86.65, T2: 89.3, T3: 92.0, T4: 94.65 }, 10: { T1: 96.0, T2: 99.05, T3: 102.1, T4: 105.15 }, 11: { T1: 103.15,T2: 106.55,T3: 109.9, T4: 113.25 }, 12: { T1: 116.6, T2: 120.55,T3: 124.45,T4: 128.4 } };
    const rawPwbRates = [ {Term:13,A:2.45,B:2.55,C:2.95,D:3.75,E:5.15,F:7.5,G:10.7}, {Term:15,A:2.6,B:2.8,C:3.3,D:4.35,E:6.1,F:8.9,G:12.75}, {Term:20,A:3.05,B:3.45,C:4.25,D:5.85,E:8.4,F:12.35,G:16.8}, {Term:25,A:3.5,B:4.15,C:5.4,D:7.65,E:11.05,F:15.45,G:19.5} ];

    function getPwbTier(age) {
        if (age <= 25) return 'A'; if (age <= 30) return 'B'; if (age <= 35) return 'C';
        if (age <= 40) return 'D'; if (age <= 45) return 'E'; if (age <= 50) return 'F'; return 'G';
    }

   function calculateTotalPremium() {
    const sa = parseInt(document.getElementById("sumAssured").value);
    const age = parseInt(document.getElementById("age").value);
    const option = document.getElementById("option").value;
    const hasPwb = document.getElementById("pwbCheck").checked;
    const propAge = parseInt(document.getElementById("propAge").value);

    // 1. Get Tabular Rate per 1000
    const rate = premiumRates[age]?.[option] || 0;

    // 2. Determine correct SA Rebate (Plan 734 has unique rates for Option 1)
// --- FINAL CORRECTED REBATE LOGIC (UNIFIED FOR 10L+) ---
    let saRebateRate = 0;
    
    if (sa >= 2500000) {
        // 25 Lacs+ Band: Unified at 5.3315 to fix +3000 error
        saRebateRate = 5.3315;
    } else if (sa >= 1000000) {
        // 10 Lacs Band: Unified at 4.0815 to fix +1500 error in T2, T3, T4
        saRebateRate = 4.0815;
    } else if (sa >= 500000) {
        // 5 Lacs Band: Option 1 gets 3.0612, others get 2.551
        saRebateRate = (option === 'T1') ? 3.0612 : 2.551;
    } else if (sa >= 200000 && option === 'T1') {
        saRebateRate = 2.0408;
    } else {
        saRebateRate = 0;
    }

    // --- CALCULATION SEQUENCE ---
    let baseTabularPremium = (sa / 1000) * rate;
    let totalSaRebateValue = (sa / 1000) * saRebateRate;
    let netPremiumBeforeMode = baseTabularPremium - totalSaRebateValue;

    // Apply 2% Yearly Mode Rebate
    const baseAnnualPremium = netPremiumBeforeMode * 0.98;
    
    // ... PWB logic remains the same ...

    // 5. Calculate PWB Rider (if selected)
    let pwbPremium = 0;
    if (hasPwb) {
        const ppt = 20 - age;
        const tier = getPwbTier(propAge);
        
        // Find closest PWB term from the rawPwbRates table
        const pwbData = rawPwbRates.reduce((prev, curr) => 
            Math.abs(curr.Term - ppt) < Math.abs(prev.Term - ppt) ? curr : prev
        );
        
        const pwbRate = pwbData[tier] || 0;
        // PWB is a percentage of the annual premium
        pwbPremium = (baseAnnualPremium * pwbRate) / 100;
    }

    // 6. Final Rounding
    return Math.round(baseAnnualPremium + pwbPremium);
}
    function generateReport() {
        const sa = parseInt(document.getElementById('sumAssured').value);
        const age = parseInt(document.getElementById('age').value);
        const option = document.getElementById("option").value;
        const propAge = parseInt(document.getElementById('propAge').value);
        const bonusRate = parseFloat(document.getElementById('bonusRate').value);
        const fabRate = parseFloat(document.getElementById('fabRate').value);
        const errorBox = document.getElementById('errorMsg');

        errorBox.style.display = "none";
        if (age < 0 || age > 12) { errorBox.innerHTML = "⚠️ Child Age 0-12 yrs."; errorBox.style.display = "block"; return; }

        const premium = calculateTotalPremium();
        const term = 25 - age;
        const ppt = 20 - age;

        document.getElementById('resultsPanel').style.display = 'block';
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        let flows = [], totals = { out: 0, in: 0 };

        for (let i = 0; i <= term; i++) {
            let childAge = age + i;
            let yrOut = (i < ppt) ? premium : 0;
            
            // Survival Benefit logic (Paid at END of ages 20, 21, 22, 23, 24)
            let pct = 0;
            if (childAge >= 20 && childAge <= 24) {
                pct = (option === 'T2') ? 0.05 : (option === 'T3') ? 0.10 : (option === 'T4') ? 0.15 : 0;
            }
            let sbVal = sa * pct;

            // Maturity logic (Paid at age 25)
            let matSAFactor = (option === 'T2') ? 0.75 : (option === 'T3') ? 0.50 : (option === 'T4') ? 0.25 : 1.0;
            let maturityVal = (childAge === 25) ? (sa * matSAFactor) + (sa / 1000 * bonusRate * term) + (sa / 1000 * fabRate) : 0;
            let fabAmt = (childAge === 25) ? (sa / 1000 * fabRate) : 0;
            let bonusAcc = (sa / 1000 * bonusRate * i);

            let rowIn = sbVal + maturityVal;
            let net = rowIn - yrOut;
            flows.push({ amt: net, t: i });
            totals.out += yrOut; totals.in += rowIn;

            let db = (age >= 8 || i >= 2) ? Math.round(sa * 1.25 + bonusAcc + fabAmt) : "Ref. Prem";

            tbody.innerHTML += `<tr>
                <td>${i}</td><td>${childAge}</td>
                <td class="row-outflow">${yrOut > 0 ? '₹' + yrOut.toLocaleString() : '-'}</td>
                <td class="row-inflow">${rowIn > 0 ? '₹' + Math.round(rowIn).toLocaleString() : '-'}</td>
                <td style="color:#0056b3; font-weight:bold">${pct > 0 ? (pct*100)+'%' : '-'}</td>
                <td>₹${Math.round(bonusAcc).toLocaleString()}</td>
                <td>${fabAmt > 0 ? '₹' + Math.round(fabAmt).toLocaleString() : '-'}</td>
                <td style="color:blue">${typeof db === 'number' ? '₹' + db.toLocaleString() : db}</td>
                <td style="background:#f0f7ff;font-weight:700">${net >= 0 ? '+' : ''}₹${Math.round(net).toLocaleString()}</td>
            </tr>`;
        }
        document.getElementById('tableFoot').innerHTML = `<tr class="total-row"><td colspan="2">TOTAL</td><td>₹${Math.round(totals.out).toLocaleString()}</td><td>₹${Math.round(totals.in).toLocaleString()}</td><td colspan="4"></td><td>₹${Math.round(totals.in - totals.out).toLocaleString()}</td></tr>`;
        document.getElementById('assetVal').innerText = "₹" + Math.round(totals.in - totals.out).toLocaleString();

        let irr = 0.05;
        for (let j = 0; j < 60; j++) {
            let f = 0, df = 0;
            for (let flow of flows) {
                f += flow.amt / Math.pow(1 + irr, flow.t);
                df -= flow.t * flow.amt / Math.pow(1 + irr, flow.t + 1);
            }
            irr -= f / df;
        }
        document.getElementById('dispXIRR').innerText = (irr * 100).toFixed(2) + "%";
    }
    updatePPT();
</script>
</body>
</html>
