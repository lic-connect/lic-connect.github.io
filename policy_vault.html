        .status-due { color: #e74c3c; font-weight: bold; }
        .status-ok { color: #2ecc71; }
        .file-link { color: #0055a4; text-decoration: none; font-weight: 600; }


/* MOBILE OPTIMIZATION (CSS ONLY) */

    /* 1. Stack the upload form inputs into a single column */

        grid-template-columns: 1fr !important; 
        padding: 15px !important;
    }

    /* 2. Fix the button width for mobile */
    .btn-upload { grid-column: span 1 !important; }

    /* 3. Enable horizontal overflow for the table */
    .policy-list {
        display: block; /* Required for overflow-x to work on tables */
        width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch; /* Smooth scrolling for iPhone */
        border: 1px solid #eee;
    }

    /* 4. Prevent the columns from shrinking/wrapping */
    .policy-list th, .policy-list td {
        min-width: 140px; /* Forces the table to be wide enough to scroll */
        font-size: 0.85rem;
        white-space: nowrap; /* Keeps text on one line */
    }
}

<body>

<div class="vault-container">
    <h2><i class="fas fa-shield-alt"></i> Policy Vault</h2>
    
    <!-- Upload Form -->
    <div class="upload-form">
        <input type="text" id="clientName" placeholder="Client Name" required>
        <input type="text" id="policyNo" placeholder="Policy Number" required>
        <input type="date" id="dueDate" title="Next Renewal Date" required>
        <input type="file" id="policyFile" accept=".pdf" required>
        <button class="btn-upload" onclick="uploadPolicy()">Upload to Cloud Vault</button>
    </div>

    <!-- Policy Table -->
    <table class="policy-list">
        <thead>
            <tr>
                <th>Client</th>
                <th>Policy No.</th>
                <th>Next Due</th>
                <th>Document</th>
            </tr>
        </thead>
        <tbody id="policyTableBody">
            <!-- Data will load here -->
        </tbody>
    </table>
</div>

<script>


    async function uploadPolicy() {
        // 1. Select Elements
        const btn = document.querySelector('.btn-upload');
        const fileInput = document.getElementById('policyFile');
        const clientInput = document.getElementById('clientName');
        const pNoInput = document.getElementById('policyNo');
        const dDateInput = document.getElementById('dueDate');

        // 2. Validate Inputs
        if (!fileInput.files.length || !clientInput.value || !pNoInput.value || !dDateInput.value) {
            alert("⚠️ Please fill all fields and select a PDF file.");
            return;
        }

        const file = fileInput.files[0];
        const originalText = btn.innerText;

        try {
            // 3. UI Feedback
            btn.innerText = "Uploading...";
            btn.disabled = true;

            // 4. Get User Session
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) throw new Error("You must be logged in to upload.");

            // 5. Upload to Storage
            const cleanName = file.name.replace(/[^a-zA-Z0-9.]/g, '_');
            const filePath = `${user.id}/${Date.now()}_${cleanName}`;

            const { error: storageError } = await supabase.storage
                .from('policy-vault')
                .upload(filePath, file);

            if (storageError) throw storageError;

            // 6. Get Public Link
            const { data: urlData } = supabase.storage
                .from('policy-vault')
                .getPublicUrl(filePath);

            // 7. Insert into Database
            const { error: dbError } = await supabase
                .from('policies')
                .insert([{
                    user_id: user.id,
                    client_name: clientInput.value,
                    policy_number: pNoInput.value,
                    due_date: dDateInput.value,
                    file_url: urlData.publicUrl
                }]);

            if (dbError) throw dbError;

            alert("✅ Policy Uploaded Successfully!");
            window.location.reload();

        } catch (error) {
            console.error("Upload Error:", error);
            alert("❌ Upload Failed: " + (error.message || "Unknown Error"));
        } finally {
            btn.innerText = originalText;
            btn.disabled = false;
        }
    }

    async function loadPolicies() {
        const tbody = document.getElementById('policyTableBody');
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center">Loading...</td></tr>';

        // 1. Get Current User
        const { data: { user } } = await supabase.auth.getUser();
        
        if (!user) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center">Please login to view policies.</td></tr>';
            return;
        }

        // 2. Fetch policies ONLY for this user
        const { data, error } = await supabase
            .from('policies')
            .select('*')
            .eq('user_id', user.id)
            .order('due_date', { ascending: true });

        if (error) {
            console.error(error);
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:red">Error loading data.</td></tr>';
            return;
        }

        tbody.innerHTML = ''; // Clear loading message

        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center">No policies found. Upload one above!</td></tr>';
            return;
        }
        
        // 3. Populate Table
        data.forEach(p => {
            const today = new Date();
            const due = new Date(p.due_date);
            // Check if due in current month and year
            const isDue = (due.getMonth() === today.getMonth()) && (due.getFullYear() === today.getFullYear());

            tbody.innerHTML += `
                <tr>
                    <td>${p.client_name}</td>
                    <td>${p.policy_number}</td>
                    <td class="${isDue ? 'status-due' : ''}">
                        ${p.due_date} 
                        ${isDue ? '⚠️' : ''}
                    </td>
                    <td>
                        <a href="${p.file_url}" target="_blank" class="file-link">
                            <i class="fas fa-file-pdf"></i> View Doc
                        </a>
                    </td>
                </tr>
            `;
        });
    }

    // Call load function
    loadPolicies();
</script>
