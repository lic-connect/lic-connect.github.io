<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIC Plan 880 - Jan Suraksha Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --modern-blue: #0061ff;
            --deep-blue: #003366;
            --accent-blue: #60efff;
            --black: #1a1a1a;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background: radial-gradient(circle at center, #1a2a6c, #b21f1f, #fdbb2d);
            background: linear-gradient(135deg, #001f3f 0%, #0074D9 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            perspective: 2000px;
        }

        /* 3D Box Container */
        .calculator-3d-box {
            position: relative;
            width: 100%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            transform-style: preserve-3d;
            transform: rotateX(10deg);
            box-shadow: 0 50px 100px rgba(0,0,0,0.5);
            padding: 40px;
            border: 1px solid rgba(255,255,255,0.3);
            /* Mirror Reflection Effect */
            -webkit-box-reflect: below 5px linear-gradient(transparent, transparent, rgba(255,255,255,0.1));
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
            border-bottom: 4px solid var(--modern-blue);
            padding-bottom: 15px;
        }

        .header h1 { 
            color: var(--deep-blue); 
            font-size: 28px; 
            font-weight: 800; 
            text-transform: uppercase; 
            letter-spacing: 2px;
        }

        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
        }

        .input-group { position: relative; display: flex; flex-direction: column; }
        .input-group label { font-size: 12px; font-weight: 700; color: var(--deep-blue); margin-bottom: 8px; text-transform: uppercase; }
        .input-group i { position: absolute; right: 15px; top: 42px; color: var(--modern-blue); font-size: 1.1rem; }

        input, select {
            padding: 14px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            outline: none;
            transition: 0.3s;
            background: #f8faff;
        }

        input:focus, select:focus { 
            border-color: var(--modern-blue); 
            background: #fff;
            box-shadow: 0 0 15px rgba(0,97,255,0.2);
        }

        /* Benefit Toggle */
        .toggle-section {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
            background: #f0f3f7;
            padding: 10px;
            border-radius: 50px;
        }

        .toggle-container {
            display: flex;
            width: 350px;
            height: 50px;
            background: var(--black);
            border-radius: 25px;
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }

        .toggle-btn {
            flex: 1;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #fff;
            transition: 0.3s;
            font-size: 13px;
        }

        .toggle-btn.active { color: var(--black); }

        .slider {
            position: absolute;
            left: 5px;
            top: 5px;
            width: calc(50% - 5px);
            height: 40px;
            background: var(--accent-blue);
            border-radius: 25px;
            transition: 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1;
        }

        .calc-btn {
            grid-column: 1 / -1;
            background: linear-gradient(45deg, var(--deep-blue), var(--modern-blue));
            color: white;
            border: none;
            padding: 20px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.4s;
            text-transform: uppercase;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            margin-top: 10px;
        }

        .calc-btn:hover { transform: translateY(-5px) scale(1.02); box-shadow: 0 15px 30px rgba(0,97,255,0.4); }

        /* Output Styling */
        #results {
            margin-top: 40px;
            display: none;
            padding: 30px;
            background: var(--white);
            border-radius: 20px;
            border-left: 10px solid var(--modern-blue);
            animation: slideUp 0.6s ease;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .res-row { display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px dashed #ddd; }
        .res-row.final { background: var(--black); color: var(--accent-blue); padding: 20px; border-radius: 12px; margin-top: 15px; }
        .res-val { font-weight: 800; font-size: 18px; color: var(--modern-blue); }
        .final .res-val { color: var(--white); font-size: 24px; }

        .formula { font-size: 11px; color: #777; text-align: center; margin-top: 20px; font-style: italic; background: #eee; padding: 10px; border-radius: 8px; }

        .error-msg { color: #ff4757; font-size: 11px; font-weight: 700; margin-top: 6px; display: none; }

        .btn-footer { display: flex; gap: 15px; margin-top: 25px; }
        .btn-action { flex: 1; padding: 14px; border-radius: 10px; border: 2px solid var(--deep-blue); background: transparent; color: var(--deep-blue); font-weight: 700; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-action:hover { background: var(--deep-blue); color: #fff; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(50px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 600px) { .calculator-3d-box { transform: none; padding: 20px; } }
    </style>
</head>
<body>

<div class="calculator-3d-box">
    <div class="header">
        <h1><i class="fas fa-shield-alt"></i> LIC-PLAN 880: JAN SURAKSHA</h1>
        <p style="color: #666; font-weight: 600; margin-top: 5px;">Micro Insurance Maturity Calculator</p>
    </div>

    <div class="input-grid">
        <div class="input-group">
            <label>Policy Holder Name</label>
            <input type="text" id="name" placeholder="Enter Name">
            <i class="fas fa-user"></i>
        </div>

        <div class="input-group">
            <label>Age at Entry (18-55)</label>
            <input type="number" id="age" value="30">
            <i class="fas fa-birthday-cake"></i>
            <span id="age-err" class="error-msg">Min 18 | Max 55 (53 for POSP)</span>
        </div>

        <div class="input-group">
            <label>Sum Assured (1L - 2L)</label>
            <input type="number" id="sa" value="100000" step="5000">
            <i class="fas fa-indian-rupee-sign"></i>
            <span id="sa-err" class="error-msg">SA must be 1,00,000 to 2,00,000</span>
        </div>

        <div class="input-group">
            <label>Policy Term (12-20 Yrs)</label>
            <select id="term" onchange="syncPPT()">
                <option value="12">12 Years</option>
                <option value="13">13 Years</option>
                <option value="14">14 Years</option>
                <option value="15" selected>15 Years</option>
                <option value="16">16 Years</option>
                <option value="17">17 Years</option>
                <option value="18">18 Years</option>
                <option value="19">19 Years</option>
                <option value="20">20 Years</option>
            </select>
            <i class="fas fa-calendar-alt"></i>
        </div>

        <div class="input-group">
            <label>Premium Paying Term (PPT)</label>
            <input type="number" id="ppt" readonly style="background: #eee;">
            <i class="fas fa-hourglass-half"></i>
        </div>

        <div class="input-group">
            <label>Mode of Premium</label>
            <select id="mode">
                <option value="1">Yearly</option>
                <option value="0.509">Half-Yearly</option>
                <option value="0.2568">Quarterly</option>
                <option value="0.0861">Monthly</option>
            </select>
            <i class="fas fa-wallet"></i>
        </div>

        <div class="input-group">
            <label>Installment Premium</label>
            <input type="number" id="premium" value="9080">
            <i class="fas fa-coins"></i>
        </div>

        <div class="input-group">
            <label>GA Rate (% of Premium)</label>
            <input type="number" id="ga_rate" value="4.0" step="0.01">
            <i class="fas fa-chart-line"></i>
        </div>

        <div class="toggle-section">
            <div class="toggle-container" onclick="toggleBenefit()">
                <div id="slider" class="slider"></div>
                <div id="btn-surv" class="toggle-btn active">SURVIVAL (MATURITY)</div>
                <div id="btn-death" class="toggle-btn">DEATH BENEFIT</div>
            </div>
        </div>

        <div class="input-group" id="death_ui" style="display:none; grid-column: 1 / -1;">
            <label>Date / Policy Year of Death</label>
            <input type="number" id="death_yr" value="5" min="1">
            <i class="fas fa-calendar-xmark"></i>
        </div>

        <button class="calc-btn" onclick="calculate()">
            <i class="fas fa-calculator"></i> Calculate Final Benefits
        </button>
    </div>

    <div id="results">
        <div id="res-content"></div>
        <div class="btn-footer">
            <button class="btn-action" onclick="window.print()"><i class="fas fa-print"></i> Print PDF</button>
            <button class="btn-action" onclick="alert('Shared Successfully')"><i class="fas fa-share-alt"></i> Share PDF</button>
        </div>
    </div>
</div>

<script>
    function syncPPT() {
        const term = parseInt(document.getElementById('term').value);
        document.getElementById('ppt').value = term - 5;
    }

    let isDeath = false;
    function toggleBenefit() {
        isDeath = !isDeath;
        const slider = document.getElementById('slider');
        const deathUI = document.getElementById('death_ui');
        const bSurv = document.getElementById('btn-surv');
        const bDeath = document.getElementById('btn-death');

        if(isDeath) {
            slider.style.left = '50%';
            deathUI.style.display = 'block';
            bDeath.classList.add('active');
            bSurv.classList.remove('active');
        } else {
            slider.style.left = '5px';
            deathUI.style.display = 'none';
            bSurv.classList.add('active');
            bDeath.classList.remove('active');
        }
    }

    function calculate() {
        const name = document.getElementById('name').value || "Valued Client";
        const age = parseInt(document.getElementById('age').value);
        const sa = parseFloat(document.getElementById('sa').value);
        const term = parseInt(document.getElementById('term').value);
        const ppt = term - 5;
        const premium = parseFloat(document.getElementById('premium').value);
        const ga_rate = parseFloat(document.getElementById('ga_rate').value) / 100;
        const deathYr = parseInt(document.getElementById('death_yr').value);

        // Validation
        let valid = true;
        document.getElementById('age-err').style.display = (age < 18 || age > 55) ? 'block' : 'none';
        document.getElementById('sa-err').style.display = (sa < 100000 || sa > 200000) ? 'block' : 'none';
        
        if(age + term > 70) { alert("Maximum Maturity Age (70) exceeded!"); valid = false; }
        if(age < 18 || age > 55 || sa < 100000 || sa > 200000) valid = false;
        
        if(!valid) return;

        // GA Logic: 4% of annualized premium per policy year
        const annualGa = premium * ga_rate;
        const totalGa = annualGa * term;
        const totalPaid = premium * ppt;

        let html = `<h3 style="color:var(--deep-blue); margin-bottom:15px; text-align:center;">Report for ${name}</h3>`;

        if(!isDeath) {
            const finalMaturity = sa + totalGa;
            html += `
                <div class="res-row"><span>Basic Sum Assured:</span><span class="res-val">₹ ${sa.toLocaleString('en-IN')}</span></div>
                <div class="res-row"><span>Total Accrued GA (${(ga_rate*100).toFixed(2)}%):</span><span class="res-val">₹ ${totalGa.toLocaleString('en-IN')}</span></div>
                <div class="res-row"><span>Total Premium Paid:</span><span class="res-val">₹ ${totalPaid.toLocaleString('en-IN')}</span></div>
                <div class="res-row final"><span>FINAL MATURITY BENEFIT:</span><span class="res-val">₹ ${finalMaturity.toLocaleString('en-IN')}</span></div>
                <div class="formula">Formula: Basic Sum Assured + (Annual GA Rate × Annualized Premium × Policy Term)</div>
            `;
        } else {
            const deathGa = annualGa * deathYr;
            const saOnDeath = Math.max(sa, 7 * premium);
            const finalDeathBenefit = saOnDeath + deathGa;

            html += `
                <div class="res-header" style="text-align:center; font-weight:bold; margin-bottom:10px;">Death Claim in Year ${deathYr}</div>
                <div class="res-row"><span>Basic Sum Assured on Death:</span><span class="res-val">₹ ${saOnDeath.toLocaleString('en-IN')}</span></div>
                <div class="res-row"><span>Accrued GA till death:</span><span class="res-val">₹ ${deathGa.toLocaleString('en-IN')}</span></div>
                <div class="res-row final"><span>FINAL DEATH BENEFIT:</span><span class="res-val">₹ ${finalDeathBenefit.toLocaleString('en-IN')}</span></div>
                <div class="formula">Formula: Higher of (7x Annualized Premium OR BSA) + Accrued Guaranteed Additions</div>
            `;
        }

        document.getElementById('res-content').innerHTML = html;
        document.getElementById('results').style.display = 'block';
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    // Initialize PPT
    syncPPT();
</script>

</body>
</html>
