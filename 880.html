<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jan Suraksha Pro | LIC Plan 880</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
        :root {
            --lic-grey: #444444;
            --light-grey: #f4f4f4;
            --border-grey: #cccccc;
            --white: #ffffff;
            --accent: #ffd700;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background: #e9e9e9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .calculator-card {
            width: 100%;
            max-width: 800px;
            background: var(--white);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 35px;
            border-top: 10px solid var(--lic-grey);
        }

        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { color: var(--lic-grey); font-size: 22px; text-transform: uppercase; letter-spacing: 1px; }
        .header p { font-size: 12px; color: #777; font-weight: 600; margin-top: 5px; }

        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .input-group { display: flex; flex-direction: column; }
        .input-group label { font-size: 11px; font-weight: 700; color: #555; margin-bottom: 5px; text-transform: uppercase; }

        input, select {
            padding: 12px;
            border: 1px solid var(--border-grey);
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            outline: none;
            transition: border 0.3s;
        }
        
        input:focus { border-color: var(--lic-grey); }
        input[readonly] { background: #f9f9f9; color: var(--lic-grey); border-style: dashed; }

        /* Plan 880 Specific Layout Elements */
        .option-toggle { 
            grid-column: 1 / -1; 
            display: flex; 
            justify-content: center; 
            gap: 10px; 
            margin-bottom: 10px; 
        }

        .option-btn { 
            border: 1px solid var(--lic-grey); 
            background: white; 
            padding: 8px 15px; 
            border-radius: 5px; 
            cursor: pointer; 
            font-size: 11px; 
            font-weight: 700; 
            text-transform: uppercase;
            transition: 0.3s; 
        }

        .option-btn.active { 
            background: var(--lic-grey); 
            color: white; 
        }

        .checkbox-row { 
            grid-column: 1 / -1; 
            display: flex; 
            gap: 20px; 
            justify-content: center; 
            background: var(--light-grey); 
            padding: 15px; 
            border-radius: 8px; 
            font-size: 12px; 
            font-weight: 600; 
            color: var(--lic-grey); 
        }

        #errorDisplay { 
            color: #d32f2f; 
            background: #ffebee; 
            padding: 12px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            display: none; 
            font-size: 12px; 
            text-align: center; 
            border: 1px solid #ffcdd2; 
            font-weight: 600;
        }

        .calc-btn {
            width: 100%;
            padding: 16px;
            background: var(--lic-grey);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s;
            text-transform: uppercase;
        }

        .calc-btn:hover { background: #222; }

        #results { margin-top: 30px; display: none; animation: fadeIn 0.5s ease-in; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .summary-box {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
            padding: 20px;
            background: #fdfdfd;
            border: 1px solid #eee;
            border-radius: 8px;
            border-left: 5px solid var(--lic-grey);
        }

        .summary-item { font-size: 12px; color: #666; font-weight: 600; }
        .summary-item span { display: block; font-weight: 700; color: var(--lic-grey); font-size: 18px; margin-top: 4px; }

        .table-container { overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: var(--lic-grey); color: white; padding: 12px; text-align: left; text-transform: uppercase; font-size: 11px; }
        td { padding: 12px; border-bottom: 1px solid #eee; font-weight: 600; color: #444; }
        .highlight-row { background-color: #f9f9f9; font-size: 15px; }
        .text-right { text-align: right; }

        .note { font-size: 11px; color: #888; margin-top: 15px; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <div class="glass-card">
        <h1>PLAN 880 JAN SURAKSHA</h1>
        <div class="subtitle">Official Surrender Calculator</div>

        <div class="input-grid">
<div class="input-group">
    <label>Entry Age (18-55)</label>
    <input type="number" id="age" value="30" oninput="updateAutoFields()">
</div>
            <div class="input-group">
                <label>Sum Assured (BSA)</label>
                <input type="number" id="bsa" value="200000" oninput="updateAutoFields()">
            </div>
            <div class="input-group">
                <label>Annual Premium (AP)</label>
                <input type="number" id="ap" value="10000" oninput="updateAutoFields()">
            </div>
            <div class="input-group">
                <label>PPT (7-15 Years)</label>
                <input type="number" id="ppt" value="10" min="7" max="15" oninput="updateAutoFields()">
            </div>
            <div class="input-group">
                <label>Years Premium Paid</label>
                <input type="number" id="yearsPaid" value="5" min="2" oninput="updateAutoFields()">
            </div>
            <div class="input-group">
                <label>Policy Term (Auto)</label>
                <input type="text" id="ptDisplay" readonly>
            </div>
            <div class="input-group">
                <label>Accrued GA (Auto)</label>
                <input type="text" id="gaDisplay" readonly>
            </div>

            <div class="option-toggle">
                <button class="option-btn active" id="btnA" onclick="setOption('A')">Opt A (PPT+6)</button>
                <button class="option-btn" id="btnB" onclick="setOption('B')">Opt B (PPT+8)</button>
                <button class="option-btn" id="btnC" onclick="setOption('C')">Opt C (PPT+10)</button>
            </div>

            <div class="checkbox-row">
                <label style="color:white;"><input type="checkbox" id="isOnline" checked onchange="updateAutoFields()"> Online Purchase (+1%)</label>
                <label style="color:white;"><input type="checkbox" id="isHighSA" checked onchange="updateAutoFields()"> High SA (+0.25%)</label>
            </div>
        </div>

<div id="errorDisplay" style="color: #ff4d4d; font-size: 0.8rem; margin-bottom: 15px; display: none; text-align: center; font-weight: bold; background: rgba(255,0,0,0.1); padding: 10px; border-radius: 10px;"></div>

        <button class="calc-btn" onclick="calculateSurrender()">Calculate Value</button>

        <div id="results" class="results-area">
            <div class="res-grid">
                <div class="res-box"><div class="res-label">GSV (Guaranteed)</div><div class="res-value" id="gsvVal">₹ 0</div></div>
                <div class="res-box"><div class="res-label">SSV (Special)</div><div class="res-value" id="ssvVal">₹ 0</div></div>
            </div>
            <div class="final-box">
                <div class="final-label">FINAL PAYABLE SURRENDER VALUE</div>
                <div class="final-amt" id="finalAmt">₹ 0</div>
            </div>
        </div>
    </div>
</div>

<script>
    let currentOption = 'A';
    
    // Factors for Plan 880
   const dataB = [

];
  const dataP = [
    {"Term": 1, "T20": 0.0000},
    {"Term": 2, "T20": 0.3000},
    {"Term": 3, "T20": 0.3500},
    {"Term": 4, "T20": 0.5000},

    {"Term": 10, "T20": 0.5750},
    {"Term": 11, "T20": 0.6000},
    {"Term": 12, "T20": 0.6250},
    {"Term": 13, "T20": 0.6500},
    {"Term": 14, "T20": 0.6750},

    {"Term": 16, "T20": 0.7400},
    {"Term": 17, "T20": 0.7800},
    {"Term": 18, "T20": 0.8200},
    {"Term": 19, "T20": 0.8600},
    {"Term": 20, "T20": 0.9000},
    {"Term": 21, "T20": 0.9000},

    {"Term": 23, "T20": 0.9000},
    {"Term": 24, "T20": 0.9000},
    {"Term": 25, "T20": 0.9000}
];
    const dataF1 = [
    {"Term": 1, "T20": 0.0318},
    {"Term": 2, "T20": 0.0322},
    {"Term": 3, "T20": 0.0328},
    {"Term": 4, "T20": 0.0336},
    {"Term": 5, "T20": 0.0345},
    {"Term": 6, "T20": 0.0346},
    {"Term": 7, "T20": 0.0347},

];
    const dataF3 = [
    {"Term": 1, "T20": 0.3395},

    {"Term": 9, "T20": 0.2247},
    {"Term": 10, "T20": 0.2036},
    {"Term": 11, "T20": 0.1811},
    {"Term": 12, "T20": 0.1572},
    {"Term": 13, "T20": 0.1322},
    {"Term": 14, "T20": 0.1061},
    {"Term": 15, "T20": 0.0792},
    {"Term": 16, "T20": 0.0519},
    {"Term": 17, "T20": 0.0380},
    {"Term": 18, "T20": 0.0240},
    {"Term": 19, "T20": 0.0120},
    {"Term": 20, "T20": 0.0000}
];

    function setOption(opt) {
        currentOption = opt;
        document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn' + opt).classList.add('active');
        updateAutoFields();
    }

    function updateAutoFields() {
        const ppt = parseInt(document.getElementById('ppt').value) || 0;
        const bsa = parseFloat(document.getElementById('bsa').value) || 0;
        const ap = parseFloat(document.getElementById('ap').value) || 0;
        const yearsPaid = parseInt(document.getElementById('yearsPaid').value) || 0;
        
        let pt = ppt + (currentOption === 'A' ? 6 : currentOption === 'B' ? 8 : 10);
        document.getElementById('ptDisplay').value = pt + " Years";

        let gaRate = 0.04;
        if(document.getElementById('isOnline').checked) gaRate += 0.01;
        if(document.getElementById('isHighSA').checked && bsa >= 200000) gaRate += 0.0025;

        const totalGA = ap * gaRate * Math.min(yearsPaid, ppt);
        document.getElementById('gaDisplay').value = "₹ " + Math.round(totalGA).toLocaleString('en-IN');
    }

    function getF(arr, yr) {
        let rows = arr.filter(x => x.Term <= yr);
        return rows.length ? rows[rows.length - 1].T20 : 0;
    }

   function calculateSurrender() {
    // 1. Get all input values (Only declare them once)
    const age = parseInt(document.getElementById('age').value);
    const bsa = parseFloat(document.getElementById('bsa').value);
    const ap = parseFloat(document.getElementById('ap').value);
    const ppt = parseInt(document.getElementById('ppt').value);
    const yearsPaid = parseInt(document.getElementById('yearsPaid').value);
    const term = parseInt(document.getElementById('ptDisplay').value); // From the auto-field
    
    const errorBox = document.getElementById('errorDisplay');
    const resultsDiv = document.getElementById('results');

    // 2. Reset UI state
    errorBox.style.display = 'none';
    resultsDiv.style.display = 'none';

    // 3. --- VALIDATION BLOCK (From Brochure) ---
    if (isNaN(age) || age < 18 || age > 55) {
        errorBox.innerText = "Validation Error: Entry Age must be between 18 and 55.";
        errorBox.style.display = 'block'; return;
    }
    if (bsa < 100000 || bsa > 200000) {
        errorBox.innerText = "Validation Error: Basic Sum Assured must be between ₹1,00,000 and ₹2,00,000.";
        errorBox.style.display = 'block'; return;
    }
    if (bsa % 5000 !== 0) {
        errorBox.innerText = "Validation Error: Sum Assured must be in multiples of ₹5,000.";
        errorBox.style.display = 'block'; return;
    }
    if (ppt < 7 || ppt > 15) {
        errorBox.innerText = "Validation Error: PPT must be between 7 and 15 years.";
        errorBox.style.display = 'block'; return;
    }
    if (age + (ppt + 5) > 70) {
        errorBox.innerText = "Validation Error: Maturity Age (Entry Age + Term) cannot exceed 70.";
        errorBox.style.display = 'block'; return;
    }
    if (yearsPaid < 2) {
        errorBox.innerText = "Validation Error: Minimum 2 full years' premiums must be paid to surrender.";
        errorBox.style.display = 'block'; return;
    }

    // 4. --- CALCULATION LOGIC (Only runs if validations pass) ---
    let gaRate = 0.04;
    if(document.getElementById('isOnline').checked) gaRate += 0.01;
    if(document.getElementById('isHighSA').checked && bsa >= 200000) gaRate += 0.0025;
    
    const accruedGA = ap * gaRate * Math.min(yearsPaid, ppt);

    // Calculate GSV
    const gsv = (ap * yearsPaid * getF(dataP, yearsPaid)) + (accruedGA * getF(dataB, yearsPaid));

    // Calculate SSV
    const paidUpSA = (bsa * yearsPaid) / ppt;
    const ssv = (paidUpSA * getF(dataF1, yearsPaid)) + (accruedGA * getF(dataF3, yearsPaid));

    const final = Math.max(gsv, ssv);

    // 5. Update UI Results
    resultsDiv.style.display = 'block';
    document.getElementById('gsvVal').innerText = "₹ " + Math.round(gsv).toLocaleString('en-IN');
    document.getElementById('ssvVal').innerText = "₹ " + Math.round(ssv).toLocaleString('en-IN');
    document.getElementById('finalAmt').innerText = "₹ " + Math.round(final).toLocaleString('en-IN');
}
    window.onload = updateAutoFields;
</script>
</body>
</html>
