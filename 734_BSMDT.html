<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LIC Plan 734 - Jeevan Tarun Premium Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { font-family: Arial, sans-serif; background: #f8f9fa; margin: 0; padding: 20px; padding-bottom: 120px; /* Space for the fixed button */ }
    .container { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 8px rgba(0,0,0,0.1); max-width: 700px; margin:auto; }
    h1 { text-align:center; font-size: 1.8rem; }
    label { font-weight:bold; margin-top:10px; display:block; }
    input[type="number"], input[type="text"], select { width:100%; padding:10px; margin-bottom:10px; box-sizing: border-box; }
    button { width:100%; padding:15px; background:#27ae60; color:#fff; font-size:16px; border:none; cursor:pointer; border-radius: 5px; }
    button:hover { background:#219150; }
    table { width:100%; margin-top:20px; border-collapse:collapse; }
    th, td { border:1px solid #ccc; padding:10px; text-align:center; }
    th { background:#e8f5e9; }
    
    /* --- STYLES FOR PWB BUTTON AND MODAL --- */

    .actions-container {
        display: flex;
        gap: 15px;
        margin-top: 20px;
    }
    .actions-container button {
        flex: 1; /* This is the key property to make them equal width */
    }
    .pwb-button-container {
        position: fixed; bottom: 0; left: 50%;
        transform: translateX(-50%); padding: 25px; z-index: 1000;
    }
    .pwb-btn {
        background: linear-gradient(145deg, #007bff, #0056b3);
        color: white; font-family: Arial, sans-serif; font-size: 16px;
        font-weight: bold; border: none; border-radius: 10px;
        padding: 15px 30px; cursor: pointer;
        box-shadow: 0 5px 15px rgba(0, 91, 179, 0.4);
        transition: all 0.3s ease;
    }
    .pwb-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(0, 91, 179, 0.5);
    }
    .modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.6);
        display: none; align-items: center; justify-content: center; z-index: 2000;
    }
    .modal-content {
        background: #fff; padding: 30px; border-radius: 10px;
        width: 90%; max-width: 500px; text-align: center;
        box-shadow: 0 5px 15px rgba(0,0,0,0.3); position: relative;
    }
    .modal-close-btn {
        position: absolute; top: 10px; right: 15px;
        font-size: 28px; font-weight: bold; color: #888; cursor: pointer;
    }
    #modal-title { margin-top: 0; color: #0056b3; }
    #modal-body { font-size: 1.1em; color: #333; }


/* WhatsApp Button Styling */
.whatsapp-share-container {
    margin-top: 20px;
    text-align: center;
}

.whatsapp-btn {
    background-color: #25D366;
    color: white;
    font-family: Arial, sans-serif;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    padding: 12px 24px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
    transition: background 0.3s ease;
    width: 100%;
}

.whatsapp-btn:hover {
    background-color: #1ebe57;
}

.whatsapp-btn svg {
    fill: white;
    width: 20px;
    height: 20px;
}
  </style>
</head>
<body>
  <div class="container">
    <h1>LIC Jeevan Tarun (Plan 734)</h1>

    <label for="age">Child's Age (0-12)</label>
    <input type="number" class="form-control" id="age" value="5" min="0" max="12" />

    <div class="row">
        <div class="col-md-6">
            <label for="term">Policy Term</label>
            <input type="text" class="form-control" id="term" disabled />
        </div>
        <div class="col-md-6">
            <label for="ppt">Premium Paying Term</label>
            <input type="text" class="form-control" id="ppt" disabled />
        </div>
    </div>

    <label for="sumAssured">Sum Assured</label>
    <input type="number" class="form-control" id="sumAssured" value="500000" step="10000" />
    
    <label for="option">Benefit Option</label>
    <select id="option" class="form-select">
      <option value="T1">Option 1: 100% at Maturity, No SB</option>
      <option value="T2">Option 2: 5% SB for 5 yrs + 75% Maturity</option>
      <option value="T3">Option 3: 10% SB for 5 yrs + 50% Maturity</option>
      <option value="T4">Option 4: 15% SB for 5 yrs + 25% Maturity</option>
    </select>
    
    <!-- START: New Button Container -->
    <div class="actions-container">
        <button class="btn btn-success w-100" onclick="calculate()">Calculate Base Premium</button>
        <button id="pwb-btn" class="pwb-btn">Know Your PWB Premium</button>
    </div>
    <!-- END: New Button Container -->

<div class="whatsapp-share-container">
    <button onclick="shareOnWhatsApp()" class="whatsapp-btn">
        <svg viewBox="0 0 448 512"><path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.4 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-5.5-2.8-23.2-8.5-44.2-27.1-16.4-14.6-27.4-32.7-30.6-38.2-3.2-5.6-.3-8.6 2.4-11.3 2.5-2.4 5.5-6.5 8.3-9.7 2.8-3.3 3.7-5.5 5.5-9.3 1.9-3.7.9-6.9-.5-9.7-1.4-2.8-12.4-29.8-17-40.7-4.5-10.7-9-9.2-12.4-9.4h-10.6c-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 13.2 5.8 23.5 9.2 31.5 11.8 13.3 4.2 25.4 3.6 35 2.2 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"/></svg>
        Share Quote on WhatsApp
    </button>
</div>

    <div id="results" class="mt-3"></div>
  </div>
  
  <!-- Button and Modal HTML -->
  
  <!-- Button and Modal HTML -->

  <div id="pwb-modal" class="modal-overlay">
      <div class="modal-content">
          <span class="modal-close-btn">×</span>
          <h2 id="modal-title"></h2>
          <div id="modal-body"></div>
      </div>
  </div>
  
<script>
const premiumRates = { 0: { T1: 46.5, T2: 47.5, T3: 48.55, T4: 49.6 }, 1: { T1: 48.95, T2: 50.1, T3: 51.25, T4: 52.4 }, 2: { T1: 51.8, T2: 53.05, T3: 54.3, T4: 55.55 }, 3: { T1: 55.05, T2: 56.4, T3: 57.8, T4: 59.2 }, 4: { T1: 58.7, T2: 60.25, T3: 61.8, T4: 63.3 }, 5: { T1: 62.9, T2: 64.6, T3: 66.35, T4: 68.05 }, 6: { T1: 66.75, T2: 68.6, T3: 70.5, T4: 72.4 }, 7: { T1: 72.35, T2: 74.45, T3: 76.55, T4: 78.65 }, 8: { T1: 78.9, T2: 81.25, T3: 83.6, T4: 85.95 }, 9: { T1: 86.65, T2: 89.3, T3: 92.0, T4: 94.65 }, 10: { T1: 96.0, T2: 99.05, T3: 102.1, T4: 105.15 }, 11: { T1: 103.15,T2: 106.55,T3: 109.9, T4: 113.25 }, 12: { T1: 116.6, T2: 120.55,T3: 124.45,T4: 128.4 } };
const rawPwbRates = [ { "A": 1.7, "B": 1.7, "C": 1.85, "D": 2.1, "E": 2.45, "F": 3.1, "G": 4.1, "Term": 5 }, { "A": 1.8, "B": 1.85, "C": 1.95, "D": 2.25, "E": 2.7, "F": 3.55, "G": 4.8, "Term": 6 }, { "A": 1.9, "B": 1.9, "C": 2.1, "D": 2.4, "E": 2.95, "F": 4, "G": 5.55, "Term": 7 }, { "A": 1.95, "B": 2, "C": 2.2, "D": 2.6, "E": 3.25, "F": 4.5, "G": 6.3, "Term": 8 }, { "A": 2, "B": 2.1, "C": 2.3, "D": 2.8, "E": 3.6, "F": 5, "G": 7.05, "Term": 9 }, { "A": 2.2, "B": 2.25, "C": 2.55, "D": 3.1, "E": 4.05, "F": 5.75, "G": 8.15, "Term": 10 }, { "A": 2.25, "B": 2.4, "C": 2.65, "D": 3.3, "E": 4.4, "F": 6.35, "G": 9, "Term": 11 }, { "A": 2.3, "B": 2.45, "C": 2.8, "D": 3.5, "E": 4.8, "F": 6.9, "G": 9.85, "Term": 12 }, { "A": 2.45, "B": 2.55, "C": 2.95, "D": 3.75, "E": 5.15, "F": 7.5, "G": 10.7, "Term": 13 }, { "A": 2.5, "B": 2.7, "C": 3.1, "D": 4, "E": 5.55, "F": 8.15, "G": 11.6, "Term": 14 }, { "A": 2.6, "B": 2.8, "C": 3.3, "D": 4.35, "E": 6.1, "F": 8.9, "G": 12.75, "Term": 15 }, { "A": 2.7, "B": 2.9, "C": 3.5, "D": 4.6, "E": 6.5, "F": 9.55, "G": 13.7, "Term": 16 }, { "A": 2.8, "B": 3.05, "C": 3.65, "D": 4.9, "E": 7, "F": 10.25, "G": 14.7, "Term": 17 }, { "A": 2.85, "B": 3.15, "C": 3.85, "D": 5.2, "E": 7.45, "F": 10.95, "G": 15.75, "Term": 18 }, { "A": 2.9, "B": 3.3, "C": 4.05, "D": 5.5, "E": 7.95, "F": 11.65, "G": 16.8, "Term": 19 }, { "A": 3.05, "B": 3.45, "C": 4.25, "D": 5.85, "E": 8.4, "F": 12.35, "G": 0, "Term": 20 } ];
const pwbRates = rawPwbRates.reduce((acc, item) => { acc[item.Term] = { A: item.A, B: item.B, C: item.C, D: item.D, E: item.E, F: item.F, G: item.G }; return acc; }, {});

const modalFactors = { yly:1, hly:0.50540, qly:0.25540,mly:0.085140 };
const modeRebate = { yly:0.02, hly:0, qly:0, mly:0 };
const gstFirst = 1;
const gstSecond = 1;

function formatINR(val) {
  return "₹ " + Math.round(val).toLocaleString("en-IN");
}

function calculate() {
  const sa = parseInt(document.getElementById("sumAssured").value);
  const age = parseInt(document.getElementById("age").value);
  const selectedOption = document.getElementById("option").value;
  
  const term = 25 - age;
  const ppt  = 20 - age;
  document.getElementById("term").value = term + " Years";
  document.getElementById("ppt").value  = ppt + " Years";

  const rate = premiumRates[age]?.[selectedOption];
  if (!rate) {
    document.getElementById("results").innerHTML = `<p class="text-danger text-center">No rate available for this age and option.</p>`;
    return;
  }

  let basePrem = (sa / 1000) * rate;

  // SA Rebate Calculation based on the selected Benefit Option
  let saRebateRate = 0; // Default to 0
  if (sa >= 5000000) { saRebateRate = 4.0815; }
  else if (sa >= 500000) { saRebateRate = 2.55; }

  let saRebate = (sa / 1000) * saRebateRate;
  let afterSaRebate = basePrem - saRebate;
  let yearlyPrem = afterSaRebate * (1 - modeRebate.yly);
const result = {};
  for (let m of ["yly", "hly", "qly", "mly"]) {
    let modalPrem = yearlyPrem * modalFactors[m];
    // We now store a single formatted string instead of an object with first/second
    result[m] = formatINR(modalPrem);
  }

  document.getElementById("results").innerHTML = `
    <h2 class="text-center mt-4">Base Premium Summary</h2>
    <table class="table table-bordered">
      <thead class="table-light">
        <tr><th>Mode</th><th>Premium Amount</th></tr>
      </thead>
      <tbody>
        <tr><td>Yearly</td><td>${result.yly}</td></tr>
        <tr><td>Half-Yearly</td><td>${result.hly}</td></tr>
        <tr><td>Quarterly</td><td>${result.qly}</td></tr>
        <tr><td>Monthly</td><td>${result.mly}</td></tr>
      </tbody>
    </table>`;
}

// --- PWB MODAL LOGIC ---
const modal = document.getElementById('pwb-modal');
const modalTitle = document.getElementById('modal-title');
const modalBody = document.getElementById('modal-body');
const closeModalBtn = document.querySelector('.modal-close-btn');

function showModal(title, bodyHtml) {
    modalTitle.innerHTML = title;
    modalBody.innerHTML = bodyHtml;
    modal.style.display = 'flex';
}
function hideModal() { modal.style.display = 'none'; }

closeModalBtn.addEventListener('click', hideModal);
window.addEventListener('click', (event) => { if (event.target === modal) hideModal(); });

document.getElementById('pwb-btn').addEventListener('click', () => {
    const title = 'PWB Rider Premium';
    const bodyHtml = `
        <label for="proposer-age" class="form-label">Enter Proposer's Age (18-55)</label>
        <input type="number" id="proposer-age" class="form-control mb-3" value="30" min="18" max="55">
        <button class="btn btn-primary w-100" onclick="calculatePwbFromModal()">Calculate PWB Premium</button>
    `;
    showModal(title, bodyHtml);
});

function getPwbTier(proposerAge) {
    if (proposerAge >= 18 && proposerAge <= 25) return 'A';
    if (proposerAge >= 26 && proposerAge <= 30) return 'B';
    if (proposerAge >= 31 && proposerAge <= 35) return 'C';
    if (proposerAge >= 36 && proposerAge <= 40) return 'D';
    if (proposerAge >= 41 && proposerAge <= 45) return 'E';
    if (proposerAge >= 46 && proposerAge <= 50) return 'F';
    if (proposerAge >= 51 && proposerAge <= 55) return 'G';
    return null;
}

function calculatePwbFromModal() {
    const childAge = parseInt(document.getElementById("age").value);
    const sumAssured = parseFloat(document.getElementById("sumAssured").value);
    const proposerAge = parseInt(document.getElementById("proposer-age").value);
    const selectedOption = document.getElementById("option").value;

    if (isNaN(proposerAge) || proposerAge < 18 || proposerAge > 55) {
        showModal('Error', '<p class="text-danger">Please enter a valid Proposer Age between 18 and 55.</p>');
        return;
    }
    
    const ppt = 20 - childAge;
    const pwbTier = getPwbTier(proposerAge);
    const pwbRate = pwbRates[ppt]?.[pwbTier];

    if (!pwbRate) {
        showModal('PWB Premium Not Available', `<p class="text-danger">PWB is not available for a Proposer Age of <b>${proposerAge}</b> and a Premium Paying Term of <b>${ppt} years</b>.</p>`);
        return;
    }

    // --- Start of Corrected Logic ---

    // STEP 1: Calculate the Base Annual Premium (after all rebates).
    const rate = premiumRates[childAge]?.[selectedOption];
    let basePrem = (sumAssured / 1000) * rate;
    
    let saRebateRate = 0;
    if (sumAssured >= 5000000) saRebateRate = 4.082;
    else if (sumAssured >= 500000) saRebateRate = 4.08;
    
    let saRebate = (sumAssured / 1000) * saRebateRate;
    let afterSaRebate = basePrem - saRebate;
    const baseAnnualPremium = afterSaRebate * (1 - modeRebate.yly); // Applying yearly mode rebate

    // STEP 2: Apply your requested formula to that Base Annual Premium.
    const pwbPremium = (baseAnnualPremium * pwbRate) / 100;
    
    // --- End of Corrected Logic ---
    
    const resultHtml = `
        <p style="font-size: 1.5em; font-weight: bold; color: #333;">
            Yearly PWB Premium: ${formatINR(pwbPremium)}
        </p>
        <small>(This is a standalone rider premium, excluding tax)</small>
    `;
    showModal('Standalone PWB Premium', resultHtml);
}


function shareOnWhatsApp() {
    // 1. Get Plan Name from the H1 tag
    const planName = document.querySelector('h1').innerText;

    // 2. Get Input Values
    const age = document.getElementById("age").value;
    const term = document.getElementById("term").value;
    const sumAssured = document.getElementById("sumAssured").value;
    
    // 3. Check if calculation results exist
    const resultsDiv = document.getElementById("results");
    if (resultsDiv.innerHTML.trim() === "") {
        alert("Please calculate the premium first!");
        return;
    }

    // 4. Format the numbers for readability
    const formattedSA = Number(sumAssured).toLocaleString('en-IN');

    // 5. Gather Modal Premium results from the table
    // This logic finds the results generated in the 'results' div
    const rows = resultsDiv.querySelectorAll('table tr');
    let premiumDetails = "";
    
    rows.forEach(row => {
        const cols = row.querySelectorAll('td, th');
        if (cols.length === 2) {
            premiumDetails += `*${cols[0].innerText.replace(':','')}:* ${cols[1].innerText}\n`;
        }
    });

    // 6. Construct the Message
    let message = `*📊 ${planName} Premium Quote*\n\n`;
    message += `*--- Policy Details ---*\n`;
    message += `*Age:* ${age} Years\n`;
    message += `*Policy Term:* ${term} Years\n`;
    message += `*Sum Assured:* ₹${formattedSA}\n\n`;
    message += `*--- Premium Summary ---*\n`;
    message += premiumDetails;
    message += `\n_Calculated via LIC Premium Calculator_`;

    // 7. Open WhatsApp
    const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(message)}`;
    window.open(whatsappUrl, '_blank');
}
</script>
