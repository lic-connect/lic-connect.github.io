<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIC Plan 736 - Jeevan Labh Calculator</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --lic-orange: #ff6b00;
            --lic-orange-dark: #e65c00;
            --black: #1a1a1a;
            --white: #ffffff;
            --grey-light: #f4f4f4;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background: radial-gradient(circle at center, #333, #000);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px 20px;
            perspective: 1500px;
        }

        /* 3D Box & Mirror Effect */
        .calculator-container {
            position: relative;
            width: 100%;
            max-width: 950px;
            background: var(--white);
            border-radius: 25px;
            transform-style: preserve-3d;
            transform: rotateX(7deg);
            box-shadow: 0 40px 100px rgba(0,0,0,0.8);
            padding: 45px;
            border: 1px solid rgba(255,255,255,0.2);
            /* Fantastic Mirror Reflection */
            -webkit-box-reflect: below 2px linear-gradient(transparent, transparent, rgba(255,255,255,0.15));
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
            border-bottom: 5px solid var(--lic-orange);
            padding-bottom: 15px;
        }

        .header h1 { color: var(--black); font-size: 26px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        .header p { color: var(--lic-orange); font-weight: 700; font-size: 14px; }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 22px;
        }

        .input-group { position: relative; display: flex; flex-direction: column; }
        .input-group label { font-size: 11px; font-weight: 800; color: var(--black); margin-bottom: 6px; text-transform: uppercase; }
        .input-group i { position: absolute; right: 15px; top: 38px; color: var(--lic-orange); font-size: 18px; }

        input, select {
            padding: 14px 18px;
            border: 2px solid #edeff2;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            outline: none;
            transition: 0.3s ease;
            background: var(--grey-light);
        }

        input:focus, select:focus { border-color: var(--lic-orange); background: #fff; box-shadow: 0 0 15px rgba(255, 107, 0, 0.2); }

        /* Benefit Toggle Switch */
        .toggle-wrapper {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            margin: 15px 0;
            background: #fff5eb;
            padding: 12px;
            border-radius: 50px;
        }

        .toggle-box {
            display: flex;
            width: 360px;
            height: 50px;
            background: var(--black);
            border-radius: 25px;
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }

        .toggle-opt {
            flex: 1;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: var(--lic-orange);
            transition: 0.3s;
            font-size: 13px;
        }

        .toggle-opt.active { color: #fff; }
        .slider {
            position: absolute;
            left: 0;
            width: 50%;
            height: 100%;
            background: var(--lic-orange);
            border-radius: 25px;
            transition: 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1;
        }

        .calc-btn {
            grid-column: 1 / -1;
            background: var(--black);
            color: var(--lic-orange);
            border: 2px solid var(--lic-orange);
            padding: 20px;
            border-radius: 15px;
            font-size: 20px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.4s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .calc-btn:hover { background: var(--lic-orange); color: #000; transform: translateY(-5px); box-shadow: 0 10px 20px rgba(255, 107, 0, 0.3); }

        /* Results Panel */
        #results-box {
            margin-top: 40px;
            display: none;
            background: #fffbf8;
            padding: 35px;
            border-radius: 20px;
            border: 3px solid var(--lic-orange);
            animation: slideUp 0.6s ease;
        }

        .res-row { display: flex; justify-content: space-between; padding: 14px 0; border-bottom: 1px dashed #ccc; }
        .res-row:last-of-type { border: none; background: var(--black); color: var(--lic-orange); padding: 22px; border-radius: 15px; margin-top: 15px; }
        .res-label { font-weight: 600; font-size: 15px; }
        .res-val { font-weight: 800; font-size: 20px; }

        .formula-box {
            font-size: 11px;
            color: #777;
            text-align: center;
            margin-top: 20px;
            font-style: italic;
            background: #eee;
            padding: 10px;
            border-radius: 8px;
        }

        .action-btns { display: flex; gap: 20px; margin-top: 30px; }
        .btn-act { flex: 1; padding: 15px; border-radius: 12px; border: 2px solid var(--black); background: transparent; color: var(--black); font-weight: 800; cursor: pointer; transition: 0.3s; }
        .btn-act:hover { background: var(--black); color: var(--lic-orange); }

        @keyframes slideUp { from { opacity: 0; transform: translateY(50px); } to { opacity: 1; transform: translateY(0); } }
        .error-hint { color: #d63031; font-size: 11px; font-weight: 700; margin-top: 5px; display: none; }
    </style>
</head>
<body>

<div class="calculator-container">
    <div class="header">
        <h1>LIC-PLAN NO 736-JEEVAN LABH</h1>
        <p>LIMITED PREMIUM PAYMENT - MAXIMUM MATURITY RETURNS</p>
    </div>

    <div class="form-grid">
        <div class="input-group">
            <label>Policy Holder Name</label>
            <input type="text" id="name" placeholder="Name">
            <i class="fas fa-user-circle"></i>
        </div>

        <div class="input-group">
            <label>Age at Entry (8-59 Yrs)</label>
            <input type="number" id="age" value="30">
            <i class="fas fa-id-card"></i>
            <span id="age-err" class="error-hint">Age exceeds limit for selected term</span>
        </div>

        <div class="input-group">
            <label>Sum Assured (Min 2,00,000)</label>
            <input type="number" id="sa" value="200000" step="10000">
            <i class="fas fa-coins"></i>
            <span id="sa-err" class="error-hint">Minimum Sum Assured ₹2,00,000</span>
        </div>

        <div class="input-group">
            <label>Policy Term</label>
            <select id="term" onchange="updatePPT()">
                <option value="16">16 Years</option>
                <option value="21">21 Years</option>
                <option value="25" selected>25 Years</option>
            </select>
            <i class="fas fa-calendar-alt"></i>
        </div>

        <div class="input-group">
            <label>Premium Paying Term (PPT)</label>
            <input type="number" id="ppt" value="16" disabled>
            <i class="fas fa-hourglass-half"></i>
        </div>

        <div class="input-group">
            <label>Premium Mode</label>
            <select id="mode">
                <option value="yly">Yearly</option>
                <option value="hly">Half-Yearly</option>
                <option value="qly">Quarterly</option>
                <option value="mly">Monthly (NACH)</option>
            </select>
            <i class="fas fa-wallet"></i>
        </div>

        <div class="input-group">
            <label>Entered Annual Premium</label>
            <input type="number" id="prem" value="10025">
            <i class="fas fa-indian-rupee-sign"></i>
        </div>

        <div class="input-group">
            <label>Bonus Rate (Default 48)</label>
            <input type="number" id="bonus_rate" value="48">
            <i class="fas fa-chart-line"></i>
        </div>

        <div class="input-group">
            <label>FAB Rate (Default 20)</label>
            <input type="number" id="fab_rate" value="20">
            <i class="fas fa-star"></i>
        </div>

        <div class="toggle-wrapper">
            <div class="toggle-box" onclick="switchBenefit()">
                <div class="slider" id="slider"></div>
                <div class="toggle-opt active" id="opt_m">SURVIVAL (MATURITY)</div>
                <div class="toggle-opt" id="opt_d">DEATH BENEFIT</div>
            </div>
        </div>

        <div class="input-group" id="death_ui" style="display:none; grid-column: 1 / -1;">
            <label>Policy Year of Death</label>
            <input type="number" id="death_yr" value="10">
            <i class="fas fa-skull-crossbones"></i>
        </div>

        <button class="calc-btn" onclick="calculate()">
            <i class="fas fa-calculator"></i> Calculate Wow Factor
        </button>
    </div>

    <div id="results-box">
        <div id="res_body"></div>
        <div class="action-btns">
            <button class="btn-act" onclick="window.print()"><i class="fas fa-print"></i> Print PDF</button>
            <button class="btn-act" onclick="alert('PDF Generated for Sharing')"><i class="fas fa-share-alt"></i> Share PDF</button>
        </div>
    </div>
</div>

<script>
    function updatePPT() {
        const term = document.getElementById('term').value;
        const pptMap = { "16": 10, "21": 15, "25": 16 };
        document.getElementById('ppt').value = pptMap[term];
    }

    let isDeathMode = false;
    function switchBenefit() {
        isDeathMode = !isDeathMode;
        const slider = document.getElementById('slider');
        const dUI = document.getElementById('death_ui');
        if(isDeathMode) {
            slider.style.left = '50%';
            dUI.style.display = 'block';
            document.getElementById('opt_d').classList.add('active');
            document.getElementById('opt_m').classList.remove('active');
        } else {
            slider.style.left = '0';
            dUI.style.display = 'none';
            document.getElementById('opt_m').classList.add('active');
            document.getElementById('opt_d').classList.remove('active');
        }
    }

    function calculate() {
        const name = document.getElementById('name').value || "Valued Client";
        const age = parseInt(document.getElementById('age').value);
        const sa = parseFloat(document.getElementById('sa').value);
        const term = parseInt(document.getElementById('term').value);
        const ppt = parseInt(document.getElementById('ppt').value);
        const prem = parseFloat(document.getElementById('prem').value);
        const bonusR = parseFloat(document.getElementById('bonus_rate').value);
        const fabR = parseFloat(document.getElementById('fab_rate').value);
        const dYear = parseInt(document.getElementById('death_yr').value);

        // Validations
        const maxAgeMap = { 16: 59, 21: 54, 25: 50 };
        let err = false;
        if(age < 8 || age > maxAgeMap[term]) { document.getElementById('age-err').style.display='block'; err=true; }
        else document.getElementById('age-err').style.display='none';
        
        if(sa < 200000) { document.getElementById('sa-err').style.display='block'; err=true; }
        else document.getElementById('sa-err').style.display='none';

        if(err) return;

        const totalBonus = (sa/1000) * bonusR * (isDeathMode ? dYear : term);
        const fab = (term >= 15 && sa >= 200000) ? (sa/1000) * fabR : 0;
        
        let html = `<h3>Plan 736 Benefit Summary: ${name}</h3><br>`;

        if(!isDeathMode) {
            const totalPaid = prem * ppt;
            const matTotal = sa + totalBonus + fab;
            html += `
                <div class="res-row"><span class="res-label">Basic Sum Assured:</span><span class="res-val">₹ ${sa.toLocaleString()}</span></div>
                <div class="res-row"><span class="res-label">Accrued Vested Bonus:</span><span class="res-val">₹ ${totalBonus.toLocaleString()}</span></div>
                <div class="res-row"><span class="res-label">Final Additional Bonus (FAB):</span><span class="res-val">₹ ${fab.toLocaleString()}</span></div>
                <div class="res-row"><span class="res-label">Total Premium Paid:</span><span class="res-val">₹ ${totalPaid.toLocaleString()}</span></div>
                <div class="res-row"><span class="res-label">FINAL MATURITY PAYABLE:</span><span class="res-val">₹ ${matTotal.toLocaleString()}</span></div>
                <div class="formula-box">Formula: Basic Sum Assured + Vested Bonus + FAB</div>
            `;
        } else {
            // Death Logic: Jeevan Labh risk starts immediately (min age 8)
            // Sum Assured on Death is higher of 125% SA or 7x Premium
            const totalPaidTillDeath = prem * Math.min(dYear, ppt);
            const saOnDeath = Math.max(sa, 7 * prem); 
            const finalDeath = saOnDeath + totalBonus + fab;

            html += `
                <div class="res-row" style="background:var(--lic-orange); color:white; border-radius:12px; margin-bottom:10px;"><span class="res-label">Status:</span><span class="res-val">After Risk Commencement</span></div>
                <div class="res-row"><span class="res-label">Sum Assured on Death:</span><span class="res-val">₹ ${saOnDeath.toLocaleString()}</span></div>
                <div class="res-row"><span class="res-label">Bonus till Death (Year ${dYear}):</span><span class="res-val">₹ ${totalBonus.toLocaleString()}</span></div>
                <div class="res-row"><span class="res-label">Final Additional Bonus (if any):</span><span class="res-val">₹ ${fab.toLocaleString()}</span></div>
                <div class="res-row"><span class="res-label">Total Premium Paid till Death:</span><span class="res-val">₹ ${totalPaidTillDeath.toLocaleString()}</span></div>
                <div class="res-row"><span class="res-label">FINAL DEATH BENEFIT:</span><span class="res-val">₹ ${finalDeath.toLocaleString()}</span></div>
                <div class="formula-box">Formula: [Higher of Basic SA or 7x Annualized Premium] + Vested Bonus + FAB</div>
            `;
        }

        document.getElementById('res_body').innerHTML = html;
        document.getElementById('results-box').style.display = 'block';
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }
</script>

</body>
</html>
