<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surrender Value Calculator - Plan 715</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --lic-grey: #444444;
            --light-grey: #f4f4f4;
            --border-grey: #cccccc;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background: #e9e9e9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .calculator-card {
            width: 100%;
            max-width: 900px;
            background: var(--white);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 35px;
            border-top: 10px solid var(--lic-grey);
        }

        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { color: var(--lic-grey); font-size: 24px; text-transform: uppercase; }



        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .input-group { display: flex; flex-direction: column; }
        .input-group label { font-size: 11px; font-weight: 700; color: #555; margin-bottom: 5px; text-transform: uppercase; }

        input {
            padding: 10px;
            border: 1px solid var(--border-grey);
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
        }

        .calc-btn {
            width: 100%;
            padding: 16px;
            background: var(--lic-grey);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
        }

        #results { margin-top: 30px; display: none; }
        .summary-box {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
            padding: 15px;
            background: #fdfdfd;
            border: 1px solid #eee;
            border-radius: 8px;
        }
        .summary-item span { display: block; font-weight: 700; color: var(--lic-grey); font-size: 16px; }

        .table-container { overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: var(--lic-grey); color: white; padding: 10px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #eee; font-weight: 600; }
        .highlight-text { color: #2e7d32; font-size: 18px; }
    </style>
</head>
<body>

        <p style="font-weight: 700; color: #666; font-size: 13px;">PLAN NO 715 - NEW JEEVAN ANAND</p>
    </div>



<!-- ADD THIS: Error Box -->
<div id="errorBox" style="display:none; background:#fee; color:#b00; padding:15px; border-radius:8px; margin-bottom:20px; border:1px solid #fcc; font-size:13px; font-weight:600;">
    <div id="errorList"></div>
</div>


    <div class="input-grid">


<!-- ADD THIS: Age field (put it inside the <div class="input-grid">) -->

        </div>
        <div class="input-group">
            <label>Bonus Rate (Per 1000 SA)</label>

        </div>
    </div>

    <button class="calc-btn" onclick="calculate715()">Calculate Surrender Value</button>

    <div id="results">

    // FIX: LIC Correct lookup (Exact or Last available lower)
    function getFactor(data, year, term) {
        let termKey = `T${term}`;
        if (term != 15 && term != 21 && term != 25) termKey = "T25"; // Fallback to 25

        let rows = data.filter(x => x.Term <= year);
        if (rows.length === 0) return 0;
        let last = rows[rows.length - 1];
        return last[termKey] || 0;
    }

    const fmt = (n) => "₹ " + Math.round(n).toLocaleString('en-IN');

    function calculate715() {


// --- ADD VALIDATION START ---
    const ageVal = parseInt(document.getElementById('age').value);
    const termVal = parseInt(document.getElementById('term').value);
    const saVal = parseFloat(document.getElementById('sa').value);
    const errBox = document.getElementById('errorBox');
    const errList = document.getElementById('errorList');
    
    errBox.style.display = "none";
    errList.innerHTML = "";
    let errors = [];

    // 1. Entry Age Validation (Brochure Page 2: 18yr to 50yr)
    if (isNaN(ageVal) || ageVal < 18 || ageVal > 50) {
        errors.push("• Entry Age must be between 18 and 50 years.");
    }

    // 2. Policy Term Validation (Brochure Page 2: 15yr to 35yr)
    if (isNaN(termVal) || termVal < 15 || termVal > 35) {
        errors.push("• Policy Term must be between 15 and 35 years.");
    }

    // 3. Max Maturity Age Validation (Brochure Page 2: Max 75yr)
    if (!isNaN(ageVal) && !isNaN(termVal) && (ageVal + termVal > 75)) {
        errors.push("• Maximum Maturity Age cannot exceed 75 (Entry Age + Term).");
    }

    // 4. Sum Assured & Multiples Validation (Brochure Page 2)
    if (isNaN(saVal) || saVal < 100000) {
        errors.push("• Minimum Basic Sum Assured for Plan 715 is ₹ 1,00,000.");
    } else {
        if (saVal <= 450000 && saVal % 5000 !== 0) {
            errors.push("• For SA up to 4.5L, use multiples of ₹ 5,000.");
        } else if (saVal > 450000 && saVal <= 900000 && saVal % 50000 !== 0) {
            errors.push("• For SA between 4.5L and 9L, use multiples of ₹ 50,000.");
        } else if (saVal > 900000 && saVal % 100000 !== 0) {
            errors.push("• For SA above 9L, use multiples of ₹ 1,00,000.");
        }
    }

    if (errors.length > 0) {
        errList.innerHTML = errors.join("<br>");
        errBox.style.display = "block";
        document.getElementById('results').style.display = "none";
        window.scrollTo(0, 0);
        return; // Stops calculation
    }
    // --- ADD VALIDATION END ---


        const docVal = document.getElementById('doc').value;
        const term = parseInt(document.getElementById('term').value);
        const sa = parseFloat(document.getElementById('sa').value);
        const premium = parseFloat(document.getElementById('premium').value);
        const bonusRate = parseFloat(document.getElementById('bonusRate').value);

        if(!docVal || isNaN(sa) || isNaN(premium)) return alert("Please enter all details.");

        // Calculate Policy Years
        const doc = new Date(docVal);
        const today = new Date();
        let yearsCompleted = today.getFullYear() - doc.getFullYear();
        if (today.getMonth() < doc.getMonth() || (today.getMonth() === doc.getMonth() && today.getDate() < doc.getDate())) {
            yearsCompleted--;
        }

        const resDiv = document.getElementById('results');
        if (yearsCompleted < 2) {
            resDiv.style.display = "block";
            document.getElementById('detailsBody').innerHTML = "<tr><td colspan='3' style='color:red; text-align:center;'>Minimum 2 full years' premiums required for Surrender Value.</td></tr>";
            return;
        }

        // 1. Core Calculations
        const accruedBonus = (sa / 1000) * bonusRate * yearsCompleted;
        const paidUpSA = sa * (yearsCompleted / term);

        // 2. GSV Calculation
        const gpFactor = getFactor(gsv_p_data, yearsCompleted, term);
        const gbFactor = getFactor(gsv_b_data, yearsCompleted, term);
        
        // Logic: (Premium * (N-1)) * Factor
        const gsvOnPrem = (premium * (yearsCompleted - 1)) * gpFactor;
        const gsvOnBonus = accruedBonus * gbFactor;
        const totalGSV = gsvOnPrem + gsvOnBonus;

        // 3. SSV Calculation
        const ssvFactor = getFactor(ssv_f1_data, yearsCompleted, term);
        // Correct Logic: (Paid-up SA + Accrued Bonus) * SSV Factor
        const totalSSV = (paidUpSA + accruedBonus) * ssvFactor;

        // 4. Final Selection
        const finalSV = Math.max(totalGSV, totalSSV);

        // Update UI
        document.getElementById('resYear').innerText = yearsCompleted + " Years";
        document.getElementById('resPaidUp').innerText = fmt(paidUpSA);
        document.getElementById('resBonus').innerText = fmt(accruedBonus);
        document.getElementById('resFinal').innerText = fmt(finalSV);

        document.getElementById('detailsBody').innerHTML = `
            <tr>
                <td><b>Guaranteed SV (GSV)</b><br><small>(Prem x ${yearsCompleted - 1}) x GP + (Bonus x GB)</small></td>
                <td>GP: ${gpFactor.toFixed(4)}<br>GB: ${gbFactor.toFixed(4)}</td>
                <td style="text-align: right;">${fmt(totalGSV)}</td>
            </tr>
            <tr>
                <td><b>Special SV (SSV)</b><br><small>(Paid-up SA + Bonus) x SSV Factor</small></td>
                <td>Factor: ${ssvFactor.toFixed(4)}</td>
                <td style="text-align: right;">${fmt(totalSSV)}</td>
            </tr>
            <tr style="background: #f9f9f9;">
                <td colspan="2"><b>Final Payable (Higher of GSV/SSV)</b></td>
                <td style="text-align: right;" class="highlight-text">${fmt(finalSV)}</td>
            </tr>
        `;

        resDiv.style.display = "block";
    }
