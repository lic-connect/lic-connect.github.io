<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIC Plan 715 IRR Professional Report</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #003366;
            --success-green: #28a745;
            --white: #ffffff;
            --black: #000000;
            --bg-light: #f4f7f6;
            --shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-light);
            color: var(--black);
            margin: 0;
            padding: 20px;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        .header {
            background: linear-gradient(135deg, var(--primary-blue) 0%, #001a35 100%);
            color: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
            border-bottom: 8px solid var(--success-green);
        }
        .header h1 { margin: 0; font-size: 2.5em; text-transform: uppercase; letter-spacing: 2px; }

        .main-grid {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 30px;
        }

        .card {
            background: var(--white);
            padding: 30px;
            border-radius: 20px;
            box-shadow: var(--shadow);
        }

        .section-title {
            font-size: 1.1em;
            font-weight: 700;
            color: var(--primary-blue);
            margin-bottom: 20px;
            border-bottom: 3px solid var(--success-green);
            display: inline-block;
        }

        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85em; font-weight: 600; margin-bottom: 5px; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-family: inherit;
            box-sizing: border-box;
        }
        input[readonly] { background-color: #f9f9f9; color: #555; font-weight: bold; cursor: not-allowed; }

        .rider-box {
            background: #f0f7ff;
            padding: 15px;
            border-radius: 12px;
            margin: 20px 0;
            border: 1px solid #d0e4ff;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 0.9em;
            font-weight: 600;
        }

        #errorMsg {
            color: #d32f2f;
            background: #ffebee;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
            font-weight: bold;
            border: 1px solid #ffcdd2;
            font-size: 0.85em;
            line-height: 1.6;
        }

        button.btn-generate {
            width: 100%;
            background: var(--success-green);
            color: white;
            border: none;
            padding: 18px;
            font-size: 1.1em;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .results-panel { display: none; }
        
        .asset-summary {
            background: var(--primary-blue);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 700;
            font-size: 1.4em;
        }

        .summary-ribbon {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            flex: 1;
            background: white;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            box-shadow: var(--shadow);
            border-bottom: 6px solid var(--primary-blue);
        }
        .stat-card strong { font-size: 1.8em; display: block; margin-top: 5px; }

        .table-container {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            overflow-x: auto;
        }
        table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
        th { background: #f8fafc; color: var(--primary-blue); padding: 12px; border-bottom: 2px solid #eee; text-align: center; white-space: nowrap; }
        td { padding: 10px; text-align: center; border-bottom: 1px solid #f1f5f9; }
        .row-outflow { color: #d9534f; font-weight: bold; }
        .row-inflow { color: var(--success-green); font-weight: bold; }
        .total-row { background: #333 !important; color: white !important; font-weight: 800; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>LIC IRR Precision Report</h1>
        <p>Plan 715: New Jeevan Anand | Precision Matching (Zero GST)</p>
    </div>

    <div class="main-grid">
        <div class="card">
            <div class="section-title">Primary Inputs</div>
            
            <div class="input-group">
                <label>Basic Sum Assured (₹)</label>
                <input type="number" id="sumAssured" value="10000000">
            </div>
            <div class="input-group">
                <label>Entry Age (18-50 Yrs)</label>
                <input type="number" id="age" value="25">
            </div>
            <div class="input-group">
                <label>Policy Term (15-35 Yrs)</label>
                <input type="number" id="term" value="25" oninput="updatePPT()">
            </div>
            <div class="input-group">
                <label>Premium Paying Term (PPT)</label>
                <input type="number" id="ppt" readonly>
            </div>

            <div class="rider-box">
                <div class="section-title" style="font-size: 0.9em; margin-bottom: 10px; border:none;">Riders (ADDB Max: 1 Cr)</div>
                
                <div class="checkbox-container">
                    <input type="checkbox" id="addbCheck" onchange="document.getElementById('addbIn').style.display = this.checked ? 'block' : 'none'">
                    <label>Include AD&DB Rider</label>
                </div>
                <div id="addbIn" style="display:none; margin-bottom: 15px;">
                    <label>AD&DB Sum Assured</label>
                    <input type="number" id="addbSaValue" value="10000000">
                </div>

                <div class="checkbox-container">
                    <input type="checkbox" id="trCheck" onchange="document.getElementById('trIn').style.display = this.checked ? 'block' : 'none'">
                    <label>Include Term Rider</label>
                </div>
                <div id="trIn" style="display:none;">
                    <label>Term Rider Sum Assured (Max 25L)</label>
                    <input type="number" id="trSaValue" value="2500000">
                </div>
            </div>

            <div class="section-title">Bonus Projection</div>
            <div class="input-group">
                <label>Assumed Bonus (per 1000 SA)</label>
                <input type="number" id="bonusRate" value="45">
            </div>
            <div class="input-group">
                <label>FAB (per 1000 SA)</label>
                <input type="number" id="fabRate" value="20">
            </div>

            <button class="btn-generate" onclick="generateReport()">Generate Official Report</button>
            <div id="errorMsg"></div>
        </div>

        <div class="results-panel" id="resultsPanel">
            <div class="asset-summary">
                TOTAL ASSET = INFLOWS - OUTFLOWS : <span id="assetVal">₹0</span>
            </div>

            <div class="summary-ribbon">
                <div class="stat-card">
                    <span>Yearly Outflow (Premium)</span>
                    <strong id="dispPremium">₹0</strong>
                </div>
                <div class="stat-card" style="border-bottom-color: var(--success-green);">
                    <span>XIRR Yield</span>
                    <strong id="dispXIRR">0.00%</strong>
                </div>
            </div>

            <div class="table-container">
                <table id="irrTable">
                    <thead>
                        <tr>
                            <th>Year</th>
                            <th>Age</th>
                            <th>Outflow</th>
                            <th>Inflows</th>
                            <th>SB</th>
                            <th>Bonus</th>
                            <th>FAB</th>
                            <th>GA</th>
                            <th>Death Benefit</th>
                            <th>Netflow</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                    <tfoot id="tableFoot"></tfoot>
                </table>
            </div>
        </div>
    </div>
</div>

    function updatePPT() { document.getElementById('ppt').value = document.getElementById('term').value; }

    function calculateExactPremium() {
        const sa = parseInt(document.getElementById('sumAssured').value);
        const age = parseInt(document.getElementById('age').value);
        const term = parseInt(document.getElementById('term').value);
        const hasAddb = document.getElementById('addbCheck').checked;
        const hasTr = document.getElementById('trCheck').checked;
        const addbSaIn = parseInt(document.getElementById('addbSaValue').value) || 0;
        const trSaIn = parseInt(document.getElementById('trSaValue').value) || 0;

        const rate = (premiumRates715[age] && premiumRates715[age][term]) ? premiumRates715[age][term] : 48.7;

        // --- TARGET MATCHING LOGIC ---
        // Using the 4.0815 decimal matching Plan 714 for SA 1Cr+ cases
        let saRebate = (sa >= 1000000) ? 4.0815 : (sa >= 500000 ? 2.550 : 0);
        let netRate = rate - saRebate;
        let basePremAnnual = netRate * (sa / 1000);
        let baseWithRebate = Math.round(basePremAnnual * 0.98); // 2% Mode Rebate

        let addbPrem = 0;
        if (hasAddb && age >= 18) {
            let effAddb = Math.min(addbSaIn, sa, 10000000);
            addbPrem = Math.round((effAddb / 1000) * 1.0);
        }

        let trPrem = 0;
        if (hasTr) {
            let effTr = Math.min(trSaIn, sa, 2500000);
            let trRate = trRates[age] ? trRates[age][term] : 2.5;
            trPrem = Math.round((effTr / 1000) * trRate * 0.98);
        }

        return baseWithRebate + addbPrem + trPrem;
    }

    function generateReport() {
        const sa = parseInt(document.getElementById('sumAssured').value);
        const age = parseInt(document.getElementById('age').value);
        const term = parseInt(document.getElementById('term').value);
        const bonusRate = parseFloat(document.getElementById('bonusRate').value);
        const fabRate = parseFloat(document.getElementById('fabRate').value);
        const addbSa = parseInt(document.getElementById('addbSaValue').value);
        const trSa = parseInt(document.getElementById('trSaValue').value);
        const errorBox = document.getElementById('errorMsg');

        errorBox.style.display = "none";
        let errors = [];
        if (age < 18 || age > 50) errors.push("⚠️ Entry Age must be 18 to 50 years.");
        if (term < 15 || term > 35) errors.push("⚠️ Policy Term must be 15 to 35 years.");
        if (sa < 200000) errors.push("⚠️ Min SA is ₹2,00,000.");
        if (document.getElementById('addbCheck').checked) {
            if (addbSa > sa) errors.push("⚠️ AD&DB cannot exceed Basic SA.");
            if (addbSa > 10000000) errors.push("⚠️ AD&DB Max is 1 Crore.");
        }
        if (document.getElementById('trCheck').checked) {
            if (trSa > sa) errors.push("⚠️ Term Rider cannot exceed Basic SA.");
            if (trSa > 2500000) errors.push("⚠️ Term Rider Max is 25 Lacs.");
        }

        if (errors.length > 0) {
            errorBox.innerHTML = errors.join("<br>");
            errorBox.style.display = "block";
            return;
        }

        const premium = calculateExactPremium();
        document.getElementById('resultsPanel').style.display = 'block';
        document.getElementById('dispPremium').innerText = "₹" + premium.toLocaleString('en-IN');

        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        let flows = [];
        let totals = { outflow:0, inflow:0, bonus:0, fab:0 };

        // For DB rule B calculation
        const rateForDB = (premiumRates715[age] && premiumRates715[age][term]) ? premiumRates715[age][term] : 48.7;
        let saRebateDB = (sa >= 1000000) ? 4.0815 : (sa >= 500000 ? 2.55 : 0);
        let annualizedBase = (rateForDB - saRebateDB) * (sa / 1000);

        for (let i = 0; i <= term; i++) {
            let yrOut = (i < term) ? premium : 0;
            let yrIn = (i === term) ? sa + (sa/1000*bonusRate*term) + (sa/1000*fabRate) : 0;
            let bonusAcc = (sa/1000)*bonusRate*i;
            
            // Death Benefit Logic: Max(125% SA + Bonus + FAB, 7x Annualized, 105% Total Paid)
            let compA = (sa * 1.25) + bonusAcc + (i >= 15 ? (sa/1000*fabRate) : 0);
            let compB = annualizedBase * 7;
            let compC = (premium * i) * 1.05;
            let db = (i === 0) ? (sa * 1.25) : Math.max(compA, compB, compC);

            let net = yrIn - yrOut;
            flows.push({ amt: net, t: i });
            totals.outflow += yrOut; totals.inflow += yrIn; totals.bonus = (sa/1000)*bonusRate*term; totals.fab = (sa/1000)*fabRate;

            tbody.innerHTML += `<tr><td>${i}</td><td>${age+i}</td><td class="row-outflow">${yrOut>0?'₹'+yrOut.toLocaleString():'-'}</td><td class="row-inflow">${yrIn>0?'₹'+Math.round(yrIn).toLocaleString():'-'}</td><td>-</td><td>₹${Math.round(bonusAcc).toLocaleString()}</td><td>${i===term?'₹'+Math.round(totals.fab).toLocaleString():'-'}</td><td>-</td><td style="color:blue;font-weight:700">₹${Math.round(db).toLocaleString()}</td><td style="background:#f0f7ff;font-weight:700">${net>=0?'+':''}₹${net.toLocaleString()}</td></tr>`;
        }

        document.getElementById('tableFoot').innerHTML = `<tr class="total-row"><td colspan="2">TOTAL</td><td>₹${totals.outflow.toLocaleString()}</td><td>₹${Math.round(totals.inflow).toLocaleString()}</td><td>-</td><td>₹${Math.round(totals.bonus).toLocaleString()}</td><td>₹${Math.round(totals.fab).toLocaleString()}</td><td>-</td><td>-</td><td>₹${Math.round(totals.inflow-totals.outflow).toLocaleString()}</td></tr>`;
        document.getElementById('assetVal').innerText = "₹" + Math.round(totals.inflow - totals.outflow).toLocaleString();
        document.getElementById('dispXIRR').innerText = (calculateIRR(flows) * 100).toFixed(2) + "%";
    }

    function calculateIRR(flows) {
        let irr = 0.05;
        for (let i = 0; i < 30; i++) {
            let f = 0, df = 0;
            for (let flow of flows) {
                f += flow.amt / Math.pow(1 + irr, flow.t);
                df -= flow.t * flow.amt / Math.pow(1 + irr, flow.t + 1);
            }
            irr -= f / df;
        }
        return irr;
    }
    window.onload = updatePPT;
