<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIC Bima Lakshmi (881) IRR Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #ad1457; --accent: #ec407a; --bg: #fce4ec; --text: #333; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg); margin: 0; padding: 20px; color: var(--text); }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { background: linear-gradient(135deg, #ad1457, #880e4f); color: white; padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(173, 20, 87, 0.3); }
        .grid-layout { display: grid; grid-template-columns: 320px 1fr; gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-top: 4px solid var(--primary); }
        
        label { display: block; font-size: 0.85em; font-weight: 600; margin-bottom: 5px; color: #880e4f; }
        input, select { width: 100%; padding: 10px; border: 1px solid #f8bbd0; border-radius: 6px; font-size: 0.9em; margin-bottom: 15px; }
        input:focus, select:focus { outline: none; border-color: var(--accent); }

        .rider-section { background: #fce4ec; padding: 10px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #f48fb1; }
        .checkbox-wrapper { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; font-weight: 500; font-size: 0.9em; }
        
        button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        button:hover { background: #880e4f; transform: translateY(-2px); }
        
        #errorMsg { color: #d32f2f; background: #ffebee; padding: 10px; border-radius: 5px; font-size: 0.85em; margin-top: 10px; display: none; border: 1px solid #ef9a9a; }
        
        .results-panel { display: none; }
        .summary-box { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .kpi-card { background: #880e4f; color: white; padding: 15px; border-radius: 8px; text-align: center; }
        .kpi-card h3 { margin: 0; font-size: 0.8em; opacity: 0.9; }
        .kpi-card span { font-size: 1.5em; font-weight: 700; }

        .table-wrap { overflow-x: auto; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; font-size: 0.85em; background: white; min-width: 900px; }
        th { background: var(--primary); color: white; padding: 10px; text-align: center; }
        td { padding: 8px; border: 1px solid #fce4ec; text-align: center; }
        .total-row { background: #f8bbd0; font-weight: bold; color: #880e4f; }
        
        @media(max-width: 768px) { .grid-layout { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>LIC Bima Lakshmi (881)</h1>
        <p style="margin:0; font-size:0.9em; opacity:0.9;">Women's Plan | Guaranteed Additions</p>
    </div>

    <div class="grid-layout">
        <div class="card">
            <h3>Plan Inputs</h3>
            
            <label>Plan Option</label>
            <select id="planOption" onchange="updateDesc()">
                <option value="A">Option A (Lumpsum at End of PPT)</option>
                <option value="B">Option B (MB 7.5% every 2 yrs)</option>
                <option value="C">Option C (MB 15% every 4 yrs)</option>
            </select>
            <div id="optDesc" style="font-size:0.75em; color:#666; margin-top:-10px; margin-bottom:15px;">50% SA at end of PPT</div>

            <label>Age (18-50)</label>
            <input type="number" id="age" value="24" min="18" max="50">

            <label>Premium Paying Term (7-15)</label>
            <input type="number" id="ppt" value="10" min="7" max="15">

            <label>Sum Assured (Min 2L)</label>
            <input type="number" id="sumAssured" value="200000" step="10000" min="200000">

            <div class="rider-section">
                <div class="checkbox-wrapper">
                    <input type="checkbox" id="addbCheck" onchange="toggleInp('addbInp', this)"> 
                    <label for="addbCheck">ADDB Rider (Max 1Cr)</label>
                </div>
                <div id="addbInp" style="display:none;">
                    <input type="number" id="addbSa" placeholder="Rider SA" style="margin-bottom:5px;">
                </div>

                <div class="checkbox-wrapper">
                    <input type="checkbox" id="trCheck" onchange="toggleInp('trInp', this)"> 
                    <label for="trCheck">Term Rider (Max 25L)</label>
                </div>
                <div id="trInp" style="display:none;">
                    <input type="number" id="trSa" placeholder="Rider SA" style="margin-bottom:5px;">
                </div>
                
                <div class="checkbox-wrapper" style="margin-top:10px; border-top:1px dashed #f48fb1; padding-top:5px;">
                    <input type="checkbox" id="onlineCheck"> 
                    <label for="onlineCheck">Online Purchase</label>
                </div>
            </div>

            <button onclick="generateReport()">Generate IRR Table</button>
            <div id="errorMsg"></div>
        </div>

        <div class="results-panel" id="resultsPanel">
            <div class="summary-box">
                <div class="kpi-card">
                    <h3>Net Benefit</h3>
                    <span id="netProfit">₹0</span>
                </div>
                <div class="kpi-card" style="background:#00897b;">
                    <h3>XIRR (Yield)</h3>
                    <span id="xirrVal">0.00%</span>
                </div>
            </div>

            <div class="card" style="padding:0; overflow:hidden;">
                <div class="table-wrap">
                    <table id="flowTable">
                        <thead>
                            <tr>
                                <th>Year</th>
                                <th>Age</th>
                                <th>Premium<br><small>(Outflow)</small></th>
                                <th>Survival Benefit</th>
                                <th>Maturity<br><small>(SA+GA)</small></th>
                                <th>Accrued GA</th>
                                <th>Death Benefit<br><small>(Cover)</small></th>
                                <th>Net Cashflow</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                        <tfoot id="tableFoot"></tfoot>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

  // --- ROBUST XIRR FUNCTION ---
  function calculateIRR(values, guess) {
        // Advanced Newton-Raphson with Bisect Fallback
        const credits = values;
        const maxIterations = 100;
        const tolerance = 1e-7;
        
        let x0 = guess || 0.1;
        let x1 = 0.0;
        
        // Check for validity (must have at least one positive and one negative)
        let positive = false;
        let negative = false;
        for (let i = 0; i < credits.length; i++) {
            if (credits[i] > 0) positive = true;
            if (credits[i] < 0) negative = true;
        }
        if (!positive || !negative) return 0;

        for (let i = 0; i < maxIterations; i++) {
            let fValue = 0;
            let fDerivative = 0;
            
            for (let j = 0; j < credits.length; j++) {
                // Formula: sum( CF / (1+r)^t )
                const div = Math.pow(1 + x0, j);
                fValue += credits[j] / div;
                fDerivative -= (j * credits[j]) / (div * (1 + x0));
            }
            
            x1 = x0 - fValue / fDerivative;
            
            if (Math.abs(x1 - x0) <= tolerance) {
                return x1;
            }
            x0 = x1;
        }
        
        // If Newton fails, try a simple brute force scan (Fallback)
        let bestRate = 0;
        let minDiff = Infinity;
        for(let r = -0.5; r < 1.0; r += 0.001) {
             let npv = 0;
             for (let j = 0; j < values.length; j++) {
                npv += values[j] / Math.pow(1 + r, j);
             }
             if(Math.abs(npv) < minDiff) {
                 minDiff = Math.abs(npv);
                 bestRate = r;
             }
        }
        return bestRate;
    }

 function generateReport() {
        const age = parseInt(document.getElementById('age').value);
        const ppt = parseInt(document.getElementById('ppt').value);
        const sa = parseInt(document.getElementById('sumAssured').value);
        const opt = document.getElementById('planOption').value;
        const err = document.getElementById('errorMsg');
        err.style.display = 'none';

        // --- VALIDATIONS ---
        if(sa < 200000) { showError("Min Sum Assured is 2L"); return; }
        if(sa % 10000 !== 0) { showError("SA must be multiple of 10,000"); return; }
        if(age < 18 || age > 50) { showError("Age must be 18-50"); return; }
        if(ppt < 7 || ppt > 15) { showError("PPT must be 7-15"); return; }

        const hasAddb = document.getElementById('addbCheck').checked;
        const addbSaInp = document.getElementById('addbSa').value;
        const addbSa = addbSaInp ? parseInt(addbSaInp) : sa;
        if(hasAddb && (addbSa > sa || addbSa > 10000000)) { showError("ADDB SA Max 1Cr or Basic SA"); return; }

        const hasTr = document.getElementById('trCheck').checked;
        const trSaInp = document.getElementById('trSa').value;
        const trSa = trSaInp ? parseInt(trSaInp) : sa;
        if(hasTr && (trSa > sa || trSa > 2500000)) { showError("Term Rider SA Max 25L or Basic SA"); return; }

        // --- PREMIUM CALCULATION ---
        let rateArr;
        if(opt === 'A') rateArr = ratesA;
        else if(opt === 'B') rateArr = ratesB;
        else rateArr = ratesC;

        const rateRow = rateArr.find(r => r.Age === age);
        if(!rateRow) { showError("Rate not found"); return; }
        const baseRate = rateRow[`T${ppt}`];
        const basePrem = (sa * baseRate) / 1000;

        // Rider Premiums
        let addbPrem = 0;
        if(hasAddb) {
            const addbRow = ratesADDB.find(x => x.Term === 25);
            if(addbRow) {
                let rateVal = addbRow[`T${ppt}`];
                if(rateVal) {
                    let rateNum = parseFloat(rateVal);
                    let rawAddb = (addbSa * rateNum) / 1000;
                    const maxRiderPrem = basePrem * 0.30;
                    addbPrem = (rawAddb > maxRiderPrem) ? maxRiderPrem : rawAddb;
                    addbPrem = Math.round(addbPrem);
                }
            }
        }

        let trPrem = 0;
        if(hasTr) {
            const trRow = ratesTR.find(r => r.Age === age);
            if(trRow) {
                const trRate = trRow[`T${ppt}`];
                if(trRate) {
                    let rawTr = (trSa * trRate) / 1000;
                    const maxRiderPrem = basePrem * 0.30;
                    trPrem = (rawTr > maxRiderPrem) ? maxRiderPrem : rawTr;
                    trPrem = Math.round(trPrem);
                }
            }
        }

        const totalAnnualPrem = Math.round(basePrem + addbPrem + trPrem);

        // --- GA CALCULATION ---
        let gaRatePct = 7.0;
        if(sa >= 2500000) gaRatePct += 0.45;
        else if(sa >= 1500000) gaRatePct += 0.40;
        else if(sa >= 1000000) gaRatePct += 0.35;
        else if(sa >= 500000) gaRatePct += 0.25;

        if(document.getElementById('onlineCheck').checked) {
            if(ppt <= 9) gaRatePct += 0.75;
            else if(ppt <= 14) gaRatePct += 1.25;
            else gaRatePct += 1.50;
        }

        const gaAmount = (basePrem * gaRatePct) / 100;

        // --- TABLE GENERATION ---
        document.getElementById('resultsPanel').style.display = 'block';
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        let cflows = [], totalOut = 0, totalIn = 0;
        let accruedGA = 0;

        // Year 0 Cashflow (First Premium Outflow)
        cflows.push(-totalAnnualPrem);

        for(let yr = 1; yr <= 25; yr++) {
            let curAge = age + yr;
            
            // Outflow (Years 1 to PPT-1, since Year 0 is already paid)
            let out = 0;
            // Note: Premium is paid at START of year. 
            // In table, Row "1" means End of Year 1. 
            // So premium for Year 2 is paid at start of Year 2 (which is effectively end of Year 1 time-value wise).
            if (yr < ppt) out = totalAnnualPrem;

            // GA Accrual (End of Year)
            if(yr <= ppt) accruedGA += gaAmount; // GA accrues during PPT only? 
            // Wait, brochure says: "Guaranteed Additions during the Policy Term... 7% of premiums paid".
            // Actually, for Limited Pay, GA usually accrues ONLY during PPT for premiums paid.
            // Bima Lakshmi Brochure check: "Under an in-force policy... Guaranteed Additions during the Policy Term shall accrue at the end of each policy year."
            // "The Guaranteed Additions... shall be 7% of Total Tabular Annual Premium in respect of Premiums Paid."
            // This usually means GA is attached every year *during PPT*. After PPT, GA stops accruing for this specific plan structure unless specified "throughout policy term".
            // Correction: Brochure Point 4: "Under an in-force policy... Guaranteed Additions during the Policy Term shall accrue at the end of each policy year."
            // AND "Rate ... shall be 7% of ... Annual Premium in respect of Premiums Paid".
            // Meaning: Year 1 GA = 7% * 1 Prem. Year 2 GA = 7% * 1 Prem. 
            // Does it accrue after PPT? "In case of fully paid-up policy... GA shall continue to accrue at the end of each policy year".
            // YES, it accrues for the full 25 years.
            
            if(yr > ppt) accruedGA += gaAmount; // Continue accruing after PPT

            // Survival Benefits
            let sb = 0;
            if (opt === 'A') {
                if (yr === ppt) sb = sa * 0.50;
            } else if (opt === 'B') {
                // Payable at end of policy year 2, 4, 6... 24
                if (yr % 2 === 0 && yr < 25) sb = sa * 0.075;
            } else if (opt === 'C') {
                // Payable at end of policy year 4, 8, 12, 16, 20, 24
                if (yr % 4 === 0 && yr < 25) sb = sa * 0.15;
            }

            // Maturity Benefit (End of Year 25)
            let maturity = 0;
            if (yr === 25) maturity = sa + accruedGA;

            // Death Benefit
            let db = 0;
            let totalPremiumsPaid = totalAnnualPrem * (yr < ppt ? yr : ppt); // Approx logic for display
            if(yr === 1 && totalPremiumsPaid === 0) totalPremiumsPaid = totalAnnualPrem; // Handle Year 1 start

            let saOnDeath = Math.max(sa, 10 * totalAnnualPrem);
            let dbVal = saOnDeath + accruedGA;
            db = Math.max(dbVal, 1.05 * totalPremiumsPaid);

            let net = (sb + maturity) - out;
            cflows.push(net);

            totalOut += out; // This sums up 2nd to last premium
            totalIn += (sb + maturity);

            tbody.innerHTML += `
                <tr>
                    <td>${yr}</td>
                    <td>${curAge}</td>
                    <td class="outflow">${out > 0 ? '₹'+Math.round(out).toLocaleString() : '-'}</td>
                    <td class="inflow">${sb > 0 ? '₹'+Math.round(sb).toLocaleString() : '-'}</td>
                    <td class="inflow">${maturity > 0 ? '₹'+Math.round(maturity).toLocaleString() : '-'}</td>
                    <td>₹${Math.round(accruedGA).toLocaleString()}</td>
                    <td style="color:blue">${db > 0 ? '₹'+Math.round(db).toLocaleString() : '-'}</td>
                    <td style="font-weight:bold">${net !== 0 ? (net > 0 ? '+' : '') + '₹'+Math.round(net).toLocaleString() : '-'}</td>
                </tr>
            `;
        }

        // Adjust Total Out to include Year 0 premium
        totalOut += totalAnnualPrem; 

        document.getElementById('netProfit').innerText = "₹" + Math.round(totalIn - totalOut).toLocaleString();
        
        // Calculate IRR using new function
        let irrVal = calculateIRR(cflows, 0.05) * 100;
        if(isNaN(irrVal) || !isFinite(irrVal)) irrVal = 0;
        
        document.getElementById('xirrVal').innerText = irrVal.toFixed(2) + "%";
        
        document.getElementById('tableFoot').innerHTML = `
            <tr class="total-row">
                <td colspan="2">TOTAL</td>
                <td>₹${Math.round(totalOut).toLocaleString()}</td>
                <td>-</td>
                <td>-</td>
                <td>-</td>
                <td>-</td>
                <td>₹${Math.round(totalIn - totalOut).toLocaleString()}</td>
            </tr>
        `;
    }
    function showError(msg) {
        const e = document.getElementById('errorMsg');
        e.innerText = "⚠️ " + msg;
        e.style.display = 'block';
    }
</script>

</body>
