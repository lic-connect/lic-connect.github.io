        const online = document.getElementById('isOnline').checked;
        

        if (sa < 20000000) { alert("Min Sum Assured is 2 Crore."); return; }

        const ageData = tabularRates.find(r => r.Age === age);
        if (!ageData || !ageData[`T${term}`]) {
            alert("No data for this Age/Term combination.");
            return;
        }

        const rate = ageData[`T${term}`];
        const tabSinglePremium = (sa / 1000) * rate;

        // High Sum Assured Rebate for Single Premium (Option II)
        let hsaRate = 0;
        const saCr = sa / 10000000;
        if (saCr >= 3 && saCr < 5) hsaRate = 1.00;
        else if (saCr >= 5 && saCr < 10) hsaRate = 1.50;
        else if (saCr >= 10) hsaRate = 2.00;
        
        const hsaRebate = (tabSinglePremium * hsaRate) / 100;

        // Online Rebate (2% for Single Premium)
        const onlineRebate = online ? (tabSinglePremium * 0.02) : 0;

     

        const totalPremium = tabSinglePremium - hsaRebate - onlineRebate;

        document.getElementById('resultsArea').style.display = 'block';
        document.getElementById('outTab').innerText = "₹ " + Math.round(tabSinglePremium).toLocaleString('en-IN');
        document.getElementById('outHSA').innerText = "- ₹ " + Math.round(hsaRebate).toLocaleString('en-IN');
        document.getElementById('outOnline').innerText = "- ₹ " + Math.round(onlineRebate).toLocaleString('en-IN');
        
        document.getElementById('outTotal').innerText = "₹ " + Math.round(totalPremium).toLocaleString('en-IN');
    }
</script>

</body>
</html>
