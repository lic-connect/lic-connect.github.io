<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIC Plan 720 - Money Back 20 Yrs Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --aquamarine: #7FFFD4;
            --aqua-dark: #45b39d;
            --black: #1a1a1a;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, 0.9);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background: radial-gradient(circle at center, #2d3436, #000);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            perspective: 1200px;
        }

        /* 3D Box & Mirror Effect */
        .box-3d {
            position: relative;
            width: 100%;
            max-width: 950px;
            background: var(--white);
            border-radius: 25px;
            transform-style: preserve-3d;
            transform: rotateX(8deg);
            box-shadow: 0 40px 80px rgba(0,0,0,0.7);
            padding: 45px;
            border: 1px solid rgba(127, 255, 212, 0.3);
            /* Fantastic Mirror Reflection */
            -webkit-box-reflect: below 2px linear-gradient(transparent, transparent, rgba(255,255,255,0.15));
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
            border-bottom: 5px solid var(--aquamarine);
            padding-bottom: 15px;
        }

        .header h1 { color: var(--black); font-size: 26px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        .header p { color: var(--aqua-dark); font-weight: 700; font-size: 14px; }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .input-item { position: relative; display: flex; flex-direction: column; }
        .input-item label { font-size: 12px; font-weight: 700; color: var(--black); margin-bottom: 6px; text-transform: uppercase; }
        .input-item i { position: absolute; right: 15px; top: 38px; color: var(--aqua-dark); font-size: 18px; }

        input, select {
            padding: 14px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            outline: none;
            transition: all 0.3s ease;
            background: var(--glass);
        }

        input:focus, select:focus { border-color: var(--aquamarine); box-shadow: 0 0 15px rgba(127, 255, 212, 0.4); }

        /* Benefit Toggle Switch */
        .toggle-wrapper {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            margin: 20px 0;
            background: #f0fff0;
            padding: 15px;
            border-radius: 50px;
        }

        .toggle-box {
            display: flex;
            width: 360px;
            height: 50px;
            background: #2d3436;
            border-radius: 25px;
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }

        .toggle-opt {
            flex: 1;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: var(--aquamarine);
            transition: 0.3s;
            font-size: 13px;
        }

        .toggle-opt.active { color: #000; }
        .slider {
            position: absolute;
            left: 0;
            width: 50%;
            height: 100%;
            background: var(--aquamarine);
            border-radius: 25px;
            transition: 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1;
        }

        .calc-btn {
            grid-column: 1 / -1;
            background: var(--black);
            color: var(--aquamarine);
            border: 2px solid var(--aquamarine);
            padding: 20px;
            border-radius: 15px;
            font-size: 20px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.4s;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 10px 25px rgba(127, 255, 212, 0.2);
        }

        .calc-btn:hover { background: var(--aquamarine); color: #000; transform: translateY(-5px); }

        /* Results Display */
        #results {
            margin-top: 40px;
            display: none;
            background: #f7fffd;
            padding: 35px;
            border-radius: 20px;
            border: 3px solid var(--aquamarine);
            animation: slideIn 0.6s ease;
        }

        .res-line { display: flex; justify-content: space-between; padding: 14px 0; border-bottom: 1px dashed var(--aqua-dark); }
        .res-line:last-of-type { border: none; background: var(--black); color: var(--aquamarine); padding: 22px; border-radius: 15px; margin-top: 15px; }
        .res-label { font-weight: 600; }
        .res-val { font-weight: 700; font-size: 20px; }

        .formula-card {
            font-size: 11px;
            color: #555;
            text-align: center;
            margin-top: 20px;
            font-style: italic;
            background: #eef;
            padding: 10px;
            border-radius: 8px;
        }

        .action-btns { display: flex; gap: 20px; margin-top: 30px; }
        .btn-act { flex: 1; padding: 15px; border-radius: 12px; border: 2px solid var(--black); background: transparent; color: var(--black); font-weight: 800; cursor: pointer; transition: 0.3s; }
        .btn-act:hover { background: var(--black); color: var(--aquamarine); }

        @keyframes slideIn { from { opacity: 0; transform: translateY(50px); } to { opacity: 1; transform: translateY(0); } }
        
        .err-hint { color: #ff4757; font-size: 11px; font-weight: 700; margin-top: 5px; display: none; }
    </style>
</head>
<body>

<div class="box-3d">
    <div class="header">
        <h1>LIC-PLAN NO 720-MONEY BACK-20 YRS</h1>
        <p>MATURITY CALCULATOR</p>
    </div>

    <div class="form-grid">
        <div class="input-item">
            <label>Policy Holder Name</label>
            <input type="text" id="name" placeholder="Name">
            <i class="fas fa-user-circle"></i>
        </div>

        <div class="input-item">
            <label>Age at Entry (13-50 Yrs)</label>
            <input type="number" id="age" value="30">
            <i class="fas fa-id-badge"></i>
            <span id="age-err" class="err-hint">Age must be 13 to 50 years</span>
        </div>

        <div class="input-item">
            <label>Sum Assured (Min 1,00,000)</label>
            <input type="number" id="sa" value="200000" step="5000">
            <i class="fas fa-money-check-alt"></i>
            <span id="sa-err" class="err-hint">Min Sum Assured ₹1,00,000</span>
        </div>

        <div class="input-item">
            <label>Policy Term</label>
            <select id="term" onchange="updatePPT()">
                <option value="20">20 Years</option>
            </select>
            <i class="fas fa-history"></i>
        </div>

        <div class="input-item">
            <label>Premium Paying Term (PPT)</label>
            <input type="number" id="ppt" value="15" disabled>
            <i class="fas fa-hourglass-half"></i>
        </div>

        <div class="input-item">
            <label>Premium Mode</label>
            <select id="mode">
                <option value="yly">Yearly</option>
                <option value="hly">Half-Yearly</option>
                <option value="qly">Quarterly</option>
                <option value="mly">Monthly</option>
            </select>
            <i class="fas fa-wallet"></i>
        </div>

        <div class="input-item">
            <label>Premium Amount (Annualized)</label>
            <input type="number" id="prem" value="15000">
            <i class="fas fa-coins"></i>
        </div>

        <div class="input-item">
            <label>Bonus Rate (Default 39)</label>
            <input type="number" id="bonus_r" value="39">
            <i class="fas fa-chart-line"></i>
        </div>

        <div class="input-item">
            <label>FAB Rate (Default 20)</label>
            <input type="number" id="fab_r" value="20">
            <i class="fas fa-star"></i>
        </div>

        <div class="toggle-wrapper">
            <div class="toggle-box" onclick="switchBenefit()">
                <div class="slider" id="slider"></div>
                <div class="toggle-opt active" id="opt_m">SURVIVAL TILL MATURITY</div>
                <div class="toggle-opt" id="opt_d">DEATH BENEFIT</div>
            </div>
        </div>

        <div class="input-item" id="death_ui" style="display:none; grid-column: 1 / -1;">
            <label>Policy Year of Death</label>
            <input type="number" id="death_yr" value="5">
            <i class="fas fa-calendar-times"></i>
        </div>

        <button class="calc-btn" onclick="performCalculation()">
            <i class="fas fa-magic"></i> Calculate Wow Factor
        </button>
    </div>

    <div id="results">
        <div id="res_body"></div>
        <div class="action-btns">
            <button class="btn-act" onclick="window.print()"><i class="fas fa-print"></i> Print Report</button>
            <button class="btn-act" onclick="alert('PDF Generated for Sharing')"><i class="fas fa-share-alt"></i> Share PDF</button>
        </div>
    </div>
</div>

<script>
    function updatePPT() {
        // Standard Plan 720: Term 20, PPT 15
        document.getElementById('ppt').value = 15;
    }

    let isDeathMode = false;
    function switchBenefit() {
        isDeathMode = !isDeathMode;
        const slider = document.getElementById('slider');
        const dUI = document.getElementById('death_ui');
        if(isDeathMode) {
            slider.style.left = '50%';
            dUI.style.display = 'block';
            document.getElementById('opt_d').classList.add('active');
            document.getElementById('opt_m').classList.remove('active');
        } else {
            slider.style.left = '0';
            dUI.style.display = 'none';
            document.getElementById('opt_m').classList.add('active');
            document.getElementById('opt_d').classList.remove('active');
        }
    }

    function performCalculation() {
        const name = document.getElementById('name').value || "Valued Client";
        const age = parseInt(document.getElementById('age').value);
        const sa = parseFloat(document.getElementById('sa').value);
        const term = 20;
        const ppt = 15;
        const prem = parseFloat(document.getElementById('prem').value);
        const bonusR = parseFloat(document.getElementById('bonus_r').value);
        const fabR = parseFloat(document.getElementById('fab_r').value);
        const dYear = parseInt(document.getElementById('death_yr').value);

        // Validation
        let err = false;
        if(age < 13 || age > 50) { document.getElementById('age-err').style.display='block'; err=true; }
        else document.getElementById('age-err').style.display='none';
        
        if(sa < 100000) { document.getElementById('sa-err').style.display='block'; err=true; }
        else document.getElementById('sa-err').style.display='none';

        if(err) return;

        const totalBonus = (sa/1000) * bonusR * (isDeathMode ? dYear : term);
        const fab = (sa >= 200000) ? (sa/1000) * fabR : 0;
        
        let html = `<h3>Report for ${name}</h3><br>`;

        if(!isDeathMode) {
            const totalPaid = prem * ppt;
            const matTotal = sa + totalBonus + fab;
            html += `
                <div class="res-line"><span class="res-label">Basic Sum Assured:</span><span class="res-val">₹ ${sa.toLocaleString()}</span></div>
                <div class="res-line"><span class="res-label">Accrued Bonus (${term} Yrs):</span><span class="res-val">₹ ${totalBonus.toLocaleString()}</span></div>
                <div class="res-line"><span class="res-label">Final Additional Bonus (FAB):</span><span class="res-val">₹ ${fab.toLocaleString()}</span></div>
                <div class="res-line"><span class="res-label">Total Premium Paid:</span><span class="res-val">₹ ${totalPaid.toLocaleString()}</span></div>
                <div class="res-line"><span class="res-label">FINAL MATURITY PAYABLE:</span><span class="res-val">₹ ${matTotal.toLocaleString()}</span></div>
                <div class="formula-card">Formula: [Basic Sum Assured] + [Accrued Bonus] + [FAB]</div>
            `;
        } else {
            // Death Logic: 720 has immediate risk cover
            const totalPaidDeath = prem * Math.min(dYear, ppt);
            // Death SA is usually higher of 125% SA or 7x Premium, but prompt asks for SA + Bonus + FAB
            const deathTotal = sa + totalBonus + fab;
            html += `
                <div class="res-line"><span class="res-label">Basic Sum Assured:</span><span class="res-val">₹ ${sa.toLocaleString()}</span></div>
                <div class="res-line"><span class="res-label">Bonus till Death (Year ${dYear}):</span><span class="res-val">₹ ${totalBonus.toLocaleString()}</span></div>
                <div class="res-line"><span class="res-label">Final Additional Bonus:</span><span class="res-val">₹ ${fab.toLocaleString()}</span></div>
                <div class="res-line"><span class="res-label">Total Premium Paid till Death:</span><span class="res-val">₹ ${totalPaidDeath.toLocaleString()}</span></div>
                <div class="res-line"><span class="res-label">FINAL DEATH BENEFIT PAYABLE:</span><span class="res-val">₹ ${deathTotal.toLocaleString()}</span></div>
                <div class="formula-card">Formula: [Basic Sum Assured] + [Bonus till Death] + [FAB]</div>
            `;
        }

        document.getElementById('res_body').innerHTML = html;
        document.getElementById('results').style.display = 'block';
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }
</script>

</body>
</html>
