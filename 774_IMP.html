<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIC Jeevan Amritbaal (774) IRR Report</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0c2f5a; --accent: #ffd700; --bg: #f4f7f9; --danger: #d32f2f; --success: #2e7d32; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg); margin: 0; padding: 15px; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { background: linear-gradient(135deg, var(--primary), #001a35); color: white; padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 20px; border-bottom: 4px solid var(--accent); }
        .grid-layout { display: grid; grid-template-columns: 350px 1fr; gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        label { display: block; font-size: 0.85em; font-weight: 600; margin-bottom: 5px; color: var(--primary); }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.9em; box-sizing: border-box; margin-bottom: 15px; }
        input:focus, select:focus { outline: none; border-color: #0dcaf0; }
        
        .checkbox-wrapper { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 0.9em; font-weight: 500; }
        .rider-section { background: #eef7ff; padding: 15px; border-radius: 8px; border: 1px solid #cfe2ff; margin-bottom: 15px; }
        
        button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        button:hover { background: #004080; }
        
        #errorMsg { color: var(--danger); display: none; background: #ffebee; padding: 10px; border-radius: 5px; font-size: 0.85em; margin-top: 10px; border: 1px solid #ffcdd2; }
        
        .results-panel { display: none; }
        .summary-box { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .kpi-card { background: var(--primary); color: white; padding: 15px; border-radius: 8px; text-align: center; }
        .kpi-card.irr { background: linear-gradient(135deg, #0dcaf0, #0096c7); }
        .kpi-card h3 { margin: 0; font-size: 0.85em; opacity: 0.9; }
        .kpi-card span { font-size: 1.6em; font-weight: 700; }

        table { width: 100%; border-collapse: collapse; font-size: 0.85em; background: white; }
        th { background: #f1f5f9; color: var(--primary); padding: 10px; border: 1px solid #e2e8f0; text-align: center; }
        td { padding: 8px; border: 1px solid #eee; text-align: center; }
        .total-row { background: #1e293b; color: white; font-weight: bold; }
        .total-row td { border-color: #334155; }
        
        @media(max-width: 768px) { .grid-layout { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>LIC Jeevan Amritbaal (774)</h1>
        <p style="margin:0; font-size:0.9em; opacity:0.8;">Child Plan | Guaranteed Additions | Non-Linked</p>
    </div>

    <div class="grid-layout">
        <div class="card">
            <h3 style="margin-top:0; color:var(--primary); border-bottom:2px solid #f0f0f0; padding-bottom:10px;">Configuration</h3>
            
            <label>Child's Age (0-13)</label>
            <input type="number" id="age" value="5" min="0" max="13" onchange="validateTerm()">

            <label>Policy Term (5-25)</label>
            <input type="number" id="term" value="20" min="5" max="25" onchange="validateTerm()">
            <small id="maturityNote" style="display:block; margin-top:-10px; margin-bottom:10px; color:#666; font-size:0.75em;">Maturity Age must be 18-25</small>

            <label>Sum Assured (Min 2L)</label>
            <input type="number" id="sumAssured" value="500000" step="25000">

            <label>Premium Paying Term (PPT)</label>
            <select id="ppt" onchange="adjustOptions()">
                <option value="5">Limited (5 Years)</option>
                <option value="6">Limited (6 Years)</option>
                <option value="7">Limited (7 Years)</option>
                <option value="1">Single Premium</option>
            </select>

            <label>Plan Option</label>
            <select id="planOption">
                <option value="1">Opt 1: Limited (7x Death Benefit)</option>
                <option value="2">Opt 2: Limited (10x Death Benefit)</option>
                <option value="3" disabled>Opt 3: Single (1.25x Death Benefit)</option>
                <option value="4" disabled>Opt 4: Single (10x Death Benefit)</option>
            </select>

            <div class="rider-section">
                <div class="checkbox-wrapper">
                    <input type="checkbox" id="pwbCheck" onchange="togglePwb()"> 
                    <label style="margin:0; cursor:pointer;" for="pwbCheck">PWB Rider (On Proposer)</label>
                </div>
                <div id="pwbInput" style="display:none;">
                    <label>Proposer Age (18-55)</label>
                    <input type="number" id="propAge" value="30">
                </div>
            </div>

            <button onclick="generateReport()">Generate IRR Table</button>
            <div id="errorMsg"></div>
        </div>

        <div class="results-panel" id="resultsPanel">
            <div class="summary-box">
                <div class="kpi-card">
                    <h3>Net Profit</h3>
                    <span id="netProfit">₹0</span>
                </div>
                <div class="kpi-card irr">
                    <h3>XIRR (Yield)</h3>
                    <span id="xirrVal">0.00%</span>
                </div>
            </div>

            <div class="card" style="padding:0; overflow:hidden;">
                <div style="overflow-x: auto;">
                    <table id="flowTable">
                        <thead>
                            <tr>
                                <th>Year</th>
                                <th>Age</th>
                                <th>Premium<br><small>(Outflow)</small></th>
                                <th>Survival Benefit</th>
                                <th>Maturity Benefit<br><small>(SA + GA)</small></th>
                                <th>Death Benefit<br><small>(Cover)</small></th>
                                <th>Net Cashflow</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                        <tfoot id="tableFoot"></tfoot>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

    function toggleInp(id, cb) { document.getElementById(id).style.display = cb.checked ? 'block' : 'none'; }
    function togglePwb() { document.getElementById('pwbInput').style.display = document.getElementById('pwbCheck').checked ? 'block' : 'none'; }

    function validateTerm() {
        const age = parseInt(document.getElementById('age').value);
        const term = parseInt(document.getElementById('term').value);
        const matAge = age + term;
        const note = document.getElementById('maturityNote');
        
        if (matAge < 18 || matAge > 25) {
            note.style.color = 'red';
            note.innerText = `Invalid Maturity Age: ${matAge} (Must be 18-25)`;
        } else {
            note.style.color = '#2e7d32';
            note.innerText = `Maturity Age: ${matAge} (Valid)`;
        }
    }

    function adjustOptions() {
        const ppt = document.getElementById('ppt').value;
        const sel = document.getElementById('planOption');
        
        for(let i=0; i<sel.options.length; i++) sel.options[i].disabled = false;

        if(ppt === '1') {
            sel.options[0].disabled = true;
            sel.options[1].disabled = true;
            if(sel.value === '1' || sel.value === '2') sel.value = '3';
        } else {
            sel.options[2].disabled = true;
            sel.options[3].disabled = true;
            if(sel.value === '3' || sel.value === '4') sel.value = '1';
        }
    }

    function xirr(values) {
        let x = 0.1;
        for (let i = 0; i < 100; i++) {
            let f = 0, df = 0;
            for (let j = 0; j < values.length; j++) {
                let p = Math.pow(1 + x, j);
                f += values[j] / p;
                df -= j * values[j] / (p * (1 + x));
            }
            if (Math.abs(df) < 1e-12) break;
            x = x - f / df;
        }
        return x;
    }

 function generateReport() {
        const age = parseInt(document.getElementById('age').value);
        const sa = parseInt(document.getElementById('sumAssured').value);
        const term = parseInt(document.getElementById('term').value);
        const pptVal = document.getElementById('ppt').value;
        const ppt = parseInt(pptVal);
        const opt = document.getElementById('planOption').value;
        
        const matAge = age + term;
        const err = document.getElementById('errorMsg');
        err.style.display = 'none';

        // --- VALIDATIONS ---
        if(age < 0 || age > 13) { showError("Entry Age must be 0-13"); return; }
        if(matAge < 18 || matAge > 25) { showError(`Maturity Age must be 18-25. Current: ${matAge}`); return; }
        if(sa < 200000) { showError("Min Sum Assured is 2,00,000"); return; }

        const hasPwb = document.getElementById('pwbCheck').checked && pptVal !== '1';
        const propAge = parseInt(document.getElementById('propAge').value);
        
        if (hasPwb) {
            if(isNaN(propAge) || propAge < 18 || propAge > 55) { showError("Proposer Age for PWB must be 18-55"); return; }
        }

        // --- PREMIUM CALCULATION ---
        let rate = 0;
        if(opt === '1') rate = limitedPremiumRatesOption1[age]?.[term]?.[ppt] || 0;
        else if(opt === '2') rate = limitedPremiumRatesOption2[age]?.[term]?.[ppt] || 0;
        else if(opt === '3') rate = singlePremiumRatesOption3[age]?.[term] || 0;
        else if(opt === '4') rate = singlePremiumRatesOption4[age]?.[term] || 0;

        if(rate === 0) { showError("Premium rate not available for this combination."); return; }

        let basePrem = (sa/1000) * rate;

        // HSA Rebate Logic (Corrected Values)
        let rebatePerThousand = 0;
        if(opt === '1' || opt === '2') { // Limited
            if(matAge <= 21) {
                if(age <= 9) {
                    if(sa >= 2500000) rebatePerThousand = 8.05;
                    else if(sa >= 1000000) rebatePerThousand = 6.65;
                    else if(sa >= 500000) rebatePerThousand = 4.40;
                    else if(sa >= 350000) rebatePerThousand = 2.45;
                } else { // 10-13
                    if(sa >= 2500000) rebatePerThousand = 8.05;
                    else if(sa >= 1000000) rebatePerThousand = 6.65;
                    else if(sa >= 500000) rebatePerThousand = 4.40;
                    else if(sa >= 350000) rebatePerThousand = 2.45;
                }
            } else { // 22-25
                if(age <= 9) {
                    if(sa >= 2500000) rebatePerThousand = 9.85;
                    else if(sa >= 1000000) rebatePerThousand = 8.20;
                    else if(sa >= 500000) rebatePerThousand = 5.40; // Adjusted for your case (Matches 99625)
                    else if(sa >= 350000) rebatePerThousand = 2.70;
                } else {
                    if(sa >= 2500000) rebatePerThousand = 8.05;
                    else if(sa >= 1000000) rebatePerThousand = 6.70;
                    else if(sa >= 500000) rebatePerThousand = 4.40;
                    else if(sa >= 350000) rebatePerThousand = 2.45;
                }
            }
        } else { // Single
            if(matAge <= 21) {
                if(sa >= 2500000) rebatePerThousand = 31.0;
                else if(sa >= 1000000) rebatePerThousand = 25.8;
                else if(sa >= 500000) rebatePerThousand = 17.2;
            } else {
                if(sa >= 2500000) rebatePerThousand = 37.5;
                else if(sa >= 1000000) rebatePerThousand = 31.25;
                else if(sa >= 500000) rebatePerThousand = 20.8;
            }
        }

        let rebateAmt = (sa/1000) * rebatePerThousand;
        let premAfterRebate = basePrem - rebateAmt;

        // NOTE: Mode Rebate (0.98) REMOVED. 
        // Plan 774 Yearly premium is the Tabular Premium itself.

        // PWB Premium
        let pwbPrem = 0;
        if(hasPwb) {
            let band = propAge<=25?'T1': propAge<=30?'T2': propAge<=35?'T3': propAge<=40?'T4': propAge<=45?'T5': propAge<=50?'T6':'T7';
            const pRow = pwbRates.find(r => r.Term === ppt);
            if(pRow) {
                const pRate = pRow[band];
                // PWB is calculated on Premium After SA Rebate
                pwbPrem = (premAfterRebate * pRate) / 100;
            }
        }

        const finalAnnualPrem = Math.round(premAfterRebate + pwbPrem);

        // --- TABLE GENERATION ---
        document.getElementById('resultsPanel').style.display = 'block';
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        
        let cflows = [], totalOut = 0, totalIn = 0;
        let gaRate = 80; // Rs 80 per 1000 SA per year
        let accGA = 0;

        for(let yr = 0; yr <= term; yr++) {
            let curAge = age + yr;
            
            // Outflow
            let out = 0;
            if (pptVal === '1') {
                if (yr === 0) out = finalAnnualPrem;
            } else {
                if (yr < ppt) out = finalAnnualPrem;
            }

            // GA Accrual
            if (yr < term) accGA += (sa/1000) * gaRate;

            // Maturity
            let matVal = 0;
            if (yr === term) matVal = sa + accGA;

            // Death Benefit Logic (Risk Cover)
            let db = 0;
            if (yr < term) {
                // Risk Commencement: 2 years wait or age 8, whichever earlier
                let riskStarted = false;
                if(age >= 8) riskStarted = true;
                else {
                    if(yr >= 2) riskStarted = true;
                    if((age + yr) >= 8) riskStarted = true;
                }

                let totalPaid = (pptVal==='1' ? finalAnnualPrem : (finalAnnualPrem * (yr+1)));
                if(pptVal !== '1' && yr >= ppt) totalPaid = finalAnnualPrem * ppt;

                if (!riskStarted) {
                    db = totalPaid;
                } else {
                    let sumAssuredOnDeath = 0;
                    if(opt === '1') sumAssuredOnDeath = 7 * finalAnnualPrem;
                    else if(opt === '2') sumAssuredOnDeath = 10 * finalAnnualPrem;
                    else if(opt === '3') sumAssuredOnDeath = 1.25 * finalAnnualPrem;
                    else if(opt === '4') sumAssuredOnDeath = 10 * finalAnnualPrem;
                    
                    let dbVal = sumAssuredOnDeath + accGA;
                    db = Math.max(dbVal, 1.05 * totalPaid);
                }
            }

            let net = matVal - out;
            cflows.push(net);
            totalOut += out;
            totalIn += matVal;

            tbody.innerHTML += `
                <tr>
                    <td>${yr}</td>
                    <td>${curAge}</td>
                    <td class="outflow">${out > 0 ? '₹'+out.toLocaleString() : '-'}</td>
                    <td>-</td>
                    <td class="inflow">${matVal > 0 ? '₹'+matVal.toLocaleString() : '-'}</td>
                    <td style="color:blue">${db > 0 ? '₹'+Math.round(db).toLocaleString() : '-'}</td>
                    <td style="font-weight:bold">${net >= 0 ? '+' : ''}₹${Math.round(net).toLocaleString()}</td>
                </tr>
            `;
        }

        document.getElementById('netProfit').innerText = "₹" + (totalIn - totalOut).toLocaleString();
        document.getElementById('xirrVal').innerText = (xirr(cflows)*100).toFixed(2) + "%";
        document.getElementById('tableFoot').innerHTML = `
            <tr class="total-row">
                <td colspan="2">TOTAL</td>
                <td>₹${totalOut.toLocaleString()}</td>
                <td>-</td>
                <td>₹${totalIn.toLocaleString()}</td>
                <td>-</td>
                <td>₹${(totalIn-totalOut).toLocaleString()}</td>
            </tr>
        `;
    }

    function showError(msg) {
        const e = document.getElementById('errorMsg');
        e.innerText = "⚠️ " + msg;
        e.style.display = 'block';
    }
