<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surrender Value Calculator - Plan 720</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --lic-grey: #444444;
            --light-grey: #f4f4f4;
            --border-grey: #cccccc;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background: #e9e9e9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .calculator-card {
            width: 100%;
            max-width: 900px;
            background: var(--white);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 35px;
            border-top: 10px solid var(--lic-grey);
        }

        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { color: var(--lic-grey); font-size: 24px; text-transform: uppercase; }
        .header p { font-weight: 700; color: #666; font-size: 13px; }

        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .input-group { display: flex; flex-direction: column; }
        .input-group label { font-size: 11px; font-weight: 700; color: #555; margin-bottom: 5px; text-transform: uppercase; }

        input {
            padding: 10px;
            border: 1px solid var(--border-grey);
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
        }

        .calc-btn {
            width: 100%;
            padding: 16px;
            background: var(--lic-grey);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
        }

        #results { margin-top: 30px; display: none; }
        .summary-box {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
            padding: 15px;
            background: #fdfdfd;
            border: 1px solid #eee;
            border-radius: 8px;
        }
        .summary-item { font-size: 11px; font-weight: 700; color: #777; }
        .summary-item span { display: block; font-weight: 700; color: var(--lic-grey); font-size: 16px; margin-top: 5px; }

        .table-container { overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: var(--lic-grey); color: white; padding: 10px; text-align: left; text-transform: uppercase; font-size: 11px; }
        td { padding: 10px; border-bottom: 1px solid #eee; font-weight: 600; }
        .highlight-text { color: #2e7d32; font-size: 20px; }
        .text-right { text-align: right; }
    </style>
</head>
<body>

<div class="calculator-card">
    <div class="header">
        <h1>Surrender Value Calculator</h1>
        <p>PLAN NO 720 - MONEY BACK (20 YEARS)</p>
    </div>

<!-- ADD THIS: Error Message Container -->
<div id="errorBox" style="display:none; background:#fee; color:#b00; padding:15px; border-radius:8px; margin-bottom:20px; border:1px solid #fcc; font-size:13px; font-weight:600;">
    <div id="errorList"></div>
</div>

    <div class="input-grid">


<!-- ADD THIS: Age Input (put this inside the <div class="input-grid">) -->
<div class="input-group">
    <label>Entry Age (Years)</label>
    <input type="number" id="age" placeholder="13 to 50">
</div>
        <div class="input-group">
            <label>Commencement Date</label>
            <input type="date" id="doc" required>
        </div>
        <div class="input-group">
            <label>Basic Sum Assured</label>
            <input type="number" id="sa" placeholder="500000">
        </div>
        <div class="input-group">
            <label>Annual Premium (Excl. Tax)</label>
            <input type="number" id="premium" placeholder="35000">
        </div>
        <div class="input-group">
            <label>Bonus Rate (Per 1000 SA)</label>
            <input type="number" id="bonusRate" step="0.1" value="42">
        </div>
    </div>

    <button class="calc-btn" onclick="calculate720()">Calculate Surrender Value</button>

    <div id="results">
        <div class="summary-box">
            <div class="summary-item">Policy Duration <span><span id="resYear">0</span> Years</span></div>
            <div class="summary-item">SB Paid <span><span id="resSB">₹ 0</span></span></div>
            <div class="summary-item">Total Accrued Bonus <span><span id="resBonus">₹ 0</span></span></div>
            <div class="summary-item">Final Payable SV <span><span id="resFinal" class="highlight-text">₹ 0</span></span></div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Calculation Method</th>
                        <th>Factors Used</th>
                        <th class="text-right">Calculated Value</th>
                    </tr>
                </thead>
                <tbody id="detailsBody">
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // CONTINUOUS YEAR-WISE DATA FOR PLAN 720
    const gsv_p_data = [
        {"Term": 1, "T20": 0.0}, {"Term": 2, "T20": 0.3}, {"Term": 3, "T20": 0.35},
        {"Term": 4, "T20": 0.5}, {"Term": 5, "T20": 0.5}, {"Term": 6, "T20": 0.5},
        {"Term": 7, "T20": 0.5}, {"Term": 8, "T20": 0.525}, {"Term": 9, "T20": 0.55},
        {"Term": 10, "T20": 0.575}, {"Term": 11, "T20": 0.6}, {"Term": 12, "T20": 0.625},
        {"Term": 13, "T20": 0.65}, {"Term": 14, "T20": 0.675}, {"Term": 15, "T20": 0.7},
        {"Term": 16, "T20": 0.725}, {"Term": 17, "T20": 0.75}, {"Term": 18, "T20": 0.775},
        {"Term": 19, "T20": 0.9}, {"Term": 20, "T20": 0.9}
    ];

    const gsv_b_data = [
        {"Term": 1, "T20": 0.0}, {"Term": 2, "T20": 0.0}, {"Term": 3, "T20": 0.1622},
        {"Term": 4, "T20": 0.1658}, {"Term": 5, "T20": 0.1703}, {"Term": 6, "T20": 0.1758},
        {"Term": 7, "T20": 0.1758}, {"Term": 8, "T20": 0.1766}, {"Term": 9, "T20": 0.1785},
        {"Term": 10, "T20": 0.1816}, {"Term": 11, "T20": 0.186}, {"Term": 12, "T20": 0.1918},
        {"Term": 13, "T20": 0.1993}, {"Term": 14, "T20": 0.2085}, {"Term": 15, "T20": 0.2199},
        {"Term": 16, "T20": 0.2338}, {"Term": 17, "T20": 0.2505}, {"Term": 18, "T20": 0.2706},
        {"Term": 19, "T20": 0.3}, {"Term": 20, "T20": 0.35}
    ];

    const ssv_factor_data = [
        {"Term": 1, "T20": 0.2291}, {"Term": 2, "T20": 0.2471}, {"Term": 3, "T20": 0.2665},
        {"Term": 4, "T20": 0.2875}, {"Term": 5, "T20": 0.3101}, {"Term": 6, "T20": 0.3346},
        {"Term": 7, "T20": 0.361}, {"Term": 8, "T20": 0.3896}, {"Term": 9, "T20": 0.4206},
        {"Term": 10, "T20": 0.4541}, {"Term": 11, "T20": 0.4904}, {"Term": 12, "T20": 0.5298},
        {"Term": 13, "T20": 0.5725}, {"Term": 14, "T20": 0.6189}, {"Term": 15, "T20": 0.6695},
        {"Term": 16, "T20": 0.7245}, {"Term": 17, "T20": 0.7845}, {"Term": 18, "T20": 0.85},
        {"Term": 19, "T20": 0.9216}, {"Term": 20, "T20": 1.0}
    ];

    function getFactor(data, year) {
        let rows = data.filter(x => x.Term <= year);
        if (rows.length === 0) return 0;
        return rows[rows.length - 1].T20;
    }

    const fmt = (n) => "₹ " + Math.round(n).toLocaleString('en-IN');

    function calculate720() {

// --- ADD VALIDATION START ---
    const ageVal = parseInt(document.getElementById('age').value);
    const saVal = parseFloat(document.getElementById('sa').value);
    const errBox = document.getElementById('errorBox');
    const errList = document.getElementById('errorList');
    
    errBox.style.display = "none";
    errList.innerHTML = "";
    let errors = [];

    // 1. Entry Age Validation (Brochure Page 1: 13yr to 50yr)
    if (isNaN(ageVal) || ageVal < 13 || ageVal > 50) {
        errors.push("• Entry Age must be between 13 and 50 years.");
    }

    // 2. Sum Assured Validation (Brochure Page 1: Min 1,00,000 & Multiples of 5,000)
    if (isNaN(saVal) || saVal < 100000) {
        errors.push("• Minimum Sum Assured is ₹ 1,00,000.");
    } else if (saVal % 5000 !== 0) {
        errors.push("• Sum Assured must be in multiples of ₹ 5,000.");
    }

    if (errors.length > 0) {
        errList.innerHTML = errors.join("<br>");
        errBox.style.display = "block";
        document.getElementById('results').style.display = "none";
        window.scrollTo(0, 0);
        return; // Stops calculation
    }
    // --- ADD VALIDATION END ---


        const docVal = document.getElementById('doc').value;
        const sa = parseFloat(document.getElementById('sa').value);
        const premium = parseFloat(document.getElementById('premium').value);
        const bonusRate = parseFloat(document.getElementById('bonusRate').value);

        if(!docVal || isNaN(sa) || isNaN(premium)) return alert("Please fill all details.");

        // Calculate Duration
        const doc = new Date(docVal);
        const today = new Date();
        let yearsCompleted = today.getFullYear() - doc.getFullYear();
        if (today.getMonth() < doc.getMonth() || (today.getMonth() === doc.getMonth() && today.getDate() < doc.getDate())) {
            yearsCompleted--;
        }

        if(yearsCompleted < 2) {
            document.getElementById('results').style.display = "block";
            document.getElementById('detailsBody').innerHTML = "<tr><td colspan='3' style='color:red; text-align:center;'>Minimum 2 full years' premiums required.</td></tr>";
            return;
        }

        const term = 20;
        const ppt = 15;

        // 1. SB Paid Calculation (20% at 5, 10, 15)
        let sbPaid = 0;
        if (yearsCompleted >= 5) sbPaid += (sa * 0.20);
        if (yearsCompleted >= 10) sbPaid += (sa * 0.20);
        if (yearsCompleted >= 15) sbPaid += (sa * 0.20);

        // Accrued Bonus (Count till last completed anniversary)
        const accruedBonus = (sa / 1000) * bonusRate * yearsCompleted;

        // 2. GSV Calculation
        const gpFact = getFactor(gsv_p_data, yearsCompleted);
        const gbFact = getFactor(gsv_b_data, yearsCompleted);
        
        // Correct Logic: (Annual Premium * (min(YearsPaid, PPT) - 1)) * Factor
        const premCount = Math.min(yearsCompleted, ppt) - 1;
        const gsvOnPrem = (premium * premCount) * gpFact;
        const gsvOnBonus = accruedBonus * gbFact;
        const totalGSV = gsvOnPrem + gsvOnBonus;

        // 3. SSV Calculation
        // Step 1: Paid-up Sum Assured = (Basic SA - Survival Benefits already paid) * (YearsPaid / PPT)
        const paidUpRatio = Math.min(yearsCompleted, ppt) / ppt;
        const paidUpSA = (sa - sbPaid) * paidUpRatio;
        
        // Step 2: Paid-up Bonus = Total Accrued Bonus * (Paid-up SA / SA)
        const paidUpBonus = accruedBonus * (paidUpSA / sa);
        
        // Step 3: SSV = (Paid-up SA + Paid-up Bonus) * SSV Factor
        const ssvFact = getFactor(ssv_factor_data, yearsCompleted);
        const totalSSV = (paidUpSA + paidUpBonus) * ssvFact;

        const finalSV = Math.max(totalGSV, totalSSV);

        // Update UI
        document.getElementById('resYear').innerText = yearsCompleted;
        document.getElementById('resSB').innerText = fmt(sbPaid);
        document.getElementById('resBonus').innerText = fmt(accruedBonus);
        document.getElementById('resFinal').innerText = fmt(finalSV);

        document.getElementById('detailsBody').innerHTML = `
            <tr>
                <td><b>Guaranteed (GSV)</b><br><small>[(Premium x ${premCount}) x GP] + [Bonus x GB]</small></td>
                <td>GP: ${gpFact.toFixed(4)}<br>GB: ${gbFact.toFixed(4)}</td>
                <td class="text-right">${fmt(totalGSV)}</td>
            </tr>
            <tr>
                <td><b>Special (SSV)</b><br><small>(Paid-up SA + Proportionate Bonus) x Factor</small></td>
                <td>Factor: ${ssvFact.toFixed(4)}</td>
                <td class="text-right">${fmt(totalSSV)}</td>
            </tr>
            <tr style="background:#f9f9f9">
                <td colspan="2"><b>Final Payable (Higher of GSV/SSV)</b></td>
                <td class="text-right highlight-text"><b>${fmt(finalSV)}</b></td>
            </tr>
        `;

        document.getElementById('results').style.display = "block";
    }
</script>

</body>
</html>
