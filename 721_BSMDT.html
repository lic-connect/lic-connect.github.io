<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIC 25-Year Money Back Calculator (Plan 721)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f0f2f5; padding-bottom: 120px; /* Add space for the fixed button */ }
    .calculator-container { max-width: 650px; margin: 40px auto; padding: 30px; background: white; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.08); }
    .result-box { background-color: #eef2f7; border-left: 4px solid #198754; }
    h3 { color: #0c2f5a; }
    .plan-details { font-size: 0.9rem; color: #6c757d; }

     /* Container to hold and center the buttons */
    .rider-button-container {
        display: flex;          /* Aligns buttons in a row */
        justify-content: center; /* Horizontally centers the buttons */
        gap: 20px;              /* Creates space between the buttons */
        margin-top: 20px;       /* Adds space above the buttons */
    }
     .actions-container {
        display: flex;
        gap: 15px;
        margin-top: 20px;
        width: 100%; /* Make the container take full width */
    }
    .actions-container button {
        flex: 1; /* This is the key property to make them equal width */
    }
    .rider-btn {
        background: linear-gradient(145deg, #d9534f, #c9302c);
        color: white;
        font-family: Arial, sans-serif;
        font-size: 16px;
        font-weight: bold;
        border: none;
        border-radius: 10px;
        padding: 15px 30px;
        cursor: pointer;
        box-shadow: 0 5px 15px rgba(201, 48, 44, 0.4);
        transition: all 0.3s ease;
    }
    .rider-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(201, 48, 44, 0.5);
    }
    .modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.6);
        display: none; align-items: center; justify-content: center; z-index: 2000;
    }
    .modal-content {
        background: #fff; padding: 30px; border-radius: 10px;
        width: 90%; max-width: 500px; text-align: center;
        box-shadow: 0 5px 15px rgba(0,0,0,0.3); position: relative;
    }
    .modal-close-btn {
        position: absolute; top: 10px; right: 15px;
        font-size: 28px; font-weight: bold; color: #888; cursor: pointer;
    }
    #modal-title { margin-top: 0; color: #c9302c; }
    #modal-body { font-size: 1.1em; color: #333; }


/* WhatsApp Button Styling */
.whatsapp-share-container {
    margin-top: 20px;
    text-align: center;
}

.whatsapp-btn {
    background-color: #25D366;
    color: white;
    font-family: Arial, sans-serif;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    padding: 12px 24px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
    transition: background 0.3s ease;
    width: 100%;
}

.whatsapp-btn:hover {
    background-color: #1ebe57;
}

.whatsapp-btn svg {
    fill: white;
    width: 20px;
    height: 20px;
}
  </style>
</head>
<body>

<div class="calculator-container">
  <h3 class="text-center mb-4 fw-bold">LIC 25-Year Money Back (Plan 721)</h3>
  
  <div class="row g-3">
    <div class="col-md-6">
      <label for="age" class="form-label">Entry Age (13-45 Years)</label>
      <input type="number" class="form-control" id="age" value="30">
    </div>
    <div class="col-md-6">
      <label for="sum-assured" class="form-label">Sum Assured (₹)</label>
      <input type="number" class="form-control" id="sum-assured" value="500000" step="5000">
    </div>
    <div class="col-md-12">
        <div class="form-check mt-3">
            <input class="form-check-input" type="checkbox" id="addb-rider">
            <label class="form-check-label" for="addb-rider">
                Include Accidental Death & Disability Benefit Rider? (₹1 per 1000 SA)
            </label>
        </div>
    </div>
  </div>

  <div id="error-message" class="text-danger fw-bold mt-3"></div>

  <!-- START: New Button Container -->
  <div class="actions-container">
    <button type="button" class="btn btn-success w-100" onclick="calculatePremium()">Calculate Premium</button>
    <button id="term-rider-btn" class="rider-btn">Know Your Term Rider Premium</button>
  </div>
  <!-- END: New Button Container -->


<div class="whatsapp-share-container">
    <button onclick="shareOnWhatsApp()" class="whatsapp-btn">
        <svg viewBox="0 0 448 512"><path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.4 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-5.5-2.8-23.2-8.5-44.2-27.1-16.4-14.6-27.4-32.7-30.6-38.2-3.2-5.6-.3-8.6 2.4-11.3 2.5-2.4 5.5-6.5 8.3-9.7 2.8-3.3 3.7-5.5 5.5-9.3 1.9-3.7.9-6.9-.5-9.7-1.4-2.8-12.4-29.8-17-40.7-4.5-10.7-9-9.2-12.4-9.4h-10.6c-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 13.2 5.8 23.5 9.2 31.5 11.8 13.3 4.2 25.4 3.6 35 2.2 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"/></svg>
        Share Quote on WhatsApp
    </button>
</div>
  <div id="results" class="mt-4 d-none"><hr><div id="premium-results"></div></div>
</div>


<div id="premium-modal" class="modal-overlay">
    <div class="modal-content">
        <span class="modal-close-btn">×</span>
        <h2 id="modal-title"></h2>
        <div id="modal-body"></div>
    </div>
</div>

<script>
    // Data setup for Base Premium
    const rawBaseRates = [ { "Age": 13, "T25": 62.35 }, { "Age": 14, "T25": 62.4 }, { "Age": 15, "T25": 62.45 }, { "Age": 16, "T25": 62.55 }, { "Age": 17, "T25": 62.6 }, { "Age": 18, "T25": 62.65 }, { "Age": 19, "T25": 62.7 }, { "Age": 20, "T25": 62.75 }, { "Age": 21, "T25": 62.8 }, { "Age": 22, "T25": 62.9 }, { "Age": 23, "T25": 62.95 }, { "Age": 24, "T25": 63.05 }, { "Age": 25, "T25": 63.2 }, { "Age": 26, "T25": 63.35 }, { "Age": 27, "T25": 63.5 }, { "Age": 28, "T25": 63.7 }, { "Age": 29, "T25": 63.9 }, { "Age": 30, "T25": 64.15 }, { "Age": 31, "T25": 64.45 }, { "Age": 32, "T25": 64.75 }, { "Age": 33, "T25": 65.1 }, { "Age": 34, "T25": 65.5 }, { "Age": 35, "T25": 65.9 }, { "Age": 36, "T25": 66.4 }, { "Age": 37, "T25": 66.9 }, { "Age": 38, "T25": 67.45 }, { "Age": 39, "T25": 68.05 }, { "Age": 40, "T25": 68.7 }, { "Age": 41, "T25": 69.4 }, { "Age": 42, "T25": 70.2 }, { "Age": 43, "T25": 71.05 }, { "Age": 44, "T25": 71.95 }, { "Age": 45, "T25": 72.95 } ];
    
    // Data setup for Term Rider
    const rawTermRiderRates = [ { "Age": 18, "T25": 1.98 }, { "Age": 19, "T25": 2.04 }, { "Age": 20, "T25": 2.09 }, { "Age": 21, "T25": 2.16 }, { "Age": 22, "T25": 2.24 }, { "Age": 23, "T25": 2.33 }, { "Age": 24, "T25": 2.43 }, { "Age": 25, "T25": 2.56 }, { "Age": 26, "T25": 2.7 }, { "Age": 27, "T25": 2.87 }, { "Age": 28, "T25": 3.06 }, { "Age": 29, "T25": 3.28 }, { "Age": 30, "T25": 3.53 }, { "Age": 31, "T25": 3.81 }, { "Age": 32, "T25": 4.12 }, { "Age": 33, "T25": 4.46 }, { "Age": 34, "T25": 4.84 }, { "Age": 35, "T25": 5.25 }, { "Age": 36, "T25": 5.7 }, { "Age": 37, "T25": 6.19 }, { "Age": 38, "T25": 6.72 }, { "Age": 39, "T25": 7.29 }, { "Age": 40, "T25": 7.91 }, { "Age": 41, "T25": 8.59 }, { "Age": 42, "T25": 9.3 }, { "Age": 43, "T25": 10.07 }, { "Age": 44, "T25": 10.91 }, { "Age": 45, "T25": 11.81 } ];

    // Helper function to convert rate arrays into easy-to-use objects
    const convertRates = (raw) => raw.reduce((acc, item) => { acc[item.Age] = item.T25; return acc; }, {});
    
    const baseRates = convertRates(rawBaseRates);
    const termRiderRates = convertRates(rawTermRiderRates);
    const addbRatePer1000 = 1.0; 

    function calculatePremium() {
        document.getElementById("error-message").textContent = "";
        document.getElementById("results").classList.add("d-none");

        const age = parseInt(document.getElementById("age").value);
        const sumAssured = parseFloat(document.getElementById("sum-assured").value);
        const addbSelected = document.getElementById("addb-rider").checked;
        
        if (isNaN(age) || isNaN(sumAssured)) { document.getElementById("error-message").textContent = "Please fill all required fields."; return; }
        if (age < 13 || age > 45) { document.getElementById("error-message").textContent = "Entry Age must be between 13 and 45 years."; return; }
        if (sumAssured < 200000) { document.getElementById("error-message").textContent = "Minimum Sum Assured is ₹2,00,000."; return; }

        const tabularRate = baseRates[age];
        if (!tabularRate) { document.getElementById("error-message").textContent = "Premium rate for the selected Age is not available."; return; }

        const annualTabularPremium = (tabularRate * sumAssured) / 1000;

          let saRebateRate = 0;
    if (addbSelected) {
        // --- Logic for when ADDB IS SELECTED ---
        if (sumAssured >= 2500000) {
            saRebateRate = 2.85;
        } else if (sumAssured >= 1000000) {
            saRebateRate = 2.85;
        } else if (sumAssured >= 500000) {
            saRebateRate = 2.85;
        }
    } else {
        // --- Logic for when ADDB IS NOT SELECTED ---
        if (sumAssured >= 2500000) {
            saRebateRate = 3.0;
        } else if (sumAssured >= 1000000) {
            saRebateRate = 3.0;
        } else if (sumAssured >= 500000) {
            saRebateRate = 3.0;
        }
    }
        const annualSaRebateAmount = (saRebateRate * sumAssured) / 1000;
        
        const annualPremiumAfterSaRebate = annualTabularPremium - annualSaRebateAmount;
        let annualAddbPremium = addbSelected ? (addbRatePer1000 * sumAssured) / 1000 : 0;
        if (sumAssured < 500000) annualAddbPremium = addbSelected ? (1.15 * sumAssured) / 1000 : 0;

        const modes = {
            yearly: { name: "Yearly", factor: 1.0, modeRebatePercent: 0.02 },
            "half-yearly": { name: "Half-Yearly", factor: 0.4949, modeRebatePercent: 0 },
            quarterly: { name: "Quarterly", factor: 0.2500, modeRebatePercent: 0 },
            monthly: { name: "Monthly (NACH)", factor: 0.08333, modeRebatePercent: 0 }
        };

        let outputHTML = `<p class="plan-details text-center"><b>Policy Term:</b> 25 Years | <b>Premium Paying Term:</b> 20 Years</p>`;

       for (const modeKey in modes) {
            const mode = modes[modeKey];
            let premiumBeforeTax = 0;
            if (mode.modeRebatePercent > 0) {
                const modeRebateAmount = annualTabularPremium * mode.modeRebatePercent;
                // Mode rebate only applies to the base premium portion
                premiumBeforeTax = annualTabularPremium - annualSaRebateAmount - modeRebateAmount + annualAddbPremium;
            } else {
                const loadedBasePremium = annualPremiumAfterSaRebate * mode.factor;
                const loadedRiderPremium = annualAddbPremium * mode.factor;
                premiumBeforeTax = loadedBasePremium + loadedRiderPremium;
            }

            const formatInr = (num) => num.toLocaleString('en-IN', {minimumFractionDigits: 0, maximumFractionDigits: 0});
            
            // Simplified output showing only one total per mode
            outputHTML += `
                <div class="result-box mb-3 p-3">
                    <strong class="text-success">${mode.name.toUpperCase()} PREMIUM</strong>
                    <hr class="my-2">
                    <div>
                        <b>Premium Amount:</b> 
                        <span class="fw-bold fs-5">₹${formatInr(premiumBeforeTax)}</span>
                    </div>
                </div>`;
        }
        document.getElementById("premium-results").innerHTML = outputHTML;
        document.getElementById("results").classList.remove("d-none");
    }

    // --- RIDER AND MODAL LOGIC ---
    const modal = document.getElementById('premium-modal');
    const modalTitle = document.getElementById('modal-title');
    const modalBody = document.getElementById('modal-body');
    const closeModalBtn = document.querySelector('.modal-close-btn');

    function showModal(title, bodyHtml) {
        modalTitle.innerHTML = title;
        modalBody.innerHTML = bodyHtml;
        modal.style.display = 'flex';
    }

    function hideModal() {
        modal.style.display = 'none';
    }

    closeModalBtn.addEventListener('click', hideModal);
    window.addEventListener('click', (event) => { if (event.target === modal) hideModal(); });

    document.getElementById('term-rider-btn').addEventListener('click', () => {
        const baseSa = parseFloat(document.getElementById("sum-assured").value);
        const title = 'Term Rider Premium Calculator';
        const bodyHtml = `
            <label for="termRiderSA" style="display:block; margin-bottom:5px; font-weight:bold;">Enter Term Rider Sum Assured</label>
            <p style="font-size:0.8em; color:#555; margin-top:0;">(Cannot exceed Base SA of ₹${baseSa.toLocaleString('en-IN')})</p>
            <input type="number" id="termRiderSA" class="form-control mb-3" value="${baseSa}" />
            <button onclick="calculateTermRiderFromModal()" class="btn btn-danger w-100">Calculate Rider Premium</button>
        `;
        showModal(title, bodyHtml);
    });

    function calculateTermRiderFromModal() {
        const lifeAssuredAge = parseInt(document.getElementById("age").value);
        const baseSumAssured = parseFloat(document.getElementById("sum-assured").value);
        const termRiderSumAssured = parseFloat(document.getElementById('termRiderSA').value);

        if (isNaN(termRiderSumAssured) || termRiderSumAssured <= 0) { showModal('Error', '<p class="text-danger">Please enter a valid Term Rider Sum Assured.</p>'); return; }
        if (termRiderSumAssured > baseSumAssured) { showModal('Validation Error', `<p class="text-danger">Rider Sum Assured cannot exceed the Base Sum Assured of ₹${baseSumAssured.toLocaleString('en-IN')}.</p>`); return; }

        const termRiderRate = termRiderRates[lifeAssuredAge];
        if (!termRiderRate) { showModal('Term Rider Premium', '<p class="text-danger">Term Rider is not available for this Age.</p>'); return; }

        const termRiderPremium = (termRiderSumAssured / 1000) * termRiderRate;
     const termRiderPremiumWithGst = termRiderPremium; // GST is now 0

        const formatInr = (num) => num.toLocaleString('en-IN', {minimumFractionDigits: 0, maximumFractionDigits: 0});
      const resultHtml = `
    <p style="font-size: 1.4em; font-weight: bold; color: #333;">Yearly Premium: ₹${formatInr(termRiderPremiumWithGst)}</p>
    <small>(For Rider SA of ₹${formatInr(termRiderSumAssured)})</small>
`;
        showModal('Standalone Term Rider Premium', resultHtml);
    }


function shareOnWhatsApp() {
    // 1. Get Plan Name from the H1 tag
    const planName = document.querySelector('h1').innerText;

    // 2. Get Input Values
    const age = document.getElementById("age").value;
    const term = document.getElementById("term").value;
    const sumAssured = document.getElementById("sumAssured").value;
    
    // 3. Check if calculation results exist
    const resultsDiv = document.getElementById("results");
    if (resultsDiv.innerHTML.trim() === "") {
        alert("Please calculate the premium first!");
        return;
    }

    // 4. Format the numbers for readability
    const formattedSA = Number(sumAssured).toLocaleString('en-IN');

    // 5. Gather Modal Premium results from the table
    // This logic finds the results generated in the 'results' div
    const rows = resultsDiv.querySelectorAll('table tr');
    let premiumDetails = "";
    
    rows.forEach(row => {
        const cols = row.querySelectorAll('td, th');
        if (cols.length === 2) {
            premiumDetails += `*${cols[0].innerText.replace(':','')}:* ${cols[1].innerText}\n`;
        }
    });

    // 6. Construct the Message
    let message = `*📊 ${planName} Premium Quote*\n\n`;
    message += `*--- Policy Details ---*\n`;
    message += `*Age:* ${age} Years\n`;
    message += `*Policy Term:* ${term} Years\n`;
    message += `*Sum Assured:* ₹${formattedSA}\n\n`;
    message += `*--- Premium Summary ---*\n`;
    message += premiumDetails;
    message += `\n_Calculated via LIC Premium Calculator_`;

    // 7. Open WhatsApp
    const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(message)}`;
    window.open(whatsappUrl, '_blank');
}
</script>

</body>
</html>
